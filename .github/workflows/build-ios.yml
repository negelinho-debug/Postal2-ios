name: POSTAL 2 WineGlass iOS FIX 7.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 FIX 7.1
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # FORCE XCODE 15.4
      # ==========================================================

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== AVAILABLE XCODE ====="
          ls -1 /Applications | grep Xcode || true

          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found on runner"
            exit 1
          fi

          echo "===== SELECTED XCODE ====="
          xcodebuild -version

          echo "===== XCODE PATH ====="
          xcode-select -p

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -euxo pipefail

          brew install xcodegen make

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== SDK PATH ====="
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== CLANG ====="
          xcrun --sdk iphoneos --find clang

      # ==========================================================
      # CLONE WINEGLASS + BLINK
      # ==========================================================

      - name: Clone WineGlass and blink
        run: |
          set -euxo pipefail

          rm -rf WineGlass blink-src

          git clone --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p WineGlass/Vendor/blink/lib

          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK COMMIT ====="
          git -C blink-src rev-parse HEAD

      # ==========================================================
      # BUILD BLINK ARM64 IOS NO-JIT
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          chmod +x configure

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0 -D_FILE_OFFSET_BITS=64 -D_DARWIN_C_SOURCE -DTARGET_OS_IPHONE=1" \
            --disable-threads \
            --disable-sockets \
            --disable-jit \
            || true

          test -f config.h

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("config.h")
          s = p.read_text(errors="ignore")

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
              "HAVE_SCHED_YIELD",
          ]

          enable = [
              "HAVE_DEV_URANDOM",
              "HAVE_SYS_MOUNT_H",
          ]

          for name in disable + enable:
              s = re.sub(
                  rf'^\s*#\s*(?:define|undef)\s+{re.escape(name)}.*$',
                  '',
                  s,
                  flags=re.M
              )

          s += "\n/* POSTAL 2 IOS FIX 7.1 */\n"

          for name in disable:
              s += f"#undef {name}\n"

          for name in enable:
              s += f"#define {name} 1\n"

          p.write_text(s)
          PY

          echo "===== CONFIG CHECK ====="

          grep -E \
            'HAVE_(DEV_URANDOM|SYS_MOUNT_H|GETENTROPY|GETRANDOM|SCHED_YIELD|KERN_ARND)' \
            config.h || true

          gmake -j2 o//blink/blink.a

          test -f o//blink/blink.a

          echo "===== BLINK ARCH ====="
          lipo -info o//blink/blink.a || true

          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"

      # ==========================================================
      # BLINK FIX7 DIAGNOSTICS
      # ==========================================================

      - name: Patch Blink FIX 7 diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Vendor/blink/wg_blink_impl.c")
          s = p.read_text()

          old = '''        InitMap();
                  s_blink_initialized = 1;'''

          new = '''        fprintf(stderr, "[FIX7/BLINK] BEFORE InitMap\\n");
                  fflush(stderr);
                  InitMap();
                  fprintf(stderr, "[FIX7/BLINK] AFTER InitMap\\n");
                  fflush(stderr);
                  s_blink_initialized = 1;'''

          if old not in s:
              raise SystemExit("ERROR: InitMap block changed upstream")

          s = s.replace(old, new, 1)

          old = '''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {
              ensure_initialized();'''

          new = '''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {
              fprintf(stderr,
                      "[FIX7/BLINK] create_vm_with_mode ENTER omode=%d\\n",
                      mode.omode);
              fflush(stderr);

              ensure_initialized();

              fprintf(stderr,
                      "[FIX7/BLINK] ensure_initialized OK\\n");
              fflush(stderr);'''

          if old not in s:
              raise SystemExit("ERROR: create_vm_with_mode changed upstream")

          s = s.replace(old, new, 1)

          old = '''    struct WGBlinkVM *vm = calloc(1, sizeof(struct WGBlinkVM));
              if (!vm) return NULL;'''

          new = '''    fprintf(stderr,
                      "[FIX7/BLINK] BEFORE VM calloc\\n");
              fflush(stderr);

              struct WGBlinkVM *vm =
                  calloc(1, sizeof(struct WGBlinkVM));

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER VM calloc ptr=%p\\n",
                      (void *)vm);
              fflush(stderr);

              if (!vm) return NULL;'''

          if old not in s:
              raise SystemExit("ERROR: VM calloc block changed upstream")

          s = s.replace(old, new, 1)

          old = '''    vm->s = NewSystem(mode);
              if (!vm->s) { free(vm); return NULL; }'''

          new = '''    fprintf(stderr,
                      "[FIX7/BLINK] BEFORE NewSystem\\n");
              fflush(stderr);

              vm->s = NewSystem(mode);

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER NewSystem ptr=%p\\n",
                      (void *)vm->s);
              fflush(stderr);

              if (!vm->s) {
                  fprintf(stderr,
                          "[FIX7/BLINK] NewSystem returned NULL\\n");
                  fflush(stderr);
                  free(vm);
                  return NULL;
              }'''

          if old not in s:
              raise SystemExit("ERROR: NewSystem block changed upstream")

          s = s.replace(old, new, 1)

          old = '''        vm->s->real = Mmap(NULL, real_size, PROT_READ | PROT_WRITE,
                                     MAP_PRIVATE | MAP_ANONYMOUS_, -1, 0, "real");
                  if (!vm->s->real) { FreeSystem(vm->s); free(vm); return NULL; }'''

          new = '''        fprintf(stderr,
                          "[FIX7/BLINK] BEFORE real Mmap size=%ld pagesize=%ld\\n",
                          real_size,
                          pagesize);
                  fflush(stderr);

                  vm->s->real =
                      Mmap(NULL,
                           real_size,
                           PROT_READ | PROT_WRITE,
                           MAP_PRIVATE | MAP_ANONYMOUS_,
                           -1,
                           0,
                           "real");

                  fprintf(stderr,
                          "[FIX7/BLINK] AFTER real Mmap ptr=%p\\n",
                          (void *)vm->s->real);
                  fflush(stderr);

                  if (!vm->s->real) {
                      fprintf(stderr,
                              "[FIX7/BLINK] real Mmap FAILED\\n");
                      fflush(stderr);

                      FreeSystem(vm->s);
                      free(vm);
                      return NULL;
                  }'''

          if old not in s:
              raise SystemExit("ERROR: Mmap block changed upstream")

          s = s.replace(old, new, 1)

          old = '''    vm->m = NewMachine(vm->s, NULL);
              if (!vm->m) { FreeSystem(vm->s); free(vm); return NULL; }'''

          new = '''    fprintf(stderr,
                      "[FIX7/BLINK] BEFORE NewMachine\\n");
              fflush(stderr);

              vm->m = NewMachine(vm->s, NULL);

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER NewMachine ptr=%p\\n",
                      (void *)vm->m);
              fflush(stderr);

              if (!vm->m) {
                  fprintf(stderr,
                          "[FIX7/BLINK] NewMachine returned NULL\\n");
                  fflush(stderr);

                  FreeSystem(vm->s);
                  free(vm);
                  return NULL;
              }'''

          if old not in s:
              raise SystemExit("ERROR: NewMachine block changed upstream")

          s = s.replace(old, new, 1)

          old = '''    vm->m->flags |= (1 << 9); // IF
              return vm;'''

          new = '''    vm->m->flags |= (1 << 9); // IF

              fprintf(stderr,
                      "[FIX7/BLINK] VM CREATE SUCCESS vm=%p machine=%p system=%p\\n",
                      (void *)vm,
                      (void *)vm->m,
                      (void *)vm->s);
              fflush(stderr);

              return vm;'''

          if old not in s:
              raise SystemExit("ERROR: VM success block changed upstream")

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("Blink FIX7 diagnostics patched")
          PY

      # ==========================================================
      # BUILD BLINK BRIDGE OBJECT
      # ==========================================================

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I. \
            -include config.h \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          echo "===== BRIDGE ARCH ====="

          lipo -info \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            || true

      # ==========================================================
      # FALLBACK X86 A0-A3
      # ==========================================================

      - name: Add x86 A0 A1 A2 A3 fallback opcodes
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/CPU/wg_x86_decode.c"
          )

          s = p.read_text()

          marker = '''    // TEST AL/rAX, imm (A8, A9)'''

          if marker not in s:
              raise SystemExit(
                  "ERROR: decoder marker changed upstream"
              )

          patch = r'''
              // =====================================================
              // POSTAL 2 FIX 7
              //
              // A0 MOV AL, moffs8
              // A1 MOV EAX, moffs32
              // A2 MOV moffs8, AL
              // A3 MOV moffs32, EAX
              // =====================================================

              case 0xA0: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 1
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 1
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA1: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 4
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 4
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA2: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 1
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 1
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA3: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 4
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 4
                  };

                  out->num_operands = 2;
                  break;
              }

          '''

          s = s.replace(
              marker,
              patch + marker,
              1
          )

          p.write_text(s)

          print(
              "A0/A1/A2/A3 added to fallback decoder"
          )
          PY

          echo "===== CHECK A1 ====="

          grep -n \
            "case 0xA1" \
            WineGlass/Sources/CPU/wg_x86_decode.c

      # ==========================================================
      # PATCH PROJECT
      # ==========================================================

      - name: Patch WineGlass project for POSTAL 2
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass

          python3 <<'PY'
          from pathlib import Path

          p = Path("project.yml")
          s = p.read_text()

          s = s.replace(
              "bundleIdPrefix: com.wineglass",
              "bundleIdPrefix: com.postal2ios"
          )

          s = s.replace(
              'xcodeVersion: "15.0"',
              'xcodeVersion: "15.4"\n  projectFormat: xcode15_3'
          )

          s = s.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",
              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )

          s = s.replace(
              'TARGETED_DEVICE_FAMILY: "1,2"',
              'TARGETED_DEVICE_FAMILY: "1"'
          )

          lines = []

          for line in s.splitlines():
              if "CODE_SIGN_ENTITLEMENTS:" in line:
                  continue

              if "DEVELOPMENT_TEAM:" in line:
                  continue

              if "CODE_SIGN_STYLE: Automatic" in line:
                  line = line.replace(
                      "CODE_SIGN_STYLE: Automatic",
                      "CODE_SIGN_STYLE: Manual"
                  )

              lines.append(line)

          p.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          echo "===== PROJECT.YML ====="
          cat project.yml

      # ==========================================================
      # INFO PLIST
      # ==========================================================

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="WineGlass/Sources/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleDisplayName" \
            "$PLIST" \
            || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 0.7.1" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion 71" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$PLIST"

          plutil -lint "$PLIST"

      # ==========================================================
      # POSTAL 2 LAUNCHER
      # ==========================================================

      - name: Patch POSTAL 2 launcher and log
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/App/WGSceneDelegate.m"
          )

          s = p.read_text()

          if "#include <stdio.h>" not in s:
              s = s.replace(
                  "#include <unistd.h>",
                  "#include <unistd.h>\n#include <stdio.h>"
              )

          old = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              wg_log_init();'''

          new = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              NSString *fix7Docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;

              NSString *fix7Log =
                  [fix7Docs
                      stringByAppendingPathComponent:
                          @"POSTAL2-WineGlass.log"];

              [[NSFileManager defaultManager]
                  removeItemAtPath:fix7Log
                  error:nil];

              freopen(
                  fix7Log.fileSystemRepresentation,
                  "a",
                  stderr
              );

              setvbuf(
                  stderr,
                  NULL,
                  _IONBF,
                  0
              );

              fprintf(
                  stderr,
                  "========================================\\n"
                  "POSTAL 2 WineGlass FIX 7.1\\n"
                  "Blink diagnostics enabled\\n"
                  "========================================\\n"
              );

              fflush(stderr);

              wg_log_init();

              WG_LOGI(
                  "FIX7",
                  "Log path: %s",
                  fix7Log.UTF8String
              );'''

          if old not in s:
              raise SystemExit(
                  "ERROR: scene startup changed upstream"
              )

          s = s.replace(old, new, 1)

          old = '''[_loadButton setTitle:@"  Load .exe  " forState:UIControlStateNormal];'''

          new = '''[_loadButton setTitle:@"  RUN POSTAL 2  " forState:UIControlStateNormal];'''

          if old not in s:
              raise SystemExit(
                  "ERROR: Load .exe title changed upstream"
              )

          s = s.replace(old, new, 1)

          old = '''[_loadButton addTarget:self action:@selector(openFilePicker) forControlEvents:UIControlEventTouchUpInside];'''

          new = '''[_loadButton addTarget:self action:@selector(runPostal2) forControlEvents:UIControlEventTouchUpInside];'''

          if old not in s:
              raise SystemExit(
                  "ERROR: button action changed upstream"
              )

          s = s.replace(old, new, 1)

          marker = \
              "#pragma mark - UIDocumentPickerDelegate"

          if marker not in s:
              raise SystemExit(
                  "ERROR: document picker marker changed upstream"
              )

          postal = r'''
          // ============================================================
          // POSTAL 2
          // ============================================================

          - (NSString *)findPostal2Exe {

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;

              NSString *root =
                  [docs
                      stringByAppendingPathComponent:
                          @"Postal2FullData"];

              NSFileManager *fm =
                  [NSFileManager defaultManager];

              NSString *normal =
                  [root
                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"];

              if ([fm fileExistsAtPath:normal]) {

                  WG_LOGI(
                      "POSTAL2",
                      "Postal2.exe normal path: %s",
                      normal.UTF8String
                  );

                  return normal;
              }

              NSDirectoryEnumerator *enumerator =
                  [fm enumeratorAtPath:root];

              for (NSString *relative in enumerator) {

                  if ([[relative lastPathComponent]
                          caseInsensitiveCompare:
                              @"Postal2.exe"]
                      == NSOrderedSame) {

                      NSString *found =
                          [root
                              stringByAppendingPathComponent:
                                  relative];

                      WG_LOGI(
                          "POSTAL2",
                          "Postal2.exe recursive path: %s",
                          found.UTF8String
                      );

                      return found;
                  }
              }

              WG_LOGE(
                  "POSTAL2",
                  "Postal2.exe NOT FOUND under %s",
                  root.UTF8String
              );

              return nil;
          }

          - (void)runPostal2 {

              if (!_engine) {

                  WG_LOGE(
                      "POSTAL2",
                      "Engine not ready"
                  );

                  return;
              }

              NSString *exe =
                  [self findPostal2Exe];

              if (!exe) {

                  [_loadButton
                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "
                      forState:
                          UIControlStateNormal];

                  return;
              }

              NSString *systemDir =
                  [exe
                      stringByDeletingLastPathComponent];

              int cdResult =
                  chdir(
                      systemDir.fileSystemRepresentation
                  );

              WG_LOGI(
                  "POSTAL2",
                  "chdir(%s) = %d",
                  systemDir.UTF8String,
                  cdResult
              );

              WG_LOGI(
                  "POSTAL2",
                  "Starting original Postal2.exe"
              );

              [_loadButton
                  setTitle:
                      @"  STARTING POSTAL 2...  "
                  forState:
                      UIControlStateNormal];

              [self loadAndRunPE:exe];
          }

          '''

          s = s.replace(
              marker,
              postal + "\n" + marker,
              1
          )

          old = '''            [self tryLoadBundledPE];'''

          new = '''            WG_LOGI(
                          "POSTAL2",
                          "FIX 7.1 auto-run"
                      );

                      [self runPostal2];'''

          if old not in s:
              raise SystemExit(
                  "ERROR: tryLoadBundledPE changed upstream"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print(
              "POSTAL 2 FIX7.1 launcher patched"
          )
          PY

          echo "===== PATCH CHECK ====="

          grep -n \
            "RUN POSTAL 2\|STARTING POSTAL 2\|findPostal2Exe\|POSTAL2-WineGlass" \
            WineGlass/Sources/App/WGSceneDelegate.m

      # ==========================================================
      # GENERATE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass

          rm -rf WineGlass.xcodeproj

          xcodegen generate

          test -f \
            WineGlass.xcodeproj/project.pbxproj

          echo "===== OBJECT VERSION ====="

          grep -m1 \
            "objectVersion" \
            WineGlass.xcodeproj/project.pbxproj \
            || true

          if grep -q \
            "objectVersion = 77" \
            WineGlass.xcodeproj/project.pbxproj; then

            echo "ERROR: objectVersion 77"
            exit 1
          fi

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build POSTAL 2 FIX 7.1
        shell: bash
        run: |
          set -o pipefail

          cd WineGlass

          rm -rf build

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 | tee xcodebuild.log

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail

          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          test -d "$APP"
          test -f "$APP/WineGlass"

          echo "===== APP ARCH ====="
          lipo -info "$APP/WineGlass"

          echo "===== BUNDLE ID ====="

          ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "$ID"

          if [ "$ID" != "com.postal2ios.native" ]; then
            echo "ERROR: wrong bundle id: $ID"
            exit 1
          fi

          echo "===== VERSION ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"

      # ==========================================================
      # IPA
      # ==========================================================

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"

          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          OUT="$ROOT/out"

          rm -rf "$OUT"

          mkdir -p \
            "$OUT/Payload"

          cp -R \
            "$APP" \
            "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"

          zip -qry \
            "POSTAL-2-iOS-v7.1-BLINK-FIX.ipa" \
            Payload

          ls -lh \
            "POSTAL-2-iOS-v7.1-BLINK-FIX.ipa"

      # ==========================================================
      # UPLOAD IPA
      # ==========================================================

      - name: Upload POSTAL 2 FIX 7.1 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v7.1-BLINK-FIX
          path: out/POSTAL-2-iOS-v7.1-BLINK-FIX.ipa
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p debug-fix7

          cp \
            WineGlass/xcodebuild.log \
            debug-fix7/ \
            2>/dev/null || true

          cp \
            WineGlass/project.yml \
            debug-fix7/ \
            2>/dev/null || true

          cp \
            WineGlass/Sources/App/WGSceneDelegate.m \
            debug-fix7/ \
            2>/dev/null || true

          cp \
            WineGlass/Sources/App/Info.plist \
            debug-fix7/ \
            2>/dev/null || true

          cp \
            WineGlass/Sources/CPU/wg_x86_decode.c \
            debug-fix7/ \
            2>/dev/null || true

          cp \
            WineGlass/Vendor/blink/wg_blink_impl.c \
            debug-fix7/ \
            2>/dev/null || true

          cp \
            blink-src/config.h \
            debug-fix7/blink-config.h \
            2>/dev/null || true

          cp \
            WineGlass/WineGlass.xcodeproj/project.pbxproj \
            debug-fix7/ \
            2>/dev/null || true

      - name: Upload FIX 7.1 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX7.1-DEBUG
          path: debug-fix7
          if-no-files-found: ignore
          retention-days: 7
