name: POSTAL 2 iOS v6 ORIGINAL EXE TEST FIX 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Windows x86 runtime
    runs-on: macos-14
    timeout-minutes: 120

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== GNU MAKE ====="
          gmake --version | head -n 1

          echo "===== FLOCK ====="
          command -v flock


      # ==========================================================
      # CLONE WINEGLASS + BLINK
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf WineGlass
          rm -rf blink

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink

          echo
          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo
          echo "===== BLINK COMMIT ====="
          git -C blink rev-parse HEAD


      # ==========================================================
      # BUILD BLINK ARM64
      #
      # FIRST TEST = NO JIT
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          BLINK="$GITHUB_WORKSPACE/blink"
          WG="$GITHUB_WORKSPACE/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"

          cd "$BLINK"

          echo
          echo "======================================"
          echo "BLINK SOURCE CHECK"
          echo "======================================"

          test -f config.h.in
          test -f configure

          echo
          echo "======================================"
          echo "CONFIGURE BLINK FOR IPHONE"
          echo "======================================"

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-g -O2 -fno-common -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk


          echo
          echo "======================================"
          echo "PATCH BLINK IOS CONFIG"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          config = Path("config.h")
          text = config.read_text()


          # ======================================================
          # NO JIT / THREADS / SOCKETS
          # ======================================================

          force_enable = [
              "DISABLE_JIT",
              "DISABLE_THREADS",
              "DISABLE_SOCKETS",
          ]

          for name in force_enable:

              text = re.sub(
                  rf'^[ \t]*//[ \t]*#define[ \t]+{re.escape(name)}.*$',
                  f'#define {name}',
                  text,
                  flags=re.MULTILINE
              )

              if f"#define {name}" not in text:
                  text += f"\n#define {name}\n"


          # ======================================================
          # RANDOM BACKEND FIX
          #
          # Do not use getentropy/getrandom.
          # Use /dev/urandom.
          # ======================================================

          force_disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
          ]

          for name in force_disable:

              text = re.sub(
                  rf'^[ \t]*#define[ \t]+{re.escape(name)}.*$',
                  f'// #define {name}',
                  text,
                  flags=re.MULTILINE
              )


          text = re.sub(
              r'^[ \t]*//[ \t]*#define[ \t]+HAVE_DEV_URANDOM.*$',
              '#define HAVE_DEV_URANDOM',
              text,
              flags=re.MULTILINE
          )

          if "#define HAVE_DEV_URANDOM" not in text:
              text += "\n#define HAVE_DEV_URANDOM\n"


          # ======================================================
          # FIX 4
          #
          # Darwin / iOS struct statfs comes from sys/mount.h.
          #
          # Blink only includes that header when:
          #
          # HAVE_SYS_MOUNT_H
          #
          # is enabled.
          # ======================================================

          text = re.sub(
              r'^[ \t]*//[ \t]*#define[ \t]+HAVE_SYS_MOUNT_H.*$',
              '#define HAVE_SYS_MOUNT_H',
              text,
              flags=re.MULTILINE
          )

          if "#define HAVE_SYS_MOUNT_H" not in text:
              text += "\n#define HAVE_SYS_MOUNT_H\n"


          # ======================================================
          # OTHER DARWIN FEATURES WE KNOW ARE PRESENT
          # ======================================================

          optional_enable = [
              "HAVE_INT128",
              "HAVE_SYSCTL",
              "HAVE_SA_LEN",
              "HAVE_WCWIDTH",
              "HAVE_MEMCCPY",
              "HAVE_SEEKDIR",
              "HAVE_REALPATH",
              "HAVE_SCHED_YIELD",
              "HAVE_MAP_ANONYMOUS",
              "HAVE_MAP_SHARED",
              "HAVE_STRUCT_TIMEZONE",
          ]

          for name in optional_enable:

              text = re.sub(
                  rf'^[ \t]*//[ \t]*#define[ \t]+{re.escape(name)}.*$',
                  f'#define {name}',
                  text,
                  flags=re.MULTILINE
              )


          config.write_text(text)


          # ======================================================
          # HOST BUILD HELPER
          #
          # Keep the same host helper settings as the previous
          # build that already reached blink/statfs.c.
          # ======================================================

          config_mk = Path("config.mk")
          mk = config_mk.read_text()

          mk = re.sub(
              r'^HOST_SYSTEM\s*=.*$',
              'HOST_SYSTEM = Linux',
              mk,
              flags=re.MULTILINE
          )

          mk = re.sub(
              r'^HOST_ARCH\s*=.*$',
              'HOST_ARCH = x86_64',
              mk,
              flags=re.MULTILINE
          )

          config_mk.write_text(mk)
          PY


          echo
          echo "======================================"
          echo "IMPORTANT CONFIG FLAGS"
          echo "======================================"

          grep \
            -E \
            "DISABLE_JIT|DISABLE_THREADS|DISABLE_SOCKETS|HAVE_GETENTROPY|HAVE_GETRANDOM|HAVE_DEV_URANDOM|HAVE_SYS_MOUNT_H" \
            config.h \
            || true


          echo
          echo "======================================"
          echo "VERIFY STATFS FIX"
          echo "======================================"

          grep \
            -n \
            "HAVE_SYS_MOUNT_H" \
            config.h

          grep \
            -n \
            "sys/mount.h" \
            blink/statfs.c


          echo
          echo "======================================"
          echo "CONFIG.MK"
          echo "======================================"

          grep \
            -E \
            "^HOST_SYSTEM|^HOST_ARCH|^CC =|^AR =|^CFLAGS =" \
            config.mk \
            || true


          echo
          echo "======================================"
          echo "BUILD BLINK.A"
          echo "======================================"

          gmake \
            -j"$(sysctl -n hw.ncpu)" \
            o//blink/blink.a


          test -f \
            o//blink/blink.a


          echo
          echo "======================================"
          echo "COPY BLINK TO WINEGLASS"
          echo "======================================"

          mkdir -p \
            "$WG/Vendor/blink/lib"

          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"


          echo
          echo "======================================"
          echo "BUILD WINEGLASS BLINK BRIDGE"
          echo "======================================"

          "$CC" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -fno-common \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"


          echo
          echo "======================================"
          echo "VERIFY BLINK ARM64"
          echo "======================================"

          file \
            "$WG/Vendor/blink/lib/blink.a"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            | grep \
                -q \
                "arm64"


          echo
          echo "======================================"
          echo "BLINK ARM64 NO-JIT READY"
          echo "======================================"


      # ==========================================================
      # PATCH WINEGLASS INTO POSTAL 2
      #
      # SAME BUNDLE ID AS v5:
      #
      # com.postal2ios.native
      #
      # ==========================================================

      - name: Patch WineGlass into POSTAL 2 v6
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          python3 <<'PY'
          from pathlib import Path
          import plistlib
          import re


          # ======================================================
          # PROJECT.YML
          # ======================================================

          project = Path("project.yml")
          text = project.read_text()


          text = text.replace(
              "bundleIdPrefix: com.wineglass",
              "bundleIdPrefix: com.postal2ios"
          )


          text = text.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",
              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )


          text = text.replace(
              'xcodeVersion: "15.0"',
              'xcodeVersion: "15.4"'
          )


          if "projectFormat:" not in text:

              text = text.replace(
                  '  xcodeVersion: "15.4"',
                  '  xcodeVersion: "15.4"\n'
                  '  projectFormat: xcode15_3',
                  1
              )


          text = text.replace(
              'TARGETED_DEVICE_FAMILY: "1,2"',
              'TARGETED_DEVICE_FAMILY: "1"'
          )


          text = re.sub(
              r'^\s*CODE_SIGN_ENTITLEMENTS:.*\n',
              '',
              text,
              flags=re.MULTILINE
          )


          text = re.sub(
              r'^\s*DEVELOPMENT_TEAM:.*\n',
              '',
              text,
              flags=re.MULTILINE
          )


          text = text.replace(
              "CODE_SIGN_STYLE: Automatic",
              "CODE_SIGN_STYLE: Manual"
          )


          project.write_text(text)


          # ======================================================
          # INFO.PLIST
          # ======================================================

          plist_path = Path(
              "Sources/App/Info.plist"
          )


          with plist_path.open("rb") as f:
              info = plistlib.load(f)


          info["CFBundleName"] = "POSTAL 2"
          info["CFBundleDisplayName"] = "POSTAL 2"

          info["CFBundleShortVersionString"] = "0.6"
          info["CFBundleVersion"] = "6"

          info["UIFileSharingEnabled"] = True
          info["LSSupportsOpeningDocumentsInPlace"] = True


          with plist_path.open("wb") as f:

              plistlib.dump(
                  info,
                  f,
                  sort_keys=False
              )


          # ======================================================
          # LOG TO IOS FILES
          #
          # Documents/POSTAL2-WineGlass.log
          # ======================================================

          log_path = Path(
              "Sources/Core/wg_log.c"
          )

          log = log_path.read_text()


          if "#include <stdlib.h>" not in log:

              log = log.replace(
                  "#include <pthread.h>",
                  "#include <pthread.h>\n"
                  "#include <stdlib.h>",
                  1
              )


          mutex_old = (
              "static pthread_mutex_t s_mutex   = "
              "PTHREAD_MUTEX_INITIALIZER;"
          )

          mutex_new = (
              "static pthread_mutex_t s_mutex   = "
              "PTHREAD_MUTEX_INITIALIZER;\n"
              "static FILE *s_postal_file = NULL;"
          )


          if mutex_old not in log:
              raise SystemExit(
                  "ERROR: WineGlass mutex line changed"
              )


          log = log.replace(
              mutex_old,
              mutex_new,
              1
          )


          init_old = """void wg_log_init(void) {
              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;
          }"""


          init_new = """void wg_log_init(void) {
              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;

              const char *home = getenv("HOME");

              if (home && home[0]) {

                  char path[1024];

                  snprintf(
                      path,
                      sizeof(path),
                      "%s/Documents/POSTAL2-WineGlass.log",
                      home
                  );

                  if (s_postal_file) {

                      fclose(
                          s_postal_file
                      );

                      s_postal_file = NULL;
                  }

                  s_postal_file =
                      fopen(
                          path,
                          "w"
                      );

                  if (s_postal_file) {

                      setvbuf(
                          s_postal_file,
                          NULL,
                          _IOLBF,
                          0
                      );

                      fprintf(
                          s_postal_file,
                          "POSTAL 2 iOS v6 WineGlass log\\n"
                      );

                      fflush(
                          s_postal_file
                      );
                  }
              }
          }"""


          if init_old not in log:
              raise SystemExit(
                  "ERROR: WineGlass wg_log_init changed"
              )


          log = log.replace(
              init_old,
              init_new,
              1
          )


          writer_old = """    fprintf(stderr, "[%s/%s] %s\\n", level_names[lvl], safe_tag, buf);
              pthread_mutex_lock(&s_mutex);"""


          writer_new = """    fprintf(stderr, "[%s/%s] %s\\n", level_names[lvl], safe_tag, buf);

              pthread_mutex_lock(&s_mutex);

              if (s_postal_file) {

                  fprintf(
                      s_postal_file,
                      "[%s/%s] %s\\n",
                      level_names[lvl],
                      safe_tag,
                      buf
                  );

                  fflush(
                      s_postal_file
                  );
              }"""


          if writer_old not in log:
              raise SystemExit(
                  "ERROR: WineGlass log writer changed"
              )


          log = log.replace(
              writer_old,
              writer_new,
              1
          )


          log_path.write_text(log)


          # ======================================================
          # POSTAL 2 SCENE
          # ======================================================

          scene_path = Path(
              "Sources/App/WGSceneDelegate.m"
          )

          scene = scene_path.read_text()


          # ======================================================
          # BUTTON TITLE
          # ======================================================

          old_title = (
              '[_loadButton setTitle:@"  Load .exe  " '
              'forState:UIControlStateNormal];'
          )

          new_title = (
              '[_loadButton setTitle:@"  RUN POSTAL 2  " '
              'forState:UIControlStateNormal];'
          )


          if old_title not in scene:

              raise SystemExit(
                  "ERROR: Load .exe title changed upstream"
              )


          scene = scene.replace(
              old_title,
              new_title,
              1
          )


          # ======================================================
          # BUTTON ACTION
          # ======================================================

          old_action = (
              '[_loadButton addTarget:self '
              'action:@selector(openFilePicker) '
              'forControlEvents:UIControlEventTouchUpInside];'
          )

          new_action = (
              '[_loadButton addTarget:self '
              'action:@selector(runPostal2) '
              'forControlEvents:UIControlEventTouchUpInside];'
          )


          if old_action not in scene:

              raise SystemExit(
                  "ERROR: Load button action changed upstream"
              )


          scene = scene.replace(
              old_action,
              new_action,
              1
          )


          # ======================================================
          # INSERT POSTAL METHODS
          # ======================================================

          marker = (
              "#pragma mark - UIDocumentPickerDelegate"
          )


          if marker not in scene:

              raise SystemExit(
                  "ERROR: picker marker missing"
              )


          methods = r'''
          // =====================================================
          // POSTAL 2 v6
          // =====================================================


          - (NSString *)findPostal2Exe {

              NSString *docs =

                  NSSearchPathForDirectoriesInDomains(

                      NSDocumentDirectory,

                      NSUserDomainMask,

                      YES

                  ).firstObject;


              if (!docs) {

                  WG_LOGE(
                      "POSTAL2",
                      "Documents directory unavailable"
                  );

                  return nil;
              }


              NSString *root =

                  [
                      docs

                      stringByAppendingPathComponent:
                          @"Postal2FullData"
                  ];


              NSFileManager *fm =

                  [
                      NSFileManager
                      defaultManager
                  ];


              BOOL isDirectory =
                  NO;


              if (

                  ![
                      fm

                      fileExistsAtPath:
                          root

                      isDirectory:
                          &isDirectory
                  ]

                  ||

                  !isDirectory

              ) {

                  WG_LOGE(
                      "POSTAL2",
                      "Postal2FullData missing: %s",
                      root.UTF8String
                  );

                  return nil;
              }


              // ===============================================
              // NORMAL GAME LAYOUT
              // ===============================================

              NSString *normal =

                  [
                      root

                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"
                  ];


              if (

                  [
                      fm

                      fileExistsAtPath:
                          normal
                  ]

              ) {

                  WG_LOGI(
                      "POSTAL2",
                      "Found EXE: %s",
                      normal.UTF8String
                  );

                  return normal;
              }


              // ===============================================
              // RECURSIVE FALLBACK SEARCH
              // ===============================================

              NSDirectoryEnumerator *enumerator =

                  [
                      fm

                      enumeratorAtPath:
                          root
                  ];


              NSString *relative =
                  nil;


              while (

                  (
                      relative =
                          [
                              enumerator
                              nextObject
                          ]
                  )

              ) {

                  NSString *filename =
                      relative.lastPathComponent;


                  if (

                      [
                          filename

                          caseInsensitiveCompare:
                              @"Postal2.exe"
                      ]

                      ==

                      NSOrderedSame

                  ) {

                      NSString *found =

                          [
                              root

                              stringByAppendingPathComponent:
                                  relative
                          ];


                      WG_LOGI(
                          "POSTAL2",
                          "Found recursive EXE: %s",
                          found.UTF8String
                      );

                      return found;
                  }
              }


              WG_LOGE(
                  "POSTAL2",
                  "Postal2.exe not found"
              );


              return nil;
          }



          // =====================================================
          // RUN ORIGINAL WINDOWS POSTAL2.EXE
          // =====================================================


          - (void)runPostal2 {

              if (!_engine) {

                  WG_LOGW(
                      "POSTAL2",
                      "Engine not ready"
                  );

                  return;
              }


              NSString *exe =

                  [
                      self
                      findPostal2Exe
                  ];


              if (!exe) {

                  [
                      _loadButton

                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "

                      forState:
                          UIControlStateNormal
                  ];


                  _loadButton.enabled =
                      YES;


                  return;
              }


              NSString *systemFolder =

                  [
                      exe

                      stringByDeletingLastPathComponent
                  ];


              // ===============================================
              // UE2 EXPECTS SYSTEM AS WORKING DIRECTORY
              // ===============================================

              if (

                  chdir(
                      systemFolder.fileSystemRepresentation
                  )

                  !=

                  0

              ) {

                  WG_LOGE(
                      "POSTAL2",
                      "Could not enter System folder: %s",
                      systemFolder.UTF8String
                  );

              } else {

                  WG_LOGI(
                      "POSTAL2",
                      "Working directory: %s",
                      systemFolder.UTF8String
                  );
              }


              [
                  _loadButton

                  setTitle:
                      @"  STARTING POSTAL 2...  "

                  forState:
                      UIControlStateNormal
              ];


              _loadButton.enabled =
                  NO;


              WG_LOGI(
                  "POSTAL2",
                  "Launching ORIGINAL Windows Postal2.exe"
              );


              WG_LOGI(
                  "POSTAL2",
                  "EXE = %s",
                  exe.UTF8String
              );


              [
                  self

                  loadAndRunPE:
                      exe
              ];
          }


          '''


          scene = scene.replace(
              marker,
              methods + "\n" + marker,
              1
          )


          # ======================================================
          # AUTO RUN AFTER ENGINE INITIALIZES
          # ======================================================

          autorun_old = (
              "[self tryLoadBundledPE];"
          )

          autorun_new = (
              "[self runPostal2];"
          )


          if autorun_old not in scene:

              raise SystemExit(
                  "ERROR: tryLoadBundledPE call changed upstream"
              )


          scene = scene.replace(
              autorun_old,
              autorun_new,
              1
          )


          scene_path.write_text(
              scene
          )


          print(
              "POSTAL 2 v6 FIX 4 patch complete"
          )
          PY


          echo
          echo "======================================"
          echo "BUNDLE ID"
          echo "======================================"

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            project.yml


          echo
          echo "======================================"
          echo "POSTAL 2 METHODS"
          echo "======================================"

          grep \
            -n \
            "RUN POSTAL 2\|findPostal2Exe\|runPostal2\|Postal2FullData" \
            Sources/App/WGSceneDelegate.m


          echo
          echo "======================================"
          echo "LOG"
          echo "======================================"

          grep \
            -n \
            "POSTAL2-WineGlass.log" \
            Sources/Core/wg_log.c


      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          xcodegen generate

          test -d \
            WineGlass.xcodeproj


          PBX="$GITHUB_WORKSPACE/WineGlass/WineGlass.xcodeproj/project.pbxproj"

          test -f "$PBX"


          echo
          echo "======================================"
          echo "OBJECT VERSION"
          echo "======================================"

          grep \
            -n \
            "objectVersion" \
            "$PBX" \
            | head


          if grep \
            -q \
            "objectVersion = 77;" \
            "$PBX"; then

              echo
              echo "ERROR:"
              echo "XcodeGen created objectVersion 77"

              exit 1
          fi


          echo
          echo "Xcode project generated."


      # ==========================================================
      # BUILD APPLICATION
      # ==========================================================

      - name: Build POSTAL 2 v6 ARM64
        shell: bash
        run: |
          set +e
          set -o pipefail


          cd "$GITHUB_WORKSPACE/WineGlass"


          rm -rf \
            "$GITHUB_WORKSPACE/build"


          mkdir -p \
            "$GITHUB_WORKSPACE/build"


          echo
          echo "======================================"
          echo "BUILD POSTAL 2 v6 FIX 4"
          echo "======================================"


          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
                "$GITHUB_WORKSPACE/build/xcodebuild.log"


          STATUS=${PIPESTATUS[0]}


          if [ "$STATUS" -ne 0 ]; then

              echo
              echo "======================================"
              echo "REAL BUILD ERRORS"
              echo "======================================"

              grep \
                -n \
                -E \
                "error:|fatal error:" \
                "$GITHUB_WORKSPACE/build/xcodebuild.log" \
                | tail \
                    -250 \
                || true

              echo
              echo "======================================"

              exit "$STATUS"
          fi


          echo
          echo "======================================"
          echo "XCODE BUILD SUCCESS"
          echo "======================================"


      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -euxo pipefail


          APP="$(
            find \
              "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -type d \
              -name "WineGlass.app" \
              | head \
                  -n 1
          )"


          if [ -z "$APP" ]; then

              echo
              echo "ERROR:"
              echo "WineGlass.app not found"

              find \
                "$GITHUB_WORKSPACE/build" \
                -maxdepth 8 \
                -print

              exit 1
          fi


          echo \
            "APP_PATH=$APP" \
            >> "$GITHUB_ENV"


          echo
          echo "======================================"
          echo "APP"
          echo "======================================"

          echo "$APP"


          echo
          echo "======================================"
          echo "EXECUTABLE"
          echo "======================================"

          file \
            "$APP/WineGlass"


          echo
          echo "======================================"
          echo "ARCHITECTURE"
          echo "======================================"

          lipo \
            -info \
            "$APP/WineGlass" \
            || true


          file \
            "$APP/WineGlass" \
            | grep \
                -q \
                "arm64"


          echo
          echo "ARM64 confirmed."


      # ==========================================================
      # VERIFY SAME ID AS v5
      # ==========================================================

      - name: Verify v6 bundle identity
        shell: bash
        run: |
          set -euxo pipefail


          INFO="$APP_PATH/Info.plist"


          BUNDLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$INFO"
          )"


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$INFO"
          )"


          BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$INFO"
          )"


          echo
          echo "======================================"
          echo "IDENTITY"
          echo "======================================"

          echo "Bundle:  $BUNDLE"
          echo "Version: $VERSION"
          echo "Build:   $BUILD"


          test \
            "$BUNDLE" = \
            "com.postal2ios.native"


          test \
            "$VERSION" = \
            "0.6"


          test \
            "$BUILD" = \
            "6"


          echo
          echo "======================================"
          echo "FILE SHARING"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :UIFileSharingEnabled" \
            "$INFO"


      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create POSTAL 2 v6 IPA
        shell: bash
        run: |
          set -euxo pipefail


          OUTPUT="$GITHUB_WORKSPACE/output"


          rm -rf \
            "$OUTPUT"


          mkdir -p \
            "$OUTPUT/Payload"


          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/Postal2iOS.app"


          cd \
            "$OUTPUT"


          echo
          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          /usr/bin/zip \
            -qry \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX4.ipa" \
            Payload


          rm -rf \
            Payload


          test -f \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX4.ipa"


          echo
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls \
            -lh \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX4.ipa"


      # ==========================================================
      # README
      # ==========================================================

      - name: Create README
        shell: bash
        run: |
          set -euxo pipefail

          cat > \
            "$GITHUB_WORKSPACE/output/README.txt" \
            <<'EOF'
          POSTAL 2 iOS v6
          ORIGINAL EXE TEST FIX 4
          ===============================


          IMPORTANT
          ---------

          DO NOT DELETE YOUR OLD v5.


          SAME BUNDLE ID
          --------------

          com.postal2ios.native


          OLD IMPORT
          ----------

          Documents/Postal2FullData


          Your imported POSTAL 2 files should
          remain there when v6 is installed
          over v5 with the same signer.


          POSTAL 2 EXE
          ------------

          v6 automatically searches:

          Documents/Postal2FullData/System/Postal2.exe


          There is also a recursive search
          if Postal2.exe is stored elsewhere.


          CPU
          ---

          blink ARM64

          NO JIT for this first test.


          FIX 3
          -----

          getentropy/getrandom disabled

          /dev/urandom enabled


          FIX 4
          -----

          HAVE_SYS_MOUNT_H enabled

          This gives Blink the Darwin/iOS
          struct statfs definitions from:

          sys/mount.h


          RUN
          ---

          Install v6 OVER v5.

          Open POSTAL 2.

          It should automatically attempt
          to start Postal2.exe.

          There is also a:

          RUN POSTAL 2

          button.


          LOG
          ---

          Open the POSTAL 2 folder
          in iOS Files.

          Find:

          POSTAL2-WineGlass.log


          Send that log back to ChatGPT.


          GOAL
          ----

          Get the ORIGINAL Windows
          Postal2.exe through the PE/x86
          compatibility layer.

          This build is not guaranteed
          to reach the POSTAL 2 menu yet.
          EOF


      # ==========================================================
      # FINAL CHECK
      # ==========================================================

      - name: Final artifact check
        shell: bash
        run: |
          set -euxo pipefail


          IPA="$GITHUB_WORKSPACE/output/POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX4.ipa"

          README="$GITHUB_WORKSPACE/output/README.txt"


          test -f "$IPA"
          test -f "$README"


          echo
          echo "======================================"
          echo "READY FOR UPLOAD"
          echo "======================================"

          ls \
            -lh \
            "$GITHUB_WORKSPACE/output"


      # ==========================================================
      # UPLOAD IPA
      # ==========================================================

      - name: Upload POSTAL 2 v6 IPA
        uses: actions/upload-artifact@v4
        with:

          name: POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX4

          path: |

            output/POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX4.ipa

            output/README.txt

          if-no-files-found: error

          compression-level: 0

          retention-days: 7


      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload build debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:

          name: POSTAL-2-iOS-v6-FIX4-BUILD-FAILED

          path: |

            build/xcodebuild.log

            WineGlass/project.yml

            WineGlass/Sources/App/WGSceneDelegate.m

            WineGlass/Sources/App/Info.plist

            WineGlass/Sources/Core/wg_log.c

            WineGlass/WineGlass.xcodeproj/project.pbxproj

            blink/config.h

            blink/config.mk

            blink/config.log

          if-no-files-found: ignore

          retention-days: 7
