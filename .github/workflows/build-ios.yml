            -c "Print :CFBundleVersion" \
            "$APP/Info.plist"

      # ==========================================================
      # PACKAGE IPA
      # ==========================================================

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"

          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          OUT="$ROOT/out"

          rm -rf \
            "$OUT"

          mkdir -p \
            "$OUT/Payload"

          cp -R \
            "$APP" \
            "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"

          zip \
            -qry \
            "POSTAL-2-iOS-v9.0-CRT-DATA-FIX.ipa" \
            Payload

          echo "===== IPA ====="

          ls -lh \
            "POSTAL-2-iOS-v9.0-CRT-DATA-FIX.ipa"

      # ==========================================================
      # UPLOAD IPA
      # ==========================================================

      - name: Upload POSTAL 2 FIX 9.0 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v9.0-CRT-DATA-FIX
          path: out/POSTAL-2-iOS-v9.0-CRT-DATA-FIX.ipa
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p \
            debug-fix9

          cp \
            WineGlass/xcodebuild.log \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            blink-src/config.h \
            debug-fix9/blink-config.h \
            2>/dev/null \
            || true

          cp \
            blink-src/config.mk \
            debug-fix9/blink-config.mk \
            2>/dev/null \
            || true

          cp \
            blink-src/config.log \
            debug-fix9/blink-config.log \
            2>/dev/null \
            || true

          cp \
            WineGlass/Vendor/blink/wg_blink_impl.c \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/Sources/Core/wg_engine.c \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/Sources/Win32/wg_dll_mapper.c \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/Sources/CPU/wg_x86_decode.c \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/Sources/App/WGSceneDelegate.m \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/project.yml \
            debug-fix9/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/WineGlass.xcodeproj/project.pbxproj \
            debug-fix9/ \
            2>/dev/null \
            || true

      - name: Upload FIX 9 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX9-DEBUG
          path: debug-fix9
          if-no-files-found: ignore
          retention-days: 7
