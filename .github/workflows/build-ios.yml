name: POSTAL 2 WineGlass iOS FIX 11.6 CLEAN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate FIX 11.6 CLEAN
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate embedded Python
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import textwrap
          import zlib

          path = Path(".github/workflows/build-ios.yml")
          text = path.read_text()

          lines = text.splitlines()
          blocks = []
          i = 0

          while i < len(lines):
              line = lines[i]

              if line.strip() == "python3 <<'PY'":
                  base_indent = len(line) - len(line.lstrip())
                  body = []
                  i += 1

                  while i < len(lines) and lines[i].strip() != "PY":
                      current = lines[i]

                      if current.startswith(" " * base_indent):
                          current = current[base_indent:]

                      body.append(current)
                      i += 1

                  if i >= len(lines):
                      raise SystemExit(
                          "ERROR: unterminated Python heredoc"
                      )

                  blocks.append(
                      textwrap.dedent(
                          "\n".join(body)
                      )
                  )

              i += 1

          for index, code in enumerate(
              blocks,
              start=1
          ):
              ast.parse(
                  code,
                  filename=f"visible-python-{index}"
              )

          payload_re = re.compile(
              r'payload\s*=\s*"""([A-Za-z0-9+/=\s]+)"""',
              re.S
          )

          payloads = payload_re.findall(text)

          if not payloads:
              raise SystemExit(
                  "ERROR: no compressed Python payloads found"
              )

          for index, payload in enumerate(
              payloads,
              start=1
          ):
              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(
                  code,
                  filename=f"decoded-patch-{index}"
              )

          print(
              "Python validation OK:",
              len(blocks),
              "visible blocks,",
              len(payloads),
              "compressed payloads"
          )
          PY


  vc120:
    needs: lint
    name: Prepare VC++ 2013 x86
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Download official VC++ 2013 x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $exe = Join-Path $root "vcredist_x86.exe"
          $out = Join-Path $root "vc120-runtime"

          Remove-Item `
            $out `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out |
            Out-Null

          $urls = @(
            "https://download.visualstudio.microsoft.com/download/pr/10912113/5da66ddebb0ad32ebd4b922fd82e8e25/vcredist_x86.exe",
            "https://download.microsoft.com/download/2/E/6/2E61CFA4-993B-4DD4-91DA-3737CD5CD6E3/vcredist_x86.exe"
          )

          $downloaded = $false

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $exe

              if (
                (Test-Path $exe) -and
                ((Get-Item $exe).Length -gt 100000)
              ) {
                $downloaded = $true
                break
              }
            }
            catch {
              Write-Warning $_
            }
          }

          if (-not $downloaded) {
            throw "Could not download VC++ 2013 x86"
          }

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList "/install","/quiet","/norestart" `
            -Wait `
            -PassThru

          Write-Host "vcredist exit code: $($proc.ExitCode)"

          if (
            $proc.ExitCode -ne 0 -and
            $proc.ExitCode -ne 1638
          ) {
            throw "vcredist failed: $($proc.ExitCode)"
          }

          $msvcr = @(
            "$env:WINDIR\SysWOW64\msvcr120.dll",
            "$env:WINDIR\System32\msvcr120.dll"
          ) |
          Where-Object {
            Test-Path $_
          } |
          Select-Object -First 1

          $msvcp = @(
            "$env:WINDIR\SysWOW64\msvcp120.dll",
            "$env:WINDIR\System32\msvcp120.dll"
          ) |
          Where-Object {
            Test-Path $_
          } |
          Select-Object -First 1

          if (-not $msvcr) {
            throw "msvcr120.dll not found"
          }

          if (-not $msvcp) {
            throw "msvcp120.dll not found"
          }

          Copy-Item `
            $msvcr `
            (Join-Path $out "msvcr120.dll") `
            -Force

          Copy-Item `
            $msvcp `
            (Join-Path $out "msvcp120.dll") `
            -Force

          Get-Item `
            (Join-Path $out "msvcr120.dll"), `
            (Join-Path $out "msvcp120.dll") |
            Format-List FullName,Length

      - name: Upload VC120
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime
          if-no-files-found: error
          retention-days: 1


  build:
    needs: vc120
    name: Build POSTAL 2 FIX 11.6 CLEAN
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VC120
        uses: actions/download-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime

      - name: Verify VC120
        shell: bash
        run: |
          set -euxo pipefail

          test -s vc120-runtime/msvcr120.dll
          test -s vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll
          file vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll |
            grep -q "PE32 executable"

          file vc120-runtime/msvcp120.dll |
            grep -q "PE32 executable"

          file vc120-runtime/msvcr120.dll |
            grep -q "Intel 80386"

          file vc120-runtime/msvcp120.dll |
            grep -q "Intel 80386"


      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "/Applications/Xcode_15.4.app" ]; then

            sudo xcode-select \
              -s "/Applications/Xcode_15.4.app/Contents/Developer"

          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then

            sudo xcode-select \
              -s "/Applications/Xcode_15.4.0.app/Contents/Developer"

          else

            echo "ERROR: Xcode 15.4 not found"

            ls -1 /Applications |
              grep Xcode ||
              true

            exit 1

          fi

          xcodebuild -version
          xcode-select -p


      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          export PATH="$(brew --prefix)/bin:$PATH"

          command -v flock
          xcodegen --version

          xcrun \
            --sdk iphoneos \
            --show-sdk-version


      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf WineGlass blink-src

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p \
            WineGlass/Vendor/blink/lib

          echo "===== WINEGLASS ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK ====="
          git -C blink-src rev-parse HEAD


      - name: Configure Blink ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd blink-src

          chmod +x configure

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk


