      - name: Patch Blink FIX 7.7 diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Vendor/blink/wg_blink_impl.c"
          )

          s = p.read_text()

          if "#include <stdio.h>" not in s:
              if "#include <string.h>" in s:
                  s = s.replace(
                      "#include <string.h>",
                      "#include <string.h>\n#include <stdio.h>",
                      1
                  )
              else:
                  s = "#include <stdio.h>\n" + s

          old = '''        InitMap();
                  s_blink_initialized = 1;'''

          new = '''        fprintf(stderr, "[FIX7/BLINK] BEFORE InitMap\\n");
                  fflush(stderr);

                  InitMap();

                  fprintf(stderr, "[FIX7/BLINK] AFTER InitMap\\n");
                  fflush(stderr);

                  s_blink_initialized = 1;'''

          if old not in s:
              raise SystemExit(
                  "ERROR: InitMap location missing"
              )

          s = s.replace(old, new, 1)

          old = '''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {
              ensure_initialized();'''

          new = '''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {

              fprintf(stderr,
                      "[FIX7/BLINK] CREATE VM mode=%d\\n",
                      mode.omode);
              fflush(stderr);

              ensure_initialized();

              fprintf(stderr,
                      "[FIX7/BLINK] INIT COMPLETE\\n");
              fflush(stderr);'''

          if old not in s:
              raise SystemExit(
                  "ERROR: create_vm location missing"
              )

          s = s.replace(old, new, 1)

          old = '''    struct WGBlinkVM *vm = calloc(1, sizeof(struct WGBlinkVM));'''

          new = '''    fprintf(stderr,
                      "[FIX7/BLINK] BEFORE calloc\\n");
              fflush(stderr);

              struct WGBlinkVM *vm =
                  calloc(1, sizeof(struct WGBlinkVM));

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER calloc vm=%p\\n",
                      (void *)vm);
              fflush(stderr);'''

          if old not in s:
              raise SystemExit(
                  "ERROR: calloc location missing"
              )

          s = s.replace(old, new, 1)

          old = '''    vm->s = NewSystem(mode);'''

          new = '''    fprintf(stderr,
                      "[FIX7/BLINK] BEFORE NewSystem\\n");
              fflush(stderr);

              vm->s = NewSystem(mode);

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER NewSystem system=%p\\n",
                      (void *)vm->s);
              fflush(stderr);'''

          if old not in s:
              raise SystemExit(
                  "ERROR: NewSystem location missing"
              )

          s = s.replace(old, new, 1)

          old = '''        vm->s->real = Mmap(NULL, real_size, PROT_READ | PROT_WRITE,
                                     MAP_PRIVATE | MAP_ANONYMOUS_, -1, 0, "real");'''

          new = '''        fprintf(stderr,
                          "[FIX7/BLINK] BEFORE real Mmap size=%ld\\n",
                          real_size);
                  fflush(stderr);

                  vm->s->real = Mmap(NULL, real_size, PROT_READ | PROT_WRITE,
                                     MAP_PRIVATE | MAP_ANONYMOUS_, -1, 0, "real");

                  fprintf(stderr,
                          "[FIX7/BLINK] AFTER real Mmap real=%p\\n",
                          (void *)vm->s->real);
                  fflush(stderr);'''

          if old not in s:
              raise SystemExit(
                  "ERROR: real Mmap location missing"
              )

          s = s.replace(old, new, 1)

          old = '''    vm->m = NewMachine(vm->s, NULL);'''

          new = '''    fprintf(stderr,
                      "[FIX7/BLINK] BEFORE NewMachine\\n");
              fflush(stderr);

              vm->m = NewMachine(vm->s, NULL);

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER NewMachine machine=%p\\n",
                      (void *)vm->m);
              fflush(stderr);'''

          if old not in s:
              raise SystemExit(
                  "ERROR: NewMachine location missing"
              )

          s = s.replace(old, new, 1)

          old = '''        vm->s->cr3 = AllocatePageTable(vm->s);'''

          new = '''        fprintf(stderr,
                          "[FIX7/BLINK] BEFORE AllocatePageTable\\n");
                  fflush(stderr);

                  vm->s->cr3 =
                      AllocatePageTable(vm->s);

                  fprintf(stderr,
                          "[FIX7/BLINK] AFTER AllocatePageTable cr3=%llu\\n",
                          (unsigned long long)vm->s->cr3);
                  fflush(stderr);'''

          if old not in s:
              raise SystemExit(
                  "ERROR: AllocatePageTable location missing"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("BLINK FIX 7.7 DIAGNOSTICS PATCHED")
          print("return vm / closing brace untouched")
          PY

          echo "===== DIAGNOSTICS ====="

          grep -n \
            "FIX7/BLINK" \
            WineGlass/Vendor/blink/wg_blink_impl.c

          echo "===== FUNCTION END CHECK ====="

          grep -n -A5 -B5 \
            'flags |= (1 << 9)' \
            WineGlass/Vendor/blink/wg_blink_impl.c \
            || true
