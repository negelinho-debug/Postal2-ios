      - name: Patch FIX 11.2 VC120 Win32 environment
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()

          # ============================================================
          # POSTAL 2 FIX 11.2
          # Real VC120 needs several Win32 startup APIs to return sane data.
          # LoadLibraryExW is intentionally left alone: current WineGlass
          # already gives missing system DLLs a virtual/fake module handle.
          # ============================================================

          anchor = '''        } else if (strcmp(fn, "GetStringTypeW") == 0 ||
                             strcmp(fn, "GetStringTypeExW") == 0) {'''

          block = r'''        } else if (strcmp(fn, "GetEnvironmentStringsW") == 0) {
              // Environment block is STRING\0STRING\0\0.
              static const uint16_t envw[] = {
                  'T','E','M','P','=','C',':','\\','T','e','m','p',0,
                  'P','A','T','H','=','C',':','\\','W','i','n','d','o','w','s','\\',
                  'S','y','s','t','e','m','3','2',0,
                  0
              };
              uint32_t mem = wg_guest_alloc(engine, (uint32_t)sizeof(envw));
              if (mem) {
                  wg_blink_write_mem(engine->blink, mem, envw, (uint32_t)sizeof(envw));
              }
              ret_val = mem;
              WG_LOGI(TAG, "FIX11.2 GetEnvironmentStringsW -> 0x%X", mem);

          } else if (strcmp(fn, "GetEnvironmentStringsA") == 0) {
              static const char enva[] =
                  "TEMP=C:\\Temp\0"
                  "PATH=C:\\Windows\\System32\0";
              uint32_t mem = wg_guest_alloc(engine, (uint32_t)sizeof(enva));
              if (mem) {
                  wg_blink_write_mem(engine->blink, mem, enva, (uint32_t)sizeof(enva));
              }
              ret_val = mem;
              WG_LOGI(TAG, "FIX11.2 GetEnvironmentStringsA -> 0x%X", mem);

          } else if (strcmp(fn, "FreeEnvironmentStringsW") == 0 ||
                     strcmp(fn, "FreeEnvironmentStringsA") == 0) {
              // Guest heap is a bump allocator; leaving this tiny block mapped is safe.
              ret_val = 1;

          } else if (strcmp(fn, "GetCurrentProcessId") == 0) {
              ret_val = 0x1000;
              WG_LOGI(TAG, "FIX11.2 GetCurrentProcessId -> 0x%X", (uint32_t)ret_val);

          } else if (strcmp(fn, "GetStdHandle") == 0) {
              int32_t which = (int32_t)args[0];
              if (which == -10)      ret_val = 0xF0;
              else if (which == -11) ret_val = 0xF1;
              else if (which == -12) ret_val = 0xF2;
              else                   ret_val = 0xF1;

              WG_LOGI(TAG,
                      "FIX11.2 GetStdHandle(%d) -> 0x%X",
                      which,
                      (uint32_t)ret_val);

          } else if (strcmp(fn, "GetProcessWindowStation") == 0) {
              ret_val = 0x4400;

              WG_LOGI(TAG,
                      "FIX11.2 GetProcessWindowStation -> 0x%X",
                      (uint32_t)ret_val);

          } else if (strcmp(fn, "GetUserObjectInformationW") == 0 ||
                     strcmp(fn, "GetUserObjectInformationA") == 0) {
              uint32_t need = 12;

              if (args[4]) {
                  wg_blink_write_mem(
                      engine->blink,
                      args[4],
                      &need,
                      4
                  );
              }

              if (
                  args[1] == 1 &&
                  args[2] &&
                  args[3] >= need
              ) {
                  uint32_t flags[3] = {
                      0,
                      0,
                      1
                  };

                  wg_blink_write_mem(
                      engine->blink,
                      args[2],
                      flags,
                      sizeof(flags)
                  );

                  ret_val = 1;
                  s_last_error = 0;

              } else if (
                  !args[2] ||
                  args[3] < need
              ) {
                  ret_val = 0;
                  s_last_error = 122;

              } else {
                  ret_val = 1;
                  s_last_error = 0;
              }

              WG_LOGI(
                  TAG,
                  "FIX11.2 %s(index=%u,len=%u) -> %u",
                  fn,
                  args[1],
                  args[3],
                  (uint32_t)ret_val
              );

          } else if (strcmp(fn, "GetLastActivePopup") == 0) {
              ret_val =
                  args[0]
                      ? args[0]
                      : 1;

          } else if (strcmp(fn, "GetStringTypeW") == 0 ||
                     strcmp(fn, "GetStringTypeExW") == 0) {'''

          if "FIX11.2 GetEnvironmentStringsW" not in s:
              if anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.2 insertion anchor missing"
                  )

              s = s.replace(
                  anchor,
                  block,
                  1
              )

          old_lc = '''            bool is_ex = (fn[11] == 'E');
                      int ofs = is_ex ? 1 : 0; // LCMapStringEx has locale name as first arg'''

          new_lc = '''            // FIX11.2: do not shift LCMapStringEx arguments.
                      int ofs = 0;'''

          if old_lc in s:
              s = s.replace(
                  old_lc,
                  new_lc,
                  1
              )

          elif new_lc not in s:
              old1 = \
                  "            bool is_ex = (fn[11] == 'E');"

              old2 = \
                  "            int ofs = is_ex ? 1 : 0; // LCMapStringEx has locale name as first arg"

              if old1 in s and old2 in s:
                  s = s.replace(
                      old1,
                      "            // FIX11.2 LCMapStringEx argument layout",
                      1
                  )

                  s = s.replace(
                      old2,
                      "            int ofs = 0;",
                      1
                  )

              else:
                  raise SystemExit(
                      "ERROR: LCMapStringEx argument block missing"
                  )

          old_dll = '''              if (!ok) {
                  WG_LOGE(TAG, "FIX11 DllMain FAILED for %s", m->name);
                  return false;
              }'''

          new_dll = '''              if (!ok || dll_result == 0) {
                  WG_LOGE(TAG,
                          "FIX11.2 DllMain FAILED for %s (runner_ok=%d result=0x%X)",
                          m->name,
                          ok ? 1 : 0,
                          dll_result);
                  return false;
              }'''

          if old_dll in s:
              s = s.replace(
                  old_dll,
                  new_dll,
                  1
              )

          elif "dll_result == 0" not in s:
              raise SystemExit(
                  "ERROR: FIX11 DllMain result block missing"
              )

          old_cleanup = '''    int num_args = entry ? entry->num_args : 0;
              uint64_t new_rsp = rsp + ptr_size + (num_args * ptr_size);'''

          new_cleanup = '''    int num_args = entry ? entry->num_args : 0;
              // POSTAL 2 FIX11.2: correct stdcall cleanup for dynamically auto-stubbed APIs.
              if (fn) {
                  if (strcmp(fn, "GetStdHandle") == 0) num_args = 1;
                  else if (strcmp(fn, "FreeEnvironmentStringsW") == 0 ||
                           strcmp(fn, "FreeEnvironmentStringsA") == 0) num_args = 1;
                  else if (strcmp(fn, "GetLastActivePopup") == 0) num_args = 1;
                  else if (strcmp(fn, "GetUserObjectInformationW") == 0 ||
                           strcmp(fn, "GetUserObjectInformationA") == 0) num_args = 5;
                  else if (strcmp(fn, "LCMapStringW") == 0 ||
                           strcmp(fn, "LCMapStringA") == 0) num_args = 6;
                  else if (strcmp(fn, "LCMapStringEx") == 0) num_args = 9;
              }
              uint64_t new_rsp = rsp + ptr_size + (num_args * ptr_size);'''

          if old_cleanup in s:
              s = s.replace(
                  old_cleanup,
                  new_cleanup,
                  1
              )

          elif "POSTAL 2 FIX11.2: correct stdcall cleanup" not in s:
              raise SystemExit(
                  "ERROR: stdcall cleanup marker missing"
              )

          p.write_text(s)

          print("==============================================")
          print("POSTAL 2 FIX 11.2 PATCH INSTALLED")
          print("GetEnvironmentStringsW/A       FIXED")
          print("GetCurrentProcessId             FIXED")
          print("GetStdHandle                    FIXED")
          print("GetProcessWindowStation         FIXED")
          print("GetUserObjectInformationW/A     FIXED")
          print("GetLastActivePopup              FIXED")
          print("LCMapStringEx argument layout   FIXED")
          print("DllMain BOOL result check       FIXED")
          print("Dynamic stdcall cleanup         FIXED")
          print("LoadLibraryExW                  LEFT INTACT")
          print("==============================================")
          PY

          echo "===== FIX 11.2 VERIFY ====="

          grep -n \
            "FIX11.2 GetEnvironmentStringsW" \
            WineGlass/Sources/Core/wg_engine.c

          grep -n \
            "FIX11.2 GetCurrentProcessId" \
            WineGlass/Sources/Core/wg_engine.c

          grep -n \
            "FIX11.2 GetProcessWindowStation" \
            WineGlass/Sources/Core/wg_engine.c

          grep -n \
            "dll_result == 0" \
            WineGlass/Sources/Core/wg_engine.c

          grep -n \
            "POSTAL 2 FIX11.2: correct stdcall cleanup" \
            WineGlass/Sources/Core/wg_engine.c

          echo "FIX 11.2 VERIFY OK"

