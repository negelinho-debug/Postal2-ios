name: POSTAL 2 iOS v6 ORIGINAL EXE TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Windows x86 runtime
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen make

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== GNU MAKE ====="
          gmake --version | head -n 1

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf WineGlass blink

          git clone --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone --depth 1 \
            https://github.com/jart/blink.git \
            blink

          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK COMMIT ====="
          git -C blink rev-parse HEAD

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          BLINK="$GITHUB_WORKSPACE/blink"
          WG="$GITHUB_WORKSPACE/WineGlass"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"

          cd "$BLINK"

          test -f config.h.ios
          cp config.h.ios config.h

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-g -O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          gmake -j"$(sysctl -n hw.ncpu)" o//blink/blink.a

          test -f o//blink/blink.a

          mkdir -p "$WG/Vendor/blink/lib"
          cp o//blink/blink.a "$WG/Vendor/blink/lib/blink.a"

          "$CC" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          echo "===== BLINK ====="
          file "$WG/Vendor/blink/lib/blink.a"
          file "$WG/Vendor/blink/lib/wg_blink_impl.o"

      - name: Patch WineGlass into POSTAL 2 v6
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          python3 <<'PY'
          from pathlib import Path
          import plistlib
          import re

          # ======================================================
          # PROJECT.YML
          # ======================================================

          project = Path("project.yml")
          s = project.read_text()

          s = s.replace(
              "bundleIdPrefix: com.wineglass",
              "bundleIdPrefix: com.postal2ios"
          )

          s = s.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",
              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )

          s = re.sub(
              r'xcodeVersion:\s*"[^"]+"',
              'xcodeVersion: "15.4"',
              s,
              count=1
          )

          if "projectFormat:" not in s:
              s = s.replace(
                  '  xcodeVersion: "15.4"',
                  '  xcodeVersion: "15.4"\n  projectFormat: xcode15_3',
                  1
              )

          s = s.replace(
              'TARGETED_DEVICE_FAMILY: "1,2"',
              'TARGETED_DEVICE_FAMILY: "1"'
          )

          s = re.sub(
              r'^\s*CODE_SIGN_ENTITLEMENTS:.*\n',
              '',
              s,
              flags=re.MULTILINE
          )

          s = s.replace(
              "CODE_SIGN_STYLE: Automatic",
              "CODE_SIGN_STYLE: Manual"
          )

          s = re.sub(
              r'^\s*DEVELOPMENT_TEAM:.*\n',
              '',
              s,
              flags=re.MULTILINE
          )

          project.write_text(s)

          # ======================================================
          # INFO.PLIST
          # ======================================================

          plist_path = Path("Sources/App/Info.plist")

          with plist_path.open("rb") as f:
              info = plistlib.load(f)

          info["CFBundleName"] = "POSTAL 2"
          info["CFBundleDisplayName"] = "POSTAL 2"
          info["CFBundleShortVersionString"] = "0.6"
          info["CFBundleVersion"] = "6"
          info["UIFileSharingEnabled"] = True
          info["LSSupportsOpeningDocumentsInPlace"] = True

          with plist_path.open("wb") as f:
              plistlib.dump(
                  info,
                  f,
                  sort_keys=False
              )

          # ======================================================
          # LOG TO DOCUMENTS
          # ======================================================

          log_path = Path(
              "Sources/Core/wg_log.c"
          )

          log_path.write_text(r'''#include "wg_log.h"
          #include <stdio.h>
          #include <string.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <stdarg.h>

          static WGLogCallback s_callback = NULL;
          static void *s_userdata = NULL;
          static WGLogLevel s_minLevel = WG_LOG_DEBUG;

          static pthread_mutex_t s_mutex =
              PTHREAD_MUTEX_INITIALIZER;

          static FILE *s_postal_file = NULL;

          static const char *level_names[] = {
              "DBG",
              "INF",
              "WRN",
              "ERR",
              "FTL"
          };


          void wg_log_init(void) {

              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;

              const char *home =
                  getenv("HOME");

              if (
                  home &&
                  home[0]
              ) {

                  char path[1024];

                  snprintf(
                      path,
                      sizeof(path),
                      "%s/Documents/POSTAL2-WineGlass.log",
                      home
                  );

                  if (
                      s_postal_file
                  ) {

                      fclose(
                          s_postal_file
                      );

                      s_postal_file =
                          NULL;
                  }

                  s_postal_file =
                      fopen(
                          path,
                          "w"
                      );

                  if (
                      s_postal_file
                  ) {

                      setvbuf(
                          s_postal_file,
                          NULL,
                          _IOLBF,
                          0
                      );

                      fprintf(
                          s_postal_file,
                          "POSTAL 2 iOS v6 WineGlass log\n"
                      );

                      fflush(
                          s_postal_file
                      );
                  }
              }
          }


          void wg_log_set_callback(
              WGLogCallback callback,
              void *userdata
          ) {

              pthread_mutex_lock(
                  &s_mutex
              );

              s_callback =
                  callback;

              s_userdata =
                  userdata;

              pthread_mutex_unlock(
                  &s_mutex
              );
          }


          void wg_log_set_level(
              WGLogLevel minLevel
          ) {

              s_minLevel =
                  minLevel;
          }


          void wg_log(
              WGLogLevel level,
              const char *tag,
              const char *fmt,
              ...
          ) {

              if (
                  level <
                  s_minLevel
              ) {

                  return;
              }

              int lvl =

                  (
                      level >= 0 &&
                      level <= WG_LOG_FATAL
                  )

                  ? (int)level

                  : (int)WG_LOG_ERROR;


              const char *safe_tag =
                  tag
                  ? tag
                  : "?";


              char buf[512];


              if (
                  fmt
              ) {

                  va_list ap;

                  va_start(
                      ap,
                      fmt
                  );

                  vsnprintf(
                      buf,
                      sizeof(buf),
                      fmt,
                      ap
                  );

                  va_end(
                      ap
                  );

              } else {

                  buf[0] =
                      '\0';
              }


              fprintf(
                  stderr,
                  "[%s/%s] %s\n",
                  level_names[lvl],
                  safe_tag,
                  buf
              );


              pthread_mutex_lock(
                  &s_mutex
              );


              if (
                  s_postal_file
              ) {

                  fprintf(
                      s_postal_file,
                      "[%s/%s] %s\n",
                      level_names[lvl],
                      safe_tag,
                      buf
                  );

                  fflush(
                      s_postal_file
                  );
              }


              if (
                  s_callback
              ) {

                  char tagged[600];

                  snprintf(
                      tagged,
                      sizeof(tagged),
                      "[%s] %s",
                      safe_tag,
                      buf
                  );

                  s_callback(
                      (WGLogLevel)lvl,
                      safe_tag,
                      tagged,
                      s_userdata
                  );
              }


              pthread_mutex_unlock(
                  &s_mutex
              );
          }


          void wg_log_ring_init(
              WGLogRingBuffer *ring
          ) {

              memset(
                  ring,
                  0,
                  sizeof(*ring)
              );

              ring->capacity =
                  256;
          }


          void wg_log_ring_push(
              WGLogRingBuffer *ring,
              WGLogLevel level,
              const char *message
          ) {

              int idx =
                  ring->head;


              strncpy(
                  ring->lines[idx],
                  message,
                  255
              );


              ring->lines[idx][255] =
                  '\0';


              ring->levels[idx] =
                  level;


              ring->head =
                  (
                      ring->head +
                      1
                  )
                  %
                  ring->capacity;


              if (
                  ring->count <
                  ring->capacity
              ) {

                  ring->count++;
              }
          }


          int wg_log_ring_count(
              const WGLogRingBuffer *ring
          ) {

              return
                  ring->count;
          }


          const char *wg_log_ring_get(
              const WGLogRingBuffer *ring,
              int index,
              WGLogLevel *outLevel
          ) {

              if (
                  index < 0 ||
                  index >= ring->count
              ) {

                  return NULL;
              }


              int start =

                  (
                      ring->head
                      -
                      ring->count
                      +
                      ring->capacity
                  )

                  %

                  ring->capacity;


              int actual =

                  (
                      start +
                      index
                  )

                  %

                  ring->capacity;


              if (
                  outLevel
              ) {

                  *outLevel =
                      (WGLogLevel)
                      ring->levels[
                          actual
                      ];
              }


              return
                  ring->lines[
                      actual
                  ];
          }
          ''')

          # ======================================================
          # AUTORUN ORIGINAL POSTAL2.EXE
          # ======================================================

          scene_path =
              Path(
                  "Sources/App/WGSceneDelegate.m"
              )

          m =
              scene_path.read_text()


          # ======================================================
          # CHANGE LOAD BUTTON TITLE
          # ======================================================

          m, count =
              re.subn(
                  r'\[_loadButton\s+setTitle:@"\s*Load \.exe\s*"\s+forState:UIControlStateNormal\];',
                  '[_loadButton setTitle:@"  RUN POSTAL 2  " forState:UIControlStateNormal];',
                  m,
                  count=1
              )


          if (
              count != 1
          ) {

              raise SystemExit(
                  "Could not patch Load .exe button title"
              )
          }


          # ======================================================
          # CHANGE BUTTON ACTION
          # ======================================================

          m, count =
              re.subn(
                  r'\[_loadButton\s+addTarget:self\s+action:@selector\(openFilePicker\)\s+forControlEvents:UIControlEventTouchUpInside\];',
                  '[_loadButton addTarget:self action:@selector(runPostal2) forControlEvents:UIControlEventTouchUpInside];',
                  m,
                  count=1
              )


          if (
              count != 1
          ) {

              raise SystemExit(
                  "Could not patch Load .exe button action"
              )
          }


          # ======================================================
          # AUTO START AFTER ENGINE INITIALIZATION
          # ======================================================

          old =
              "[self tryLoadBundledPE];"


          if (
              old not in m
          ) {

              raise SystemExit(
                  "Could not find tryLoadBundledPE call"
              )
          }


          m =
              m.replace(
                  old,
                  "[self runPostal2];",
                  1
              )


          marker =
              "#pragma mark - UIDocumentPickerDelegate"


          if (
              marker not in m
          ) {

              raise SystemExit(
                  "UIDocumentPicker marker missing"
              )
          }


          # ======================================================
          # POSTAL 2 METHODS
          # ======================================================

          postal_methods = r'''
          // =====================================================
          // POSTAL 2 v6
          // =====================================================


          - (NSString *)findPostal2Exe {

              NSArray *paths =

                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  );


              NSString *docs =
                  paths.firstObject;


              if (
                  !docs
              ) {

                  WG_LOGE(
                      "POSTAL2",
                      "Documents directory unavailable"
                  );

                  return nil;
              }


              NSString *root =

                  [
                      docs
                      stringByAppendingPathComponent:
                          @"Postal2FullData"
                  ];


              NSFileManager *fm =

                  [
                      NSFileManager
                      defaultManager
                  ];


              BOOL isDirectory =
                  NO;


              if (

                  ![
                      fm
                      fileExistsAtPath:
                          root

                      isDirectory:
                          &isDirectory
                  ]

                  ||

                  !isDirectory

              ) {

                  WG_LOGE(
                      "POSTAL2",
                      "Existing v5 folder missing: %s",
                      root.UTF8String
                  );

                  return nil;
              }


              // ===============================================
              // NORMAL POSTAL 2 PATH
              // ===============================================

              NSString *normal =

                  [
                      root
                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"
                  ];


              if (

                  [
                      fm
                      fileExistsAtPath:
                          normal
                  ]

              ) {

                  WG_LOGI(
                      "POSTAL2",
                      "Found normal EXE: %s",
                      normal.UTF8String
                  );

                  return normal;
              }


              // ===============================================
              // FALLBACK RECURSIVE SEARCH
              // ===============================================

              NSDirectoryEnumerator *enumerator =

                  [
                      fm
                      enumeratorAtPath:
                          root
                  ];


              NSString *relative =
                  nil;


              while (

                  (
                      relative =
                          [
                              enumerator
                              nextObject
                          ]
                  )

              ) {

                  NSString *name =
                      relative.lastPathComponent;


                  if (

                      [
                          name

                          caseInsensitiveCompare:
                              @"Postal2.exe"
                      ]

                      ==

                      NSOrderedSame

                  ) {

                      NSString *found =

                          [
                              root

                              stringByAppendingPathComponent:
                                  relative
                          ];


                      WG_LOGI(
                          "POSTAL2",
                          "Found recursive EXE: %s",
                          found.UTF8String
                      );


                      return found;
                  }
              }


              WG_LOGE(
                  "POSTAL2",
                  "Postal2.exe not found under Postal2FullData"
              );


              return nil;
          }


          // =====================================================
          // RUN POSTAL 2
          // =====================================================

          - (void)runPostal2 {

              if (
                  !_engine
              ) {

                  WG_LOGW(
                      "POSTAL2",
                      "RUN pressed before engine initialization"
                  );

                  return;
              }


              NSString *exe =
                  [
                      self
                      findPostal2Exe
                  ];


              if (
                  !exe
              ) {

                  [
                      _loadButton

                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "

                      forState:
                          UIControlStateNormal
                  ];

                  return;
              }


              NSString *systemFolder =

                  [
                      exe
                      stringByDeletingLastPathComponent
                  ];


              // ===============================================
              // UE2 EXPECTS SYSTEM AS WORKING DIRECTORY
              // ===============================================

              if (

                  chdir(
                      systemFolder
                          .fileSystemRepresentation
                  )

                  !=

                  0

              ) {

                  WG_LOGE(
                      "POSTAL2",
                      "chdir System failed: %s",
                      systemFolder.UTF8String
                  );

              } else {

                  WG_LOGI(
                      "POSTAL2",
                      "Working directory: %s",
                      systemFolder.UTF8String
                  );
              }


              [
                  _loadButton

                  setTitle:
                      @"  STARTING POSTAL 2...  "

                  forState:
                      UIControlStateNormal
              ];


              _loadButton.enabled =
                  NO;


              WG_LOGI(
                  "POSTAL2",
                  "Launching ORIGINAL Windows executable"
              );


              WG_LOGI(
                  "POSTAL2",
                  "EXE = %s",
                  exe.UTF8String
              );


              // ===============================================
              // REAL WINDOWS EXE
              // ===============================================

              [
                  self

                  loadAndRunPE:
                      exe
              ];
          }


          '''


          m =
              m.replace(
                  marker,
                  postal_methods
                      +
                  "\n"
                      +
                  marker,
                  1
              )


          scene_path.write_text(
              m
          )


          print(
              "WineGlass patched for POSTAL 2 v6"
          )
          PY


          echo
          echo "======================================"
          echo "BUNDLE ID"
          echo "======================================"

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            project.yml


          echo
          echo "======================================"
          echo "POSTAL PATCH"
          echo "======================================"

          grep \
            -n \
            "runPostal2\|findPostal2Exe\|Postal2FullData" \
            Sources/App/WGSceneDelegate.m


          echo
          echo "======================================"
          echo "LOG PATCH"
          echo "======================================"

          grep \
            -n \
            "POSTAL2-WineGlass.log" \
            Sources/Core/wg_log.c


      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          xcodegen generate

          test -d \
            WineGlass.xcodeproj


          PBX="$GITHUB_WORKSPACE/WineGlass/WineGlass.xcodeproj/project.pbxproj"


          test -f \
            "$PBX"


          echo
          echo "======================================"
          echo "OBJECT VERSION"
          echo "======================================"

          grep \
            -n \
            "objectVersion" \
            "$PBX" \
            | head


          if grep \
            -q \
            "objectVersion = 77;" \
            "$PBX"; then

              echo
              echo "ERROR:"
              echo "future Xcode project format 77"

              exit 1
          fi


      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build POSTAL 2 v6 ARM64
        shell: bash
        run: |
          set +e
          set -o pipefail


          cd "$GITHUB_WORKSPACE/WineGlass"


          rm -rf \
            "$GITHUB_WORKSPACE/build"


          mkdir -p \
            "$GITHUB_WORKSPACE/build"


          echo
          echo "======================================"
          echo "BUILD POSTAL 2 v6"
          echo "======================================"


          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
                "$GITHUB_WORKSPACE/build/xcodebuild.log"


          STATUS=${PIPESTATUS[0]}


          if [
              "$STATUS"
              -ne
              0
          ]; then

              echo
              echo "======================================"
              echo "REAL BUILD ERRORS"
              echo "======================================"


              grep \
                -n \
                -E \
                "error:|fatal error:" \
                "$GITHUB_WORKSPACE/build/xcodebuild.log" \
                | tail \
                    -250 \
                || true


              echo
              echo "======================================"


              exit \
                "$STATUS"
          fi


          echo
          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"


      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -euxo pipefail


          APP="$(

              find \
                "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
                -type d \
                -name "WineGlass.app" \
                | head \
                    -n 1

          )"


          if [
              -z "$APP"
          ]; then

              echo
              echo "ERROR:"
              echo "WineGlass.app not found"

              exit 1
          fi


          echo \
            "APP_PATH=$APP" \
            >> "$GITHUB_ENV"


          echo
          echo "======================================"
          echo "APP"
          echo "======================================"

          echo \
            "$APP"


          echo
          echo "======================================"
          echo "EXECUTABLE"
          echo "======================================"

          file \
            "$APP/WineGlass"


          echo
          echo "======================================"
          echo "ARCH"
          echo "======================================"

          lipo \
            -info \
            "$APP/WineGlass" \
            || true


          file \
            "$APP/WineGlass" \
            | grep \
                -q \
                "arm64"


      # ==========================================================
      # VERIFY SAME BUNDLE ID AS v5
      # ==========================================================

      - name: Verify v6 bundle identity
        shell: bash
        run: |
          set -euxo pipefail


          INFO="$APP_PATH/Info.plist"


          BUNDLE="$(

              /usr/libexec/PlistBuddy \
                -c \
                "Print :CFBundleIdentifier" \
                "$INFO"

          )"


          VERSION="$(

              /usr/libexec/PlistBuddy \
                -c \
                "Print :CFBundleShortVersionString" \
                "$INFO"

          )"


          BUILD="$(

              /usr/libexec/PlistBuddy \
                -c \
                "Print :CFBundleVersion" \
                "$INFO"

          )"


          echo
          echo "======================================"
          echo "IDENTITY"
          echo "======================================"

          echo \
            "Bundle:  $BUNDLE"

          echo \
            "Version: $VERSION"

          echo \
            "Build:   $BUILD"


          test \
            "$BUNDLE" = \
            "com.postal2ios.native"


          test \
            "$VERSION" = \
            "0.6"


          test \
            "$BUILD" = \
            "6"


          echo
          echo "======================================"
          echo "FILE SHARING"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c \
            "Print :UIFileSharingEnabled" \
            "$INFO"


      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create POSTAL 2 v6 IPA
        shell: bash
        run: |
          set -euxo pipefail


          OUTPUT="$GITHUB_WORKSPACE/output"


          rm -rf \
            "$OUTPUT"


          mkdir -p \
            "$OUTPUT/Payload"


          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/Postal2iOS.app"


          cd \
            "$OUTPUT"


          echo
          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"


          /usr/bin/zip \
            -qry \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST.ipa" \
            Payload


          rm -rf \
            Payload


          test -f \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST.ipa"


          cat > README.txt <<'README'
          POSTAL 2 iOS v6
          ORIGINAL EXE TEST
          ===============================


          IMPORTANT
          ---------

          DO NOT DELETE v5 FIRST.


          SAME BUNDLE ID
          --------------

          com.postal2ios.native


          INSTALL
          -------

          Sign v6 the same way
          you signed v5.

          Install v6 OVER v5.


          DATA
          ----

          v5 already has:

          Documents/Postal2FullData


          v6 searches automatically for:

          Documents/Postal2FullData/System/Postal2.exe


          If Postal2.exe is somewhere else
          inside Postal2FullData,
          v6 also searches recursively.


          RUN
          ---

          v6 changes working directory
          to the POSTAL 2 System folder.

