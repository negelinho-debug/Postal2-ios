          POSTAL 2 iOS v6
          ORIGINAL EXE TEST FIX 2
          ===============================


          IMPORTANT
          ---------

          DO NOT DELETE v5.


          SAME BUNDLE ID
          --------------

          com.postal2ios.native


          DATA FROM v5
          ------------

          Documents/Postal2FullData


          INSTALLATION
          ------------

          Sign this IPA exactly the same way
          as your old POSTAL 2 v5.

          Install it OVER v5.


          DO NOT uninstall v5 first.


          RUN
          ---

          Open POSTAL 2.

          Wait for WineGlass initialization.

          Press:

          RUN POSTAL 2


          v6 searches for:

          Documents/Postal2FullData/System/Postal2.exe


          If it is not there,
