name: POSTAL 2 Full Data iOS FIXED Importer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Native iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo
          echo "===== XCODE ====="
          xcodebuild -version

          echo
          echo "===== XCODEGEN ====="
          xcodegen --version

          echo
          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================================
      # CREATE PROJECT
      # ==========================================================

      - name: Create POSTAL 2 iOS project
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          rm -rf Postal2iOS
          mkdir -p Postal2iOS/Sources

          cat > Postal2iOS/project.yml <<'YAML'
          name: Postal2iOS

          options:
            bundleIdPrefix: com.postal2ios

          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1"
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""

          targets:
            Postal2iOS:
              type: application
              platform: iOS

              sources:
                - Sources

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native
                  PRODUCT_NAME: Postal2iOS
                  INFOPLIST_KEY_CFBundleDisplayName: "POSTAL 2"
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO

              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: POSTAL 2
                  CFBundleName: POSTAL 2
                  UIApplicationSupportsIndirectInputEvents: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                    - UIInterfaceOrientationPortrait
                  UILaunchScreen: {}
          YAML

      # ==========================================================
      # SWIFT APP
      # ==========================================================

      - name: Create POSTAL 2 importer
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          cat > Postal2iOS/Sources/Postal2App.swift <<'SWIFT'
          import SwiftUI
          import UniformTypeIdentifiers
          import Foundation

          @main
          struct Postal2App: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct PostalCounts {
              var maps = 0
              var staticMeshes = 0
              var textures = 0
              var animations = 0
              var scripts = 0
              var sounds = 0
              var music = 0
              var configs = 0
              var total = 0
          }

          struct ContentView: View {

              @State private var showImporter = false
              @State private var importing = false

              @State private var status =
                  "Import the full POSTAL 2 folder"

              @State private var errorText: String? = nil
              @State private var progressText = ""

              @State private var counts =
                  PostalCounts()

              private let fm =
                  FileManager.default

              var body: some View {

                  ScrollView {

                      VStack(
                          spacing: 16
                      ) {

                          Text(
                              "POSTAL 2 iOS"
                          )
                          .font(
                              .system(
                                  size: 30,
                                  weight: .bold
                              )
                          )

                          Text(
                              "Native ARM64 runtime"
                          )
                          .foregroundStyle(
                              .secondary
                          )

                          Button {
                              errorText = nil
                              showImporter = true
                          } label: {

                              HStack {

                                  Image(
                                      systemName:
                                          "folder.badge.plus"
                                  )

                                  Text(
                                      importing
                                      ? "Importing…"
                                      : "Import POSTAL 2 Folder"
                                  )
                              }
                              .frame(
                                  maxWidth:
                                      .infinity
                              )
                              .padding()
                          }
                          .buttonStyle(
                              .borderedProminent
                          )
                          .disabled(
                              importing
                          )

                          if importing {

                              ProgressView()
                                  .padding(
                                      .top,
                                      4
                                  )

                              if !progressText.isEmpty {

                                  Text(
                                      progressText
                                  )
                                  .font(
                                      .caption
                                  )
                                  .foregroundStyle(
                                      .secondary
                                  )
                              }
                          }

                          Divider()

                          VStack(
                              spacing: 8
                          ) {

                              StatRow(
                                  title: "Maps",
                                  ext: ".fuk",
                                  value:
                                      counts.maps
                              )

                              StatRow(
                                  title:
                                      "StaticMeshes",
                                  ext: ".usx",
                                  value:
                                      counts.staticMeshes
                              )

                              StatRow(
                                  title:
                                      "Textures",
                                  ext: ".utx",
                                  value:
                                      counts.textures
                              )

                              StatRow(
                                  title:
                                      "Animations",
                                  ext: ".ukx",
                                  value:
                                      counts.animations
                              )

                              StatRow(
                                  title:
                                      "Scripts",
                                  ext: ".u",
                                  value:
                                      counts.scripts
                              )

                              StatRow(
                                  title:
                                      "Sounds",
                                  ext: ".uax / wav",
                                  value:
                                      counts.sounds
                              )

                              StatRow(
                                  title:
                                      "Music",
                                  ext: ".ogg / mp3",
                                  value:
                                      counts.music
                              )

                              StatRow(
                                  title:
                                      "Configs",
                                  ext: ".ini / int",
                                  value:
                                      counts.configs
                              )
                          }

                          Divider()

                          HStack {

                              Text(
                                  "TOTAL FILES"
                              )
                              .fontWeight(
                                  .bold
                              )

                              Spacer()

                              Text(
                                  "\(counts.total)"
                              )
                              .fontWeight(
                                  .bold
                              )
                          }

                          Text(
                              status
                          )
                          .font(
                              .system(
                                  size: 14,
                                  weight:
                                      .medium
                              )
                          )
                          .multilineTextAlignment(
                              .center
                          )
                          .foregroundStyle(
                              errorText == nil
                              ? .green
                              : .red
                          )
                          .padding(
                              .top,
                              4
                          )

                          if let errorText {

                              Text(
                                  errorText
                              )
                              .font(
                                  .caption
                              )
                              .foregroundStyle(
                                  .red
                              )
                              .multilineTextAlignment(
                                  .center
                              )
                              .textSelection(
                                  .enabled
                              )
                          }

                          Text(
                              "Select ONE main POSTAL 2 folder containing Maps, StaticMeshes, Textures, Animations, Sounds, Music and System."
                          )
                          .font(
                              .caption
                          )
                          .foregroundStyle(
                              .secondary
                          )
                          .multilineTextAlignment(
                              .center
                          )
                          .padding(
                              .top,
                              8
                          )
                      }
                      .padding(
                          20
                      )
                  }
                  .fileImporter(
                      isPresented:
                          $showImporter,
                      allowedContentTypes:
                          [.folder],
                      allowsMultipleSelection:
                          false
                  ) { result in

                      switch result {

                      case .success(
                          let urls
                      ):

                          guard let source =
                              urls.first
                          else {

                              fail(
                                  "No folder selected"
                              )

                              return
                          }

                          beginImport(
                              source
                          )

                      case .failure(
                          let error
                      ):

                          fail(
                              "Folder picker error: \(error.localizedDescription)"
                          )
                      }
                  }
                  .onAppear {

                      scanExistingImport()
                  }
              }

              private func beginImport(
                  _ source: URL
              ) {

                  importing = true

                  status =
                      "Reading POSTAL 2 folder…"

                  progressText =
                      source.lastPathComponent

                  errorText =
                      nil

                  counts =
                      PostalCounts()

                  /*
                   Security-scoped access is the important fix.

                   Without this, iOS may return the selected folder
                   but deny recursive access immediately afterwards.
                  */

                  let accessGranted =
                      source
                      .startAccessingSecurityScopedResource()

                  DispatchQueue.global(
                      qos: .userInitiated
                  ).async {

                      defer {

                          if accessGranted {

                              source
                                  .stopAccessingSecurityScopedResource()
                          }
                      }

                      do {

                          let result =
                              try importFolder(
                                  source
                              )

                          DispatchQueue.main.async {

                              counts =
                                  result

                              importing =
                                  false

                              progressText =
                                  ""

                              if (
                                  result.maps > 0 &&
                                  result.staticMeshes > 0 &&
                                  result.textures > 0
                              ) {

                                  status =
                                      "POSTAL 2 data imported successfully"

                                  errorText =
                                      nil

                              } else {

                                  status =
                                      "Folder imported, but required POSTAL 2 packages are missing"

                                  errorText =
                                      "Need at least Maps (.fuk), StaticMeshes (.usx) and Textures (.utx)."
                              }
                          }

                      } catch {

                          DispatchQueue.main.async {

                              importing =
                                  false

                              progressText =
                                  ""

                              status =
                                  "POSTAL 2 import failed"

                              errorText =
                                  error
                                  .localizedDescription
                          }
                      }
                  }
              }

              private func importFolder(
                  _ source: URL
              ) throws -> PostalCounts {

                  guard let documents =
                      fm.urls(
                          for: .documentDirectory,
                          in: .userDomainMask
                      ).first
                  else {

                      throw ImportError(
                          message:
                              "Documents directory unavailable"
                      )
                  }

                  let destination =
                      documents
                      .appendingPathComponent(
                          "Postal2FullData",
                          isDirectory:
                              true
                      )

                  try fm
                      .createDirectory(
                          at: destination,
                          withIntermediateDirectories:
                              true
                      )

                  let keys:
                      [URLResourceKey] = [

                          .isDirectoryKey,
                          .isRegularFileKey,
                          .fileSizeKey
                      ]

                  guard let enumerator =
                      fm.enumerator(
                          at: source,
                          includingPropertiesForKeys:
                              keys,
                          options: [
                              .skipsHiddenFiles,
                              .skipsPackageDescendants
                          ]
                      )
                  else {

                      throw ImportError(
                          message:
                              "Could not read selected folder"
                      )
                  }

                  var result =
                      PostalCounts()

                  var copied =
                      0

                  var scanned =
                      0

                  let allowedExtensions:
                      Set<String> = [

                          "fuk",
                          "usx",
                          "utx",
                          "ukx",
                          "u",
                          "uax",

                          "wav",
                          "ogg",
                          "mp3",

                          "ini",
                          "int",

                          "bmp",
                          "tga",
                          "png",
                          "jpg",
                          "jpeg",

                          "txt"
                      ]

                  while let item =
                      enumerator.nextObject()
                          as? URL {

                      scanned += 1

                      let values =
                          try? item
                              .resourceValues(
                                  forKeys:
                                      Set(keys)
                              )

                      if values?.isDirectory ==
                          true {

                          continue
                      }

                      guard values?
                          .isRegularFile ==
                          true
                      else {

                          continue
                      }

                      let ext =
                          item
                          .pathExtension
                          .lowercased()

                      guard allowedExtensions
                          .contains(ext)
                      else {

                          continue
                      }

                      /*
                       Preserve directory structure relative
                       to selected POSTAL 2 root.
                      */

                      let sourceRoot =
                          source
                          .standardizedFileURL
                          .path

                      let fullPath =
                          item
                          .standardizedFileURL
                          .path

                      var relative =
                          fullPath

                      if relative.hasPrefix(
                          sourceRoot
                      ) {

                          relative.removeFirst(
                              sourceRoot.count
                          )
                      }

                      while relative.hasPrefix(
                          "/"
                      ) {

                          relative.removeFirst()
                      }

                      if relative.isEmpty {

                          relative =
                              item.lastPathComponent
                      }

                      let target =
                          destination
                          .appendingPathComponent(
                              relative
                          )

                      let parent =
                          target
                          .deletingLastPathComponent()

                      try fm
                          .createDirectory(
                              at: parent,
                              withIntermediateDirectories:
                                  true
                          )

                      if fm
                          .fileExists(
                              atPath:
                                  target.path
                          ) {

                          try fm
                              .removeItem(
                                  at: target
                              )
                      }

                      try fm
                          .copyItem(
                              at: item,
                              to: target
                          )

                      copied += 1

                      classify(
                          extensionName:
                              ext,
                          counts:
                              &result
                      )

                      if copied % 25 == 0 {

                          let c = copied
                          let s = scanned

                          DispatchQueue.main.async {

                              progressText =
                                  "Imported \(c) files • scanned \(s)"
                          }
                      }
                  }

                  result.total =
                      copied

                  if copied == 0 {

                      throw ImportError(
                          message:
                              "No supported POSTAL 2 files were found in this folder"
                      )
                  }

                  return result
              }

              private func classify(
                  extensionName ext:
                      String,
                  counts:
                      inout PostalCounts
              ) {

                  switch ext {

                  case "fuk":

                      counts.maps += 1

                  case "usx":

                      counts.staticMeshes += 1

                  case "utx":

                      counts.textures += 1

                  case "ukx":

                      counts.animations += 1

                  case "u":

                      counts.scripts += 1

                  case "uax",
                       "wav":

                      counts.sounds += 1

                  case "ogg",
                       "mp3":

                      counts.music += 1

                  case "ini",
                       "int":

                      counts.configs += 1

                  default:

                      break
                  }
              }

              private func scanExistingImport() {

                  guard let documents =
                      fm.urls(
                          for: .documentDirectory,
                          in: .userDomainMask
                      ).first
                  else {

                      return
                  }

                  let root =
                      documents
                      .appendingPathComponent(
                          "Postal2FullData",
                          isDirectory:
                              true
                      )

                  guard fm
                      .fileExists(
                          atPath:
                              root.path
                      )
                  else {

                      return
                  }

                  DispatchQueue.global(
                      qos: .utility
                  ).async {

                      guard let enumerator =
                          fm.enumerator(
                              at: root,
                              includingPropertiesForKeys:
                                  [.isRegularFileKey],
                              options:
                                  [.skipsHiddenFiles]
                          )
                      else {

                          return
                      }

                      var result =
                          PostalCounts()

                      var total =
                          0

                      while let item =
                          enumerator.nextObject()
                              as? URL {

                          let ext =
                              item
                              .pathExtension
                              .lowercased()

                          switch ext {

                          case "fuk",
                               "usx",
                               "utx",
                               "ukx",
                               "u",
                               "uax",
                               "wav",
                               "ogg",
                               "mp3",
                               "ini",
                               "int":

                              total += 1

                              classify(
                                  extensionName:
                                      ext,
                                  counts:
                                      &result
                              )

                          default:

                              continue
                          }
                      }

                      result.total =
                          total

                      if total > 0 {

                          DispatchQueue.main.async {

                              counts =
                                  result

                              status =
                                  "Existing POSTAL 2 data found"
                          }
                      }
                  }
              }

              private func fail(
                  _ text: String
              ) {

                  importing =
                      false

                  status =
                      "Import failed"

                  errorText =
                      text
              }
          }

          struct StatRow: View {

              let title: String
              let ext: String
              let value: Int

              var body: some View {

                  HStack {

                      VStack(
                          alignment:
                              .leading,
                          spacing: 2
                      ) {

                          Text(
                              title
                          )

                          Text(
                              ext
                          )
                          .font(
                              .caption2
                          )
                          .foregroundStyle(
                              .secondary
                          )
                      }

                      Spacer()

                      Text(
                          "\(value)"
                      )
                      .font(
                          .system(
                              design:
                                  .monospaced
                          )
                      )
                  }
              }
          }

          struct ImportError:
              LocalizedError {

              let message:
                  String

              var errorDescription:
                  String? {

                  message
              }
          }
          SWIFT

          cat > Postal2iOS/Sources/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>CFBundleDisplayName</key>
              <string>POSTAL 2</string>

              <key>CFBundleName</key>
              <string>POSTAL 2</string>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>

              <key>UILaunchScreen</key>
              <dict/>

          </dict>
          </plist>
          PLIST

      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/Postal2iOS"

          xcodegen generate

          echo
          echo "===== PROJECT ====="

          find . \
            -maxdepth 2 \
            -type f \
            -print

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build POSTAL 2 iOS
        shell: bash
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/Postal2iOS"

          rm -rf \
            "$GITHUB_WORKSPACE/build"

          mkdir -p \
            "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project Postal2iOS.xcodeproj \
            -scheme Postal2iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/build/xcodebuild.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"

            grep \
              -n \
              -E \
              "error:|fatal error:" \
              "$GITHUB_WORKSPACE/build/xcodebuild.log" \
              | tail \
                  -150 \
              || true

            echo
            echo "======================================"

            exit "$STATUS"
          fi

          echo
          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"

      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -e

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -type d \
              -name "Postal2iOS.app" \
              | head -n 1
          )"

          if [ -z "$APP" ]; then

            echo "ERROR: Postal2iOS.app not found"
            exit 1
          fi

          echo "APP_PATH=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "APP:"
          echo "$APP"

          du -sh "$APP"

      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"

          mkdir -p \
            "$OUTPUT/Payload"

          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/POSTAL2.app"

          cd "$OUTPUT"

          zip \
            -qry \
            "POSTAL-2-iOS-FullData-Importer-FIXED.ipa" \
            Payload

          rm -rf Payload

          echo
          echo "===== IPA ====="

          ls -lh \
            POSTAL-2-iOS-FullData-Importer-FIXED.ipa

      # ==========================================================
      # VERIFY IPA
      # ==========================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/output/POSTAL-2-iOS-FullData-Importer-FIXED.ipa"

          test -f "$IPA"

          echo
          echo "===== IPA CONTENTS ====="

          unzip -l "$IPA" \
            | head -50

          echo
          echo "===== BUNDLE ID ====="

          TMP="$RUNNER_TEMP/postal2-ipa"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q \
            "$IPA" \
            -d "$TMP"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$TMP/Payload/POSTAL2.app/Info.plist"

      # ==========================================================
      # README
      # ==========================================================

      - name: Create README
        shell: bash
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/output/README.txt" <<'EOF'
          POSTAL 2 iOS
          FULL DATA IMPORTER FIXED
          ========================

          This build fixes the iOS folder picker.

          HOW TO IMPORT

          1. Open POSTAL 2.

          2. Press:
             Import POSTAL 2 Folder

          3. In Files, find the MAIN POSTAL 2 folder.

          4. The selected folder should contain folders/files such as:

             Maps
             StaticMeshes
             Textures
             Animations
             Sounds
             Music
             System

          5. Press Open.

          6. The app should IMMEDIATELY show:

             Reading POSTAL 2 folder...

          7. Then it will copy and count the game files.

          IMPORTANT

          Do NOT select Maps alone.
          Do NOT select Textures alone.
          Do NOT import every folder separately.

          Select ONE main POSTAL 2 folder.

          Imported game data is stored in:

          Documents/Postal2FullData

          Bundle ID remains:

          com.postal2ios.native

          so installing over the previous test build should keep
          existing app Documents when your signing method allows it.

          This is still the DATA IMPORT stage.

          It is NOT yet the complete playable POSTAL 2 runtime.

          Next stage after successful import:

          load all package dependencies and reconstruct the Bridge
          map automatically from imported POSTAL 2 data.

          IPA is unsigned.
          Re-sign it with your normal sideloading method.
          EOF

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload POSTAL 2 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Postal2Native-FullData-Importer-FIXED
          path: |
            output/POSTAL-2-iOS-FullData-Importer-FIXED.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Postal2Native-FullData-Importer-FIXED-failed
          path: |
            Postal2iOS/project.yml
            Postal2iOS/Sources/Postal2App.swift
            Postal2iOS/Sources/Info.plist
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
