name: POSTAL 2 WineGlass iOS FIX 11.13 CLEAN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate FIX 11.13 CLEAN
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate workflow and successful FIX 11.8.1 base
        shell: bash
        run: |
          set -euxo pipefail

          BASE_COMMIT="0bae098"
          BASE_FILE="/tmp/POSTAL-FIX11.8.1-success.yml"

          if git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git show "${BASE_COMMIT}:.github/workflows/build-ios.yml" > "$BASE_FILE"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/negelinho-debug/Postal2-ios/${BASE_COMMIT}/.github/workflows/build-ios.yml" \
              -o "$BASE_FILE"
          fi

          grep -q \
            '^name: POSTAL 2 WineGlass iOS FIX 11.8.1 CLEAN$' \
            "$BASE_FILE"

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import textwrap
          import zlib

          current = Path(".github/workflows/build-ios.yml").read_text()
          lines = current.splitlines()
          blocks = []
          i = 0

          while i < len(lines):
              line = lines[i]

              if line.strip() == "python3 <<'PY'":
                  base_indent = len(line) - len(line.lstrip())
                  body = []
                  i += 1

                  while i < len(lines) and lines[i].strip() != "PY":
                      cur = lines[i]

                      if cur.startswith(" " * base_indent):
                          cur = cur[base_indent:]

                      body.append(cur)
                      i += 1

                  if i >= len(lines):
                      raise SystemExit("ERROR: unterminated Python heredoc")

                  blocks.append(textwrap.dedent("\n".join(body)))

              i += 1

          for index, code in enumerate(blocks, start=1):
              ast.parse(code, filename=f"visible-python-{index}")

          base = Path("/tmp/POSTAL-FIX11.8.1-success.yml").read_text()

          pattern = re.compile(
              r'payload\s*=\s*"""(.*?)"""\s*'
              r'code\s*=\s*zlib\.decompress\(.*?\)\.decode\("utf-8"\)\s*'
              r'compile\(\s*code,\s*"([^"]+)"',
              re.S,
          )

          wanted = {
              "<POSTAL-blink-config>",
              "<POSTAL-blink-sched>",
              "<POSTAL-blink-mmap>",
              "<POSTAL-engine>",
              "<POSTAL-FIX11.8.1-cumulative>",
              "<POSTAL-project>",
              "<POSTAL-launcher>",
          }

          found = set()

          for payload, label in pattern.findall(base):
              if label not in wanted:
                  continue

              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(code, filename=label)
              found.add(label)

          missing = sorted(wanted - found)

          if missing:
              raise SystemExit(
                  "ERROR: missing successful 11.8.1 payloads: "
                  + ", ".join(missing)
              )

          print(
              "FIX 11.13 validation OK:",
              len(blocks),
              "visible Python blocks and",
              len(found),
              "successful 11.8.1 payloads"
          )
          PY

  vc120:
    needs: lint
    name: Prepare VC++ 2013 x86 runtime
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Download and install official VC++ 2013 x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $exe = Join-Path $root "vcredist_x86.exe"
          $out = Join-Path $root "vc120-runtime"

          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $urls = @(
            "https://download.visualstudio.microsoft.com/download/pr/10912113/5da66ddebb0ad32ebd4b922fd82e8e25/vcredist_x86.exe",
            "https://download.microsoft.com/download/2/E/6/2E61CFA4-993B-4DD4-91DA-3737CD5CD6E3/vcredist_x86.exe"
          )

          $downloaded = $false

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $exe

              if ((Test-Path $exe) -and ((Get-Item $exe).Length -gt 100000)) {
                $downloaded = $true
                break
              }
            }
            catch {
              Write-Warning $_
            }
          }

          if (-not $downloaded) {
            throw "Could not download official VC++ 2013 x86 redistributable"
          }

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList "/install","/quiet","/norestart" `
            -Wait `
            -PassThru

          Write-Host "vcredist exit code: $($proc.ExitCode)"

          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 1638) {
            throw "vcredist_x86 failed with exit code $($proc.ExitCode)"
          }

          $msvcr = @(
            "$env:WINDIR\SysWOW64\msvcr120.dll",
            "$env:WINDIR\System32\msvcr120.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          $msvcp = @(
            "$env:WINDIR\SysWOW64\msvcp120.dll",
            "$env:WINDIR\System32\msvcp120.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msvcr) { throw "msvcr120.dll was not found" }
          if (-not $msvcp) { throw "msvcp120.dll was not found" }

          Copy-Item $msvcr (Join-Path $out "msvcr120.dll") -Force
          Copy-Item $msvcp (Join-Path $out "msvcp120.dll") -Force

          Get-Item `
            (Join-Path $out "msvcr120.dll"), `
            (Join-Path $out "msvcp120.dll") |
            Format-List FullName,Length

      - name: Upload VC120 runtime
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime
          if-no-files-found: error
          retention-days: 1

  build:
    needs: vc120
    name: Build POSTAL 2 FIX 11.13 CLEAN
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VC120 runtime
        uses: actions/download-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime

      - name: Verify VC120 runtime
        shell: bash
        run: |
          set -euxo pipefail

          test -s vc120-runtime/msvcr120.dll
          test -s vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll
          file vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll | grep -q "PE32 executable"
          file vc120-runtime/msvcp120.dll | grep -q "PE32 executable"
          file vc120-runtime/msvcr120.dll | grep -q "Intel 80386"
          file vc120-runtime/msvcp120.dll | grep -q "Intel 80386"

      - name: Recover exact successful FIX 11.8.1 patches
        shell: bash
        run: |
          set -euxo pipefail

          BASE_COMMIT="0bae098"
          BASE_FILE="/tmp/POSTAL-FIX11.8.1-success.yml"
          PATCH_DIR="$GITHUB_WORKSPACE/.postal-base-patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          if git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git show "${BASE_COMMIT}:.github/workflows/build-ios.yml" > "$BASE_FILE"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/negelinho-debug/Postal2-ios/${BASE_COMMIT}/.github/workflows/build-ios.yml" \
              -o "$BASE_FILE"
          fi

          grep -q \
            '^name: POSTAL 2 WineGlass iOS FIX 11.8.1 CLEAN$' \
            "$BASE_FILE"

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import zlib

          src = Path("/tmp/POSTAL-FIX11.8.1-success.yml").read_text()
          out = Path(".postal-base-patches")

          names = {
              "<POSTAL-blink-config>": "blink-config.py",
              "<POSTAL-blink-sched>": "blink-sched.py",
              "<POSTAL-blink-mmap>": "blink-mmap.py",
              "<POSTAL-engine>": "engine-fix11.2.py",
              "<POSTAL-FIX11.8.1-cumulative>": "cumulative-fix11.8.1.py",
              "<POSTAL-project>": "project.py",
              "<POSTAL-launcher>": "launcher.py",
          }

          pattern = re.compile(
              r'payload\s*=\s*"""(.*?)"""\s*'
              r'code\s*=\s*zlib\.decompress\(.*?\)\.decode\("utf-8"\)\s*'
              r'compile\(\s*code,\s*"([^"]+)"',
              re.S,
          )

          written = set()

          for payload, label in pattern.findall(src):
              filename = names.get(label)

              if not filename:
                  continue

              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(code, filename=label)
              (out / filename).write_text(code)
              written.add(label)

          missing = sorted(set(names) - written)

          if missing:
              raise SystemExit(
                  "ERROR: missing successful FIX11.8.1 payloads: "
                  + ", ".join(missing)
              )

          print(
              "Recovered",
              len(written),
              "successful FIX11.8.1 patches"
          )
          PY

          ls -lh "$PATCH_DIR"

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found"
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi

          xcodebuild -version
          xcode-select -p

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock
          export PATH="$(brew --prefix)/bin:$PATH"

          command -v flock
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf WineGlass blink-src

          git clone --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p WineGlass/Vendor/blink/lib

          git -C WineGlass rev-parse HEAD
          git -C blink-src rev-parse HEAD

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd blink-src
          chmod +x configure

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

      - name: Patch Blink iOS config from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/blink-config.py

          grep -q \
            '^#define HAVE_MAP_ANONYMOUS 1$' \
            blink-src/config.h

      - name: Patch Blink sched_yield from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/blink-sched.py

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"
          rm -f o//blink/blink.a

          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a

          test -f o//blink/blink.a
          cp o//blink/blink.a "$WG/Vendor/blink/lib/blink.a"
          test -f "$WG/Vendor/blink/lib/blink.a"

      - name: Patch Blink VM mmap from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/blink-mmap.py

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f "$WG/Vendor/blink/lib/wg_blink_impl.o"

      - name: Apply POSTAL engine FIX 11.2 from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/engine-fix11.2.py

      - name: Apply cumulative FIX 11.8.1 exactly as successful build
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/cumulative-fix11.8.1.py

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          FILES="WineGlass/Sources/Win32/wg_win32_files.c"

          grep -n "POSTAL FIX11.3 DisableThreadLibraryCalls" "$ENGINE"
          grep -n "POSTAL FIX11.4 VirtualAlloc" "$ENGINE"
          grep -n "POSTAL FIX11.5 timeBeginPeriod" "$ENGINE"
          grep -n "POSTAL FIX11.7 GetModuleFileNameA" "$ENGINE"
          grep -n "POSTAL FIX11.8.1 %s request" "$ENGINE"
          grep -n "POSTAL FIX11.8.1 %s STRICT FAIL" "$ENGINE"
          grep -n "POSTAL FIX11.6.2 System root" "$FILES"
          grep -n "POSTAL FIX11.6.2 map" "$FILES"

          echo "SUCCESSFUL FIX 11.8.1 BASE RESTORED"

      - name: Recover exact successful FIX 11.12 recovery patch from history
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import ast
          import subprocess
          import textwrap

          workflow = ".github/workflows/build-ios.yml"
          commits = subprocess.check_output(
              ["git", "rev-list", "HEAD", "--", workflow],
              text=True,
          ).splitlines()

          target_commit = None
          target_text = None

          for commit in commits[1:]:
              try:
                  text = subprocess.check_output(
                      ["git", "show", f"{commit}:{workflow}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue

              if text.startswith(
                  "name: POSTAL 2 WineGlass iOS FIX 11.12 CLEAN"
              ):
                  target_commit = commit
                  target_text = text
                  break

          if not target_text:
              raise SystemExit(
                  "ERROR: FIX 11.12 workflow not found in git history. "
                  "Keep the successful 11.12 commit in repository history."
              )

          step_name = "- name: Patch FIX 11.12 GObjRegistrants recovery"
          step_pos = target_text.find(step_name)
          if step_pos < 0:
              raise SystemExit(
                  "ERROR: FIX 11.12 recovery step missing in historical workflow"
              )

          lines = target_text[step_pos:].splitlines()
          body = []
          found_python = False
          base_indent = 0

          for line in lines:
              if not found_python:
                  if line.strip() == "python3 <<'PY'":
                      found_python = True
                      base_indent = len(line) - len(line.lstrip())
                  continue

              if line.strip() == "PY":
                  break

              cur = line
              if cur.startswith(" " * base_indent):
                  cur = cur[base_indent:]
              body.append(cur)

          if not found_python or not body:
              raise SystemExit(
                  "ERROR: could not extract FIX 11.12 Python patch"
              )

          code = textwrap.dedent("\n".join(body)) + "\n"
          ast.parse(code, filename="<POSTAL-FIX11.12-recovery>")

          out = Path(".postal-base-patches/recovery-fix11.12.py")
          out.write_text(code)

          print(
              "Recovered exact FIX 11.12 recovery patch from",
              target_commit,
              "->",
              out,
          )
          PY

          test -s .postal-base-patches/recovery-fix11.12.py

      - name: Apply exact successful FIX 11.12 GObjRegistrants recovery
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/recovery-fix11.12.py

          ENGINE="WineGlass/Sources/Core/wg_engine.c"

          grep -n "POSTAL FIX11.12 ASSERT ARMED" "$ENGINE"
          grep -n "POSTAL FIX11.12 TARGET ASSERTION" "$ENGINE"
          grep -n "POSTAL FIX11.12 MISSING REGISTRANT" "$ENGINE"
          grep -n "POSTAL FIX11.12 APPENDED" "$ENGINE"
          grep -n "POSTAL FIX11.12 ASSERTION BYPASSED" "$ENGINE"
          grep -n "POSTAL FIX11.12 RECOVERY COMPLETE" "$ENGINE"

          echo "EXACT WORKING FIX 11.12 RECOVERY RESTORED"

      - name: Patch FIX 11.13 FWindowsBitmap splash bridge
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          mapper = Path("WineGlass/Sources/Win32/wg_dll_mapper.c")
          ms = mapper.read_text()

          mapper_marker = "POSTAL FIX11.13 FWindowsBitmap registrations"

          if mapper_marker not in ms:
              anchor = '    WG_LOGI(TAG, "Registered %d Win32 API stubs", m->count);'
              if anchor not in ms:
                  raise SystemExit(
                      "ERROR: FIX11.13 mapper registration anchor missing"
                  )

              registrations = r'''    // POSTAL FIX11.13 FWindowsBitmap registrations
              // MSVC x86 __thiscall: ECX carries `this`; num_args is only
              // the explicit stack arguments. The old auto-stub used zero,
              // so ctor/LoadFile leaked one stack word and LoadFile returned 0.
              wg_dll_mapper_register(
                  m,
                  "Window.dll",
                  "??0FWindowsBitmap@@QAE@H@Z",
                  stub_default,
                  1
              );
              wg_dll_mapper_register(
                  m,
                  "Window.dll",
                  "?LoadFile@FWindowsBitmap@@QAEHPB_W@Z",
                  stub_return_1,
                  1
              );
              wg_dll_mapper_register(
                  m,
                  "Window.dll",
                  "?GetBitmapHandle@FWindowsBitmap@@QAEPAUHBITMAP__@@XZ",
                  stub_return_1,
                  0
              );
              wg_dll_mapper_register(
                  m,
                  "Window.dll",
                  "??1FWindowsBitmap@@QAE@XZ",
                  stub_default,
                  0
              );

          '''

              ms = ms.replace(
                  anchor,
                  registrations + anchor,
                  1,
              )
              mapper.write_text(ms)

          engine = Path("WineGlass/Sources/Core/wg_engine.c")
          es = engine.read_text()

          engine_marker = "POSTAL FIX11.13 FWindowsBitmap::LoadFile"

          if engine_marker not in es:
              anchor = '''        const char *fn = entry->func_name;
                  if (entry->dll_name && strcasecmp(entry->dll_name, "nsDialogs.dll") == 0) {'''

              if anchor not in es:
                  raise SystemExit(
                      "ERROR: FIX11.13 handle_blink_thunk anchor missing"
                  )

              replacement = r'''        const char *fn = entry->func_name;

                  // POSTAL FIX11.13 - minimal Window.dll FWindowsBitmap bridge.
                  // Postal2Splash.bmp was already opened successfully by the
                  // file layer. The Window.dll methods are auto-stubs here, so
                  // accept the cosmetic splash and keep UE2 startup moving.
                  if (
                      entry->dll_name &&
                      strcasecmp(entry->dll_name, "Window.dll") == 0 &&
                      strcmp(fn, "??0FWindowsBitmap@@QAE@H@Z") == 0
                  ) {
                      uint32_t self = (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          1
                      );
                      ret_val = self;
                      WG_LOGI(
                          TAG,
                          "POSTAL FIX11.13 FWindowsBitmap::ctor this=0x%X -> 0x%X",
                          self,
                          self
                      );
                  } else if (
                      entry->dll_name &&
                      strcasecmp(entry->dll_name, "Window.dll") == 0 &&
                      strcmp(fn, "?LoadFile@FWindowsBitmap@@QAEHPB_W@Z") == 0
                  ) {
                      uint16_t wide_name[260] = {0};
                      char ascii_name[260] = {0};

                      if (args[0]) {
                          wg_blink_read_mem(
                              engine->blink,
                              args[0],
                              wide_name,
                              sizeof(wide_name) - 2
                          );

                          for (
                              int i = 0;
                              i < 259 && wide_name[i];
                              i++
                          ) {
                              ascii_name[i] =
                                  wide_name[i] < 128
                                  ? (char)wide_name[i]
                                  : '?';
                          }
                      }

                      s_last_error = 0;
                      ret_val = 1;

                      WG_LOGI(
                          TAG,
                          "POSTAL FIX11.13 FWindowsBitmap::LoadFile('%s') -> TRUE (splash accepted)",
                          ascii_name
                      );
                  } else if (
                      entry->dll_name &&
                      strcasecmp(entry->dll_name, "Window.dll") == 0 &&
                      strcmp(
                          fn,
                          "?GetBitmapHandle@FWindowsBitmap@@QAEPAUHBITMAP__@@XZ"
                      ) == 0
                  ) {
                      ret_val = 0xB17A0001u;
                      s_last_error = 0;
                      WG_LOGI(
                          TAG,
                          "POSTAL FIX11.13 FWindowsBitmap::GetBitmapHandle -> 0x%llX",
                          (unsigned long long)ret_val
                      );
                  } else if (
                      entry->dll_name &&
                      strcasecmp(entry->dll_name, "Window.dll") == 0 &&
                      strcmp(fn, "??1FWindowsBitmap@@QAE@XZ") == 0
                  ) {
                      ret_val = 0;
                      WG_LOGI(
                          TAG,
                          "POSTAL FIX11.13 FWindowsBitmap::dtor -> OK"
                      );
                  } else if (entry->dll_name && strcasecmp(entry->dll_name, "nsDialogs.dll") == 0) {'''

              es = es.replace(
                  anchor,
                  replacement,
                  1,
              )
              engine.write_text(es)

          print("POSTAL FIX 11.13 FWindowsBitmap splash bridge installed")
          PY

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          MAPPER="WineGlass/Sources/Win32/wg_dll_mapper.c"

          grep -n "POSTAL FIX11.13 FWindowsBitmap registrations" "$MAPPER"
          grep -n "?LoadFile@FWindowsBitmap@@QAEHPB_W@Z" "$MAPPER"
          grep -n "POSTAL FIX11.13 FWindowsBitmap::ctor" "$ENGINE"
          grep -n "POSTAL FIX11.13 FWindowsBitmap::LoadFile" "$ENGINE"
          grep -n "POSTAL FIX11.13 FWindowsBitmap::GetBitmapHandle" "$ENGINE"
          grep -n "POSTAL FIX11.13 FWindowsBitmap::dtor" "$ENGINE"

          echo "POSTAL FIX 11.13 SPLASH BRIDGE VERIFY OK"

      - name: Verify all POSTAL FIX 11.13 markers
        shell: bash
        run: |
          set -euxo pipefail

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          FILES="WineGlass/Sources/Win32/wg_win32_files.c"
          MAPPER="WineGlass/Sources/Win32/wg_dll_mapper.c"

          grep -q "POSTAL REAL DLL READY" "$ENGINE"
          grep -q "POSTAL PRELOAD BEGIN" "$ENGINE"
          grep -q "POSTAL REAL EXE IMPORT" "$ENGINE"
          grep -q "POSTAL FIX11.2 GetEnvironmentStringsW" "$ENGINE"
          grep -q "POSTAL FIX11.2 GetProcessWindowStation" "$ENGINE"
          grep -q "POSTAL FIX11.2 DllMain FAILED" "$ENGINE"
          grep -q "POSTAL FIX11.3 DisableThreadLibraryCalls" "$ENGINE"
          grep -q "POSTAL FIX11.4 CreateFileA" "$ENGINE"
          grep -q "POSTAL FIX11.4 VirtualAlloc" "$ENGINE"
          grep -q "POSTAL FIX11.4 VirtualFree" "$ENGINE"
          grep -q "POSTAL FIX11.5 timeBeginPeriod" "$ENGINE"
          grep -q "POSTAL FIX11.5 timeEndPeriod" "$ENGINE"
          grep -q 'strcmp(fn, "timeGetTime")' "$ENGINE"
          grep -q "POSTAL FIX11.7 GetModuleFileNameA" "$ENGINE"
          grep -q "POSTAL FIX11.7 GetModuleFileNameW" "$ENGINE"
          grep -q "POSTAL FIX11.8.1 %s request" "$ENGINE"
          grep -q "POSTAL FIX11.8.1 %s STRICT FAIL" "$ENGINE"
          grep -q "POSTAL FIX11.12 ASSERT ARMED" "$ENGINE"
          grep -q "POSTAL FIX11.12 TARGET ASSERTION" "$ENGINE"
          grep -q "POSTAL FIX11.12 RECOVERY COMPLETE" "$ENGINE"
          grep -q "POSTAL FIX11.13 FWindowsBitmap::LoadFile" "$ENGINE"
          grep -q "POSTAL FIX11.13 FWindowsBitmap::GetBitmapHandle" "$ENGINE"
          grep -q "POSTAL DLL INITIALIZATION COMPLETE" "$ENGINE"

          grep -q "POSTAL FIX11.13 FWindowsBitmap registrations" "$MAPPER"
          grep -q "?LoadFile@FWindowsBitmap@@QAEHPB_W@Z" "$MAPPER"

          grep -q "POSTAL FIX11.6.2 System root" "$FILES"
          grep -q "POSTAL FIX11.6.2 exe win path" "$FILES"
          grep -q "POSTAL FIX11.6.2 redirect cwd" "$FILES"
          grep -q "POSTAL FIX11.6.2 map" "$FILES"

          echo "ALL POSTAL FIX 11.13 MARKERS VERIFIED"

      - name: Apply WineGlass project patch from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/project.py

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="WineGlass/Sources/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleName POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.11.13" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1113" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"

          plutil -lint "$PLIST"

      - name: Apply POSTAL launcher and log from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/launcher.py

      - name: Stamp POSTAL FIX 11.13 launcher
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/App/WGSceneDelegate.m"
          )

          s = p.read_text()

          replacements = {
              "FIX 11.2 CLEAN": "FIX 11.13 CLEAN",
              "FIX11.2 CLEAN": "FIX11.13 CLEAN",
              "FIX 11.8.1 CLEAN": "FIX 11.13 CLEAN",
              "FIX11.8.1 CLEAN": "FIX11.13 CLEAN",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass
          rm -rf WineGlass.xcodeproj
          xcodegen generate

          test -f WineGlass.xcodeproj/project.pbxproj
          grep -m1 "objectVersion" WineGlass.xcodeproj/project.pbxproj || true

          if grep -q "objectVersion = 77" WineGlass.xcodeproj/project.pbxproj; then
            echo "ERROR: unsupported objectVersion 77"
            exit 1
          fi

      - name: Build POSTAL 2 FIX 11.13 CLEAN
        shell: bash
        run: |
          set -o pipefail

          cd WineGlass
          rm -rf build

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 | tee xcodebuild.log

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail

          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          test -d "$APP"
          test -f "$APP/WineGlass"

          lipo -info "$APP/WineGlass"

          ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "$ID"
          test "$ID" = "com.postal2ios.native"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          OUT="$ROOT/out"

          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          mkdir -p "$APP/VC120"

          cp \
            "$ROOT/vc120-runtime/msvcr120.dll" \
            "$APP/VC120/msvcr120.dll"

          cp \
            "$ROOT/vc120-runtime/msvcp120.dll" \
            "$APP/VC120/msvcp120.dll"

          test -s "$APP/VC120/msvcr120.dll"
          test -s "$APP/VC120/msvcp120.dll"

          cp -R \
            "$APP" \
            "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"

          zip \
            -qry \
            "POSTAL-2-iOS-v11.13-CLEAN.ipa" \
            Payload

          ls -lh \
            "POSTAL-2-iOS-v11.13-CLEAN.ipa"

      - name: Upload POSTAL 2 FIX 11.13 CLEAN IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v11.13-CLEAN
          path: out/POSTAL-2-iOS-v11.13-CLEAN.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p debug-fix11-13-clean

          cp WineGlass/xcodebuild.log debug-fix11-13-clean/ 2>/dev/null || true
          cp blink-src/config.h debug-fix11-13-clean/blink-config.h 2>/dev/null || true
          cp WineGlass/Vendor/blink/wg_blink_impl.c debug-fix11-13-clean/ 2>/dev/null || true
          cp WineGlass/Sources/Core/wg_engine.c debug-fix11-13-clean/ 2>/dev/null || true
          cp WineGlass/Sources/Win32/wg_win32_files.c debug-fix11-13-clean/ 2>/dev/null || true
          cp WineGlass/Sources/Win32/wg_dll_mapper.c debug-fix11-13-clean/ 2>/dev/null || true
          cp WineGlass/Sources/App/WGSceneDelegate.m debug-fix11-13-clean/ 2>/dev/null || true
          cp WineGlass/project.yml debug-fix11-13-clean/ 2>/dev/null || true
          cp vc120-runtime/msvcr120.dll debug-fix11-13-clean/ 2>/dev/null || true
          cp vc120-runtime/msvcp120.dll debug-fix11-13-clean/ 2>/dev/null || true
          cp .postal-base-patches/cumulative-fix11.8.1.py debug-fix11-13-clean/ 2>/dev/null || true

      - name: Upload FIX 11.13 CLEAN debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX11.13-CLEAN-DEBUG
          path: debug-fix11-13-clean
          if-no-files-found: ignore
          retention-days: 7
