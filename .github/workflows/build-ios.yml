name: POSTAL 2 iOS v6 ORIGINAL EXE TEST FIX 6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Windows x86 runtime
    runs-on: macos-14
    timeout-minutes: 120

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== GNU MAKE ====="
          gmake --version | head -n 1


      # ==========================================================
      # CLONE
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf WineGlass
          rm -rf blink

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink

          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK COMMIT ====="
          git -C blink rev-parse HEAD


      # ==========================================================
      # BUILD BLINK
      #
      # FIXES ALREADY PROVEN BY FIX 5:
      #
      # - no JIT
      # - no threads
      # - no sockets
      # - no getentropy
      # - /dev/urandom
      # - sys/mount.h
      # - no sched_yield
      #
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          BLINK="$GITHUB_WORKSPACE/blink"
          WG="$GITHUB_WORKSPACE/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"

          cd "$BLINK"

          echo
          echo "======================================"
          echo "CONFIGURE BLINK FOR IPHONE"
          echo "======================================"

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-g -O2 -fno-common -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit


          test -f config.h
          test -f config.mk


          echo
          echo "======================================"
          echo "PATCH IOS CONFIG"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path
          import re


          path = Path(
              "config.h"
          )


          text = path.read_text()


          # ======================================================
          # NO JIT / THREADS / SOCKETS
          # ======================================================

          for name in [

              "DISABLE_JIT",

              "DISABLE_THREADS",

              "DISABLE_SOCKETS",

          ]:

              text = re.sub(

                  rf'^[ \t]*//[ \t]*#define[ \t]+{re.escape(name)}.*$',

                  f'#define {name}',

                  text,

                  flags=re.MULTILINE
              )


              if f"#define {name}" not in text:

                  text += (
                      f"\n#define {name}\n"
                  )


          # ======================================================
          # DISABLE PROBLEMATIC CROSS-COMPILE FEATURES
          # ======================================================

          for name in [

              "HAVE_GETENTROPY",

              "HAVE_SYS_GETENTROPY",

              "HAVE_GETRANDOM",

              "HAVE_SYS_GETRANDOM",

              "HAVE_KERN_ARND",

              "HAVE_SCHED_YIELD",

          ]:

              text = re.sub(

                  rf'^[ \t]*#define[ \t]+{re.escape(name)}.*$',

                  f'// #define {name}',

                  text,

                  flags=re.MULTILINE
              )


          # ======================================================
          # /DEV/URANDOM
          # ======================================================

          text = re.sub(

              r'^[ \t]*//[ \t]*#define[ \t]+HAVE_DEV_URANDOM.*$',

              '#define HAVE_DEV_URANDOM',

              text,

              flags=re.MULTILINE
          )


          if "#define HAVE_DEV_URANDOM" not in text:

              text += (
                  "\n#define HAVE_DEV_URANDOM\n"
              )


          # ======================================================
          # IOS / DARWIN STATFS
          # ======================================================

          text = re.sub(

              r'^[ \t]*//[ \t]*#define[ \t]+HAVE_SYS_MOUNT_H.*$',

              '#define HAVE_SYS_MOUNT_H',

              text,

              flags=re.MULTILINE
          )


          if "#define HAVE_SYS_MOUNT_H" not in text:

              text += (
                  "\n#define HAVE_SYS_MOUNT_H\n"
              )


          path.write_text(
              text
          )
          PY


          echo
          echo "======================================"
          echo "BLINK FLAGS"
          echo "======================================"

          grep \
            -n \
            -E \
            "DISABLE_JIT|DISABLE_THREADS|DISABLE_SOCKETS|HAVE_GETENTROPY|HAVE_GETRANDOM|HAVE_DEV_URANDOM|HAVE_SYS_MOUNT_H|HAVE_SCHED_YIELD" \
            config.h \
            || true


          echo
          echo "======================================"
          echo "BUILD BLINK.A"
          echo "======================================"

          gmake \
            -j"$(sysctl -n hw.ncpu)" \
            o//blink/blink.a


          test -f \
            o//blink/blink.a


          mkdir -p \
            "$WG/Vendor/blink/lib"


          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"


          echo
          echo "======================================"
          echo "BUILD WINEGLASS BLINK BRIDGE"
          echo "======================================"

          "$CC" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -fno-common \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"


          echo
          echo "======================================"
          echo "VERIFY BLINK"
          echo "======================================"

          file \
            "$WG/Vendor/blink/lib/blink.a"


          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"


          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            | grep -q arm64


          echo
          echo "BLINK ARM64 READY"


      # ==========================================================
      # PATCH WINEGLASS
      #
      # FIX 6:
      #
      # We NO LONGER try to patch individual wg_log.c lines.
      #
      # We replace the complete small logger source.
      #
      # ==========================================================

      - name: Patch WineGlass into POSTAL 2 v6
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"


          # ======================================================
          # PROJECT + PLIST + POSTAL AUTORUN
          # ======================================================

          python3 <<'PY'
          from pathlib import Path
          import plistlib
          import re


          # ======================================================
          # PROJECT.YML
          # ======================================================

          project = Path(
              "project.yml"
          )


          text = project.read_text()


          text = text.replace(

              "bundleIdPrefix: com.wineglass",

              "bundleIdPrefix: com.postal2ios"
          )


          text = text.replace(

              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",

              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )


          text = re.sub(

              r'xcodeVersion:\s*"[^"]+"',

              'xcodeVersion: "15.4"',

              text,

              count=1
          )


          if "projectFormat:" not in text:

              text = text.replace(

                  '  xcodeVersion: "15.4"',

                  '  xcodeVersion: "15.4"\n'
                  '  projectFormat: xcode15_3',

                  1
              )


          text = text.replace(

              'TARGETED_DEVICE_FAMILY: "1,2"',

              'TARGETED_DEVICE_FAMILY: "1"'
          )


          text = re.sub(

              r'^\s*CODE_SIGN_ENTITLEMENTS:.*\n',

              '',

              text,

              flags=re.MULTILINE
          )


          text = re.sub(

              r'^\s*DEVELOPMENT_TEAM:.*\n',

              '',

              text,

              flags=re.MULTILINE
          )


          text = text.replace(

              "CODE_SIGN_STYLE: Automatic",

              "CODE_SIGN_STYLE: Manual"
          )


          project.write_text(
              text
          )


          # ======================================================
          # INFO.PLIST
          # ======================================================

          plist_path = Path(
              "Sources/App/Info.plist"
          )


          with plist_path.open(
              "rb"
          ) as file:

              info = plistlib.load(
                  file
              )


          info[
              "CFBundleName"
          ] = "POSTAL 2"


          info[
              "CFBundleDisplayName"
          ] = "POSTAL 2"


          info[
              "CFBundleShortVersionString"
          ] = "0.6"


          info[
              "CFBundleVersion"
          ] = "6"


          info[
              "UIFileSharingEnabled"
          ] = True


          info[
              "LSSupportsOpeningDocumentsInPlace"
          ] = True


          with plist_path.open(
              "wb"
          ) as file:

              plistlib.dump(

                  info,

                  file,

                  sort_keys=False
              )


          # ======================================================
          # SCENE
          # ======================================================

          scene_path = Path(
              "Sources/App/WGSceneDelegate.m"
          )


          scene = scene_path.read_text()


          old_title = (

              '[_loadButton setTitle:@"  Load .exe  " '
              'forState:UIControlStateNormal];'
          )


          old_action = (

              '[_loadButton addTarget:self '
              'action:@selector(openFilePicker) '
              'forControlEvents:UIControlEventTouchUpInside];'
          )


          if old_title not in scene:

              raise SystemExit(
                  "ERROR: Load .exe title not found"
              )


          if old_action not in scene:

              raise SystemExit(
                  "ERROR: Load .exe action not found"
              )


          scene = scene.replace(

              old_title,

              '[_loadButton setTitle:@"  RUN POSTAL 2  " '
              'forState:UIControlStateNormal];',

              1
          )


          scene = scene.replace(

              old_action,

              '[_loadButton addTarget:self '
              'action:@selector(runPostal2) '
              'forControlEvents:UIControlEventTouchUpInside];',

              1
          )


          # ======================================================
          # INSERT POSTAL METHODS
          # ======================================================

          marker = (
              "#pragma mark - UIDocumentPickerDelegate"
          )


          if marker not in scene:

              raise SystemExit(
                  "ERROR: picker marker not found"
              )


          methods = r'''
          // =====================================================
          // POSTAL 2
          // =====================================================


          - (NSString *)findPostal2Exe {

              NSString *docs =

                  NSSearchPathForDirectoriesInDomains(

                      NSDocumentDirectory,

                      NSUserDomainMask,

                      YES

                  ).firstObject;


              if (!docs) {

                  WG_LOGE(

                      "POSTAL2",

                      "Documents directory unavailable"
                  );


                  return nil;
              }


              NSString *root =

                  [
                      docs

                      stringByAppendingPathComponent:
                          @"Postal2FullData"
                  ];


              NSFileManager *fm =

                  [
                      NSFileManager
                      defaultManager
                  ];


              BOOL isDirectory =
                  NO;


              if (

                  ![
                      fm

                      fileExistsAtPath:
                          root

                      isDirectory:
                          &isDirectory
                  ]

                  ||

                  !isDirectory

              ) {

                  WG_LOGE(

                      "POSTAL2",

                      "Postal2FullData missing: %s",

                      root.UTF8String
                  );


                  return nil;
              }


              // ===============================================
              // NORMAL PATH
              // ===============================================

              NSString *normal =

                  [
                      root

                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"
                  ];


              if (

                  [
                      fm

                      fileExistsAtPath:
                          normal
                  ]

              ) {

                  WG_LOGI(

                      "POSTAL2",

                      "Found Postal2.exe: %s",

                      normal.UTF8String
                  );


                  return normal;
              }


              // ===============================================
              // RECURSIVE FALLBACK
              // ===============================================

              NSDirectoryEnumerator *enumerator =

                  [
                      fm

                      enumeratorAtPath:
                          root
                  ];


              NSString *relative =
                  nil;


              while (

                  (
                      relative =

                          [
                              enumerator

                              nextObject
                          ]
                  )

              ) {

                  NSString *filename =
                      relative.lastPathComponent;


                  if (

                      [
                          filename

                          caseInsensitiveCompare:
                              @"Postal2.exe"
                      ]

                      ==

                      NSOrderedSame

                  ) {

                      NSString *found =

                          [
                              root

                              stringByAppendingPathComponent:
                                  relative
                          ];


                      WG_LOGI(

                          "POSTAL2",

                          "Found recursive Postal2.exe: %s",

                          found.UTF8String
                      );


                      return found;
                  }
              }


              WG_LOGE(

                  "POSTAL2",

                  "Postal2.exe not found"
              );


              return nil;
          }



          // =====================================================
          // RUN ORIGINAL POSTAL 2
          // =====================================================


          - (void)runPostal2 {

              if (!_engine) {

                  WG_LOGW(

                      "POSTAL2",

                      "Translation engine not ready"
                  );


                  return;
              }


              NSString *exe =

                  [
                      self

                      findPostal2Exe
                  ];


              if (!exe) {

                  [
                      _loadButton

                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "

                      forState:
                          UIControlStateNormal
                  ];


                  _loadButton.enabled =
                      YES;


                  return;
              }


              NSString *systemFolder =

                  [
                      exe

                      stringByDeletingLastPathComponent
                  ];


              // ===============================================
              // UE2 EXPECTS SYSTEM AS WORKING DIRECTORY
              // ===============================================

              int result =

                  chdir(

                      systemFolder
                          .fileSystemRepresentation
                  );


              if (

                  result != 0

              ) {

                  WG_LOGE(

                      "POSTAL2",

                      "Could not enter System: %s",

                      systemFolder.UTF8String
                  );

              } else {

                  WG_LOGI(

                      "POSTAL2",

                      "Working directory: %s",

                      systemFolder.UTF8String
                  );
              }


              [
                  _loadButton

                  setTitle:
                      @"  STARTING POSTAL 2...  "

                  forState:
                      UIControlStateNormal
              ];


              _loadButton.enabled =
                  NO;


              WG_LOGI(

                  "POSTAL2",

                  "Launching original Windows Postal2.exe"
              );


              WG_LOGI(

                  "POSTAL2",

                  "EXE: %s",

                  exe.UTF8String
              );


              [
                  self

                  loadAndRunPE:
                      exe
              ];
          }


          '''


          scene = scene.replace(

              marker,

              methods
              +
              "\n"
              +
              marker,

              1
          )


          # ======================================================
          # AUTO RUN
          # ======================================================

          if (

              "[self tryLoadBundledPE];"

              not in scene

          ):

              raise SystemExit(

                  "ERROR: tryLoadBundledPE not found"
              )


          scene = scene.replace(

              "[self tryLoadBundledPE];",

              "[self runPostal2];",

              1
          )


          scene_path.write_text(
              scene
          )


          print(
              "POSTAL 2 scene patched."
          )
          PY


          # ======================================================
          # FIX 6
          #
          # COMPLETE LOGGER FILE
          # ==========================================================

          cat > \
            Sources/Core/wg_log.c \
            <<'EOF'
          #include "wg_log.h"

          #include <stdio.h>
          #include <string.h>
          #include <pthread.h>
          #include <stdlib.h>
          #include <stdarg.h>


          static WGLogCallback
              s_callback =
                  NULL;


          static void
              *s_userdata =
                  NULL;


          static WGLogLevel
              s_minLevel =
                  WG_LOG_DEBUG;


          static pthread_mutex_t
              s_mutex =
                  PTHREAD_MUTEX_INITIALIZER;


          static FILE
              *s_postal_file =
                  NULL;


          static const char
              *level_names[] = {

                  "DBG",

                  "INF",

                  "WRN",

                  "ERR",

                  "FTL"
              };


          // =====================================================
          // INIT
          // =====================================================

          void wg_log_init(
              void
          ) {

              s_callback =
                  NULL;


              s_userdata =
                  NULL;


              s_minLevel =
                  WG_LOG_DEBUG;


              const char *home =
                  getenv(
                      "HOME"
                  );


              if (

                  home

                  &&

                  home[0]

              ) {

                  char path[1024];


                  snprintf(

                      path,

                      sizeof(path),

                      "%s/Documents/POSTAL2-WineGlass.log",

                      home
                  );


                  if (

                      s_postal_file

                  ) {

                      fclose(
                          s_postal_file
                      );


                      s_postal_file =
                          NULL;
                  }


                  s_postal_file =

                      fopen(

                          path,

                          "w"
                      );


                  if (

                      s_postal_file

                  ) {

                      setvbuf(

                          s_postal_file,

                          NULL,

                          _IOLBF,

                          0
                      );


                      fprintf(

                          s_postal_file,

                          "POSTAL 2 iOS v6 WineGlass log\n"
                      );


                      fflush(
                          s_postal_file
                      );
                  }
              }
          }


          // =====================================================
          // CALLBACK
          // =====================================================

          void wg_log_set_callback(

              WGLogCallback callback,

              void *userdata

          ) {

              pthread_mutex_lock(
                  &s_mutex
              );


              s_callback =
                  callback;


              s_userdata =
                  userdata;


              pthread_mutex_unlock(
                  &s_mutex
              );
          }


          // =====================================================
          // LEVEL
          // =====================================================

          void wg_log_set_level(

              WGLogLevel minLevel

          ) {

              s_minLevel =
                  minLevel;
          }


          // =====================================================
          // LOG
          // =====================================================

          void wg_log(

              WGLogLevel level,

              const char *tag,

              const char *fmt,

              ...

          ) {

              if (

                  level <
                  s_minLevel

              ) {

                  return;
              }


              int lvl =

                  (
                      level >= 0

                      &&

                      level <= WG_LOG_FATAL
                  )

                  ?

                  (int)level

                  :

                  (int)WG_LOG_ERROR;


              const char *safe_tag =

                  tag

                  ?

                  tag

                  :

                  "?";


              char buf[512];


              if (

                  fmt

              ) {

                  va_list ap;


                  va_start(

                      ap,

                      fmt
                  );


                  vsnprintf(

                      buf,

                      sizeof(buf),

                      fmt,

                      ap
                  );


                  va_end(
                      ap
                  );


              } else {


                  buf[0] =
                      '\0';
              }


              // ===============================================
              // STDERR
              // ===============================================

              fprintf(

                  stderr,

                  "[%s/%s] %s\n",

                  level_names[lvl],

                  safe_tag,

                  buf
              );


              pthread_mutex_lock(
                  &s_mutex
              );


              // ===============================================
              // IOS FILES LOG
              // ===============================================

              if (

                  s_postal_file

              ) {

                  fprintf(

                      s_postal_file,

                      "[%s/%s] %s\n",

                      level_names[lvl],

                      safe_tag,

                      buf
                  );


                  fflush(
                      s_postal_file
                  );
              }


              // ===============================================
              // ORIGINAL WINEGLASS CALLBACK
              // ===============================================

              if (

                  s_callback

              ) {

                  char tagged[600];


                  snprintf(

                      tagged,

                      sizeof(tagged),

                      "[%s] %s",

                      safe_tag,

                      buf
                  );


                  s_callback(

                      (WGLogLevel)lvl,

                      safe_tag,

                      tagged,

                      s_userdata
                  );
              }


              pthread_mutex_unlock(
                  &s_mutex
              );
          }


          // =====================================================
          // RING BUFFER
          // =====================================================

          void wg_log_ring_init(

              WGLogRingBuffer *ring

          ) {

              memset(

                  ring,

                  0,

                  sizeof(*ring)
              );


              ring->capacity =
                  256;
          }


          void wg_log_ring_push(

              WGLogRingBuffer *ring,

              WGLogLevel level,

              const char *message

          ) {

              int idx =
                  ring->head;


              strncpy(

                  ring->lines[idx],

                  message,

                  255
              );


              ring->lines[idx][255] =
                  '\0';


              ring->levels[idx] =
                  level;


              ring->head =

                  (
                      ring->head
                      +
                      1
                  )

                  %

                  ring->capacity;


              if (

                  ring->count <
                  ring->capacity

              ) {

                  ring->count++;
              }
          }


          int wg_log_ring_count(

              const WGLogRingBuffer *ring

          ) {

              return
                  ring->count;
          }


          const char *wg_log_ring_get(

              const WGLogRingBuffer *ring,

              int index,

              WGLogLevel *outLevel

          ) {

              if (

                  index < 0

                  ||

                  index >=
                  ring->count

              ) {

                  return NULL;
              }


              int start =

                  (
                      ring->head

                      -

                      ring->count

                      +

                      ring->capacity
                  )

                  %

                  ring->capacity;


              int actual =

                  (
                      start

                      +

                      index
                  )

                  %

                  ring->capacity;


              if (

                  outLevel

              ) {

                  *outLevel =

                      (
                          WGLogLevel
                      )

                      ring->levels[
                          actual
                      ];
              }


              return

                  ring->lines[
                      actual
                  ];
          }
          EOF


          echo
          echo "======================================"
          echo "VERIFY FIX 6"
          echo "======================================"

          grep \
            -n \
            "POSTAL2-WineGlass.log" \
            Sources/Core/wg_log.c


          grep \
            -n \
            "runPostal2" \
            Sources/App/WGSceneDelegate.m


          grep \
            -n \
            "findPostal2Exe" \
            Sources/App/WGSceneDelegate.m


          echo
          echo "======================================"
          echo "BUNDLE ID"
          echo "======================================"

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            project.yml


      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail


          cd "$GITHUB_WORKSPACE/WineGlass"


          xcodegen generate


          test -d \
            WineGlass.xcodeproj


          PBX="$GITHUB_WORKSPACE/WineGlass/WineGlass.xcodeproj/project.pbxproj"


          test -f \
            "$PBX"


          echo
          echo "======================================"
          echo "OBJECT VERSION"
          echo "======================================"

          grep \
            -n \
            "objectVersion" \
            "$PBX" \
            | head


          if grep \
            -q \
            "objectVersion = 77;" \
            "$PBX"; then

              echo
              echo "ERROR:"
              echo "objectVersion 77"

              exit 1
          fi


          echo
          echo "XCODE PROJECT READY"


      # ==========================================================
      # BUILD IOS APPLICATION
      # ==========================================================

      - name: Build POSTAL 2 v6 ARM64
        shell: bash
        run: |
          set +e
          set -o pipefail


          cd "$GITHUB_WORKSPACE/WineGlass"


          rm -rf \
            "$GITHUB_WORKSPACE/build"


          mkdir -p \
            "$GITHUB_WORKSPACE/build"


          echo
          echo "======================================"
          echo "BUILD POSTAL 2 v6 FIX 6"
          echo "======================================"


          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
                "$GITHUB_WORKSPACE/build/xcodebuild.log"


          STATUS=${PIPESTATUS[0]}


          if [ "$STATUS" -ne 0 ]; then

              echo
              echo "======================================"
              echo "REAL BUILD ERRORS"
              echo "======================================"

              grep \
                -n \
                -E \
                "error:|fatal error:" \
                "$GITHUB_WORKSPACE/build/xcodebuild.log" \
                | tail \
                    -300 \
                || true

              echo
              echo "======================================"

              exit "$STATUS"
          fi


          echo
          echo "======================================"
          echo "XCODE BUILD SUCCESS"
          echo "======================================"


      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -euxo pipefail


          APP="$(
            find \
              "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -type d \
              -name "WineGlass.app" \
              | head -n 1
          )"


          if [ -z "$APP" ]; then

              echo "ERROR: WineGlass.app missing"

              exit 1
          fi


          echo \
            "APP_PATH=$APP" \
            >> "$GITHUB_ENV"


          echo
          echo "======================================"
          echo "EXECUTABLE"
          echo "======================================"

          file \
            "$APP/WineGlass"


          echo
          echo "======================================"
          echo "ARCHITECTURE"
          echo "======================================"

          lipo \
            -info \
            "$APP/WineGlass" \
            || true


          file \
            "$APP/WineGlass" \
            | grep -q arm64


          echo
          echo "ARM64 CONFIRMED"


      # ==========================================================
      # VERIFY APP ID
      # ==========================================================

      - name: Verify v6 bundle identity
        shell: bash
        run: |
          set -euxo pipefail


          INFO="$APP_PATH/Info.plist"


          BUNDLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$INFO"
          )"


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$INFO"
          )"


          BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$INFO"
          )"


          echo
          echo "======================================"
          echo "IDENTITY"
          echo "======================================"

          echo "Bundle:  $BUNDLE"
          echo "Version: $VERSION"
          echo "Build:   $BUILD"


          test \
            "$BUNDLE" = \
            "com.postal2ios.native"


          test \
            "$VERSION" = \
            "0.6"


          test \
            "$BUILD" = \
            "6"


          /usr/libexec/PlistBuddy \
            -c "Print :UIFileSharingEnabled" \
            "$INFO"


      # ==========================================================
      # IPA
      # ==========================================================

      - name: Create POSTAL 2 v6 IPA
        shell: bash
        run: |
          set -euxo pipefail


          OUTPUT="$GITHUB_WORKSPACE/output"


          rm -rf \
            "$OUTPUT"


          mkdir -p \
            "$OUTPUT/Payload"


          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/Postal2iOS.app"


          cd "$OUTPUT"


          /usr/bin/zip \
            -qry \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX6.ipa" \
            Payload


          rm -rf \
            Payload


          test -f \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX6.ipa"


          echo
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls \
            -lh \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX6.ipa"


      # ==========================================================
      # README
      # ==========================================================

      - name: Create README
        shell: bash
        run: |
          set -euxo pipefail


          cat > \
            "$GITHUB_WORKSPACE/output/README.txt" \
            <<'EOF'
          POSTAL 2 iOS v6 FIX 6
          =====================


          IMPORTANT:

          DO NOT DELETE v5.


          SAME BUNDLE ID:

          com.postal2ios.native


          EXISTING POSTAL 2 DATA:

          Documents/Postal2FullData


          EXPECTED EXE:

          Documents/Postal2FullData/System/Postal2.exe


          RUNTIME:

          WineGlass

          blink ARM64

          no JIT


          FIX 6:

          Blink now builds successfully.

          The old fragile wg_log.c text patch
          has been removed.

          FIX 6 writes the complete logger
          source instead.


          RUN:

          Install over v5 using the same signer.

          Open POSTAL 2.

          It automatically searches for
          Postal2.exe and attempts to execute it.


          LOG:

          Documents/POSTAL2-WineGlass.log


          Send that log to ChatGPT
          after the first launch attempt.


          GOAL:

          Reach the first actual runtime
          POSTAL 2 error.
          EOF


      # ==========================================================
      # FINAL
      # ==========================================================

      - name: Final artifact check
        shell: bash
        run: |
          set -euxo pipefail


          test -f \
            "$GITHUB_WORKSPACE/output/POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX6.ipa"


          test -f \
            "$GITHUB_WORKSPACE/output/README.txt"


          echo
          echo "======================================"
          echo "READY"
          echo "======================================"

          ls \
            -lh \
            "$GITHUB_WORKSPACE/output"


      # ==========================================================
      # UPLOAD IPA
      # ==========================================================

      - name: Upload POSTAL 2 v6 IPA
        uses: actions/upload-artifact@v4
        with:

          name: POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX6

          path: |

            output/POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX6.ipa

            output/README.txt

          if-no-files-found: error

          compression-level: 0

          retention-days: 7


      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload build debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:

          name: POSTAL-2-iOS-v6-FIX6-BUILD-FAILED

          path: |

            build/xcodebuild.log

            WineGlass/project.yml

            WineGlass/Sources/App/WGSceneDelegate.m

            WineGlass/Sources/App/Info.plist

            WineGlass/Sources/Core/wg_log.c

            WineGlass/WineGlass.xcodeproj/project.pbxproj

            blink/config.h

            blink/config.mk

          if-no-files-found: ignore

          retention-days: 7
