name: POSTAL 2 iOS Native Folder Picker v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Native iOS
    runs-on: macos-latest
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo
          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcodebuild -version

          echo
          echo "======================================"
          echo "XCODEGEN"
          echo "======================================"

          xcodegen --version

          echo
          echo "======================================"
          echo "IPHONE SDK"
          echo "======================================"

          xcrun \
            --sdk iphoneos \
            --show-sdk-version

      # ==========================================================
      # CREATE PROJECT
      # ==========================================================

      - name: Create POSTAL 2 project
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          rm -rf Postal2iOS

          mkdir -p \
            Postal2iOS/Sources

          cat > Postal2iOS/project.yml <<'YAML'
          name: Postal2iOS

          options:
            bundleIdPrefix: com.postal2ios

          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1"
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""

          targets:

            Postal2iOS:

              type: application

              platform: iOS

              deploymentTarget: "15.0"

              sources:
                - path: Sources

              settings:
                base:

                  PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native

                  PRODUCT_NAME: Postal2iOS

                  SWIFT_VERSION: "5.0"

                  TARGETED_DEVICE_FAMILY: "1"

                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

                  CODE_SIGNING_ALLOWED: "NO"

                  CODE_SIGNING_REQUIRED: "NO"

                  CODE_SIGN_IDENTITY: ""

              info:

                path: Sources/Info.plist

                properties:

                  CFBundleDisplayName: POSTAL 2

                  CFBundleName: POSTAL 2

                  CFBundleShortVersionString: "0.3"

                  CFBundleVersion: "3"

                  UIFileSharingEnabled: true

                  LSSupportsOpeningDocumentsInPlace: true

                  UIApplicationSupportsIndirectInputEvents: true

                  UIApplicationSceneManifest:

                    UIApplicationSupportsMultipleScenes: false

                  UISupportedInterfaceOrientations:

                    - UIInterfaceOrientationLandscapeLeft

                    - UIInterfaceOrientationLandscapeRight

                    - UIInterfaceOrientationPortrait

                  UILaunchScreen: {}
          YAML

      # ==========================================================
      # CREATE SWIFT APP
      # ==========================================================

      - name: Create native folder picker
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          cat > \
            Postal2iOS/Sources/Postal2App.swift \
            <<'SWIFT'
          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers
          import Foundation

          // =====================================================
          // APP
          // =====================================================

          @main
          struct Postal2App: App {

              var body: some Scene {

                  WindowGroup {

                      ContentView()
                          .preferredColorScheme(
                              .dark
                          )
                  }
              }
          }

          // =====================================================
          // FILE COUNTERS
          // =====================================================

          struct PostalCounts {

              var maps: Int = 0

              var staticMeshes: Int = 0

              var textures: Int = 0
