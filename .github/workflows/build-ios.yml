name: POSTAL 2 WineGlass iOS FIX 8.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 FIX 8.0
    runs-on: macos-14
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # XCODE 15.4
      # ==========================================================

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== AVAILABLE XCODE ====="
          ls -1 /Applications | grep Xcode || true

          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select \
              -s "/Applications/Xcode_15.4.app/Contents/Developer"

          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select \
              -s "/Applications/Xcode_15.4.0.app/Contents/Developer"

          else
            echo "ERROR: Xcode 15.4 not found"
            exit 1
          fi

          echo "===== SELECTED XCODE ====="
          xcodebuild -version

          echo "===== XCODE PATH ====="
          xcode-select -p

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          export PATH="$(brew --prefix)/bin:$PATH"

          echo "===== FLOCK ====="
          command -v flock
          flock --version || true

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== SDK PATH ====="
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== IOS CLANG ====="
          xcrun --sdk iphoneos --find clang

      # ==========================================================
      # CLONE WINEGLASS + BLINK
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            WineGlass \
            blink-src

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p \
            WineGlass/Vendor/blink/lib

          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK COMMIT ====="
          git -C blink-src rev-parse HEAD

      # ==========================================================
      # CONFIGURE BLINK FOR IPHONE
      #
      # flock is installed on the host so configure doesn't try
      # to build its own host helper using iPhone clang.
      # ==========================================================

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          chmod +x configure

          echo "========================================"
          echo "FLOCK"
          echo "========================================"

          command -v flock

          echo "========================================"
          echo "IOS SDK"
          echo "========================================"

          echo "$SDK"

          echo "========================================"
          echo "IOS CLANG"
          echo "========================================"

          echo "$CC"

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

          echo "========================================"
          echo "CONFIGURE FINISHED"
          echo "========================================"

      # ==========================================================
      # FIX 8 CONFIG
      #
      # Cross-compiled configure tests cannot execute the produced
      # iPhone binaries on the macOS GitHub runner.
      #
      # Force capabilities known to exist on iOS.
      #
      # MOST IMPORTANT:
      # HAVE_MAP_ANONYMOUS = 1
      # ==========================================================

      - name: Patch Blink iOS config FIX 8
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/config.h")
          s = p.read_text(errors="ignore")

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
              "HAVE_SCHED_YIELD",
              "HAVE_SCHED_H",
          ]

          enable = [
              "HAVE_DEV_URANDOM",
              "HAVE_SYS_MOUNT_H",
              "HAVE_MAP_ANONYMOUS",
          ]

          targets = set(disable + enable)

          out = []

          for line in s.splitlines():

              stripped = line.strip()

              matched = False

              for name in targets:

                  patterns = [
                      rf'^#define\s+{re.escape(name)}\b',
                      rf'^#undef\s+{re.escape(name)}\b',
                      rf'^//\s*#define\s+{re.escape(name)}\b',
                      rf'^//\s*#undef\s+{re.escape(name)}\b',
                  ]

                  if any(
                      re.search(pattern, stripped)
                      for pattern in patterns
                  ):
                      matched = True
                      break

              if not matched:
                  out.append(line)

          # Insert before config include-guard end.
          insert = []

          insert.append("")
          insert.append(
              "/* ======================================== */"
          )
          insert.append(
              "/* POSTAL 2 iOS FIX 8.0                    */"
          )
          insert.append(
              "/* ======================================== */"
          )

          for name in disable:
              insert.append(
                  f"#undef {name}"
              )

          for name in enable:
              insert.append(
                  f"#define {name} 1"
              )

          final = []

          inserted = False

          for line in out:

              if (
                  not inserted
                  and line.strip().startswith(
                      "#endif"
                  )
              ):
                  final.extend(insert)
                  final.append("")
                  inserted = True

              final.append(line)

          if not inserted:
              final.extend(insert)

          p.write_text(
              "\n".join(final) + "\n"
          )

          print(
              "Blink FIX8 config patched"
          )
          PY

          echo "========================================"
          echo "FIX8 CONFIG CHECK"
          echo "========================================"

          grep -n \
            "HAVE_MAP_ANONYMOUS\|HAVE_DEV_URANDOM\|HAVE_SYS_MOUNT_H\|HAVE_SCHED_YIELD\|HAVE_GETENTROPY\|HAVE_GETRANDOM" \
            blink-src/config.h \
            || true

          echo "========================================"
          echo "REQUIRE MAP_ANONYMOUS"
          echo "========================================"

          grep -q \
            '^#define HAVE_MAP_ANONYMOUS 1$' \
            blink-src/config.h

      # ==========================================================
      # VERIFY IOS SDK REALLY HAS MAP_ANONYMOUS
      # ==========================================================

      - name: Verify iOS MAP_ANONYMOUS
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cat > /tmp/postal2-map-test.c <<'EOF'
          #include <sys/mman.h>

          #ifndef MAP_ANONYMOUS
          #error MAP_ANONYMOUS is not available in this iPhone SDK
          #endif

          int postal2_map_test(void) {
              return MAP_PRIVATE | MAP_ANONYMOUS;
          }
          EOF

          "$CC" \
            -c \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_DARWIN_C_SOURCE \
            /tmp/postal2-map-test.c \
            -o /tmp/postal2-map-test.o

          test -f \
            /tmp/postal2-map-test.o

          echo "========================================"
          echo "IOS MAP_ANONYMOUS AVAILABLE"
          echo "========================================"

      # ==========================================================
      # PATCH sched_yield
      #
      # This is the fix that already made FIX 7.x Blink compile.
      # ==========================================================

      - name: Patch Blink sched_yield for iOS
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "blink-src/blink/syscall.c"
          )

          s = p.read_text()

          pattern = r'''
          static\s+int\s+SysSchedYield
          \s*\(
              \s*struct\s+Machine\s*\*m
          \s*\)
          \s*\{
          .*?
          \n\}
          '''

          replacement = '''
          static int SysSchedYield(struct Machine *m) {
            (void)m;
            return 0;
          }
          '''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.S | re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: SysSchedYield patch failed"
              )

          s = s.replace(
              "        sched_yield();",
              "        /* sched_yield disabled on iOS */"
          )

          if "return sched_yield();" in s:
              raise SystemExit(
                  "ERROR: sched_yield still present"
              )

          p.write_text(s)

          print(
              "sched_yield patched"
          )
          PY

          echo "===== SCHED CHECK ====="

          grep -n \
            "SysSchedYield\|sched_yield" \
            blink-src/blink/syscall.c \
            || true

      # ==========================================================
      # BUILD BLINK ARM64
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          rm -f \
            o//blink/blink.a

          echo "========================================"
          echo "BUILD BLINK ARM64 IOS"
          echo "HAVE_MAP_ANONYMOUS FORCED"
          echo "========================================"

          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a

          test -f \
            o//blink/blink.a

          echo "===== BLINK BUILT ====="

          ls -lh \
            o//blink/blink.a

          mkdir -p \
            "$WG/Vendor/blink/lib"

          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"

          test -f \
            "$WG/Vendor/blink/lib/blink.a"

      # ==========================================================
      # FIX 8 BLINK VM
      #
      # Replace only create_vm_with_mode().
      #
      # Changes:
      #
      # 1. Correct MAP_FAILED check
      # 2. errno + strerror logging
      # 3. Don't continue into NewMachine after mmap failure
      # 4. Detailed page-table error
      # 5. Do NOT alter the rest of wg_blink_impl.c
      # ==========================================================

      - name: Patch Blink VM mmap FIX 8
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Vendor/blink/wg_blink_impl.c"
          )

          s = p.read_text()

          # ------------------------------------------------------
          # System headers MUST stay before Blink's headers.
          # ------------------------------------------------------

          if "#include <errno.h>" not in s:

              if "#include <stdio.h>" not in s:
                  raise SystemExit(
                      "ERROR: stdio include missing"
                  )

              s = s.replace(
                  "#include <stdio.h>",
                  "#include <stdio.h>\n"
                  "#include <errno.h>\n"
                  "#include <sys/mman.h>",
                  1
              )

          # ------------------------------------------------------
          # Replace one complete function by markers.
          #
          # This is much safer than regexing individual braces.
          # ------------------------------------------------------

          start_marker = (
              "static struct WGBlinkVM "
              "*create_vm_with_mode("
              "struct XedMachineMode mode) {"
          )

          end_marker = (
              "struct WGBlinkVM "
              "*WGBlinkVM_Create(void) {"
          )

          start = s.find(
              start_marker
          )

          if start == -1:
              raise SystemExit(
                  "ERROR: create_vm_with_mode start missing"
              )

          end = s.find(
              end_marker,
              start
          )

          if end == -1:
              raise SystemExit(
                  "ERROR: WGBlinkVM_Create marker missing"
              )

          new_function = r'''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {

              fprintf(
                  stderr,
                  "[FIX8/BLINK] CREATE VM mode=%d\n",
                  mode.omode
              );
              fflush(stderr);

              fprintf(
                  stderr,
                  "[FIX8/BLINK] BEFORE InitMap\n"
              );
              fflush(stderr);

              ensure_initialized();

              fprintf(
                  stderr,
                  "[FIX8/BLINK] AFTER InitMap pagesize=%ld\n",
                  FLAG_pagesize
              );
              fflush(stderr);


              fprintf(
                  stderr,
                  "[FIX8/BLINK] BEFORE VM calloc\n"
              );
              fflush(stderr);

              struct WGBlinkVM *vm =
                  calloc(
                      1,
                      sizeof(struct WGBlinkVM)
                  );

              fprintf(
                  stderr,
                  "[FIX8/BLINK] AFTER VM calloc vm=%p\n",
                  (void *)vm
              );
              fflush(stderr);

              if (!vm) {
                  fprintf(
                      stderr,
                      "[FIX8/BLINK] VM calloc FAILED\n"
                  );
                  fflush(stderr);
                  return NULL;
              }


              fprintf(
                  stderr,
                  "[FIX8/BLINK] BEFORE NewSystem\n"
              );
              fflush(stderr);

              vm->s =
                  NewSystem(mode);

              fprintf(
                  stderr,
                  "[FIX8/BLINK] AFTER NewSystem system=%p real=%p\n",
                  (void *)vm->s,
                  vm->s
                      ? (void *)vm->s->real
                      : NULL
              );
              fflush(stderr);

              if (!vm->s) {

                  fprintf(
                      stderr,
                      "[FIX8/BLINK] NewSystem FAILED\n"
                  );
                  fflush(stderr);

                  free(vm);

                  return NULL;
              }


              if (!vm->s->real) {

                  long pagesize =
                      FLAG_pagesize;

                  long real_size =
                      (
                          kRealSize
                          + pagesize
                          - 1
                      )
                      & ~(pagesize - 1);


                  fprintf(
                      stderr,
                      "[FIX8/BLINK] BEFORE real Mmap size=%ld pagesize=%ld flags=0x%x anon=0x%x\n",
                      real_size,
                      pagesize,
                      MAP_PRIVATE | MAP_ANONYMOUS_,
                      MAP_ANONYMOUS_
                  );
                  fflush(stderr);


                  errno = 0;

                  vm->s->real =
                      Mmap(
                          NULL,
                          real_size,
                          PROT_READ | PROT_WRITE,
                          MAP_PRIVATE | MAP_ANONYMOUS_,
                          -1,
                          0,
                          "real"
                      );

                  int mmap_errno =
                      errno;


                  fprintf(
                      stderr,
                      "[FIX8/BLINK] AFTER real Mmap real=%p errno=%d (%s)\n",
                      (void *)vm->s->real,
                      mmap_errno,
                      mmap_errno
                          ? strerror(mmap_errno)
                          : "OK"
                  );
                  fflush(stderr);


                  if (
                      vm->s->real == MAP_FAILED
                      || !vm->s->real
                  ) {

                      fprintf(
                          stderr,
                          "[FIX8/BLINK] REAL MMAP FAILED — stopping VM creation\n"
                      );
                      fflush(stderr);

                      /*
                       * MAP_FAILED is (void *)-1, not NULL.
                       * Don't leave it stored in System during
                       * cleanup.
                       */
                      vm->s->real =
                          NULL;

                      FreeSystem(
                          vm->s
                      );

                      free(vm);

                      return NULL;
                  }

              } else {

                  fprintf(
                      stderr,
                      "[FIX8/BLINK] NewSystem already provided real memory=%p\n",
                      (void *)vm->s->real
                  );
                  fflush(stderr);
              }


              fprintf(
                  stderr,
                  "[FIX8/BLINK] BEFORE NewMachine\n"
              );
              fflush(stderr);

              vm->m =
                  NewMachine(
                      vm->s,
                      NULL
                  );

              fprintf(
                  stderr,
                  "[FIX8/BLINK] AFTER NewMachine machine=%p\n",
                  (void *)vm->m
              );
              fflush(stderr);


              if (!vm->m) {

                  fprintf(
                      stderr,
                      "[FIX8/BLINK] NewMachine FAILED\n"
                  );
                  fflush(stderr);

                  FreeSystem(
                      vm->s
                  );

                  free(vm);

                  return NULL;
              }


              if (
                  mode.omode
                  == XED_MODE_LONG
              ) {

                  vm->s->cr0 =
                      CR0_PE
                      | CR0_MP
                      | CR0_ET
                      | CR0_PG;


                  fprintf(
                      stderr,
                      "[FIX8/BLINK] BEFORE AllocatePageTable\n"
                  );
                  fflush(stderr);


                  errno = 0;

                  vm->s->cr3 =
                      AllocatePageTable(
                          vm->s
                      );

                  int page_errno =
                      errno;


                  fprintf(
                      stderr,
                      "[FIX8/BLINK] AFTER AllocatePageTable cr3=%llu errno=%d (%s)\n",
                      (unsigned long long)
                          vm->s->cr3,
                      page_errno,
                      page_errno
                          ? strerror(page_errno)
                          : "OK"
                  );
                  fflush(stderr);


                  if (
                      vm->s->cr3
                      == (u64)-1
                  ) {

                      fprintf(
                          stderr,
                          "[FIX8/BLINK] AllocatePageTable FAILED\n"
                      );
                      fflush(stderr);

                      FreeMachine(
                          vm->m
                      );

                      FreeSystem(
                          vm->s
                      );

                      free(vm);

                      return NULL;
                  }

              } else if (
                  mode.omode
                  == XED_MODE_LEGACY
              ) {

                  vm->s->cr0 =
                      CR0_PE
                      | CR0_MP
                      | CR0_ET;
              }


              vm->m->flags |=
                  (1 << 9);


              fprintf(
                  stderr,
                  "[FIX8/BLINK] VM CREATE SUCCESS real=%p cr3=%llu\n",
                  (void *)vm->s->real,
                  (unsigned long long)
                      vm->s->cr3
              );
              fflush(stderr);


              return vm;
          }

          '''

          s = (
              s[:start]
              + new_function
              + "\n"
              + s[end:]
          )

          p.write_text(s)

          print(
              "========================================"
          )
          print(
              "WINEGLASS BLINK VM FIX 8 PATCHED"
          )
          print(
              "========================================"
          )
          PY

          echo "===== FIX8 SOURCE CHECK ====="

          grep -n \
            "FIX8/BLINK\|MAP_FAILED" \
            WineGlass/Vendor/blink/wg_blink_impl.c

          echo "===== CREATE VM AREA ====="

          nl -ba \
            WineGlass/Vendor/blink/wg_blink_impl.c \
            | sed -n '25,180p'

      # ==========================================================
      # BUILD WINEGLASS BLINK BRIDGE
      # ==========================================================

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          echo "===== BRIDGE OBJECT ====="

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          lipo -info \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            || true

      # ==========================================================
      # FALLBACK A0 / A1 / A2 / A3
      #
      # Keep this because if Blink still fails for another reason,
      # builtin can at least pass the old A1 blocker.
      # ==========================================================

      - name: Add x86 A0 A1 A2 A3 fallback opcodes
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/CPU/wg_x86_decode.c"
          )

          s = p.read_text()

          marker = \
              "    // TEST AL/rAX, imm (A8, A9)"

          if marker not in s:
              raise SystemExit(
                  "ERROR: decoder A8/A9 marker missing"
              )

          patch = r'''
              // =====================================================
              // POSTAL 2 FIX 8
              //
              // A0 MOV AL, moffs
              // A1 MOV EAX/RAX, moffs
              // A2 MOV moffs, AL
              // A3 MOV moffs, EAX/RAX
              // =====================================================

              case 0xA0: {

                  uint32_t addr =
                      fetch32(c);

                  out->opcode =
                      WG_OP_MOV;

                  out->operands[0] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_REG,

                          .reg_index =
                              0,

                          .size =
                              1
                      };

                  out->operands[1] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_MEM,

                          .mem_base =
                              -2,

                          .mem_index =
                              -1,

                          .mem_scale =
                              1,

                          .mem_disp =
                              (int64_t)addr,

                          .mem_seg =
                              c->seg_override,

                          .size =
                              1
                      };

                  out->num_operands =
                      2;

                  break;
              }


              case 0xA1: {

                  uint32_t addr =
                      fetch32(c);

                  out->opcode =
                      WG_OP_MOV;

                  out->operands[0] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_REG,

                          .reg_index =
                              0,

                          .size =
                              op_sz
                      };

                  out->operands[1] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_MEM,

                          .mem_base =
                              -2,

                          .mem_index =
                              -1,

                          .mem_scale =
                              1,

                          .mem_disp =
                              (int64_t)addr,

                          .mem_seg =
                              c->seg_override,

                          .size =
                              op_sz
                      };

                  out->num_operands =
                      2;

                  break;
              }


              case 0xA2: {

                  uint32_t addr =
                      fetch32(c);

                  out->opcode =
                      WG_OP_MOV;

                  out->operands[0] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_MEM,

                          .mem_base =
                              -2,

                          .mem_index =
                              -1,

                          .mem_scale =
                              1,

                          .mem_disp =
                              (int64_t)addr,

                          .mem_seg =
                              c->seg_override,

                          .size =
                              1
                      };

                  out->operands[1] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_REG,

                          .reg_index =
                              0,

                          .size =
                              1
                      };

                  out->num_operands =
                      2;

                  break;
              }


              case 0xA3: {

                  uint32_t addr =
                      fetch32(c);

                  out->opcode =
                      WG_OP_MOV;

                  out->operands[0] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_MEM,

                          .mem_base =
                              -2,

                          .mem_index =
                              -1,

                          .mem_scale =
                              1,

                          .mem_disp =
                              (int64_t)addr,

                          .mem_seg =
                              c->seg_override,

                          .size =
                              op_sz
                      };

                  out->operands[1] =
                      (WGOperand){
                          .type =
                              WG_OPERAND_REG,

                          .reg_index =
                              0,

                          .size =
                              op_sz
                      };

                  out->num_operands =
                      2;

                  break;
              }

          '''

          s = s.replace(
              marker,
              patch + marker,
              1
          )

          p.write_text(s)

          print(
              "A0 A1 A2 A3 added"
          )
          PY

          echo "===== OPCODE CHECK ====="

          grep -n \
            "case 0xA0\|case 0xA1\|case 0xA2\|case 0xA3" \
            WineGlass/Sources/CPU/wg_x86_decode.c

      # ==========================================================
      # PROJECT
      #
      # Same bundle ID so existing imported POSTAL 2 data remains
      # associated with the same app container when installed over.
      # ==========================================================

      - name: Patch WineGlass project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "project.yml"
          )

          s = p.read_text()

          s = s.replace(
              "bundleIdPrefix: com.wineglass",
              "bundleIdPrefix: com.postal2ios"
          )

          s = s.replace(
              'xcodeVersion: "15.0"',
              'xcodeVersion: "15.4"\n'
              '  projectFormat: xcode15_3'
          )

          s = s.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",
              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )

          s = s.replace(
              'TARGETED_DEVICE_FAMILY: "1,2"',
              'TARGETED_DEVICE_FAMILY: "1"'
          )

          lines = []

          for line in s.splitlines():

              if (
                  "CODE_SIGN_ENTITLEMENTS:"
                  in line
              ):
                  continue

              if (
                  "DEVELOPMENT_TEAM:"
                  in line
              ):
                  continue

              if (
                  "CODE_SIGN_STYLE: Automatic"
                  in line
              ):
                  line = line.replace(
                      "CODE_SIGN_STYLE: Automatic",
                      "CODE_SIGN_STYLE: Manual"
                  )

              lines.append(line)

          p.write_text(
              "\n".join(lines)
              + "\n"
          )

          print(
              "project.yml patched"
          )
          PY

          echo "===== PROJECT.YML ====="

          cat project.yml

      # ==========================================================
      # INFO PLIST
      # ==========================================================

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="WineGlass/Sources/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleDisplayName" \
            "$PLIST" \
            || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 0.8.0" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion 80" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$PLIST"

          plutil -lint \
            "$PLIST"

      # ==========================================================
      # POSTAL 2 LAUNCHER + LOG
      #
      # FIX 8 also prevents repeated launches from button tapping.
      # ==========================================================

      - name: Patch POSTAL 2 launcher and log
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/App/WGSceneDelegate.m"
          )

          s = p.read_text()


          # ------------------------------------------------------
          # stdio
          # ------------------------------------------------------

          if "#include <stdio.h>" not in s:

              s = s.replace(
                  "#include <unistd.h>",
                  "#include <unistd.h>\n"
                  "#include <stdio.h>",
                  1
              )


          # ------------------------------------------------------
          # File logging before Blink self-test.
          # ------------------------------------------------------

          old = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              wg_log_init();'''

          new = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;

              NSString *logPath =
                  [docs
                      stringByAppendingPathComponent:
                          @"POSTAL2-WineGlass.log"];

              [[NSFileManager defaultManager]
                  removeItemAtPath:
                      logPath
                  error:nil];

              freopen(
                  logPath.fileSystemRepresentation,
                  "a",
                  stderr
              );

              setvbuf(
                  stderr,
                  NULL,
                  _IONBF,
                  0
              );

              fprintf(
                  stderr,
                  "========================================\\n"
                  "POSTAL 2 WineGlass FIX 8.0\\n"
                  "MAP_ANONYMOUS + MAP_FAILED FIX\\n"
                  "========================================\\n"
              );

              fflush(stderr);

              wg_log_init();

              WG_LOGI(
                  "POSTAL2",
                  "FIX 8.0 logging started"
              );'''

          if old not in s:
              raise SystemExit(
                  "ERROR: scene startup marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          # ------------------------------------------------------
          # Button title.
          # ------------------------------------------------------

          old = (
              '[_loadButton setTitle:'
              '@"  Load .exe  " '
              'forState:UIControlStateNormal];'
          )

          new = (
              '[_loadButton setTitle:'
              '@"  RUN POSTAL 2  " '
              'forState:UIControlStateNormal];'
          )

          if old not in s:
              raise SystemExit(
                  "ERROR: Load .exe title missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          # ------------------------------------------------------
          # Button action.
          # ------------------------------------------------------

          old = (
              '[_loadButton addTarget:self '
              'action:@selector(openFilePicker) '
              'forControlEvents:'
              'UIControlEventTouchUpInside];'
          )

          new = (
              '[_loadButton addTarget:self '
              'action:@selector(runPostal2) '
              'forControlEvents:'
              'UIControlEventTouchUpInside];'
          )

          if old not in s:
              raise SystemExit(
                  "ERROR: button action missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          # ------------------------------------------------------
          # POSTAL runner.
          # ------------------------------------------------------

          marker = (
              "#pragma mark - "
              "UIDocumentPickerDelegate"
          )

          if marker not in s:
              raise SystemExit(
                  "ERROR: document picker marker missing"
              )


          postal_methods = r'''
          // ============================================================
          // POSTAL 2 FIX 8.0
          // ============================================================

          - (NSString *)findPostal2Exe {

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;


              NSString *root =
                  [docs
                      stringByAppendingPathComponent:
                          @"Postal2FullData"];


              NSFileManager *fm =
                  [NSFileManager
                      defaultManager];


              WG_LOGI(
                  "POSTAL2",
                  "Searching under: %s",
                  root.UTF8String
              );


              NSString *normal =
                  [root
                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"];


              if (
                  [fm
                      fileExistsAtPath:
                          normal]
              ) {

                  WG_LOGI(
                      "POSTAL2",
                      "Found normal path: %s",
                      normal.UTF8String
                  );

                  return normal;
              }


              NSDirectoryEnumerator *enumerator =
                  [fm
                      enumeratorAtPath:
                          root];


              for (
                  NSString *relative
                  in enumerator
              ) {

                  if (
                      [[relative
                          lastPathComponent]
                          caseInsensitiveCompare:
                              @"Postal2.exe"]
                      == NSOrderedSame
                  ) {

                      NSString *found =
                          [root
                              stringByAppendingPathComponent:
                                  relative];


                      WG_LOGI(
                          "POSTAL2",
                          "Found recursively: %s",
                          found.UTF8String
                      );


                      return found;
                  }
              }


              WG_LOGE(
                  "POSTAL2",
                  "Postal2.exe NOT FOUND"
              );


              return nil;
          }


          - (void)runPostal2 {

              static BOOL postalStarted =
                  NO;


              if (!_engine) {

                  WG_LOGE(
                      "POSTAL2",
                      "Engine not ready"
                  );

                  return;
              }


              NSString *exe =
                  [self
                      findPostal2Exe];


              if (!exe) {

                  [_loadButton
                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "
                      forState:
                          UIControlStateNormal];

                  return;
              }


              if (postalStarted) {

                  WG_LOGW(
                      "POSTAL2",
                      "Duplicate launch ignored"
                  );

                  return;
              }


              postalStarted =
                  YES;


              _loadButton.enabled =
                  NO;


              NSString *systemDir =
                  [exe
                      stringByDeletingLastPathComponent];


              int cdResult =
                  chdir(
                      systemDir
                          .fileSystemRepresentation
                  );


              WG_LOGI(
                  "POSTAL2",
                  "System directory: %s",
                  systemDir.UTF8String
              );


              WG_LOGI(
                  "POSTAL2",
                  "chdir result = %d",
                  cdResult
              );


              [_loadButton
                  setTitle:
                      @"  STARTING POSTAL 2...  "
                  forState:
                      UIControlStateNormal];


              WG_LOGI(
                  "POSTAL2",
                  "Launching original Postal2.exe"
              );


              [self
                  loadAndRunPE:
                      exe];
          }

          '''


          s = s.replace(
              marker,
              postal_methods
              + "\n"
              + marker,
              1
          )


          # ------------------------------------------------------
          # Auto-start.
          # ------------------------------------------------------

          old = (
              "            "
              "[self tryLoadBundledPE];"
          )

          new = '''            WG_LOGI(
                          "POSTAL2",
                          "Engine ready — FIX8 auto-start"
                      );

                      [self runPostal2];'''

          if old not in s:
              raise SystemExit(
                  "ERROR: tryLoadBundledPE marker missing"
              )


          s = s.replace(
              old,
              new,
              1
          )


          p.write_text(s)

          print(
              "POSTAL 2 FIX8 launcher patched"
          )
          PY

          echo "===== LAUNCHER CHECK ====="

          grep -n \
            "FIX 8.0\|RUN POSTAL 2\|STARTING POSTAL 2\|findPostal2Exe\|postalStarted\|POSTAL2-WineGlass" \
            WineGlass/Sources/App/WGSceneDelegate.m

      # ==========================================================
      # GENERATE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass

          rm -rf \
            WineGlass.xcodeproj

          xcodegen generate

          test -f \
            WineGlass.xcodeproj/project.pbxproj

          echo "===== OBJECT VERSION ====="

          grep -m1 \
            "objectVersion" \
            WineGlass.xcodeproj/project.pbxproj \
            || true

          if grep -q \
            "objectVersion = 77" \
            WineGlass.xcodeproj/project.pbxproj
          then

            echo \
              "ERROR: unsupported objectVersion 77"

            exit 1
          fi

      # ==========================================================
      # BUILD APP
      # ==========================================================

      - name: Build POSTAL 2 FIX 8.0
        shell: bash
        run: |
          set -o pipefail

          cd WineGlass

          rm -rf \
            build

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 \
            | tee xcodebuild.log

      # ==========================================================
      # VERIFY APP
      # ==========================================================

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail

          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          test -d \
            "$APP"

          test -f \
            "$APP/WineGlass"

          echo "===== APP ARCH ====="

          lipo -info \
            "$APP/WineGlass"

          echo "===== BUNDLE ID ====="

          ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "$ID"

          if [
            "$ID"
            !=
            "com.postal2ios.native"
          ]; then

            echo \
              "ERROR: wrong bundle ID: $ID"

            exit 1
          fi

          echo "===== VERSION ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"

          echo "===== BUILD ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist"

      # ==========================================================
      # PACKAGE IPA
      # ==========================================================

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"

          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          OUT="$ROOT/out"

          rm -rf \
            "$OUT"

          mkdir -p \
            "$OUT/Payload"

          cp -R \
            "$APP" \
            "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"

          zip \
            -qry \
            "POSTAL-2-iOS-v8.0-MAP-ANONYMOUS-FIX.ipa" \
            Payload

          echo "===== IPA ====="

          ls -lh \
            "POSTAL-2-iOS-v8.0-MAP-ANONYMOUS-FIX.ipa"

      # ==========================================================
      # UPLOAD IPA
      # ==========================================================

      - name: Upload POSTAL 2 FIX 8.0 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v8.0-MAP-ANONYMOUS-FIX
          path: out/POSTAL-2-iOS-v8.0-MAP-ANONYMOUS-FIX.ipa
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p \
            debug-fix8

          cp \
            WineGlass/xcodebuild.log \
            debug-fix8/ \
            2>/dev/null \
            || true

          cp \
            blink-src/config.h \
            debug-fix8/blink-config.h \
            2>/dev/null \
            || true

          cp \
            blink-src/config.mk \
            debug-fix8/blink-config.mk \
            2>/dev/null \
            || true

          cp \
            blink-src/config.log \
            debug-fix8/blink-config.log \
            2>/dev/null \
            || true

          cp \
            blink-src/blink/syscall.c \
            debug-fix8/blink-syscall.c \
            2>/dev/null \
            || true

          cp \
            blink-src/blink/map.c \
            debug-fix8/blink-map.c \
            2>/dev/null \
            || true

          cp \
            blink-src/blink/map.h \
            debug-fix8/blink-map.h \
            2>/dev/null \
            || true

          cp \
            WineGlass/Vendor/blink/wg_blink_impl.c \
            debug-fix8/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/Sources/CPU/wg_x86_decode.c \
            debug-fix8/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/Sources/App/WGSceneDelegate.m \
            debug-fix8/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/project.yml \
            debug-fix8/ \
            2>/dev/null \
            || true

          cp \
            WineGlass/WineGlass.xcodeproj/project.pbxproj \
            debug-fix8/ \
            2>/dev/null \
            || true

      - name: Upload FIX 8 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX8-DEBUG
          path: debug-fix8
          if-no-files-found: ignore
          retention-days: 7
