name: POSTAL 2 WineGlass iOS FIX 11.12 CLEAN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate FIX 11.12 CLEAN
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate workflow and successful FIX 11.8.1 base
        shell: bash
        run: |
          set -euxo pipefail

          BASE_COMMIT="0bae098"
          BASE_FILE="/tmp/POSTAL-FIX11.8.1-success.yml"

          if git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git show "${BASE_COMMIT}:.github/workflows/build-ios.yml" > "$BASE_FILE"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/negelinho-debug/Postal2-ios/${BASE_COMMIT}/.github/workflows/build-ios.yml" \
              -o "$BASE_FILE"
          fi

          grep -q \
            '^name: POSTAL 2 WineGlass iOS FIX 11.8.1 CLEAN$' \
            "$BASE_FILE"

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import textwrap
          import zlib

          current = Path(".github/workflows/build-ios.yml").read_text()
          lines = current.splitlines()
          blocks = []
          i = 0

          while i < len(lines):
              line = lines[i]

              if line.strip() == "python3 <<'PY'":
                  base_indent = len(line) - len(line.lstrip())
                  body = []
                  i += 1

                  while i < len(lines) and lines[i].strip() != "PY":
                      cur = lines[i]

                      if cur.startswith(" " * base_indent):
                          cur = cur[base_indent:]

                      body.append(cur)
                      i += 1

                  if i >= len(lines):
                      raise SystemExit("ERROR: unterminated Python heredoc")

                  blocks.append(textwrap.dedent("\n".join(body)))

              i += 1

          for index, code in enumerate(blocks, start=1):
              ast.parse(code, filename=f"visible-python-{index}")

          base = Path("/tmp/POSTAL-FIX11.8.1-success.yml").read_text()

          pattern = re.compile(
              r'payload\s*=\s*"""(.*?)"""\s*'
              r'code\s*=\s*zlib\.decompress\(.*?\)\.decode\("utf-8"\)\s*'
              r'compile\(\s*code,\s*"([^"]+)"',
              re.S,
          )

          wanted = {
              "<POSTAL-blink-config>",
              "<POSTAL-blink-sched>",
              "<POSTAL-blink-mmap>",
              "<POSTAL-engine>",
              "<POSTAL-FIX11.8.1-cumulative>",
              "<POSTAL-project>",
              "<POSTAL-launcher>",
          }

          found = set()

          for payload, label in pattern.findall(base):
              if label not in wanted:
                  continue

              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(code, filename=label)
              found.add(label)

          missing = sorted(wanted - found)

          if missing:
              raise SystemExit(
                  "ERROR: missing successful 11.8.1 payloads: "
                  + ", ".join(missing)
              )

          print(
              "FIX 11.12 validation OK:",
              len(blocks),
              "visible Python blocks and",
              len(found),
              "successful 11.8.1 payloads"
          )
          PY

  vc120:
    needs: lint
    name: Prepare VC++ 2013 x86 runtime
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Download and install official VC++ 2013 x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $exe = Join-Path $root "vcredist_x86.exe"
          $out = Join-Path $root "vc120-runtime"

          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $urls = @(
            "https://download.visualstudio.microsoft.com/download/pr/10912113/5da66ddebb0ad32ebd4b922fd82e8e25/vcredist_x86.exe",
            "https://download.microsoft.com/download/2/E/6/2E61CFA4-993B-4DD4-91DA-3737CD5CD6E3/vcredist_x86.exe"
          )

          $downloaded = $false

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $exe

              if ((Test-Path $exe) -and ((Get-Item $exe).Length -gt 100000)) {
                $downloaded = $true
                break
              }
            }
            catch {
              Write-Warning $_
            }
          }

          if (-not $downloaded) {
            throw "Could not download official VC++ 2013 x86 redistributable"
          }

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList "/install","/quiet","/norestart" `
            -Wait `
            -PassThru

          Write-Host "vcredist exit code: $($proc.ExitCode)"

          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 1638) {
            throw "vcredist_x86 failed with exit code $($proc.ExitCode)"
          }

          $msvcr = @(
            "$env:WINDIR\SysWOW64\msvcr120.dll",
            "$env:WINDIR\System32\msvcr120.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          $msvcp = @(
            "$env:WINDIR\SysWOW64\msvcp120.dll",
            "$env:WINDIR\System32\msvcp120.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msvcr) { throw "msvcr120.dll was not found" }
          if (-not $msvcp) { throw "msvcp120.dll was not found" }

          Copy-Item $msvcr (Join-Path $out "msvcr120.dll") -Force
          Copy-Item $msvcp (Join-Path $out "msvcp120.dll") -Force

          Get-Item `
            (Join-Path $out "msvcr120.dll"), `
            (Join-Path $out "msvcp120.dll") |
            Format-List FullName,Length

      - name: Upload VC120 runtime
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime
          if-no-files-found: error
          retention-days: 1

  build:
    needs: vc120
    name: Build POSTAL 2 FIX 11.12 CLEAN
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VC120 runtime
        uses: actions/download-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime

      - name: Verify VC120 runtime
        shell: bash
        run: |
          set -euxo pipefail

          test -s vc120-runtime/msvcr120.dll
          test -s vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll
          file vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll | grep -q "PE32 executable"
          file vc120-runtime/msvcp120.dll | grep -q "PE32 executable"
          file vc120-runtime/msvcr120.dll | grep -q "Intel 80386"
          file vc120-runtime/msvcp120.dll | grep -q "Intel 80386"

      - name: Recover exact successful FIX 11.8.1 patches
        shell: bash
        run: |
          set -euxo pipefail

          BASE_COMMIT="0bae098"
          BASE_FILE="/tmp/POSTAL-FIX11.8.1-success.yml"
          PATCH_DIR="$GITHUB_WORKSPACE/.postal-base-patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          if git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git show "${BASE_COMMIT}:.github/workflows/build-ios.yml" > "$BASE_FILE"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/negelinho-debug/Postal2-ios/${BASE_COMMIT}/.github/workflows/build-ios.yml" \
              -o "$BASE_FILE"
          fi

          grep -q \
            '^name: POSTAL 2 WineGlass iOS FIX 11.8.1 CLEAN$' \
            "$BASE_FILE"

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import zlib

          src = Path("/tmp/POSTAL-FIX11.8.1-success.yml").read_text()
          out = Path(".postal-base-patches")

          names = {
              "<POSTAL-blink-config>": "blink-config.py",
              "<POSTAL-blink-sched>": "blink-sched.py",
              "<POSTAL-blink-mmap>": "blink-mmap.py",
              "<POSTAL-engine>": "engine-fix11.2.py",
              "<POSTAL-FIX11.8.1-cumulative>": "cumulative-fix11.8.1.py",
              "<POSTAL-project>": "project.py",
              "<POSTAL-launcher>": "launcher.py",
          }

          pattern = re.compile(
              r'payload\s*=\s*"""(.*?)"""\s*'
              r'code\s*=\s*zlib\.decompress\(.*?\)\.decode\("utf-8"\)\s*'
              r'compile\(\s*code,\s*"([^"]+)"',
              re.S,
          )

          written = set()

          for payload, label in pattern.findall(src):
              filename = names.get(label)

              if not filename:
                  continue

              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(code, filename=label)
              (out / filename).write_text(code)
              written.add(label)

          missing = sorted(set(names) - written)

          if missing:
              raise SystemExit(
                  "ERROR: missing successful FIX11.8.1 payloads: "
                  + ", ".join(missing)
              )

          print(
              "Recovered",
              len(written),
              "successful FIX11.8.1 patches"
          )
          PY

          ls -lh "$PATCH_DIR"

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found"
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi

          xcodebuild -version
          xcode-select -p

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock
          export PATH="$(brew --prefix)/bin:$PATH"

          command -v flock
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf WineGlass blink-src

          git clone --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p WineGlass/Vendor/blink/lib

          git -C WineGlass rev-parse HEAD
          git -C blink-src rev-parse HEAD

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd blink-src
          chmod +x configure

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

      - name: Patch Blink iOS config from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/blink-config.py

          grep -q \
            '^#define HAVE_MAP_ANONYMOUS 1$' \
            blink-src/config.h

      - name: Patch Blink sched_yield from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/blink-sched.py

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"
          rm -f o//blink/blink.a

          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a

          test -f o//blink/blink.a
          cp o//blink/blink.a "$WG/Vendor/blink/lib/blink.a"
          test -f "$WG/Vendor/blink/lib/blink.a"

      - name: Patch Blink VM mmap from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/blink-mmap.py

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f "$WG/Vendor/blink/lib/wg_blink_impl.o"

      - name: Apply POSTAL engine FIX 11.2 from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/engine-fix11.2.py

      - name: Apply cumulative FIX 11.8.1 exactly as successful build
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/cumulative-fix11.8.1.py

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          FILES="WineGlass/Sources/Win32/wg_win32_files.c"

          grep -n "POSTAL FIX11.3 DisableThreadLibraryCalls" "$ENGINE"
          grep -n "POSTAL FIX11.4 VirtualAlloc" "$ENGINE"
          grep -n "POSTAL FIX11.5 timeBeginPeriod" "$ENGINE"
          grep -n "POSTAL FIX11.7 GetModuleFileNameA" "$ENGINE"
          grep -n "POSTAL FIX11.8.1 %s request" "$ENGINE"
          grep -n "POSTAL FIX11.8.1 %s STRICT FAIL" "$ENGINE"
          grep -n "POSTAL FIX11.6.2 System root" "$FILES"
          grep -n "POSTAL FIX11.6.2 map" "$FILES"

          echo "SUCCESSFUL FIX 11.8.1 BASE RESTORED"

      - name: Patch FIX 11.12 GObjRegistrants recovery
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()
          marker = "POSTAL FIX11.12 TARGET ASSERTION"

          if marker not in s:
              run_anchor = "bool wg_engine_run(WGEngine *engine) {"
              run_pos = s.find(run_anchor)
              if run_pos < 0:
                  raise SystemExit("ERROR: FIX11.12 wg_engine_run missing")

              helper = r'''// ============================================================
          // POSTAL 2 FIX 11.12 - GObjRegistrants recovery
          // ============================================================
          static bool s_postal_assert_armed_1112 = false;
          static uint32_t s_postal_assert_bp_1112 = 0;
          static uint8_t s_postal_assert_orig_1112 = 0;

          static void postal_read_ascii_1112(WGEngine *engine, uint32_t addr, char *out, size_t cap) {
              if (!out || cap == 0) return;
              out[0] = 0;
              if (!engine || !engine->blink || !addr) return;
              if (!wg_blink_read_mem(engine->blink, addr, out, cap - 1)) return;
              out[cap - 1] = 0;
              for (size_t i=0; i<cap-1 && out[i]; i++) {
                  unsigned char c=(unsigned char)out[i];
                  if (c < 32 || c >= 127) out[i]='?';
              }
          }

          static bool postal_find_gobj_1112(WGEngine *engine, uint32_t ret, uint32_t *data_addr, uint32_t *num_addr, uint32_t *max_addr) {
              if (!engine || !engine->blink || !ret) return false;
              uint32_t start = ret > 128u ? ret - 128u : ret;
              uint8_t code[160]={0};
              if (!wg_blink_read_mem(engine->blink, start, code, sizeof(code))) return false;
              for (int i=0; i <= (int)sizeof(code)-12; i++) {
                  if (code[i]==0x8B && code[i+1]==0x0D && code[i+6]==0x8B && code[i+7]==0x15) {
                      uint32_t n=(uint32_t)code[i+2]|((uint32_t)code[i+3]<<8)|((uint32_t)code[i+4]<<16)|((uint32_t)code[i+5]<<24);
                      uint32_t d=(uint32_t)code[i+8]|((uint32_t)code[i+9]<<8)|((uint32_t)code[i+10]<<16)|((uint32_t)code[i+11]<<24);
                      if (d>=0x60000000u && d<0x61000000u && n==d+4u) {
                          *data_addr=d; *num_addr=n; *max_addr=d+8u;
                          WG_LOGW(TAG,"POSTAL FIX11.12 GOBJ SYMBOLS data@%08X num@%08X max@%08X",d,n,d+8u);
                          return true;
                      }
                  }
              }
              return false;
          }

          static bool postal_realloc_gobj_1112(WGEngine *engine, uint32_t old_data, int32_t num, uint32_t missing, uint32_t *new_data, int32_t *new_max) {
              if (!engine || !engine->blink || num<0 || num>=1023) return false;
              uint8_t page[4096]={0};
              size_t bytes=(size_t)num*4u;
              if (bytes > sizeof(page)-4u) return false;
              if (num && !wg_blink_read_mem(engine->blink, old_data, page, bytes)) return false;
              memcpy(page+bytes,&missing,4);
              static const uint32_t cand[]={0x00B00000u,0x00B10000u,0x00B20000u,0x00B30000u,0x00B40000u,0x00B50000u,0x00B60000u,0x00B70000u};
              for (size_t i=0;i<sizeof(cand)/sizeof(cand[0]);i++) {
                  if (wg_blink_load_code(engine->blink,cand[i],page,sizeof(page),0)) {
                      *new_data=cand[i]; *new_max=1024;
                      WG_LOGW(TAG,"POSTAL FIX11.12 REALLOC old=%08X new=%08X num=%d",old_data,*new_data,num+1);
                      return true;
                  }
              }
              return false;
          }

          static bool postal_recover_gobj_1112(WGEngine *engine, uint32_t ret, uint32_t missing) {
              uint32_t da=0,na=0,ma=0,data=0;
              int32_t num=0,max=0;
              if (!postal_find_gobj_1112(engine,ret,&da,&na,&ma)) return false;
              if (!wg_blink_read_mem(engine->blink,da,&data,4) || !wg_blink_read_mem(engine->blink,na,&num,4) || !wg_blink_read_mem(engine->blink,ma,&max,4)) return false;
              WG_LOGW(TAG,"POSTAL FIX11.12 MISSING REGISTRANT this=%08X data=%08X num=%d max=%d",missing,data,num,max);
              if (num<0 || num>1023 || max<num || max>4096 || data<0x10000u || data>=0xFFF00000u) return false;
              for (int32_t i=0;i<num;i++) {
                  uint32_t obj=0;
                  if (!wg_blink_read_mem(engine->blink,data+(uint32_t)i*4u,&obj,4)) return false;
                  if (obj==missing) return true;
              }
              int32_t new_num=num+1;
              if (num<max) {
                  if (!wg_blink_write_mem(engine->blink,data+(uint32_t)num*4u,&missing,4)) return false;
                  if (!wg_blink_write_mem(engine->blink,na,&new_num,4)) return false;
                  WG_LOGW(TAG,"POSTAL FIX11.12 APPENDED index=%d newNum=%d max=%d",num,new_num,max);
                  return true;
              }
              uint32_t new_data=0; int32_t new_max=0;
              if (!postal_realloc_gobj_1112(engine,data,num,missing,&new_data,&new_max)) return false;
              if (!wg_blink_write_mem(engine->blink,da,&new_data,4) || !wg_blink_write_mem(engine->blink,na,&new_num,4) || !wg_blink_write_mem(engine->blink,ma,&new_max,4)) return false;
              WG_LOGW(TAG,"POSTAL FIX11.12 APPENDED AFTER REALLOC index=%d newNum=%d newMax=%d",num,new_num,new_max);
              return true;
          }

          static bool postal_return_from_assert_1112(WGEngine *engine) {
              uint8_t retop=0xC3;
              if (!wg_blink_write_mem(engine->blink,s_postal_assert_bp_1112,&retop,1)) return false;
              wg_blink_set_rip(engine->blink,s_postal_assert_bp_1112);
              wg_blink_step(engine->blink);
              uint64_t after=wg_blink_get_rip(engine->blink);
              uint8_t hlt=0xF4;
              wg_blink_write_mem(engine->blink,s_postal_assert_bp_1112,&hlt,1);
              WG_LOGW(TAG,"POSTAL FIX11.12 ASSERTION BYPASSED returnRip=0x%llX",(unsigned long long)after);
              return true;
          }

          static void postal_arm_assert_1112(WGEngine *engine) {
              if (s_postal_assert_armed_1112 || !engine || !engine->blink) return;
              uint32_t core=0;
              for (int i=0;i<16;i++) if (s_modules[i].in_use && strcmp(s_modules[i].name,"core.dll")==0) { core=s_modules[i].base; break; }
              if (!core) return;
              uint32_t addr=wg_module_export(core,"?appFailAssert@@YAXPBD0H@Z");
              if (!addr) return;
              uint8_t orig=0;
              if (!wg_blink_read_mem(engine->blink,addr,&orig,1)) return;
              uint8_t hlt=0xF4;
              if (!wg_blink_write_mem(engine->blink,addr,&hlt,1)) return;
              s_postal_assert_bp_1112=addr;
              s_postal_assert_orig_1112=orig;
              s_postal_assert_armed_1112=true;
              WG_LOGI(TAG,"POSTAL FIX11.12 ASSERT ARMED @0x%X",addr);
          }

          static bool postal_handle_assert_1112(WGEngine *engine, uint64_t rip) {
              if (!s_postal_assert_armed_1112 || !engine || !engine->blink || rip!=s_postal_assert_bp_1112) return false;
              uint32_t esp=(uint32_t)wg_blink_get_reg(engine->blink,4);
              uint32_t esi=(uint32_t)wg_blink_get_reg(engine->blink,6);
              uint32_t st[8]={0};
              if (esp) wg_blink_read_mem(engine->blink,esp,st,sizeof(st));
              char expr[192]={0}; char file[128]={0};
              postal_read_ascii_1112(engine,st[1],expr,sizeof(expr));
              postal_read_ascii_1112(engine,st[2],file,sizeof(file));
              WG_LOGW(TAG,"POSTAL FIX11.12 ASSERT HIT expr='%s' file='%s' line=%u this=%08X ret=%08X",expr,file,st[3],esi,st[0]);
              if (strstr(expr,"GObjRegistrants") && st[3]==380u) {
                  WG_LOGW(TAG,"POSTAL FIX11.12 TARGET ASSERTION");
                  if (postal_recover_gobj_1112(engine,st[0],esi) && postal_return_from_assert_1112(engine)) {
                      WG_LOGW(TAG,"POSTAL FIX11.12 RECOVERY COMPLETE this=%08X",esi);
                      return true;
                  }
                  WG_LOGW(TAG,"POSTAL FIX11.12 RECOVERY FAILED");
              }
              wg_blink_write_mem(engine->blink,s_postal_assert_bp_1112,&s_postal_assert_orig_1112,1);
              wg_blink_set_rip(engine->blink,s_postal_assert_bp_1112);
              wg_blink_step(engine->blink);
              uint8_t hlt=0xF4;
              wg_blink_write_mem(engine->blink,s_postal_assert_bp_1112,&hlt,1);
              return true;
          }

          '''
              s=s[:run_pos]+helper+s[run_pos:]
              arm_anchor="    // DIAG: trap steam.exe's ERR_error_string_n"
              if arm_anchor not in s:
                  raise SystemExit("ERROR: FIX11.12 run insertion anchor missing")
              s=s.replace(arm_anchor,"    postal_arm_assert_1112(engine);\n\n"+arm_anchor,1)
              halt_anchor="                uint64_t halt_rip = wg_blink_get_rip(engine->blink);"
              if halt_anchor not in s:
                  raise SystemExit("ERROR: FIX11.12 halt anchor missing")
              s=s.replace(halt_anchor,halt_anchor+"\n                if (postal_handle_assert_1112(engine, halt_rip)) break;",1)
              p.write_text(s)

          print("POSTAL FIX 11.12 direct recovery installed")

          PY

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          grep -n "POSTAL FIX11.12 ASSERT ARMED" "$ENGINE"
          grep -n "POSTAL FIX11.12 TARGET ASSERTION" "$ENGINE"
          grep -n "POSTAL FIX11.12 MISSING REGISTRANT" "$ENGINE"
          grep -n "POSTAL FIX11.12 APPENDED" "$ENGINE"
          grep -n "POSTAL FIX11.12 ASSERTION BYPASSED" "$ENGINE"
          grep -n "POSTAL FIX11.12 RECOVERY COMPLETE" "$ENGINE"
          echo "POSTAL FIX 11.12 RECOVERY PATCH OK"

      - name: Verify all POSTAL FIX 11.12 markers
        shell: bash
        run: |
          set -euxo pipefail

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          FILES="WineGlass/Sources/Win32/wg_win32_files.c"

          grep -q "POSTAL REAL DLL READY" "$ENGINE"
          grep -q "POSTAL PRELOAD BEGIN" "$ENGINE"
          grep -q "POSTAL REAL EXE IMPORT" "$ENGINE"
          grep -q "POSTAL FIX11.2 GetEnvironmentStringsW" "$ENGINE"
          grep -q "POSTAL FIX11.2 GetProcessWindowStation" "$ENGINE"
          grep -q "POSTAL FIX11.2 DllMain FAILED" "$ENGINE"
          grep -q "POSTAL FIX11.3 DisableThreadLibraryCalls" "$ENGINE"
          grep -q "POSTAL FIX11.4 CreateFileA" "$ENGINE"
          grep -q "POSTAL FIX11.4 VirtualAlloc" "$ENGINE"
          grep -q "POSTAL FIX11.4 VirtualFree" "$ENGINE"
          grep -q "POSTAL FIX11.5 timeBeginPeriod" "$ENGINE"
          grep -q "POSTAL FIX11.5 timeEndPeriod" "$ENGINE"
          grep -q 'strcmp(fn, "timeGetTime")' "$ENGINE"
          grep -q "POSTAL FIX11.7 GetModuleFileNameA" "$ENGINE"
          grep -q "POSTAL FIX11.7 GetModuleFileNameW" "$ENGINE"
          grep -q "POSTAL FIX11.8.1 %s request" "$ENGINE"
          grep -q "POSTAL FIX11.8.1 %s STRICT FAIL" "$ENGINE"
          grep -q "POSTAL FIX11.12 ASSERT ARMED" "$ENGINE"
          grep -q "POSTAL FIX11.12 TARGET ASSERTION" "$ENGINE"
          grep -q "POSTAL FIX11.12 MISSING REGISTRANT" "$ENGINE"
          grep -q "POSTAL FIX11.12 APPENDED" "$ENGINE"
          grep -q "POSTAL FIX11.12 ASSERTION BYPASSED" "$ENGINE"
          grep -q "POSTAL FIX11.12 RECOVERY COMPLETE" "$ENGINE"
          grep -q "POSTAL DLL INITIALIZATION COMPLETE" "$ENGINE"

          grep -q "POSTAL FIX11.6.2 System root" "$FILES"
          grep -q "POSTAL FIX11.6.2 exe win path" "$FILES"
          grep -q "POSTAL FIX11.6.2 redirect cwd" "$FILES"
          grep -q "POSTAL FIX11.6.2 map" "$FILES"

          echo "ALL POSTAL FIX 11.12 MARKERS VERIFIED"

      - name: Apply WineGlass project patch from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/project.py

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="WineGlass/Sources/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleName POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.11.12" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1112" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"

          plutil -lint "$PLIST"

      - name: Apply POSTAL launcher and log from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/launcher.py

      - name: Stamp POSTAL FIX 11.12 launcher
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/App/WGSceneDelegate.m"
          )

          s = p.read_text()

          replacements = {
              "FIX 11.2 CLEAN": "FIX 11.12 CLEAN",
              "FIX11.2 CLEAN": "FIX11.12 CLEAN",
              "FIX 11.8.1 CLEAN": "FIX 11.12 CLEAN",
              "FIX11.8.1 CLEAN": "FIX11.12 CLEAN",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass
          rm -rf WineGlass.xcodeproj
          xcodegen generate

          test -f WineGlass.xcodeproj/project.pbxproj
          grep -m1 "objectVersion" WineGlass.xcodeproj/project.pbxproj || true

          if grep -q "objectVersion = 77" WineGlass.xcodeproj/project.pbxproj; then
            echo "ERROR: unsupported objectVersion 77"
            exit 1
          fi

      - name: Build POSTAL 2 FIX 11.12 CLEAN
        shell: bash
        run: |
          set -o pipefail

          cd WineGlass
          rm -rf build

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 | tee xcodebuild.log

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail

          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          test -d "$APP"
          test -f "$APP/WineGlass"

          lipo -info "$APP/WineGlass"

          ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "$ID"
          test "$ID" = "com.postal2ios.native"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          OUT="$ROOT/out"

          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          mkdir -p "$APP/VC120"

          cp \
            "$ROOT/vc120-runtime/msvcr120.dll" \
            "$APP/VC120/msvcr120.dll"

          cp \
            "$ROOT/vc120-runtime/msvcp120.dll" \
            "$APP/VC120/msvcp120.dll"

          test -s "$APP/VC120/msvcr120.dll"
          test -s "$APP/VC120/msvcp120.dll"

          cp -R \
            "$APP" \
            "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"

          zip \
            -qry \
            "POSTAL-2-iOS-v11.12-CLEAN.ipa" \
            Payload

          ls -lh \
            "POSTAL-2-iOS-v11.12-CLEAN.ipa"

      - name: Upload POSTAL 2 FIX 11.12 CLEAN IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v11.12-CLEAN
          path: out/POSTAL-2-iOS-v11.12-CLEAN.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p debug-fix11-12-clean

          cp WineGlass/xcodebuild.log debug-fix11-12-clean/ 2>/dev/null || true
          cp blink-src/config.h debug-fix11-12-clean/blink-config.h 2>/dev/null || true
          cp WineGlass/Vendor/blink/wg_blink_impl.c debug-fix11-12-clean/ 2>/dev/null || true
          cp WineGlass/Sources/Core/wg_engine.c debug-fix11-12-clean/ 2>/dev/null || true
          cp WineGlass/Sources/Win32/wg_win32_files.c debug-fix11-12-clean/ 2>/dev/null || true
          cp WineGlass/Sources/App/WGSceneDelegate.m debug-fix11-12-clean/ 2>/dev/null || true
          cp WineGlass/project.yml debug-fix11-12-clean/ 2>/dev/null || true
          cp vc120-runtime/msvcr120.dll debug-fix11-12-clean/ 2>/dev/null || true
          cp vc120-runtime/msvcp120.dll debug-fix11-12-clean/ 2>/dev/null || true
          cp .postal-base-patches/cumulative-fix11.8.1.py debug-fix11-12-clean/ 2>/dev/null || true

      - name: Upload FIX 11.12 CLEAN debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX11.12-CLEAN-DEBUG
          path: debug-fix11-12-clean
          if-no-files-found: ignore
          retention-days: 7
