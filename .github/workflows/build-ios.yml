name: Build POSTAL 2 Full Data iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -e
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Create project
        run: |
          set -e

          rm -rf Postal2Native
          mkdir -p Postal2Native/Sources

          cat > project.yml <<'EOF'
          name: Postal2Native

          targets:
            Postal2Native:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - path: Postal2Native/Sources

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native
                  PRODUCT_NAME: Postal2Native

                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "POSTAL 2 iOS"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES

                  TARGETED_DEVICE_FAMILY: "1"

                  ARCHS: arm64
                  ONLY_ACTIVE_ARCH: NO

                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

          cat > Postal2Native/Sources/Postal2NativeApp.swift <<'EOF'
          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers

          @main
          struct Postal2NativeApp: App {
              var body: some Scene {
                  WindowGroup {
                      GameDataView()
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct GameIndex {
              var maps: [URL] = []
              var textures: [URL] = []
              var meshes: [URL] = []
              var animations: [URL] = []
              var scripts: [URL] = []
              var sounds: [URL] = []
              var music: [URL] = []

              var total: Int {
                  maps.count +
                  textures.count +
                  meshes.count +
                  animations.count +
                  scripts.count +
                  sounds.count +
                  music.count
              }
          }

          struct GameDataView: View {

              @State private var showFolderPicker = false

              @State private var status =
                  "Import the full POSTAL 2 folder"

              @State private var index =
                  GameIndex()

              @State private var importing = false

              @State private var gameReady = false

              var body: some View {

                  ZStack {

                      Color.black
                          .ignoresSafeArea()

                      ScrollView {

                          VStack(
                              alignment: .leading,
                              spacing: 18
                          ) {

                              HStack {

                                  VStack(
                                      alignment: .leading
                                  ) {

                                      Text("POSTAL 2 iOS")
                                          .font(
                                              .largeTitle.bold()
                                          )

                                      Text(
                                          "Native ARM64 runtime"
                                      )
                                      .foregroundStyle(
                                          .secondary
                                      )
                                  }

                                  Spacer()
                              }

                              Button {

                                  showFolderPicker =
                                      true

                              } label: {

                                  HStack {

                                      if importing {

                                          ProgressView()
                                              .tint(
                                                  .white
                                              )
                                      }

                                      Text(
                                          importing
                                              ? "Importing..."
                                              : "Import POSTAL 2 Folder"
                                      )
                                      .bold()
                                  }
                                  .frame(
                                      maxWidth: .infinity
                                  )
                                  .padding(
                                      .vertical,
                                      16
                                  )
                                  .background(
                                      Color.white
                                          .opacity(
                                              0.16
                                          )
                                  )
                                  .clipShape(
                                      RoundedRectangle(
                                          cornerRadius: 14
                                      )
                                  )
                              }
                              .disabled(importing)

                              VStack(
                                  alignment: .leading,
                                  spacing: 10
                              ) {

                                  Text("GAME DATA")
                                      .font(
                                          .headline
                                      )

                                  dataLine(
                                      "Maps",
                                      index.maps.count,
                                      ".fuk"
                                  )

                                  dataLine(
                                      "StaticMeshes",
                                      index.meshes.count,
                                      ".usx"
                                  )

                                  dataLine(
                                      "Textures",
                                      index.textures.count,
                                      ".utx"
                                  )

                                  dataLine(
                                      "Animations",
                                      index.animations.count,
                                      ".ukx"
                                  )

                                  dataLine(
                                      "Scripts",
                                      index.scripts.count,
                                      ".u"
                                  )

                                  dataLine(
                                      "Sounds",
                                      index.sounds.count,
                                      ".uax / wav"
                                  )

                                  dataLine(
                                      "Music",
                                      index.music.count,
                                      "audio"
                                  )

                                  Divider()

                                  HStack {

                                      Text(
                                          "TOTAL FILES"
                                      )
                                      .bold()

                                      Spacer()

                                      Text(
                                          "\(index.total)"
                                      )
                                      .bold()
                                  }

                              }
                              .padding()
                              .background(
                                  Color.white
                                      .opacity(
                                          0.07
                                      )
                              )
                              .clipShape(
                                  RoundedRectangle(
                                      cornerRadius: 14
                                  )
                              )

                              Text(status)
                                  .font(.caption)
                                  .foregroundStyle(
                                      gameReady
                                          ? Color.green
                                          : Color.secondary
                                  )

                              if !index.maps.isEmpty {

                                  VStack(
                                      alignment: .leading,
                                      spacing: 8
                                  ) {

                                      Text(
                                          "MAPS FOUND"
                                      )
                                      .font(
                                          .headline
                                      )

                                      ForEach(
                                          Array(
                                              index.maps
                                                  .prefix(
                                                      50
                                                  )
                                          ),
                                          id: \.path
                                      ) {
                                          url in

                                          Text(
                                              "✓ \(url.lastPathComponent)"
                                          )
                                          .font(
                                              .caption
                                          )
                                      }

                                      if index.maps.count > 50 {

                                          Text(
                                              "+ \(index.maps.count - 50) more maps"
                                          )
                                          .font(
                                              .caption
                                          )
                                          .foregroundStyle(
                                              .secondary
                                          )
                                      }
                                  }
                                  .padding()
                                  .frame(
                                      maxWidth:
                                          .infinity,
                                      alignment:
                                          .leading
                                  )
                                  .background(
                                      Color.white
                                          .opacity(
                                              0.07
                                          )
                                  )
                                  .clipShape(
                                      RoundedRectangle(
                                          cornerRadius:
                                              14
                                      )
                                  )
                              }

                              if gameReady {

                                  Button {

                                      status =
                                          "Game data ready. Next build: full map runtime."

                                  } label: {

                                      Text(
                                          "POSTAL 2 DATA READY ✓"
                                      )
                                      .bold()
                                      .frame(
                                          maxWidth:
                                              .infinity
                                      )
                                      .padding(
                                          .vertical,
                                          16
                                      )
                                      .background(
                                          Color.green
                                              .opacity(
                                                  0.25
                                              )
                                      )
                                      .clipShape(
                                          RoundedRectangle(
                                              cornerRadius:
                                                  14
                                          )
                                      )
                                  }
                              }
                          }
                          .padding()
                      }
                  }
                  .onAppear {
                      scanInstalledData()
                  }
                  .sheet(
                      isPresented:
                          $showFolderPicker
                  ) {

                      FolderPicker {
                          url in

                          showFolderPicker =
                              false

                          guard let url else {
                              return
                          }

                          importFolder(
                              url
                          )
                      }
                  }
              }

              @ViewBuilder
              private func dataLine(
                  _ name: String,
                  _ count: Int,
                  _ type: String
              ) -> some View {

                  HStack {

                      Text(
                          count > 0
                              ? "✓"
                              : "•"
                      )
                      .foregroundStyle(
                          count > 0
                              ? Color.green
                              : Color.secondary
                      )

                      Text(name)

                      Spacer()

                      Text(
                          "\(count)"
                      )
                      .monospacedDigit()

                      Text(type)
                          .foregroundStyle(
                              .secondary
                          )
                  }
                  .font(.caption)
              }

              private func storageDirectory()
                  throws -> URL {

                  let documents =
                      FileManager.default.urls(
                          for:
                              .documentDirectory,
                          in:
                              .userDomainMask
                      )[0]

                  let folder =
                      documents
                          .appendingPathComponent(
                              "Postal2FullData",
                              isDirectory: true
                          )

                  try FileManager.default
                      .createDirectory(
                          at: folder,
                          withIntermediateDirectories:
                              true
                      )

                  return folder
              }

              private func importFolder(
                  _ source: URL
              ) {

                  importing = true

                  status =
                      "Copying POSTAL 2 game data..."

                  DispatchQueue
                      .global(
                          qos:
                              .userInitiated
                      )
                      .async {

                          do {

                              let access =
                                  source
                                      .startAccessingSecurityScopedResource()

                              defer {

                                  if access {

                                      source
                                          .stopAccessingSecurityScopedResource()
                                  }
                              }

                              let destination =
                                  try storageDirectory()

                              try copyGameFiles(
                                  from: source,
                                  to: destination
                              )

                              let result =
                                  try createIndex(
                                      root:
                                          destination
                                  )

                              DispatchQueue
                                  .main
                                  .async {

                                      index =
                                          result

                                      importing =
                                          false

                                      evaluateGameData()
                                  }

                          } catch {

                              DispatchQueue
                                  .main
                                  .async {

                                      importing =
                                          false

                                      gameReady =
                                          false

                                      status =
                                          "ERROR: \(error.localizedDescription)"
                                  }
                          }
                      }
              }

              private func copyGameFiles(
                  from source: URL,
                  to destination: URL
              ) throws {

                  let manager =
                      FileManager.default

                  guard
                      let enumerator =
                          manager.enumerator(
                              at: source,
                              includingPropertiesForKeys:
                                  [
                                      .isDirectoryKey
                                  ],
                              options:
                                  [
                                      .skipsHiddenFiles
                                  ]
                          )
                  else {

                      throw NSError(
                          domain:
                              "Postal2",
                          code: 1,
                          userInfo:
                              [
                                  NSLocalizedDescriptionKey:
                                      "Could not read selected folder"
                              ]
                      )
                  }

                  let allowedExtensions:
                      Set<String> = [
                          "fuk",
                          "usx",
                          "utx",
                          "ukx",
                          "u",
                          "uax",
                          "wav",
                          "ogg",
                          "mp3",
                          "ini",
                          "int",
                          "ka",
                          "est"
                      ]

                  for case let fileURL
                      as URL in enumerator {

                      let values =
                          try fileURL
                              .resourceValues(
                                  forKeys:
                                      [
                                          .isDirectoryKey
                                      ]
                              )

                      if values.isDirectory
                          == true {

                          continue
                      }

                      let ext =
                          fileURL
                              .pathExtension
                              .lowercased()

                      guard
                          allowedExtensions
                              .contains(ext)
                      else {

                          continue
                      }

                      let relative =
                          fileURL.path
                              .replacingOccurrences(
                                  of:
                                      source.path,
                                  with: ""
                              )

                      let cleanRelative =
                          relative
                              .trimmingCharacters(
                                  in:
                                      CharacterSet(
                                          charactersIn:
                                              "/"
                                      )
                              )

                      let target =
                          destination
                              .appendingPathComponent(
                                  cleanRelative
                              )

                      let targetFolder =
                          target
                              .deletingLastPathComponent()

                      try manager
                          .createDirectory(
                              at:
                                  targetFolder,
                              withIntermediateDirectories:
                                  true
                          )

                      if manager
                          .fileExists(
                              atPath:
                                  target.path
                          ) {

                          try manager
                              .removeItem(
                                  at:
                                      target
                              )
                      }

                      try manager
                          .copyItem(
                              at:
                                  fileURL,
                              to:
                                  target
                          )
                  }
              }

              private func scanInstalledData() {

                  do {

                      let root =
                          try storageDirectory()

                      index =
                          try createIndex(
                              root:
                                  root
                          )

                      evaluateGameData()

                  } catch {

                      status =
                          "No game data imported yet"
                  }
              }

              private func createIndex(
                  root: URL
              ) throws -> GameIndex {

                  var result =
                      GameIndex()

                  guard
                      let enumerator =
                          FileManager.default
                              .enumerator(
                                  at:
                                      root,
                                  includingPropertiesForKeys:
                                      nil,
                                  options:
                                      [
                                          .skipsHiddenFiles
                                      ]
                              )
                  else {

                      return result
                  }

                  for case let url
                      as URL in enumerator {

                      let ext =
                          url
                              .pathExtension
                              .lowercased()

                      switch ext {

                      case "fuk":

                          result.maps.append(
                              url
                          )

                      case "usx":

                          result.meshes.append(
                              url
                          )

                      case "utx":

                          result.textures.append(
                              url
                          )

                      case "ukx":

                          result.animations.append(
                              url
                          )

                      case "u":

                          result.scripts.append(
                              url
                          )

                      case "uax",
                           "wav":

                          result.sounds.append(
                              url
                          )

                      case "ogg",
                           "mp3":

                          result.music.append(
                              url
                          )

                      default:
                          break
                      }
                  }

                  result.maps.sort {
                      $0.lastPathComponent
                          .lowercased()
                      <
                      $1.lastPathComponent
                          .lowercased()
                  }

                  result.meshes.sort {
                      $0.lastPathComponent
                          .lowercased()
                      <
                      $1.lastPathComponent
                          .lowercased()
                  }

                  result.textures.sort {
                      $0.lastPathComponent
                          .lowercased()
                      <
                      $1.lastPathComponent
                          .lowercased()
                  }

                  return result
              }

              private func evaluateGameData() {

                  let enoughData =
                      !index.maps.isEmpty
                      &&
                      !index.meshes.isEmpty
                      &&
                      !index.textures.isEmpty
                      &&
                      !index.scripts.isEmpty

                  gameReady =
                      enoughData

                  if enoughData {

                      status =
                          "POSTAL 2 data indexed successfully • \(index.maps.count) maps • \(index.total) game files"

                  } else if index.total > 0 {

                      status =
                          "Partial game data found. Select the main POSTAL 2 folder."

                  } else {

                      status =
                          "Import the full POSTAL 2 folder"
                  }
              }
          }

          struct FolderPicker:
              UIViewControllerRepresentable {

              let completion:
                  (URL?) -> Void

              func makeCoordinator()
                  -> Coordinator {

                  Coordinator(
                      completion:
                          completion
                  )
              }

              func makeUIViewController(
                  context: Context
              )
                  -> UIDocumentPickerViewController {

                  let picker =
                      UIDocumentPickerViewController(
                          forOpeningContentTypes:
                              [
                                  .folder
                              ],
                          asCopy:
                              false
                      )

                  picker.allowsMultipleSelection =
                      false

                  picker.delegate =
                      context.coordinator

                  return picker
              }

              func updateUIViewController(
                  _ uiViewController:
                      UIDocumentPickerViewController,
                  context:
                      Context
              ) {}

              final class Coordinator:
                  NSObject,
                  UIDocumentPickerDelegate {

                  let completion:
                      (URL?) -> Void

                  init(
                      completion:
                          @escaping
                          (URL?) -> Void
                  ) {

                      self.completion =
                          completion
                  }

                  func documentPicker(
                      _ controller:
                          UIDocumentPickerViewController,
                      didPickDocumentsAt
                          urls: [URL]
                  ) {

                      completion(
                          urls.first
                      )
                  }

                  func documentPickerWasCancelled(
                      _ controller:
                          UIDocumentPickerViewController
                  ) {

                      completion(nil)
                  }
              }
          }
          EOF

      - name: Generate Xcode project
        run: |
          set -e

          xcodegen generate

          echo "===== PROJECT ====="
          ls -la Postal2Native.xcodeproj

      - name: Build native ARM64 app
        run: |
          set +e

          rm -rf build

          xcodebuild \
            -project Postal2Native.xcodeproj \
            -scheme Postal2Native \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo ""
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"

            grep -n -E \
              "error:|fatal error:" \
              xcodebuild.log \
              | tail -100 \
              || true

            echo "======================================"

            exit "$STATUS"
          fi

      - name: Create IPA
        run: |
          set -euo pipefail

          APP_PATH="$(
            find build/Build/Products/Release-iphoneos \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          rm -rf Payload

          mkdir -p Payload

          cp -R \
            "$APP_PATH" \
            Payload/

          /usr/bin/zip \
            -qry \
            Postal2Native-FullData.ipa \
            Payload

          ls -lh \
            Postal2Native-FullData.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Postal2Native-FullData-IPA
          path: Postal2Native-FullData.ipa
          if-no-files-found: error
