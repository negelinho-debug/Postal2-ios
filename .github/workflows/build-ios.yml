name: Postal2Native

options:
  bundleIdPrefix: com.postal2ios
  deploymentTarget:
    iOS: "17.0"

targets:
  Postal2Native:
    type: application
    platform: iOS

    deploymentTarget: "17.0"

    sources:
      - Postal2Native/Sources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native
        PRODUCT_NAME: Postal2Native

        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "POSTAL 2 iOS"
        INFOPLIST_KEY_UIRequiresFullScreen: YES

        TARGETED_DEVICE_FAMILY: "1"

        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO

        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

    scheme:
      gatherCoverageData: false
