name: POSTAL 2 WineGlass iOS FIX 7.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 FIX 7.5
    runs-on: macos-14
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # XCODE 15.4
      # ==========================================================

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== AVAILABLE XCODE ====="
          ls -1 /Applications | grep Xcode || true

          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select \
              -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select \
              -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found"
            exit 1
          fi

          echo "===== SELECTED XCODE ====="
          xcodebuild -version

          echo "===== XCODE PATH ====="
          xcode-select -p

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          export PATH="$(brew --prefix)/bin:$PATH"

          echo "===== FLOCK ====="
          command -v flock
          flock --version || true

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================================
      # CLONE
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf WineGlass blink-src

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p \
            WineGlass/Vendor/blink/lib

          echo "===== WINEGLASS ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK ====="
          git -C blink-src rev-parse HEAD

      # ==========================================================
      # CONFIGURE BLINK FOR IPHONE ARM64
      # ==========================================================

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          chmod +x configure

          echo "========================================"
          echo "FLOCK"
          echo "========================================"

          command -v flock

          echo "========================================"
          echo "IOS SDK"
          echo "========================================"

          echo "$SDK"

          echo "========================================"
          echo "IOS CLANG"
          echo "========================================"

          echo "$CC"

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

          echo "========================================"
          echo "CONFIGURE FINISHED"
          echo "========================================"

      # ==========================================================
      # PATCH BLINK IOS CONFIG
      # ==========================================================

      - name: Patch Blink iOS config
        shell: bash
        run: |
          set -euxo pipefail

          cd blink-src

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("config.h")
          s = p.read_text(errors="ignore")

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
              "HAVE_SCHED_YIELD",
              "HAVE_SCHED_H",
          ]

          enable = [
              "HAVE_DEV_URANDOM",
              "HAVE_SYS_MOUNT_H",
          ]

          def disable_macro(text, name):
              pattern = (
                  rf'(?m)^\s*(?://\s*)?'
                  rf'#define\s+{re.escape(name)}\b.*$'
              )

              replacement = f"// #define {name}"

              text, count = re.subn(
                  pattern,
                  replacement,
                  text
              )

              if count == 0:
                  text += f"\n// #define {name}\n"

              return text

          def enable_macro(text, name):
              pattern = (
                  rf'(?m)^\s*(?://\s*)?'
                  rf'#define\s+{re.escape(name)}\b.*$'
              )

              replacement = f"#define {name} 1"

              text, count = re.subn(
                  pattern,
                  replacement,
                  text
              )

              if count == 0:
                  text += f"\n#define {name} 1\n"

              return text

          for name in disable:
              s = disable_macro(s, name)

          for name in enable:
              s = enable_macro(s, name)

          s += "\n"
          s += "/* POSTAL 2 IOS FIX 7.5 */\n"

          p.write_text(s)

          print("config.h patched")
          PY

          echo "========================================"
          echo "IMPORTANT CONFIG VALUES"
          echo "========================================"

          grep -n \
            "HAVE_DEV_URANDOM\|HAVE_SYS_MOUNT_H\|HAVE_SCHED_YIELD\|HAVE_SCHED_H\|HAVE_GETENTROPY\|HAVE_GETRANDOM" \
            config.h \
            || true

      # ==========================================================
      # HARD PATCH sched_yield
      # ==========================================================

      - name: Patch Blink sched_yield for iOS
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/blink/syscall.c")
          s = p.read_text()

          pattern = r'''
          static\s+int\s+SysSchedYield
          \s*\(
          \s*struct\s+Machine\s*\*m
          \s*\)
          \s*\{
          .*?
          \n\}
          '''

          replacement = '''
          static int SysSchedYield(struct Machine *m) {
            (void)m;
            return 0;
          }
          '''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.S | re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch SysSchedYield"
              )

          s = s.replace(
              "        sched_yield();",
              "        /* sched_yield disabled on iOS */"
          )

          p.write_text(s)

          if "return sched_yield();" in s:
              raise SystemExit(
                  "ERROR: sched_yield return still present"
              )

          print("sched_yield removed for iOS")
          PY

          echo "========================================"
          echo "SCHED CHECK"
          echo "========================================"

          grep -n \
            "SysSchedYield\|sched_yield" \
            blink-src/blink/syscall.c \
            || true

      # ==========================================================
      # BUILD BLINK ARM64
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          rm -f o//blink/blink.a

          echo "========================================"
          echo "BUILD BLINK"
          echo "========================================"

          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a

          test -f o//blink/blink.a

          echo "========================================"
          echo "BLINK BUILT"
          echo "========================================"

          ls -lh o//blink/blink.a

          mkdir -p \
            "$WG/Vendor/blink/lib"

          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"

          test -f \
            "$WG/Vendor/blink/lib/blink.a"

      # ==========================================================
      # BLINK RUNTIME DIAGNOSTICS FIX 7.5
      # ==========================================================

      - name: Patch Blink FIX 7 diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "WineGlass/Vendor/blink/wg_blink_impl.c"
          )

          s = p.read_text()

          # ======================================================
          # 1. InitMap
          # ======================================================

          pattern = r'''
          (?P<indent>[ \t]*)
          InitMap\(\);
          \s*
          s_blink_initialized\s*=\s*1;
          '''

          replacement = r'''\g<indent>fprintf(stderr,
          \g<indent>        "[FIX7/BLINK] BEFORE InitMap\n");
          \g<indent>fflush(stderr);

          \g<indent>InitMap();

          \g<indent>fprintf(stderr,
          \g<indent>        "[FIX7/BLINK] AFTER InitMap\n");
          \g<indent>fflush(stderr);

          \g<indent>s_blink_initialized = 1;'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch InitMap"
              )

          # ======================================================
          # 2. create_vm_with_mode entry
          # ======================================================

          pattern = r'''
          static\s+struct\s+WGBlinkVM\s*\*
          create_vm_with_mode
          \(
              struct\s+XedMachineMode\s+mode
          \)
          \s*\{
          \s*
          ensure_initialized\(\);
          '''

          replacement = r'''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {

              fprintf(stderr,
                      "[FIX7/BLINK] create_vm ENTER mode=%d\n",
                      mode.omode);

              fflush(stderr);

              ensure_initialized();

              fprintf(stderr,
                      "[FIX7/BLINK] ensure_initialized OK\n");

              fflush(stderr);'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch create_vm entry"
              )

          # ======================================================
          # 3. VM calloc
          # ======================================================

          pattern = r'''
          struct\s+WGBlinkVM\s*\*vm
          \s*=\s*
          calloc
          \(
              1,
              \s*
              sizeof
              \(
                  struct\s+WGBlinkVM
              \)
          \);
          \s*
          if\s*
          \(
              !vm
          \)
          \s*
          return\s+NULL;
          '''

          replacement = r'''fprintf(stderr,
                      "[FIX7/BLINK] BEFORE VM calloc\n");
              fflush(stderr);

              struct WGBlinkVM *vm =
                  calloc(1, sizeof(struct WGBlinkVM));

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER VM calloc ptr=%p\n",
                      (void *)vm);

              fflush(stderr);

              if (!vm)
                  return NULL;'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch VM calloc"
              )

          # ======================================================
          # 4. NewSystem
          # ======================================================

          pattern = r'''
          vm->s
          \s*=\s*
          NewSystem\(mode\);
          \s*
          if\s*\(!vm->s\)
          \s*
          \{
              \s*
              free\(vm\);
              \s*
              return\s+NULL;
              \s*
          \}
          '''

          replacement = r'''fprintf(stderr,
                      "[FIX7/BLINK] BEFORE NewSystem\n");
              fflush(stderr);

              vm->s = NewSystem(mode);

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER NewSystem ptr=%p\n",
                      (void *)vm->s);

              fflush(stderr);

              if (!vm->s) {
                  fprintf(stderr,
                          "[FIX7/BLINK] NewSystem NULL\n");

                  fflush(stderr);

                  free(vm);
                  return NULL;
              }'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch NewSystem"
              )

          # ======================================================
          # 5. Mmap
          # ======================================================

          pattern = r'''
          vm->s->real
          \s*=\s*
          Mmap
          \(
              NULL,
              \s*
              real_size,
              \s*
              PROT_READ\s*\|\s*PROT_WRITE,
              \s*
              MAP_PRIVATE\s*\|\s*MAP_ANONYMOUS_,
              \s*
              -1,
              \s*
              0,
              \s*
              "real"
          \);
          \s*
          if\s*\(!vm->s->real\)
          \s*
          \{
              \s*
              FreeSystem\(vm->s\);
              \s*
              free\(vm\);
              \s*
              return\s+NULL;
              \s*
          \}
          '''

          replacement = r'''fprintf(stderr,
                          "[FIX7/BLINK] BEFORE real Mmap size=%ld\n",
                          real_size);

                  fflush(stderr);

                  vm->s->real =
                      Mmap(
                          NULL,
                          real_size,
                          PROT_READ | PROT_WRITE,
                          MAP_PRIVATE | MAP_ANONYMOUS_,
                          -1,
                          0,
                          "real"
                      );

                  fprintf(stderr,
                          "[FIX7/BLINK] AFTER real Mmap ptr=%p\n",
                          (void *)vm->s->real);

                  fflush(stderr);

                  if (!vm->s->real) {

                      fprintf(stderr,
                              "[FIX7/BLINK] real Mmap FAILED\n");

                      fflush(stderr);

                      FreeSystem(vm->s);
                      free(vm);

                      return NULL;
                  }'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch Mmap"
              )

          # ======================================================
          # 6. NewMachine
          # ======================================================

          pattern = r'''
          vm->m
          \s*=\s*
          NewMachine
          \(
              vm->s,
              \s*
              NULL
          \);
          \s*
          if\s*\(!vm->m\)
          \s*
          \{
              \s*
              FreeSystem\(vm->s\);
              \s*
              free\(vm\);
              \s*
              return\s+NULL;
              \s*
          \}
          '''

          replacement = r'''fprintf(stderr,
                      "[FIX7/BLINK] BEFORE NewMachine\n");

              fflush(stderr);

              vm->m =
                  NewMachine(vm->s, NULL);

              fprintf(stderr,
                      "[FIX7/BLINK] AFTER NewMachine ptr=%p\n",
                      (void *)vm->m);

              fflush(stderr);

              if (!vm->m) {

                  fprintf(stderr,
                          "[FIX7/BLINK] NewMachine NULL\n");

                  fflush(stderr);

                  FreeSystem(vm->s);
                  free(vm);

                  return NULL;
              }'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch NewMachine"
              )

          # ======================================================
          # 7. AllocatePageTable
          # ======================================================

          pattern = r'''
          vm->s->cr3
          \s*=\s*
          AllocatePageTable
          \(
              vm->s
          \);
          '''

          replacement = r'''fprintf(stderr,
                          "[FIX7/BLINK] BEFORE AllocatePageTable\n");

                  fflush(stderr);

                  vm->s->cr3 =
                      AllocatePageTable(vm->s);

                  fprintf(stderr,
                          "[FIX7/BLINK] AFTER AllocatePageTable cr3=%llu\n",
                          (unsigned long long)vm->s->cr3);

                  fflush(stderr);'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch AllocatePageTable"
              )

          # ======================================================
          # 8. SUCCESS
          # ======================================================

          pattern = r'''
          vm->m->flags
          \s*\|=\s*
          \(1\s*<<\s*9\);
          \s*
          //\s*IF
          \s*
          return\s+vm;
          '''

          replacement = r'''vm->m->flags |= (1 << 9); // IF

              fprintf(stderr,
                      "[FIX7/BLINK] VM CREATE SUCCESS\n");

              fflush(stderr);

              return vm;'''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: couldn't patch VM success"
              )

          p.write_text(s)

          print("========================================")
          print("BLINK FIX 7.5 DIAGNOSTICS PATCHED")
          print("========================================")
          PY

          echo "===== CHECK DIAGNOSTICS ====="

          grep -n \
            "FIX7/BLINK" \
            WineGlass/Vendor/blink/wg_blink_impl.c

      # ==========================================================
      # BUILD WINEGLASS BLINK BRIDGE
      # ==========================================================

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          echo "===== BRIDGE ====="

          lipo -info \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            || true

      # ==========================================================
      # FALLBACK A0 / A1 / A2 / A3
      # ==========================================================

      - name: Add x86 A0 A1 A2 A3 fallback opcodes
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/CPU/wg_x86_decode.c"
          )

          s = p.read_text()

          marker = \
              "    // TEST AL/rAX, imm (A8, A9)"

          if marker not in s:
              raise SystemExit(
                  "ERROR: A8/A9 marker not found"
              )

          patch = r'''
              // =====================================================
              // POSTAL 2 FIX 7.5
              //
              // A0 = MOV AL, moffs8
              // A1 = MOV EAX, moffs32
              // A2 = MOV moffs8, AL
              // A3 = MOV moffs32, EAX
              // =====================================================

              case 0xA0: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 1
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 1
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA1: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 4
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 4
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA2: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 1
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 1
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA3: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 4
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 4
                  };

                  out->num_operands = 2;
                  break;
              }

          '''

          s = s.replace(
              marker,
              patch + marker,
              1
          )

          p.write_text(s)

          print("A0 A1 A2 A3 added")
          PY

          grep -n \
            "case 0xA1" \
            WineGlass/Sources/CPU/wg_x86_decode.c

      # ==========================================================
      # PROJECT
      # ==========================================================

      - name: Patch WineGlass project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass

          python3 <<'PY'
          from pathlib import Path

          p = Path("project.yml")

          s = p.read_text()

          s = s.replace(
              "bundleIdPrefix: com.wineglass",
              "bundleIdPrefix: com.postal2ios"
          )

          s = s.replace(
              '  xcodeVersion: "15.0"',
              '  xcodeVersion: "15.4"\n'
              '  projectFormat: xcode15_3'
          )

          s = s.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",
              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )

          s = s.replace(
              'TARGETED_DEVICE_FAMILY: "1,2"',
              'TARGETED_DEVICE_FAMILY: "1"'
          )

          lines = []

          for line in s.splitlines():

              if "CODE_SIGN_ENTITLEMENTS:" in line:
                  continue

              if "DEVELOPMENT_TEAM:" in line:
                  continue

              if "CODE_SIGN_STYLE: Automatic" in line:
                  line = line.replace(
                      "CODE_SIGN_STYLE: Automatic",
                      "CODE_SIGN_STYLE: Manual"
                  )

              lines.append(line)

          p.write_text(
              "\n".join(lines) + "\n"
          )

          print("project.yml patched")
          PY

          cat project.yml

      # ==========================================================
      # INFO PLIST
      # ==========================================================

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail

          PLIST="WineGlass/Sources/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleDisplayName" \
            "$PLIST" \
            || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 0.7.5" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion 75" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$PLIST"

          plutil -lint "$PLIST"

      # ==========================================================
      # POSTAL 2 AUTO LAUNCH + LOG
      # ==========================================================

      - name: Patch POSTAL 2 launcher and log
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/App/WGSceneDelegate.m"
          )

          s = p.read_text()

          if "#include <stdio.h>" not in s:
              s = s.replace(
                  "#include <unistd.h>",
                  "#include <unistd.h>\n"
                  "#include <stdio.h>"
              )

          old = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              wg_log_init();'''

          new = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;

              NSString *logPath =
                  [docs stringByAppendingPathComponent:
                      @"POSTAL2-WineGlass.log"];

              [[NSFileManager defaultManager]
                  removeItemAtPath:logPath
                  error:nil];

              freopen(
                  logPath.fileSystemRepresentation,
                  "a",
                  stderr
              );

              setvbuf(
                  stderr,
                  NULL,
                  _IONBF,
                  0
              );

              fprintf(
                  stderr,
                  "========================================\\n"
                  "POSTAL 2 WineGlass FIX 7.5\\n"
                  "========================================\\n"
              );

              fflush(stderr);

              wg_log_init();'''

          if old not in s:
              raise SystemExit(
                  "ERROR: startup block changed"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old = \
              '[_loadButton setTitle:@"  Load .exe  " forState:UIControlStateNormal];'

          new = \
              '[_loadButton setTitle:@"  RUN POSTAL 2  " forState:UIControlStateNormal];'

          if old not in s:
              raise SystemExit(
                  "ERROR: button title changed"
              )

          s = s.replace(
              old,
              new,
              1
          )

          old = \
              '[_loadButton addTarget:self action:@selector(openFilePicker) forControlEvents:UIControlEventTouchUpInside];'

          new = \
              '[_loadButton addTarget:self action:@selector(runPostal2) forControlEvents:UIControlEventTouchUpInside];'

          if old not in s:
              raise SystemExit(
                  "ERROR: button action changed"
              )

          s = s.replace(
              old,
              new,
              1
          )

          marker = \
              "#pragma mark - UIDocumentPickerDelegate"

          if marker not in s:
              raise SystemExit(
                  "ERROR: picker marker missing"
              )

          postal = r'''
          // ============================================================
          // POSTAL 2 FIX 7.5
          // ============================================================

          - (NSString *)findPostal2Exe {

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;

              NSString *root =
                  [docs stringByAppendingPathComponent:
                      @"Postal2FullData"];

              NSFileManager *fm =
                  [NSFileManager defaultManager];

              NSString *normal =
                  [root stringByAppendingPathComponent:
                      @"System/Postal2.exe"];

              if ([fm fileExistsAtPath:normal]) {

                  WG_LOGI(
                      "POSTAL2",
                      "Found: %s",
                      normal.UTF8String
                  );

                  return normal;
              }

              NSDirectoryEnumerator *enumerator =
                  [fm enumeratorAtPath:root];

              for (NSString *relative in enumerator) {

                  if ([[relative lastPathComponent]
                          caseInsensitiveCompare:
                              @"Postal2.exe"]
                      == NSOrderedSame) {

                      NSString *found =
                          [root
                              stringByAppendingPathComponent:
                                  relative];

                      WG_LOGI(
                          "POSTAL2",
                          "Found recursively: %s",
                          found.UTF8String
                      );

                      return found;
                  }
              }

              WG_LOGE(
                  "POSTAL2",
                  "Postal2.exe NOT FOUND"
              );

              return nil;
          }

          - (void)runPostal2 {

              if (!_engine) {

                  WG_LOGE(
                      "POSTAL2",
                      "Engine not ready"
                  );

                  return;
              }

              NSString *exe =
                  [self findPostal2Exe];

              if (!exe) {

                  [_loadButton
                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "
                      forState:
                          UIControlStateNormal];

                  return;
              }

              NSString *systemDir =
                  [exe stringByDeletingLastPathComponent];

              int result =
                  chdir(
                      systemDir.fileSystemRepresentation
                  );

              WG_LOGI(
                  "POSTAL2",
                  "System dir = %s",
                  systemDir.UTF8String
              );

              WG_LOGI(
                  "POSTAL2",
                  "chdir result = %d",
                  result
              );

              [_loadButton
                  setTitle:
                      @"  STARTING POSTAL 2...  "
                  forState:
                      UIControlStateNormal];

              WG_LOGI(
                  "POSTAL2",
                  "Launching original Postal2.exe"
              );

              [self loadAndRunPE:exe];
          }

          '''

          s = s.replace(
              marker,
              postal + "\n" + marker,
              1
          )

          old = \
              "            [self tryLoadBundledPE];"

          new = \
              "            [self runPostal2];"

          if old not in s:
              raise SystemExit(
                  "ERROR: auto-run location changed"
              )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "POSTAL 2 launcher patched"
          )
          PY

          echo "===== LAUNCHER CHECK ====="

          grep -n \
            "RUN POSTAL 2\|STARTING POSTAL 2\|findPostal2Exe\|POSTAL2-WineGlass" \
            WineGlass/Sources/App/WGSceneDelegate.m

      # ==========================================================
      # XCODEGEN
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass

          rm -rf \
            WineGlass.xcodeproj

          xcodegen generate

          test -f \
            WineGlass.xcodeproj/project.pbxproj

          echo "===== OBJECT VERSION ====="

          grep -m1 \
            "objectVersion" \
            WineGlass.xcodeproj/project.pbxproj \
            || true

          if grep -q \
            "objectVersion = 77" \
            WineGlass.xcodeproj/project.pbxproj; then

            echo "ERROR: objectVersion 77"
            exit 1
          fi

      # ==========================================================
      # BUILD IOS APP
      # ==========================================================

      - name: Build POSTAL 2 FIX 7.5
        shell: bash
        run: |
          set -o pipefail

          cd WineGlass

          rm -rf build

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 | tee xcodebuild.log

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail

          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          test -d "$APP"
          test -f "$APP/WineGlass"

          echo "===== APP ARCH ====="

          lipo -info \
            "$APP/WineGlass"

          echo "===== BUNDLE ID ====="

          ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "$ID"

          if [ "$ID" != "com.postal2ios.native" ]; then
            echo "ERROR: wrong bundle ID"
            exit 1
          fi

          echo "===== VERSION ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist"

          echo "===== BUILD ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist"

      # ==========================================================
      # IPA
      # ==========================================================

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"

          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          OUT="$ROOT/out"

          rm -rf "$OUT"

          mkdir -p \
            "$OUT/Payload"

          cp -R \
            "$APP" \
            "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"

          zip \
            -qry \
            "POSTAL-2-iOS-v7.5-BLINK-DIAG-FIX.ipa" \
            Payload

          ls -lh \
            "POSTAL-2-iOS-v7.5-BLINK-DIAG-FIX.ipa"

      # ==========================================================
      # UPLOAD IPA
      # ==========================================================

      - name: Upload POSTAL 2 FIX 7.5 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v7.5-BLINK-DIAG-FIX
          path: out/POSTAL-2-iOS-v7.5-BLINK-DIAG-FIX.ipa
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p \
            debug-fix7-5

          cp \
            WineGlass/xcodebuild.log \
            debug-fix7-5/ \
            2>/dev/null || true

          cp \
            blink-src/config.h \
            debug-fix7-5/blink-config.h \
            2>/dev/null || true

          cp \
            blink-src/config.mk \
            debug-fix7-5/blink-config.mk \
            2>/dev/null || true

          cp \
            blink-src/config.log \
            debug-fix7-5/blink-config.log \
            2>/dev/null || true

          cp \
            blink-src/blink/syscall.c \
            debug-fix7-5/blink-syscall.c \
            2>/dev/null || true

          cp \
            WineGlass/Vendor/blink/wg_blink_impl.c \
            debug-fix7-5/ \
            2>/dev/null || true

          cp \
            WineGlass/Sources/CPU/wg_x86_decode.c \
            debug-fix7-5/ \
            2>/dev/null || true

          cp \
            WineGlass/Sources/App/WGSceneDelegate.m \
            debug-fix7-5/ \
            2>/dev/null || true

          cp \
            WineGlass/project.yml \
            debug-fix7-5/ \
            2>/dev/null || true

      - name: Upload FIX 7.5 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX7.5-DEBUG
          path: debug-fix7-5
          if-no-files-found: ignore
          retention-days: 7
