name: Build POSTAL 2 Native iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -e
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Create project
        run: |
          set -e

          rm -rf Postal2Native
          mkdir -p Postal2Native/Sources

          cat > project.yml <<'EOF'
          name: Postal2Native

          options:
            bundleIdPrefix: com.postal2ios

          targets:
            Postal2Native:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - path: Postal2Native/Sources

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native
                  PRODUCT_NAME: Postal2Native

                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "POSTAL 2 iOS"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES

                  TARGETED_DEVICE_FAMILY: "1"

                  ARCHS: arm64
                  ONLY_ACTIVE_ARCH: NO

                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

          cat > Postal2Native/Sources/Postal2NativeApp.swift <<'EOF'
          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers
          import MetalKit
          import Combine
          import QuartzCore

          extension Notification.Name {
              static let postalFPS =
                  Notification.Name("postalFPS")
          }

          // ============================================================
          // MARK: - APP
          // ============================================================

          @main
          struct Postal2NativeApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }

          // ============================================================
          // MARK: - IMPORTED FILE
          // ============================================================

          struct ImportedFile: Identifiable {
              let id = UUID()
              let url: URL
              let name: String
              let size: Int64

              var sizeText: String {
                  ByteCountFormatter.string(
                      fromByteCount: size,
                      countStyle: .file
                  )
              }
          }

          // ============================================================
          // MARK: - UNREAL PACKAGE DATA
          // ============================================================

          struct UnrealHeader {
              let magic: UInt32

              let version: Int
              let licenseeVersion: Int

              let packageFlags: UInt32

              let nameCount: Int
              let nameOffset: Int

              let exportCount: Int
              let exportOffset: Int

              let importCount: Int
              let importOffset: Int
          }

          struct UnrealImportEntry {
              let classPackageIndex: Int
              let classNameIndex: Int
              let packageIndex: Int32
              let objectNameIndex: Int
          }

          struct UnrealExportEntry {
              let classIndex: Int
              let superIndex: Int

              let packageIndex: Int32

              let objectNameIndex: Int

              let objectFlags: UInt32

              let serialSize: Int
              let serialOffset: Int
          }

          struct PackageReport: Identifiable {
              let id = UUID()

              let filename: String

              let version: Int
              let licenseeVersion: Int

              let nameCount: Int
              let importCount: Int
              let exportCount: Int

              let staticMeshes: [String]
              let textures: [String]

              let classCounts: [(String, Int)]
          }

          // ============================================================
          // MARK: - ERRORS
          // ============================================================

          enum UnrealPackageError:
              LocalizedError {

              case invalid(String)

              var errorDescription: String? {
                  switch self {
                  case .invalid(let text):
                      return text
                  }
              }
          }

          // ============================================================
          // MARK: - BINARY READER
          // ============================================================

          struct BinaryReader {

              let data: Data
              var offset: Int = 0

              var remaining: Int {
                  data.count - offset
              }

              mutating func seek(
                  _ newOffset: Int
              ) throws {

                  guard
                      newOffset >= 0,
                      newOffset <= data.count
                  else {
                      throw UnrealPackageError.invalid(
                          "Invalid seek \(newOffset)"
                      )
                  }

                  offset = newOffset
              }

              private func byte(
                  _ position: Int
              ) throws -> UInt8 {

                  guard
                      position >= 0,
                      position < data.count
                  else {
                      throw UnrealPackageError.invalid(
                          "Read outside file"
                      )
                  }

                  return data[
                      data.startIndex + position
                  ]
              }

              mutating func readUInt8()
                  throws -> UInt8 {

                  let value = try byte(offset)

                  offset += 1

                  return value
              }

              mutating func readUInt16()
                  throws -> UInt16 {

                  let b0 =
                      UInt16(try byte(offset))

                  let b1 =
                      UInt16(try byte(offset + 1))

                  offset += 2

                  return b0 |
                      (b1 << 8)
              }

              mutating func readUInt32()
                  throws -> UInt32 {

                  let b0 =
                      UInt32(try byte(offset))

                  let b1 =
                      UInt32(try byte(offset + 1))

                  let b2 =
                      UInt32(try byte(offset + 2))

                  let b3 =
                      UInt32(try byte(offset + 3))

                  offset += 4

                  return b0 |
                      (b1 << 8) |
                      (b2 << 16) |
                      (b3 << 24)
              }

              mutating func readInt32()
                  throws -> Int32 {

                  Int32(
                      bitPattern:
                          try readUInt32()
                  )
              }

              // Unreal Engine 1 / 2 CompactIndex
              mutating func readCompactIndex()
                  throws -> Int {

                  let first =
                      try readUInt8()

                  let negative =
                      (first & 0x80) != 0

                  var value =
                      Int(first & 0x3F)

                  if (first & 0x40) != 0 {

                      var shift = 6
                      var count = 0

                      while true {

                          let next =
                              try readUInt8()

                          value |=
                              Int(next & 0x7F)
                              << shift

                          shift += 7
                          count += 1

                          if (next & 0x80) == 0 {
                              break
                          }

                          if count > 4 {
                              throw UnrealPackageError.invalid(
                                  "Bad CompactIndex"
                              )
                          }
                      }
                  }

                  return negative
                      ? -value
                      : value
              }

              mutating func readData(
                  count: Int
              ) throws -> Data {

                  guard
                      count >= 0,
                      offset + count <= data.count
                  else {
                      throw UnrealPackageError.invalid(
                          "Read outside file"
                      )
                  }

                  let result =
                      data.subdata(
                          in:
                              offset..<(offset + count)
                      )

                  offset += count

                  return result
              }
          }

          // ============================================================
          // MARK: - UNREAL PACKAGE PARSER
          // ============================================================

          final class UnrealPackageParser {

              static let unrealMagic:
                  UInt32 = 0x9E2A83C1

              let data: Data

              var header:
                  UnrealHeader!

              var names: [String] = []

              var imports:
                  [UnrealImportEntry] = []

              var exports:
                  [UnrealExportEntry] = []

              init(url: URL) throws {

                  data = try Data(
                      contentsOf: url,
                      options: .mappedIfSafe
                  )

                  try parse()
              }

              private func parse() throws {

                  var reader =
                      BinaryReader(
                          data: data
                      )

                  // --------------------------------------------------
                  // PACKAGE HEADER
                  // --------------------------------------------------

                  let magic =
                      try reader.readUInt32()

                  guard
                      magic ==
                          Self.unrealMagic
                  else {
                      throw UnrealPackageError.invalid(
                          "Not an Unreal package"
                      )
                  }

                  let version =
                      Int(
                          try reader.readUInt16()
                      )

                  let license =
                      Int(
                          try reader.readUInt16()
                      )

                  let flags =
                      try reader.readUInt32()

                  let nameCount =
                      Int(
                          try reader.readInt32()
                      )

                  let nameOffset =
                      Int(
                          try reader.readInt32()
                      )

                  let exportCount =
                      Int(
                          try reader.readInt32()
                      )

                  let exportOffset =
                      Int(
                          try reader.readInt32()
                      )

                  let importCount =
                      Int(
                          try reader.readInt32()
                      )

                  let importOffset =
                      Int(
                          try reader.readInt32()
                      )

                  guard
                      nameCount >= 0,
                      importCount >= 0,
                      exportCount >= 0
                  else {
                      throw UnrealPackageError.invalid(
                          "Invalid package counts"
                      )
                  }

                  header =
                      UnrealHeader(
                          magic: magic,
                          version: version,
                          licenseeVersion:
                              license,
                          packageFlags:
                              flags,
                          nameCount:
                              nameCount,
                          nameOffset:
                              nameOffset,
                          exportCount:
                              exportCount,
                          exportOffset:
                              exportOffset,
                          importCount:
                              importCount,
                          importOffset:
                              importOffset
                      )

                  // --------------------------------------------------
                  // NAME TABLE
                  // --------------------------------------------------

                  try reader.seek(
                      nameOffset
                  )

                  names.removeAll(
                      keepingCapacity: true
                  )

                  for _ in 0..<nameCount {

                      let length =
                          try reader
                              .readCompactIndex()

                      var name = ""

                      if length > 0 {

                          guard length < 65536
                          else {
                              throw UnrealPackageError.invalid(
                                  "Bad name length"
                              )
                          }

                          let bytes =
                              try reader.readData(
                                  count: length
                              )

                          name =
                              String(
                                  data: bytes,
                                  encoding:
                                      .isoLatin1
                              ) ?? ""

                      } else if length < 0 {

                          let characters =
                              -length

                          guard
                              characters < 65536
                          else {
                              throw UnrealPackageError.invalid(
                                  "Bad unicode name"
                              )
                          }

                          let bytes =
                              try reader.readData(
                                  count:
                                      characters * 2
                              )

                          name =
                              String(
                                  data: bytes,
                                  encoding:
                                      .utf16LittleEndian
                              ) ?? ""
                      }

                      name =
                          name.replacingOccurrences(
                              of: "\0",
                              with: ""
                          )

                      _ =
                          try reader.readUInt32()

                      names.append(name)
                  }

                  // --------------------------------------------------
                  // IMPORT TABLE
                  //
                  // FName ClassPackage
                  // FName ClassName
                  // INT   PackageIndex
                  // FName ObjectName
                  // --------------------------------------------------

                  try reader.seek(
                      importOffset
                  )

                  imports.removeAll(
                      keepingCapacity: true
                  )

                  for _ in 0..<importCount {

                      let classPackage =
                          try reader
                              .readCompactIndex()

                      let className =
                          try reader
                              .readCompactIndex()

                      let packageIndex =
                          try reader
                              .readInt32()

                      let objectName =
                          try reader
                              .readCompactIndex()

                      imports.append(
                          UnrealImportEntry(
                              classPackageIndex:
                                  classPackage,
                              classNameIndex:
                                  className,
                              packageIndex:
                                  packageIndex,
                              objectNameIndex:
                                  objectName
                          )
                      )
                  }

                  // --------------------------------------------------
                  // EXPORT TABLE - UE2
                  //
                  // INDEX Class
                  // INDEX Super
                  // INT   Outer
                  // INDEX Name
                  // DWORD ObjectFlags
                  // INDEX SerialSize
                  // INDEX SerialOffset
                  // --------------------------------------------------

                  try reader.seek(
                      exportOffset
                  )

                  exports.removeAll(
                      keepingCapacity: true
                  )

                  for _ in 0..<exportCount {

                      let classIndex =
                          try reader
                              .readCompactIndex()

                      let superIndex =
                          try reader
                              .readCompactIndex()

                      let packageIndex =
                          try reader
                              .readInt32()

                      let objectName =
                          try reader
                              .readCompactIndex()

                      let objectFlags =
                          try reader
                              .readUInt32()

                      let serialSize =
                          try reader
                              .readCompactIndex()

                      var serialOffset = 0

                      if serialSize != 0 {

                          serialOffset =
                              try reader
                                  .readCompactIndex()
                      }

                      exports.append(
                          UnrealExportEntry(
                              classIndex:
                                  classIndex,
                              superIndex:
                                  superIndex,
                              packageIndex:
                                  packageIndex,
                              objectNameIndex:
                                  objectName,
                              objectFlags:
                                  objectFlags,
                              serialSize:
                                  serialSize,
                              serialOffset:
                                  serialOffset
                          )
                      )
                  }
              }

              func name(
                  at index: Int
              ) -> String {

                  guard
                      index >= 0,
                      index < names.count
                  else {
                      return "Unknown"
                  }

                  return names[index]
              }

              func objectName(
                  reference: Int
              ) -> String {

                  if reference == 0 {
                      return "Class"
                  }

                  if reference < 0 {

                      let index =
                          -reference - 1

                      guard
                          index >= 0,
                          index < imports.count
                      else {
                          return "Unknown"
                      }

                      return name(
                          at:
                              imports[index]
                                  .objectNameIndex
                      )
                  }

                  let index =
                      reference - 1

                  guard
                      index >= 0,
                      index < exports.count
                  else {
                      return "Unknown"
                  }

                  return name(
                      at:
                          exports[index]
                              .objectNameIndex
                  )
              }

              func className(
                  for export:
                      UnrealExportEntry
              ) -> String {

                  objectName(
                      reference:
                          export.classIndex
                  )
              }

              func makeReport(
                  filename: String
              ) -> PackageReport {

                  var staticMeshes:
                      [String] = []

                  var textures:
                      [String] = []

                  var counts:
                      [String: Int] = [:]

                  let textureClasses:
                      Set<String> = [
                          "Texture",
                          "Cubemap",
                          "Shader",
                          "TexPanner",
                          "TexEnvMap",
                          "ConstantColor"
                      ]

                  for entry in exports {

                      let className =
                          className(
                              for: entry
                          )

                      let objectName =
                          name(
                              at:
                                  entry
                                      .objectNameIndex
                          )

                      counts[className,
                             default: 0] += 1

                      if className ==
                          "StaticMesh" {

                          staticMeshes.append(
                              objectName
                          )
                      }

                      if textureClasses
                          .contains(
                              className
                          ) {

                          textures.append(
                              objectName
                          )
                      }
                  }

                  let sortedCounts =
                      counts
                          .map {
                              ($0.key, $0.value)
                          }
                          .sorted {
                              if $0.1 ==
                                  $1.1 {
                                  return $0.0
                                      < $1.0
                              }

                              return $0.1
                                  > $1.1
                          }

                  return PackageReport(
                      filename:
                          filename,
                      version:
                          header.version,
                      licenseeVersion:
                          header
                              .licenseeVersion,
                      nameCount:
                          header.nameCount,
                      importCount:
                          header.importCount,
                      exportCount:
                          header.exportCount,
                      staticMeshes:
                          staticMeshes,
                      textures:
                          textures,
                      classCounts:
                          sortedCounts
                  )
              }
          }

          // ============================================================
          // MARK: - MAIN UI
          // ============================================================

          struct ContentView: View {

              @State private var
                  showImporter = false

              @State private var
                  files:
                      [ImportedFile] = []

              @State private var
                  reports:
                      [PackageReport] = []

              @State private var
                  analysisStatus =
                      "Import the 3 POSTAL 2 files"

              @State private var
                  isAnalyzing = false

              @State private var
                  fps: Double = 0

              var body: some View {

                  ZStack {

                      MetalView()
                          .ignoresSafeArea()

                      VStack(
                          spacing: 0
                      ) {

                          header

                          ScrollView {

                              VStack(
                                  spacing: 12
                              ) {

                                  fileCard

                                  if !reports
                                      .isEmpty {

                                      ForEach(
                                          reports
                                      ) {
                                          report in

                                          ReportView(
                                              report:
                                                  report
                                          )
                                      }
                                  }
                              }
                              .padding()
                          }
                      }
                  }
                  .onAppear {
                      loadFiles()
                  }
                  .onReceive(
                      NotificationCenter
                          .default
                          .publisher(
                              for:
                                  .postalFPS
                          )
                  ) {
                      note in

                      if let newFPS =
                          note.object
                              as? Double {

                          fps = newFPS
                      }
                  }
                  .sheet(
                      isPresented:
                          $showImporter
                  ) {

                      FileImporter {
                          urls in

                          importFiles(
                              urls
                          )

                          showImporter =
                              false
                      }
                  }
              }

              private var header:
                  some View {

                  VStack(spacing: 10) {

                      HStack {

                          VStack(
                              alignment:
                                  .leading
                          ) {

                              Text(
                                  "POSTAL 2 iOS"
                              )
                              .font(
                                  .title2.bold()
                              )

                              Text(
                                  "Native ARM64 • Metal"
                              )
                              .font(
                                  .caption
                              )

                              Text(
                                  String(
                                      format:
                                          "FPS %.0f",
                                      fps
                                  )
                              )
                              .font(
                                  .caption
                                      .monospacedDigit()
                              )
                          }

                          Spacer()

                          Button {
                              showImporter =
                                  true
                          } label: {

                              Text(
                                  "Import Files"
                              )
                              .bold()
                              .padding(
                                  .horizontal,
                                  15
                              )
                              .padding(
                                  .vertical,
                                  11
                              )
                              .background(
                                  Color.white
                                      .opacity(
                                          0.18
                                      )
                              )
                              .clipShape(
                                  RoundedRectangle(
                                      cornerRadius:
                                          12
                                  )
                              )
                          }
                      }

                      Button {

                          analyze()

                      } label: {

                          HStack {

                              if isAnalyzing {

                                  ProgressView()
                                      .tint(
                                          .white
                                      )
                              }

                              Text(
                                  isAnalyzing
                                      ? "Analyzing..."
                                      : "Analyze Bridge"
                              )
                              .bold()
                          }
                          .frame(
                              maxWidth:
                                  .infinity
                          )
                          .padding(
                              .vertical,
                              12
                          )
                          .background(
                              canAnalyze
                                  ? Color.white
                                      .opacity(
                                          0.20
                                      )
                                  : Color.white
                                      .opacity(
                                          0.08
                                      )
                          )
                          .clipShape(
                              RoundedRectangle(
                                  cornerRadius:
                                      12
                              )
                          )
                      }
                      .disabled(
                          !canAnalyze ||
                          isAnalyzing
                      )

                      Text(
                          analysisStatus
                      )
                      .font(
                          .caption
                      )
                      .frame(
                          maxWidth:
                              .infinity,
                          alignment:
                              .leading
                      )
                  }
                  .foregroundStyle(
                      .white
                  )
                  .padding()
                  .background(
                      Color.black
                          .opacity(
                              0.75
                          )
                  )
              }

              private var fileCard:
                  some View {

                  VStack(
                      alignment:
                          .leading,
                      spacing: 8
                  ) {

                      Text(
                          "POSTAL 2 DATA"
                      )
                      .font(
                          .headline
                      )

                      requiredFile(
                          "Bridge.fuk"
                      )

                      requiredFile(
                          "Zo_BridgeMeshes.usx"
                      )

                      requiredFile(
                          "Zo_BridgeTex.utx"
                      )
                  }
                  .frame(
                      maxWidth:
                          .infinity,
                      alignment:
                          .leading
                  )
                  .padding()
                  .background(
                      Color.black
                          .opacity(
                              0.72
                          )
                  )
                  .clipShape(
                      RoundedRectangle(
                          cornerRadius:
                              14
                      )
                  )
                  .foregroundStyle(
                      .white
                  )
              }

              @ViewBuilder
              private func requiredFile(
                  _ name: String
              ) -> some View {

                  let found =
                      files.first {
                          $0.name
                              .caseInsensitiveCompare(
                                  name
                              )
                              == .orderedSame
                      }

                  HStack {

                      Text(
                          found == nil
                              ? "✕"
                              : "✓"
                      )
                      .foregroundStyle(
                          found == nil
                              ? .red
                              : .green
                      )

                      Text(name)

                      Spacer()

                      if let found {

                          Text(
                              found.sizeText
                          )
                          .foregroundStyle(
                              .secondary
                          )
                      }
                  }
                  .font(
                      .caption
                  )
              }

              private var canAnalyze:
                  Bool {

                  hasFile(
                      "Bridge.fuk"
                  )
                  &&
                  hasFile(
                      "Zo_BridgeMeshes.usx"
                  )
                  &&
                  hasFile(
                      "Zo_BridgeTex.utx"
                  )
              }

              private func hasFile(
                  _ name: String
              ) -> Bool {

                  files.contains {
                      $0.name
                          .caseInsensitiveCompare(
                              name
                          )
                          == .orderedSame
                  }
              }

              private func postalDirectory()
                  throws -> URL {

                  let documents =
                      FileManager.default
                          .urls(
                              for:
                                  .documentDirectory,
                              in:
                                  .userDomainMask
                          )[0]

                  let folder =
                      documents
                          .appendingPathComponent(
                              "Postal2Data",
                              isDirectory:
                                  true
                          )

                  try FileManager
                      .default
                      .createDirectory(
                          at: folder,
                          withIntermediateDirectories:
                              true
                      )

                  return folder
              }

              private func loadFiles() {

                  do {

                      let directory =
                          try postalDirectory()

                      let urls =
                          try FileManager
                              .default
                              .contentsOfDirectory(
                                  at:
                                      directory,
                                  includingPropertiesForKeys:
                                      [
                                          .fileSizeKey
                                      ]
                              )

                      files =
                          urls.map {
                              url in

                              let values =
                                  try? url
                                      .resourceValues(
                                          forKeys:
                                              [
                                                  .fileSizeKey
                                              ]
                                      )

                              return ImportedFile(
                                  url: url,
                                  name:
                                      url
                                          .lastPathComponent,
                                  size:
                                      Int64(
                                          values?
                                              .fileSize
                                          ?? 0
                                      )
                              )
                          }
                          .sorted {
                              $0.name
                                  .lowercased()
                              <
                              $1.name
                                  .lowercased()
                          }

                  } catch {

                      analysisStatus =
                          "File load error: \(error.localizedDescription)"
                  }
              }

              private func importFiles(
                  _ urls: [URL]
              ) {

                  guard !urls.isEmpty
                  else {
                      return
                  }

                  do {

                      let directory =
                          try postalDirectory()

                      for source in urls {

                          let access =
                              source
                                  .startAccessingSecurityScopedResource()

                          defer {

                              if access {

                                  source
                                      .stopAccessingSecurityScopedResource()
                              }
                          }

                          let destination =
                              directory
                                  .appendingPathComponent(
                                      source
                                          .lastPathComponent
                                  )

                          if FileManager
                              .default
                              .fileExists(
                                  atPath:
                                      destination
                                          .path
                              ) {

                              try FileManager
                                  .default
                                  .removeItem(
                                      at:
                                          destination
                                  )
                          }

                          try FileManager
                              .default
                              .copyItem(
                                  at: source,
                                  to:
                                      destination
                              )
                      }

                      loadFiles()

                      reports.removeAll()

                      analysisStatus =
                          "Files ready — press Analyze Bridge"

                  } catch {

                      analysisStatus =
                          "Import error: \(error.localizedDescription)"
                  }
              }

              private func analyze() {

                  guard canAnalyze
                  else {
                      return
                  }

                  isAnalyzing = true

                  analysisStatus =
                      "Reading Unreal Engine packages..."

                  reports.removeAll()

                  let currentFiles =
                      files

                  DispatchQueue
                      .global(
                          qos:
                              .userInitiated
                      )
                      .async {

                          var newReports:
                              [PackageReport] = []

                          var failure:
                              String?

                          let wanted = [
                              "Bridge.fuk",
                              "Zo_BridgeMeshes.usx",
                              "Zo_BridgeTex.utx"
                          ]

                          for wantedName
                              in wanted {

                              guard
                                  let file =
                                      currentFiles
                                          .first(
                                              where: {
                                                  $0.name
                                                      .caseInsensitiveCompare(
                                                          wantedName
                                                      )
                                                      == .orderedSame
                                              }
                                          )
                              else {
                                  failure =
                                      "Missing \(wantedName)"
                                  break
                              }

                              do {

                                  let parser =
                                      try UnrealPackageParser(
                                          url:
                                              file.url
                                      )

                                  let report =
                                      parser.makeReport(
                                          filename:
                                              file.name
                                      )

                                  newReports.append(
                                      report
                                  )

                              } catch {

                                  failure =
                                      "\(wantedName): \(error.localizedDescription)"

                                  break
                              }
                          }

                          DispatchQueue
                              .main
                              .async {

                                  isAnalyzing =
                                      false

                                  if let failure {

                                      analysisStatus =
                                          "ERROR: \(failure)"

                                      reports =
                                          newReports

                                  } else {

                                      reports =
                                          newReports

                                      let meshCount =
                                          newReports
                                              .reduce(
                                                  0
                                              ) {
                                                  $0 +
                                                  $1
                                                      .staticMeshes
                                                      .count
                                              }

                                      let textureCount =
                                          newReports
                                              .reduce(
                                                  0
                                              ) {
                                                  $0 +
                                                  $1
                                                      .textures
                                                      .count
                                              }

                                      analysisStatus =
                                          "SUCCESS • \(meshCount) StaticMeshes • \(textureCount) texture/material objects"
                                  }
                              }
                      }
              }
          }

          // ============================================================
          // MARK: - PACKAGE REPORT VIEW
          // ============================================================

          struct ReportView: View {

              let report:
                  PackageReport

              var body: some View {

                  VStack(
                      alignment:
                          .leading,
                      spacing: 8
                  ) {

                      HStack {

                          Text("✓")
                              .foregroundStyle(
                                  .green
                              )

                          Text(
                              report.filename
                          )
                          .font(
                              .headline
                          )

                          Spacer()
                      }

                      Text(
                          "Unreal package \(report.version)/\(report.licenseeVersion)"
                      )

                      Text(
                          "Names: \(report.nameCount)"
                      )

                      Text(
                          "Imports: \(report.importCount)"
                      )

                      Text(
                          "Exports: \(report.exportCount)"
                      )

                      if !report
                          .staticMeshes
                          .isEmpty {

                          Divider()

                          Text(
                              "STATIC MESHES: \(report.staticMeshes.count)"
                          )
                          .bold()

                          ForEach(
                              Array(
                                  report
                                      .staticMeshes
                                      .prefix(
                                          30
                                      )
                              ),
                              id:
                                  \.self
                          ) {
                              mesh in

                              Text(
                                  "• \(mesh)"
                              )
                          }
                      }

                      if !report
                          .textures
                          .isEmpty {

                          Divider()

                          Text(
                              "TEXTURES / MATERIALS: \(report.textures.count)"
                          )
                          .bold()

                          ForEach(
                              Array(
                                  report
                                      .textures
                                      .prefix(
                                          30
                                      )
                              ),
                              id:
                                  \.self
                          ) {
                              texture in

                              Text(
                                  "• \(texture)"
                              )
                          }
                      }

                      Divider()

                      Text(
                          "TOP OBJECT CLASSES"
                      )
                      .bold()

                      ForEach(
                          Array(
                              report
                                  .classCounts
                                  .prefix(
                                      15
                                  )
                                  .enumerated()
                          ),
                          id:
                              \.offset
                      ) {
                          item in

                          HStack {

                              Text(
                                  item
                                      .element
                                      .0
                              )

                              Spacer()

                              Text(
                                  "\(item.element.1)"
                              )
                              .foregroundStyle(
                                  .secondary
                              )
                          }
                      }
                  }
                  .font(
                      .caption
                  )
                  .frame(
                      maxWidth:
                          .infinity,
                      alignment:
                          .leading
                  )
                  .padding()
                  .background(
                      Color.black
                          .opacity(
                              0.75
                          )
                  )
                  .clipShape(
                      RoundedRectangle(
                          cornerRadius:
                              14
                      )
                  )
                  .foregroundStyle(
                      .white
                  )
              }
          }

          // ============================================================
          // MARK: - FILE PICKER
          // ============================================================

          struct FileImporter:
              UIViewControllerRepresentable {

              let completion:
                  ([URL]) -> Void

              func makeCoordinator()
                  -> Coordinator {

                  Coordinator(
                      completion:
                          completion
                  )
              }

              func makeUIViewController(
                  context: Context
              )
                  -> UIDocumentPickerViewController {

                  let picker =
                      UIDocumentPickerViewController(
                          forOpeningContentTypes:
                              [
                                  .data,
                                  .item
                              ],
                          asCopy:
                              true
                      )

                  picker
                      .allowsMultipleSelection =
                      true

                  picker.delegate =
                      context
                          .coordinator

                  return picker
              }

              func updateUIViewController(
                  _ uiViewController:
                      UIDocumentPickerViewController,
                  context:
                      Context
              ) {}

              final class Coordinator:
                  NSObject,
                  UIDocumentPickerDelegate {

                  let completion:
                      ([URL]) -> Void

                  init(
                      completion:
                          @escaping
                          ([URL]) -> Void
                  ) {

                      self.completion =
                          completion
                  }

                  func documentPicker(
                      _ controller:
                          UIDocumentPickerViewController,
                      didPickDocumentsAt
                          urls: [URL]
                  ) {

                      completion(
                          urls
                      )
                  }

                  func documentPickerWasCancelled(
                      _ controller:
                          UIDocumentPickerViewController
                  ) {

                      completion([])
                  }
              }
          }

          // ============================================================
          // MARK: - METAL
          // ============================================================

          struct MetalView:
              UIViewRepresentable {

              func makeCoordinator()
                  -> MetalRenderer {

                  MetalRenderer()
              }

              func makeUIView(
                  context:
                      Context
              ) -> MTKView {

                  guard
                      let device =
                          MTLCreateSystemDefaultDevice()
                  else {
                      fatalError(
                          "Metal unavailable"
                      )
                  }

                  let view =
                      MTKView(
                          frame:
                              .zero,
                          device:
                              device
                      )

                  view.delegate =
                      context
                          .coordinator

                  view
                      .preferredFramesPerSecond =
                      60

                  view
                      .enableSetNeedsDisplay =
                      false

                  view.isPaused =
                      false

                  view.framebufferOnly =
                      true

                  view.colorPixelFormat =
                      .bgra8Unorm

                  context
                      .coordinator
                      .setup(
                          device:
                              device
                      )

                  return view
              }

              func updateUIView(
                  _ uiView:
                      MTKView,
                  context:
                      Context
              ) {}
          }

          final class MetalRenderer:
              NSObject,
              MTKViewDelegate {

              private var queue:
                  MTLCommandQueue?

              private var frames = 0

              private var lastTime =
                  CACurrentMediaTime()

              func setup(
                  device:
                      MTLDevice
              ) {

                  queue =
                      device
                          .makeCommandQueue()
              }

              func mtkView(
                  _ view:
                      MTKView,
                  drawableSizeWillChange
                      size:
                          CGSize
              ) {}

              func draw(
                  in view:
                      MTKView
              ) {

                  guard
                      let descriptor =
                          view
                              .currentRenderPassDescriptor,

                      let drawable =
                          view
                              .currentDrawable,

                      let queue,

                      let commandBuffer =
                          queue
                              .makeCommandBuffer()

                  else {
                      return
                  }

                  descriptor
                      .colorAttachments[0]
                      .clearColor =
                      MTLClearColor(
                          red:
                              0.015,
                          green:
                              0.015,
                          blue:
                              0.015,
                          alpha:
                              1
                      )

                  if let encoder =
                      commandBuffer
                          .makeRenderCommandEncoder(
                              descriptor:
                                  descriptor
                          ) {

                      encoder
                          .endEncoding()
                  }

                  commandBuffer.present(
                      drawable
                  )

                  commandBuffer.commit()

                  frames += 1

                  let now =
                      CACurrentMediaTime()

                  let elapsed =
                      now - lastTime

                  if elapsed >= 1 {

                      let measuredFPS =
                          Double(frames)
                          / elapsed

                      frames = 0

                      lastTime = now

                      DispatchQueue
                          .main
                          .async {

                              NotificationCenter
                                  .default
                                  .post(
                                      name:
                                          .postalFPS,
                                      object:
                                          measuredFPS
                                  )
                          }
                  }
              }
          }
          EOF

      - name: Generate Xcode project
        run: |
          set -e

          xcodegen generate

          echo "===== PROJECT CREATED ====="
          ls -la
          ls -la Postal2Native.xcodeproj

      - name: Build native ARM64 app
        run: |
          set -euo pipefail

          rm -rf build

          xcodebuild \
            -project Postal2Native.xcodeproj \
            -scheme Postal2Native \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          set -euo pipefail

          APP_PATH="$(
            find build/Build/Products/Release-iphoneos \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "APP=$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          /usr/bin/zip \
            -qry \
            Postal2Native-BridgeParser.ipa \
            Payload

          ls -lh \
            Postal2Native-BridgeParser.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Postal2Native-BridgeParser-IPA
          path: Postal2Native-BridgeParser.ipa
          if-no-files-found: error
