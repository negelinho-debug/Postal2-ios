name: POSTAL 2 WineGlass iOS FIX 9.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 FIX 9.1
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found"
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen make flock
          export PATH="$(brew --prefix)/bin:$PATH"
          command -v flock
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf WineGlass blink-src
          git clone --depth 1 https://github.com/Contonion/WineGlass.git WineGlass
          git clone --depth 1 https://github.com/jart/blink.git blink-src
          mkdir -p WineGlass/Vendor/blink/lib
          git -C WineGlass rev-parse HEAD
          git -C blink-src rev-parse HEAD

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"
          cd blink-src
          chmod +x configure
          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit
          test -f config.h
          test -f config.mk

      - name: Patch Blink iOS config
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/config.h")
          s = p.read_text(errors="ignore")

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
              "HAVE_SCHED_YIELD",
              "HAVE_SCHED_H",
          ]
          enable = [
              "HAVE_DEV_URANDOM",
              "HAVE_SYS_MOUNT_H",
              "HAVE_MAP_ANONYMOUS",
          ]

          for name in disable + enable:
              s = re.sub(rf'(?m)^\s*#define\s+{re.escape(name)}\b.*$', '', s)
              s = re.sub(rf'(?m)^\s*#undef\s+{re.escape(name)}\b.*$', '', s)

          s += "\n/* POSTAL 2 iOS FIX 9.1 */\n"
          for name in disable:
              s += f"#undef {name}\n"
          for name in enable:
              s += f"#define {name} 1\n"

          p.write_text(s)
          print("Blink iOS config patched")
          PY

          grep -q '^#define HAVE_MAP_ANONYMOUS 1$' blink-src/config.h

      - name: Patch Blink sched_yield
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/blink/syscall.c")
          s = p.read_text()

          pattern = r'''static\s+int\s+SysSchedYield\s*\(\s*struct\s+Machine\s*\*m\s*\)\s*\{.*?\n\}'''
          replacement = '''static int SysSchedYield(struct Machine *m) {
            (void)m;
            return 0;
          }'''

          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("ERROR: SysSchedYield patch failed")

          s = s.replace("        sched_yield();", "        /* sched_yield disabled on iOS */")
          if "return sched_yield();" in s:
              raise SystemExit("ERROR: sched_yield remains")

          p.write_text(s)
          PY

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"
          cd "$BLINK"
          rm -f o//blink/blink.a
          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a
          test -f o//blink/blink.a
          cp o//blink/blink.a "$WG/Vendor/blink/lib/blink.a"
          test -f "$WG/Vendor/blink/lib/blink.a"

      - name: Patch Blink VM mmap FIX 9.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Vendor/blink/wg_blink_impl.c")
          s = p.read_text()

          if "#include <errno.h>" not in s:
              if "#include <stdio.h>" not in s:
                  raise SystemExit("ERROR: stdio include missing")
              s = s.replace(
                  "#include <stdio.h>",
                  "#include <stdio.h>\n#include <errno.h>\n#include <sys/mman.h>",
                  1,
              )

          start_marker = "static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {"
          end_marker = "struct WGBlinkVM *WGBlinkVM_Create(void) {"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("ERROR: create_vm_with_mode markers missing")

          new_function = r'''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {
              fprintf(stderr, "[FIX9/BLINK] CREATE VM mode=%d\n", mode.omode);
              fflush(stderr);

              ensure_initialized();

              struct WGBlinkVM *vm = calloc(1, sizeof(struct WGBlinkVM));
              if (!vm) return NULL;

              vm->s = NewSystem(mode);
              if (!vm->s) {
                  free(vm);
                  return NULL;
              }

              if (!vm->s->real) {
                  long pagesize = FLAG_pagesize;
                  long real_size = (kRealSize + pagesize - 1) & ~(pagesize - 1);
                  errno = 0;
                  vm->s->real = Mmap(
                      NULL,
                      real_size,
                      PROT_READ | PROT_WRITE,
                      MAP_PRIVATE | MAP_ANONYMOUS_,
                      -1,
                      0,
                      "real"
                  );
                  int e = errno;
                  fprintf(stderr, "[FIX9/BLINK] Mmap real=%p errno=%d (%s)\n",
                          (void *)vm->s->real, e, e ? strerror(e) : "OK");
                  fflush(stderr);

                  if (vm->s->real == MAP_FAILED || !vm->s->real) {
                      vm->s->real = NULL;
                      FreeSystem(vm->s);
                      free(vm);
                      return NULL;
                  }
              }

              vm->m = NewMachine(vm->s, NULL);
              if (!vm->m) {
                  FreeSystem(vm->s);
                  free(vm);
                  return NULL;
              }

              if (mode.omode == XED_MODE_LONG) {
                  vm->s->cr0 = CR0_PE | CR0_MP | CR0_ET | CR0_PG;
                  vm->s->cr3 = AllocatePageTable(vm->s);
                  if (vm->s->cr3 == (u64)-1) {
                      FreeMachine(vm->m);
                      FreeSystem(vm->s);
                      free(vm);
                      return NULL;
                  }
              } else if (mode.omode == XED_MODE_LEGACY) {
                  vm->s->cr0 = CR0_PE | CR0_MP | CR0_ET;
              }

              vm->m->flags |= (1 << 9);
              fprintf(stderr, "[FIX9/BLINK] VM CREATE SUCCESS real=%p cr3=%llu\n",
                      (void *)vm->s->real, (unsigned long long)vm->s->cr3);
              fflush(stderr);
              return vm;
          }

          '''

          s = s[:start] + new_function + "\n" + s[end:]
          p.write_text(s)
          PY

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          cd "$BLINK"
          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"
          test -f "$WG/Vendor/blink/lib/wg_blink_impl.o"

      - name: Patch FIX 9.1 MSVCR120 data imports
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()

          helper_marker = "static bool load_pe_blink(WGEngine *engine) {"
          if helper_marker not in s:
              raise SystemExit("ERROR: load_pe_blink marker missing")

          helper = r'''
          // ============================================================
          // POSTAL 2 FIX 9.1 — MSVCR120 DATA IMPORTS
          // ============================================================

          #define WG_FIX91_PAGE          0x00A00000u
          #define WG_FIX91_WCMDLINE      0x00A00000u
          #define WG_FIX91_ACMDLINE      0x00A00100u
          #define WG_FIX91_APGMPTR       0x00A00300u
          #define WG_FIX91_WPGMPTR       0x00A00500u
          #define WG_FIX91_ACMDLN_VAR    0x00A00800u
          #define WG_FIX91_WCMDLN_VAR    0x00A00804u
          #define WG_FIX91_FMODE_VAR     0x00A00808u
          #define WG_FIX91_COMMODE_VAR   0x00A0080Cu
          #define WG_FIX91_ARGC_VAR      0x00A00810u
          #define WG_FIX91_ARGV_VAR      0x00A00814u
          #define WG_FIX91_WARGV_VAR     0x00A00818u
          #define WG_FIX91_PGMPTR_VAR    0x00A0081Cu
          #define WG_FIX91_WPGMPTR_VAR   0x00A00820u
          #define WG_FIX91_ENVIRON_VAR   0x00A00824u
          #define WG_FIX91_WENVIRON_VAR  0x00A00828u
          #define WG_FIX91_ARGV_ARRAY    0x00A00840u
          #define WG_FIX91_WARGV_ARRAY   0x00A00848u
          #define WG_FIX91_ENV_ARRAY     0x00A00850u
          #define WG_FIX91_WENV_ARRAY    0x00A00858u

          static void wg_fix91_put32(uint8_t *page, uint32_t guest, uint32_t value) {
              uint32_t off = guest - WG_FIX91_PAGE;
              if (off + 4 <= 0x1000) memcpy(page + off, &value, 4);
          }

          static bool wg_fix91_is_msvcr120(const char *dll) {
              if (!dll) return false;
              char lower[128];
              size_t n = strlen(dll);
              if (n >= sizeof(lower)) n = sizeof(lower) - 1;
              for (size_t i = 0; i < n; i++) {
                  lower[i] = (char)tolower((unsigned char)dll[i]);
              }
              lower[n] = '\0';
              return strstr(lower, "msvcr120") != NULL;
          }

          static bool wg_fix91_prepare_crt_data(WGEngine *engine) {
              if (!engine || !engine->blink) return false;

              uint8_t page[0x1000];
              memset(page, 0, sizeof(page));

              const char *winpath = wg_files_exe_win_path();
              if (!winpath || !winpath[0]) {
                  winpath = "C:\\Postal2\\System\\Postal2.exe";
              }

              uint16_t *wcmd = (uint16_t *)(page + (WG_FIX91_WCMDLINE - WG_FIX91_PAGE));
              int wi = 0;
              wcmd[0] = '"';
              for (; winpath[wi] && wi < 120; wi++) wcmd[wi + 1] = (uint8_t)winpath[wi];
              wcmd[wi + 1] = '"';
              wcmd[wi + 2] = 0;

              char *acmd = (char *)(page + (WG_FIX91_ACMDLINE - WG_FIX91_PAGE));
              snprintf(acmd, 500, "\"%s\"", winpath);

              char *apgm = (char *)(page + (WG_FIX91_APGMPTR - WG_FIX91_PAGE));
              snprintf(apgm, 500, "%s", winpath);

              uint16_t *wpgm = (uint16_t *)(page + (WG_FIX91_WPGMPTR - WG_FIX91_PAGE));
              int pi = 0;
              for (; winpath[pi] && pi < 240; pi++) wpgm[pi] = (uint8_t)winpath[pi];
              wpgm[pi] = 0;

              wg_fix91_put32(page, WG_FIX91_ACMDLN_VAR, WG_FIX91_ACMDLINE);
              wg_fix91_put32(page, WG_FIX91_WCMDLN_VAR, WG_FIX91_WCMDLINE);
              wg_fix91_put32(page, WG_FIX91_FMODE_VAR, 0);
              wg_fix91_put32(page, WG_FIX91_COMMODE_VAR, 0);
              wg_fix91_put32(page, WG_FIX91_ARGC_VAR, 1);

              wg_fix91_put32(page, WG_FIX91_ARGV_VAR, WG_FIX91_ARGV_ARRAY);
              wg_fix91_put32(page, WG_FIX91_ARGV_ARRAY, WG_FIX91_APGMPTR);
              wg_fix91_put32(page, WG_FIX91_ARGV_ARRAY + 4, 0);

              wg_fix91_put32(page, WG_FIX91_WARGV_VAR, WG_FIX91_WARGV_ARRAY);
              wg_fix91_put32(page, WG_FIX91_WARGV_ARRAY, WG_FIX91_WPGMPTR);
              wg_fix91_put32(page, WG_FIX91_WARGV_ARRAY + 4, 0);

              wg_fix91_put32(page, WG_FIX91_PGMPTR_VAR, WG_FIX91_APGMPTR);
              wg_fix91_put32(page, WG_FIX91_WPGMPTR_VAR, WG_FIX91_WPGMPTR);

              wg_fix91_put32(page, WG_FIX91_ENVIRON_VAR, WG_FIX91_ENV_ARRAY);
              wg_fix91_put32(page, WG_FIX91_ENV_ARRAY, 0);
              wg_fix91_put32(page, WG_FIX91_WENVIRON_VAR, WG_FIX91_WENV_ARRAY);
              wg_fix91_put32(page, WG_FIX91_WENV_ARRAY, 0);

              if (!wg_blink_load_code(engine->blink, WG_FIX91_PAGE, page, sizeof(page), 0)) {
                  WG_LOGE(TAG, "FIX9.1 CRT page map FAILED");
                  return false;
              }

              s_cmdpage_mapped = true;
              WG_LOGI(TAG, "FIX9.1 CRT DATA PAGE READY @0x%X", WG_FIX91_PAGE);
              WG_LOGI(TAG, "FIX9.1 _acmdln @0x%X -> 0x%X", WG_FIX91_ACMDLN_VAR, WG_FIX91_ACMDLINE);
              return true;
          }

          static uint32_t wg_fix91_data_import(const char *dll, const char *name) {
              if (!wg_fix91_is_msvcr120(dll) || !name) return 0;
              if (!strcmp(name, "_acmdln"))   return WG_FIX91_ACMDLN_VAR;
              if (!strcmp(name, "_wcmdln"))   return WG_FIX91_WCMDLN_VAR;
              if (!strcmp(name, "_fmode"))    return WG_FIX91_FMODE_VAR;
              if (!strcmp(name, "_commode"))  return WG_FIX91_COMMODE_VAR;
              if (!strcmp(name, "__argc"))    return WG_FIX91_ARGC_VAR;
              if (!strcmp(name, "__argv"))    return WG_FIX91_ARGV_VAR;
              if (!strcmp(name, "__wargv"))   return WG_FIX91_WARGV_VAR;
              if (!strcmp(name, "_pgmptr"))   return WG_FIX91_PGMPTR_VAR;
              if (!strcmp(name, "_wpgmptr"))  return WG_FIX91_WPGMPTR_VAR;
              if (!strcmp(name, "_environ"))  return WG_FIX91_ENVIRON_VAR;
              if (!strcmp(name, "_wenviron")) return WG_FIX91_WENVIRON_VAR;
              return 0;
          }

          '''

          s = s.replace(helper_marker, helper + "\n" + helper_marker, 1)

          function_start = s.find(helper_marker)
          start_marker = "// Resolve imports — write thunk addresses into the IAT"
          end_marker = "    uint64_t entry = pe->image_base + pe->entry_point;"

          start = s.find(start_marker, function_start)
          if start == -1:
              raise SystemExit("ERROR: import resolver START marker missing")

          line_start = s.rfind("\n", function_start, start)
          line_start = start if line_start == -1 else line_start + 1

          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit("ERROR: import resolver END marker missing")

          replacement = r'''    // POSTAL 2 FIX 9.1 IMPORT RESOLUTION
              // PE32 IAT = 4 bytes; PE32+ IAT = 8 bytes.
              // MSVCR120 data exports point to DATA, not HLT thunks.

              if (!pe->is_64bit) {
                  if (!wg_fix91_prepare_crt_data(engine)) {
                      WG_LOGE(TAG, "FIX9.1 CRT data setup failed");
                      return false;
                  }
              }

              if (pe->num_imports > 0) {
                  WG_LOGI(TAG, "Resolving %d DLL imports...", pe->num_imports);

                  for (int i = 0; i < pe->num_imports; i++) {
                      WGPEImportDll *imp = &pe->imports[i];
                      WG_LOGI(TAG, "  %s: %d functions", imp->dll_name, imp->num_functions);

                      for (int j = 0; j < imp->num_functions; j++) {
                          const char *fn = imp->functions[j].name;
                          uint64_t iat_entry = pe->image_base + imp->functions[j].iat_rva;

                          if (!pe->is_64bit) {
                              uint32_t data_addr = wg_fix91_data_import(imp->dll_name, fn);
                              if (data_addr) {
                                  bool ok = wg_blink_write_mem(engine->blink, iat_entry, &data_addr, 4);
                                  WG_LOGI(
                                      TAG,
                                      "FIX9.1 DATA IMPORT: %s!%s IAT=0x%llX -> DATA 0x%X write=%d",
                                      imp->dll_name,
                                      fn,
                                      (unsigned long long)iat_entry,
                                      data_addr,
                                      ok ? 1 : 0
                                  );
                                  if (!ok) return false;
                                  continue;
                              }
                          }

                          uint64_t stub_addr = wg_dll_mapper_resolve(
                              engine->dll_mapper,
                              imp->dll_name,
                              fn
                          );

                          if (!stub_addr) {
                              WG_LOGW(TAG, "FIX9.1 unresolved import: %s!%s", imp->dll_name, fn);
                              continue;
                          }

                          if (pe->is_64bit) {
                              uint64_t stub64 = stub_addr;
                              wg_blink_write_mem(engine->blink, iat_entry, &stub64, 8);
                          } else {
                              uint32_t stub32 = (uint32_t)stub_addr;
                              wg_blink_write_mem(engine->blink, iat_entry, &stub32, 4);
                          }
                      }
                  }
              }

          '''

          s = s[:line_start] + replacement + s[end:]
          p.write_text(s)
          print("FIX 9.1 CRT data + PE32 IAT patch installed")
          PY

          grep -n \
            "FIX9.1 CRT DATA PAGE\|FIX9.1 DATA IMPORT\|POSTAL 2 FIX 9.1 IMPORT" \
            WineGlass/Sources/Core/wg_engine.c

      - name: Patch WineGlass project
        shell: bash
        run: |
          set -euxo pipefail
          cd WineGlass
          python3 <<'PY'
          from pathlib import Path

          p = Path("project.yml")
          s = p.read_text()
          s = s.replace("bundleIdPrefix: com.wineglass", "bundleIdPrefix: com.postal2ios")
          s = s.replace('xcodeVersion: "15.0"', 'xcodeVersion: "15.4"\n  projectFormat: xcode15_3')
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app", "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native")
          s = s.replace('TARGETED_DEVICE_FAMILY: "1,2"', 'TARGETED_DEVICE_FAMILY: "1"')

          lines = []
          for line in s.splitlines():
              if "CODE_SIGN_ENTITLEMENTS:" in line:
                  continue
              if "DEVELOPMENT_TEAM:" in line:
                  continue
              if "CODE_SIGN_STYLE: Automatic" in line:
                  line = line.replace("CODE_SIGN_STYLE: Automatic", "CODE_SIGN_STYLE: Manual")
              lines.append(line)

          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail
          PLIST="WineGlass/Sources/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.9.1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 91" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch POSTAL 2 launcher and log
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/App/WGSceneDelegate.m")
          s = p.read_text()

          if "#include <stdio.h>" not in s:
              s = s.replace("#include <unistd.h>", "#include <unistd.h>\n#include <stdio.h>", 1)

          old = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              wg_log_init();'''

          new = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              NSString *docs = NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory,
                  NSUserDomainMask,
                  YES
              ).firstObject;

              NSString *logPath = [docs stringByAppendingPathComponent:@"POSTAL2-WineGlass.log"];
              [[NSFileManager defaultManager] removeItemAtPath:logPath error:nil];
              freopen(logPath.fileSystemRepresentation, "a", stderr);
              setvbuf(stderr, NULL, _IONBF, 0);

              fprintf(stderr,
                      "========================================\\n"
                      "POSTAL 2 WineGlass FIX 9.1\\n"
                      "CRT DATA IMPORTS + PE32 IAT FIX\\n"
                      "========================================\\n");
              fflush(stderr);

              wg_log_init();
              WG_LOGI("POSTAL2", "FIX 9.1 logging started");'''

          if old not in s:
              raise SystemExit("ERROR: scene startup marker missing")
          s = s.replace(old, new, 1)

          old = '[_loadButton setTitle:@"  Load .exe  " forState:UIControlStateNormal];'
          new = '[_loadButton setTitle:@"  RUN POSTAL 2  " forState:UIControlStateNormal];'
          if old not in s:
              raise SystemExit("ERROR: button title missing")
          s = s.replace(old, new, 1)

          old = '[_loadButton addTarget:self action:@selector(openFilePicker) forControlEvents:UIControlEventTouchUpInside];'
          new = '[_loadButton addTarget:self action:@selector(runPostal2) forControlEvents:UIControlEventTouchUpInside];'
          if old not in s:
              raise SystemExit("ERROR: button action missing")
          s = s.replace(old, new, 1)

          marker = "#pragma mark - UIDocumentPickerDelegate"
          if marker not in s:
              raise SystemExit("ERROR: document picker marker missing")

          methods = r'''
          - (NSString *)findPostal2Exe {
              NSString *docs = NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory,
                  NSUserDomainMask,
                  YES
              ).firstObject;

              NSString *root = [docs stringByAppendingPathComponent:@"Postal2FullData"];
              NSFileManager *fm = [NSFileManager defaultManager];

              NSString *normal = [root stringByAppendingPathComponent:@"System/Postal2.exe"];
              if ([fm fileExistsAtPath:normal]) return normal;

              NSDirectoryEnumerator *enumerator = [fm enumeratorAtPath:root];
              for (NSString *relative in enumerator) {
                  if ([[relative lastPathComponent] caseInsensitiveCompare:@"Postal2.exe"] == NSOrderedSame) {
                      NSString *found = [root stringByAppendingPathComponent:relative];
                      WG_LOGI("POSTAL2", "Found recursively: %s", found.UTF8String);
                      return found;
                  }
              }

              WG_LOGE("POSTAL2", "Postal2.exe NOT FOUND");
              return nil;
          }

          - (void)runPostal2 {
              static BOOL postalStarted = NO;

              if (!_engine) {
                  WG_LOGE("POSTAL2", "Engine not ready");
                  return;
              }

              NSString *exe = [self findPostal2Exe];
              if (!exe) {
                  [_loadButton setTitle:@"  POSTAL2.EXE NOT FOUND  " forState:UIControlStateNormal];
                  return;
              }

              if (postalStarted) {
                  WG_LOGW("POSTAL2", "Duplicate launch ignored");
                  return;
              }

              postalStarted = YES;
              _loadButton.enabled = NO;

              NSString *systemDir = [exe stringByDeletingLastPathComponent];
              int cdResult = chdir(systemDir.fileSystemRepresentation);
              WG_LOGI("POSTAL2", "System directory: %s", systemDir.UTF8String);
              WG_LOGI("POSTAL2", "chdir result = %d", cdResult);

              [_loadButton setTitle:@"  STARTING POSTAL 2...  " forState:UIControlStateNormal];
              WG_LOGI("POSTAL2", "Launching original Postal2.exe");
              [self loadAndRunPE:exe];
          }

          '''

          s = s.replace(marker, methods + "\n" + marker, 1)

          old = "            [self tryLoadBundledPE];"
          new = '''            WG_LOGI("POSTAL2", "Engine ready — FIX9.1 auto-start");
                      [self runPostal2];'''
          if old not in s:
              raise SystemExit("ERROR: auto-start marker missing")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          cd WineGlass
          rm -rf WineGlass.xcodeproj
          xcodegen generate
          test -f WineGlass.xcodeproj/project.pbxproj
          grep -m1 "objectVersion" WineGlass.xcodeproj/project.pbxproj || true
          if grep -q "objectVersion = 77" WineGlass.xcodeproj/project.pbxproj; then
            echo "ERROR: unsupported objectVersion 77"
            exit 1
          fi

      - name: Build POSTAL 2 FIX 9.1
        shell: bash
        run: |
          set -o pipefail
          cd WineGlass
          rm -rf build
          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 | tee xcodebuild.log

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail
          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          test -d "$APP"
          test -f "$APP/WineGlass"
          lipo -info "$APP/WineGlass"
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "$ID"
          test "$ID" = "com.postal2ios.native"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          OUT="$ROOT/out"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/POSTAL 2.app"
          cd "$OUT"
          zip -qry "POSTAL-2-iOS-v9.1-CRT-DATA-FIX.ipa" Payload
          ls -lh "POSTAL-2-iOS-v9.1-CRT-DATA-FIX.ipa"

      - name: Upload POSTAL 2 FIX 9.1 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v9.1-CRT-DATA-FIX
          path: out/POSTAL-2-iOS-v9.1-CRT-DATA-FIX.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p debug-fix9-1
          cp WineGlass/xcodebuild.log debug-fix9-1/ 2>/dev/null || true
          cp blink-src/config.h debug-fix9-1/blink-config.h 2>/dev/null || true
          cp WineGlass/Vendor/blink/wg_blink_impl.c debug-fix9-1/ 2>/dev/null || true
          cp WineGlass/Sources/Core/wg_engine.c debug-fix9-1/ 2>/dev/null || true
          cp WineGlass/Sources/App/WGSceneDelegate.m debug-fix9-1/ 2>/dev/null || true
          cp WineGlass/project.yml debug-fix9-1/ 2>/dev/null || true

      - name: Upload FIX 9.1 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX9.1-DEBUG
          path: debug-fix9-1
          if-no-files-found: ignore
          retention-days: 7
