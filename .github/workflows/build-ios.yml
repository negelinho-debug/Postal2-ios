      - name: Patch FIX 11.3 MSVCP DllMain and no fallback
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()

          handler_anchor = '        } else if (strcmp(fn, "GetEnvironmentStringsW") == 0) {'
          handler = "\n".join([
              '        } else if (strcmp(fn, "DisableThreadLibraryCalls") == 0) {',
              '            ret_val = 1;',
              '            s_last_error = 0;',
              '            WG_LOGI(TAG,',
              '                    "POSTAL FIX11.3 DisableThreadLibraryCalls(0x%X) -> TRUE",',
              '                    args[0]);',
              '',
              '        } else if (strcmp(fn, "GetEnvironmentStringsW") == 0) {',
          ])

          if "POSTAL FIX11.3 DisableThreadLibraryCalls" not in s:
              if handler_anchor not in s:
                  raise SystemExit("ERROR: FIX11.3 handler anchor missing")
              s = s.replace(handler_anchor, handler, 1)

          cleanup_anchor = '        if (strcmp(cleanup_fn, "GetStdHandle") == 0) num_args = 1;'
          cleanup_replacement = "\n".join([
              '        if (strcmp(cleanup_fn, "DisableThreadLibraryCalls") == 0) num_args = 1;',
              '        else if (strcmp(cleanup_fn, "GetStdHandle") == 0) num_args = 1;',
          ])

          if 'strcmp(cleanup_fn, "DisableThreadLibraryCalls")' not in s:
              if cleanup_anchor not in s:
                  raise SystemExit("ERROR: FIX11.3 stdcall cleanup anchor missing")
              s = s.replace(cleanup_anchor, cleanup_replacement, 1)

          load_pattern = re.compile(
              r'bool\s+ok\s*=\s*false\s*;\s*'
              r'if\s*\(engine->backend\s*==\s*WG_BACKEND_BLINK\)\s*\{\s*'
              r'ok\s*=\s*load_pe_blink\(engine\)\s*;[^\n]*\n\s*'
              r'\}\s*'
              r'if\s*\(!ok\)\s*\{\s*'
              r'ok\s*=\s*load_pe_builtin\(engine\)\s*;\s*'
              r'\}'
          )

          no_fallback = "\n".join([
              'bool ok = false;',
              '    if (engine->backend == WG_BACKEND_BLINK) {',
              '        ok = load_pe_blink(engine);',
              '        if (!ok) {',
              '            WG_LOGE(TAG, "POSTAL FIX11.3 NO BUILTIN FALLBACK: blink load failed");',
              '        }',
              '    } else {',
              '        ok = load_pe_builtin(engine);',
              '    }',
          ])

          if "POSTAL FIX11.3 NO BUILTIN FALLBACK" not in s:
              s, count = load_pattern.subn(no_fallback, s)
              if count != 2:
                  raise SystemExit(
                      f"ERROR: FIX11.3 expected 2 loader fallback blocks, found {count}"
                  )

          p.write_text(s)

          print("POSTAL 2 FIX 11.3 PATCH INSTALLED")
          print("DisableThreadLibraryCalls handler OK")
          print("DisableThreadLibraryCalls argc=1 OK")
          print("Blink -> builtin fallback DISABLED")
          PY

          FILE="WineGlass/Sources/Core/wg_engine.c"
          grep -n "POSTAL FIX11.3 DisableThreadLibraryCalls" "$FILE"
          grep -n 'strcmp(cleanup_fn, "DisableThreadLibraryCalls")' "$FILE"
          grep -n "POSTAL FIX11.3 NO BUILTIN FALLBACK" "$FILE"
          echo "FIX 11.3 VERIFY OK"

