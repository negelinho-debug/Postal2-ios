name: POSTAL 2 WineGlass iOS FIX 11.11 CLEAN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Validate FIX 11.11 CLEAN
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate workflow and successful FIX 11.8.1 base
        shell: bash
        run: |
          set -euxo pipefail

          BASE_COMMIT="0bae098"
          BASE_FILE="/tmp/POSTAL-FIX11.8.1-success.yml"

          if git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git show "${BASE_COMMIT}:.github/workflows/build-ios.yml" > "$BASE_FILE"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/negelinho-debug/Postal2-ios/${BASE_COMMIT}/.github/workflows/build-ios.yml" \
              -o "$BASE_FILE"
          fi

          grep -q \
            '^name: POSTAL 2 WineGlass iOS FIX 11.8.1 CLEAN$' \
            "$BASE_FILE"

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import textwrap
          import zlib

          current = Path(".github/workflows/build-ios.yml").read_text()
          lines = current.splitlines()
          blocks = []
          i = 0

          while i < len(lines):
              line = lines[i]

              if line.strip() == "python3 <<'PY'":
                  base_indent = len(line) - len(line.lstrip())
                  body = []
                  i += 1

                  while i < len(lines) and lines[i].strip() != "PY":
                      cur = lines[i]

                      if cur.startswith(" " * base_indent):
                          cur = cur[base_indent:]

                      body.append(cur)
                      i += 1

                  if i >= len(lines):
                      raise SystemExit("ERROR: unterminated Python heredoc")

                  blocks.append(textwrap.dedent("\n".join(body)))

              i += 1

          for index, code in enumerate(blocks, start=1):
              ast.parse(code, filename=f"visible-python-{index}")

          base = Path("/tmp/POSTAL-FIX11.8.1-success.yml").read_text()

          pattern = re.compile(
              r'payload\s*=\s*"""(.*?)"""\s*'
              r'code\s*=\s*zlib\.decompress\(.*?\)\.decode\("utf-8"\)\s*'
              r'compile\(\s*code,\s*"([^"]+)"',
              re.S,
          )

          wanted = {
              "<POSTAL-blink-config>",
              "<POSTAL-blink-sched>",
              "<POSTAL-blink-mmap>",
              "<POSTAL-engine>",
              "<POSTAL-FIX11.8.1-cumulative>",
              "<POSTAL-project>",
              "<POSTAL-launcher>",
          }

          found = set()

          for payload, label in pattern.findall(base):
              if label not in wanted:
                  continue

              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(code, filename=label)
              found.add(label)

          missing = sorted(wanted - found)

          if missing:
              raise SystemExit(
                  "ERROR: missing successful 11.8.1 payloads: "
                  + ", ".join(missing)
              )

          print(
              "FIX 11.11 validation OK:",
              len(blocks),
              "visible Python blocks and",
              len(found),
              "successful 11.8.1 payloads"
          )
          PY

  vc120:
    needs: lint
    name: Prepare VC++ 2013 x86 runtime
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Download and install official VC++ 2013 x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $env:GITHUB_WORKSPACE
          $exe = Join-Path $root "vcredist_x86.exe"
          $out = Join-Path $root "vc120-runtime"

          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $urls = @(
            "https://download.visualstudio.microsoft.com/download/pr/10912113/5da66ddebb0ad32ebd4b922fd82e8e25/vcredist_x86.exe",
            "https://download.microsoft.com/download/2/E/6/2E61CFA4-993B-4DD4-91DA-3737CD5CD6E3/vcredist_x86.exe"
          )

          $downloaded = $false

          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile $exe

              if ((Test-Path $exe) -and ((Get-Item $exe).Length -gt 100000)) {
                $downloaded = $true
                break
              }
            }
            catch {
              Write-Warning $_
            }
          }

          if (-not $downloaded) {
            throw "Could not download official VC++ 2013 x86 redistributable"
          }

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList "/install","/quiet","/norestart" `
            -Wait `
            -PassThru

          Write-Host "vcredist exit code: $($proc.ExitCode)"

          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 1638) {
            throw "vcredist_x86 failed with exit code $($proc.ExitCode)"
          }

          $msvcr = @(
            "$env:WINDIR\SysWOW64\msvcr120.dll",
            "$env:WINDIR\System32\msvcr120.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          $msvcp = @(
            "$env:WINDIR\SysWOW64\msvcp120.dll",
            "$env:WINDIR\System32\msvcp120.dll"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msvcr) { throw "msvcr120.dll was not found" }
          if (-not $msvcp) { throw "msvcp120.dll was not found" }

          Copy-Item $msvcr (Join-Path $out "msvcr120.dll") -Force
          Copy-Item $msvcp (Join-Path $out "msvcp120.dll") -Force

          Get-Item `
            (Join-Path $out "msvcr120.dll"), `
            (Join-Path $out "msvcp120.dll") |
            Format-List FullName,Length

      - name: Upload VC120 runtime
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime
          if-no-files-found: error
          retention-days: 1

  build:
    needs: vc120
    name: Build POSTAL 2 FIX 11.11 CLEAN
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VC120 runtime
        uses: actions/download-artifact@v4
        with:
          name: POSTAL2-VC120-x86
          path: vc120-runtime

      - name: Verify VC120 runtime
        shell: bash
        run: |
          set -euxo pipefail

          test -s vc120-runtime/msvcr120.dll
          test -s vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll
          file vc120-runtime/msvcp120.dll

          file vc120-runtime/msvcr120.dll | grep -q "PE32 executable"
          file vc120-runtime/msvcp120.dll | grep -q "PE32 executable"
          file vc120-runtime/msvcr120.dll | grep -q "Intel 80386"
          file vc120-runtime/msvcp120.dll | grep -q "Intel 80386"

      - name: Recover exact successful FIX 11.8.1 patches
        shell: bash
        run: |
          set -euxo pipefail

          BASE_COMMIT="0bae098"
          BASE_FILE="/tmp/POSTAL-FIX11.8.1-success.yml"
          PATCH_DIR="$GITHUB_WORKSPACE/.postal-base-patches"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          if git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git show "${BASE_COMMIT}:.github/workflows/build-ios.yml" > "$BASE_FILE"
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/negelinho-debug/Postal2-ios/${BASE_COMMIT}/.github/workflows/build-ios.yml" \
              -o "$BASE_FILE"
          fi

          grep -q \
            '^name: POSTAL 2 WineGlass iOS FIX 11.8.1 CLEAN$' \
            "$BASE_FILE"

          python3 <<'PY'
          from pathlib import Path
          import ast
          import base64
          import re
          import zlib

          src = Path("/tmp/POSTAL-FIX11.8.1-success.yml").read_text()
          out = Path(".postal-base-patches")

          names = {
              "<POSTAL-blink-config>": "blink-config.py",
              "<POSTAL-blink-sched>": "blink-sched.py",
              "<POSTAL-blink-mmap>": "blink-mmap.py",
              "<POSTAL-engine>": "engine-fix11.2.py",
              "<POSTAL-FIX11.8.1-cumulative>": "cumulative-fix11.8.1.py",
              "<POSTAL-project>": "project.py",
              "<POSTAL-launcher>": "launcher.py",
          }

          pattern = re.compile(
              r'payload\s*=\s*"""(.*?)"""\s*'
              r'code\s*=\s*zlib\.decompress\(.*?\)\.decode\("utf-8"\)\s*'
              r'compile\(\s*code,\s*"([^"]+)"',
              re.S,
          )

          written = set()

          for payload, label in pattern.findall(src):
              filename = names.get(label)

              if not filename:
                  continue

              code = zlib.decompress(
                  base64.b64decode(payload)
              ).decode("utf-8")

              ast.parse(code, filename=label)
              (out / filename).write_text(code)
              written.add(label)

          missing = sorted(set(names) - written)

          if missing:
              raise SystemExit(
                  "ERROR: missing successful FIX11.8.1 payloads: "
                  + ", ".join(missing)
              )

          print(
              "Recovered",
              len(written),
              "successful FIX11.8.1 patches"
          )
          PY

          ls -lh "$PATCH_DIR"

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found"
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi

          xcodebuild -version
          xcode-select -p

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock
          export PATH="$(brew --prefix)/bin:$PATH"

          command -v flock
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf WineGlass blink-src

          git clone --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p WineGlass/Vendor/blink/lib

          git -C WineGlass rev-parse HEAD
          git -C blink-src rev-parse HEAD

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd blink-src
          chmod +x configure

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

      - name: Patch Blink iOS config from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/blink-config.py

          grep -q \
            '^#define HAVE_MAP_ANONYMOUS 1$' \
            blink-src/config.h

      - name: Patch Blink sched_yield from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/blink-sched.py

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"
          rm -f o//blink/blink.a

          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a

          test -f o//blink/blink.a
          cp o//blink/blink.a "$WG/Vendor/blink/lib/blink.a"
          test -f "$WG/Vendor/blink/lib/blink.a"

      - name: Patch Blink VM mmap from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/blink-mmap.py

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f "$WG/Vendor/blink/lib/wg_blink_impl.o"

      - name: Apply POSTAL engine FIX 11.2 from successful 11.8.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 .postal-base-patches/engine-fix11.2.py

      - name: Apply cumulative FIX 11.8.1 exactly as successful build
        shell: bash
        run: |
          set -euxo pipefail

          python3 .postal-base-patches/cumulative-fix11.8.1.py

          ENGINE="WineGlass/Sources/Core/wg_engine.c"
          FILES="WineGlass/Sources/Win32/wg_win32_files.c"

          grep -n "POSTAL FIX11.3 DisableThreadLibraryCalls" "$ENGINE"
          grep -n "POSTAL FIX11.4 VirtualAlloc" "$ENGINE"
          grep -n "POSTAL FIX11.5 timeBeginPeriod" "$ENGINE"
          grep -n "POSTAL FIX11.7 GetModuleFileNameA" "$ENGINE"
          grep -n "POSTAL FIX11.8.1 %s request" "$ENGINE"
          grep -n "POSTAL FIX11.8.1 %s STRICT FAIL" "$ENGINE"
          grep -n "POSTAL FIX11.6.2 System root" "$FILES"
          grep -n "POSTAL FIX11.6.2 map" "$FILES"

          echo "SUCCESSFUL FIX 11.8.1 BASE RESTORED"

      - name: Patch FIX 11.10 native registrant probe
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()

          marker = "POSTAL FIX11.10 REG ENTER"

          if marker not in s:
              run_anchor = "bool wg_engine_run(WGEngine *engine) {"

              run_pos = s.find(run_anchor)

              if run_pos < 0:
                  raise SystemExit(
                      "ERROR: FIX11.10 wg_engine_run anchor missing"
                  )

              helper = r'''// ============================================================
          // POSTAL 2 FIX 11.10 — UE2 NATIVE REGISTRANT PROBE
          // ============================================================

          static bool s_postal_reg_probe_armed = false;
          static uint32_t s_postal_reg_bp[3] = {0, 0, 0};
          static uint8_t s_postal_reg_orig[3] = {0, 0, 0};
          static uint64_t s_postal_reg_hits = 0;
          static uint32_t s_postal_reg_last_this = 0;
          static uint32_t s_postal_reg_same_this = 0;

          static const char *s_postal_reg_names[3] = {
              "UObject::Register",
              "UField::Register",
              "UStruct::Register"
          };

          static const char *s_postal_reg_exports[3] = {
              "?Register@UObject@@UAEXXZ",
              "?Register@UField@@UAEXXZ",
              "?Register@UStruct@@UAEXXZ"
          };

          static void postal_arm_reg_probe_1110(
              WGEngine *engine
          ) {
              if (
                  s_postal_reg_probe_armed ||
                  !engine ||
                  !engine->blink
              ) {
                  return;
              }

              uint32_t core_base = 0;

              for (int i = 0; i < 16; i++) {
                  if (
                      s_modules[i].in_use &&
                      strcmp(s_modules[i].name, "core.dll") == 0
                  ) {
                      core_base = s_modules[i].base;
                      break;
                  }
              }

              if (!core_base) {
                  WG_LOGW(
                      TAG,
                      "POSTAL FIX11.10 core.dll not loaded; registrant probe not armed"
                  );
                  return;
              }

              int armed = 0;

              for (int i = 0; i < 3; i++) {
                  uint32_t addr =
                      wg_module_export(
                          core_base,
                          s_postal_reg_exports[i]
                      );

                  if (!addr) {
                      WG_LOGW(
                          TAG,
                          "POSTAL FIX11.10 export missing: %s",
                          s_postal_reg_names[i]
                      );
                      continue;
                  }

                  uint8_t orig = 0;

                  if (!wg_blink_read_mem(
                          engine->blink,
                          addr,
                          &orig,
                          1
                      )) {
                      WG_LOGW(
                          TAG,
                          "POSTAL FIX11.10 cannot read breakpoint byte for %s @0x%X",
                          s_postal_reg_names[i],
                          addr
                      );
                      continue;
                  }

                  uint8_t hlt = 0xF4;

                  if (!wg_blink_write_mem(
                          engine->blink,
                          addr,
                          &hlt,
                          1
                      )) {
                      WG_LOGW(
                          TAG,
                          "POSTAL FIX11.10 cannot arm %s @0x%X",
                          s_postal_reg_names[i],
                          addr
                      );
                      continue;
                  }

                  s_postal_reg_bp[i] = addr;
                  s_postal_reg_orig[i] = orig;
                  armed++;

                  WG_LOGI(
                      TAG,
                      "POSTAL FIX11.10 ARMED %s @0x%X orig=0x%02X",
                      s_postal_reg_names[i],
                      addr,
                      orig
                  );
              }

              s_postal_reg_probe_armed = armed > 0;

              WG_LOGI(
                  TAG,
                  "POSTAL FIX11.10 REG PROBE READY armed=%d core=0x%X",
                  armed,
                  core_base
              );
          }

          static bool postal_handle_reg_probe_1110(
              WGEngine *engine,
              uint64_t rip
          ) {
              if (
                  !s_postal_reg_probe_armed ||
                  !engine ||
                  !engine->blink
              ) {
                  return false;
              }

              for (int i = 0; i < 3; i++) {
                  if (
                      !s_postal_reg_bp[i] ||
                      rip != s_postal_reg_bp[i]
                  ) {
                      continue;
                  }

                  uint32_t eax =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          0
                      );

                  uint32_t ecx =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          1
                      );

                  uint32_t edx =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          2
                      );

                  uint32_t ebx =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          3
                      );

                  uint32_t esp =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          4
                      );

                  uint32_t ebp =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          5
                      );

                  uint32_t esi =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          6
                      );

                  uint32_t edi =
                      (uint32_t)wg_blink_get_reg(
                          engine->blink,
                          7
                      );

                  uint32_t stack[8] = {0};
                  uint32_t object[16] = {0};

                  if (esp) {
                      wg_blink_read_mem(
                          engine->blink,
                          esp,
                          stack,
                          sizeof(stack)
                      );
                  }

                  bool object_ok = false;

                  if (
                      ecx >= 0x10000u &&
                      ecx < 0xFFF00000u
                  ) {
                      object_ok =
                          wg_blink_read_mem(
                              engine->blink,
                              ecx,
                              object,
                              sizeof(object)
                          );
                  }

                  s_postal_reg_hits++;

                  if (
                      ecx &&
                      ecx == s_postal_reg_last_this
                  ) {
                      s_postal_reg_same_this++;
                  } else {
                      s_postal_reg_last_this = ecx;
                      s_postal_reg_same_this = 1;
                  }

                  WG_LOGW(
                      TAG,
                      "POSTAL FIX11.10 REG ENTER #%llu %s this=0x%08X same=%u ret=0x%08X",
                      (unsigned long long)s_postal_reg_hits,
                      s_postal_reg_names[i],
                      ecx,
                      s_postal_reg_same_this,
                      stack[0]
                  );

                  WG_LOGW(
                      TAG,
                      "POSTAL FIX11.10 REG REGS eax=%08X ecx=%08X edx=%08X ebx=%08X esp=%08X ebp=%08X esi=%08X edi=%08X",
                      eax,
                      ecx,
                      edx,
                      ebx,
                      esp,
                      ebp,
                      esi,
                      edi
                  );

                  WG_LOGW(
                      TAG,
                      "POSTAL FIX11.10 REG STACK %08X %08X %08X %08X  %08X %08X %08X %08X",
                      stack[0],
                      stack[1],
                      stack[2],
                      stack[3],
                      stack[4],
                      stack[5],
                      stack[6],
                      stack[7]
                  );

                  if (object_ok) {
                      WG_LOGW(
                          TAG,
                          "POSTAL FIX11.10 REG OBJ+00 %08X %08X %08X %08X  %08X %08X %08X %08X",
                          object[0],
                          object[1],
                          object[2],
                          object[3],
                          object[4],
                          object[5],
                          object[6],
                          object[7]
                      );

                      WG_LOGW(
                          TAG,
                          "POSTAL FIX11.10 REG OBJ+20 %08X %08X %08X %08X  %08X %08X %08X %08X",
                          object[8],
                          object[9],
                          object[10],
                          object[11],
                          object[12],
                          object[13],
                          object[14],
                          object[15]
                      );
                  } else {
                      WG_LOGW(
                          TAG,
                          "POSTAL FIX11.10 REG OBJECT READ FAILED this=0x%08X",
                          ecx
                      );
                  }

                  wg_blink_write_mem(
                      engine->blink,
                      s_postal_reg_bp[i],
                      &s_postal_reg_orig[i],
                      1
                  );

                  wg_blink_set_rip(
                      engine->blink,
                      s_postal_reg_bp[i]
                  );

                  wg_blink_step(
                      engine->blink
                  );

                  uint64_t after =
                      wg_blink_get_rip(
                          engine->blink
                      );

                  uint8_t hlt = 0xF4;

                  wg_blink_write_mem(
                      engine->blink,
                      s_postal_reg_bp[i],
                      &hlt,
                      1
                  );

                  WG_LOGW(
                      TAG,
                      "POSTAL FIX11.10 REG STEP %s 0x%X -> 0x%llX",
