      - name: Patch FIX 11.3 MSVCP safe
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/Core/wg_engine.c"
          )

          s = p.read_text()

          handler_anchor = (
              '        } else if '
              '(strcmp(fn, "GetEnvironmentStringsW") == 0) {'
          )

          handler = "\n".join([
              '        } else if '
              '(strcmp(fn, "DisableThreadLibraryCalls") == 0) {',

              '            ret_val = 1;',
              '            s_last_error = 0;',

              '            WG_LOGI('
              'TAG, '
              '"POSTAL FIX11.3 DisableThreadLibraryCalls(0x%X) -> TRUE", '
              'args[0]'
              ');',

              '',

              '        } else if '
              '(strcmp(fn, "GetEnvironmentStringsW") == 0) {',
          ])

          if (
              "POSTAL FIX11.3 DisableThreadLibraryCalls"
              not in s
          ):
              if handler_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.3 handler anchor missing"
                  )

              s = s.replace(
                  handler_anchor,
                  handler,
                  1
              )

          cleanup_anchor = (
              '        if '
              '(strcmp(cleanup_fn, "GetStdHandle") == 0) '
              'num_args = 1;'
          )

          cleanup_replacement = "\n".join([
              '        if '
              '(strcmp(cleanup_fn, "DisableThreadLibraryCalls") == 0) '
              'num_args = 1;',

              '        else if '
              '(strcmp(cleanup_fn, "GetStdHandle") == 0) '
              'num_args = 1;',
          ])

          if (
              'strcmp(cleanup_fn, "DisableThreadLibraryCalls")'
              not in s
          ):
              if cleanup_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.3 cleanup anchor missing"
                  )

              s = s.replace(
                  cleanup_anchor,
                  cleanup_replacement,
                  1
              )

          if (
              "POSTAL FIX11.3 NO BUILTIN FALLBACK"
              not in s
          ):
              old_file = """    bool ok = false;
              if (engine->backend == WG_BACKEND_BLINK) {
                  ok = load_pe_blink(engine); // this creates the blink VM on demand
              }
              if (!ok) {
                  ok = load_pe_builtin(engine);
              }"""

              new_file = """    bool ok = false;
              if (engine->backend == WG_BACKEND_BLINK) {
                  ok = load_pe_blink(engine);
                  if (!ok) {
                      WG_LOGE(TAG, "POSTAL FIX11.3 NO BUILTIN FALLBACK: blink load failed");
                  }
              } else {
                  ok = load_pe_builtin(engine);
              }"""

              old_mem = """    bool ok = false;
              if (engine->backend == WG_BACKEND_BLINK) {
                  ok = load_pe_blink(engine);
              }
              if (!ok) {
                  ok = load_pe_builtin(engine);
              }"""

              new_mem = """    bool ok = false;
              if (engine->backend == WG_BACKEND_BLINK) {
                  ok = load_pe_blink(engine);
                  if (!ok) {
                      WG_LOGE(TAG, "POSTAL FIX11.3 NO BUILTIN FALLBACK: blink load failed");
                  }
              } else {
                  ok = load_pe_builtin(engine);
              }"""

              replaced = 0

              if old_file in s:
                  s = s.replace(
                      old_file,
                      new_file,
                      1
                  )

                  replaced += 1

              if old_mem in s:
                  s = s.replace(
                      old_mem,
                      new_mem,
                      1
                  )

                  replaced += 1

              print(
                  "FIX11.3 fallback replacements:",
                  replaced
              )

          p.write_text(s)

          print(
              "POSTAL FIX 11.3 SAFE INSTALLED"
          )
          PY

          FILE="WineGlass/Sources/Core/wg_engine.c"

          grep -n \
            "POSTAL FIX11.3 DisableThreadLibraryCalls" \
            "$FILE"

          grep -n \
            'strcmp(cleanup_fn, "DisableThreadLibraryCalls")' \
            "$FILE"


      - name: Patch FIX 11.4 memory and file API
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/Core/wg_engine.c"
          )

          s = p.read_text()

          createfile_anchor = (
              '        } else if '
              '(strcmp(fn, "CreateFileW") == 0) {'
          )

          createfile_block = r'''        } else if (strcmp(fn, "CreateFileA") == 0) {
              char apath[520] = {0};

              if (args[0]) {
                  wg_blink_read_mem(
                      engine->blink,
                      args[0],
                      apath,
                      sizeof(apath) - 1
                  );

                  apath[sizeof(apath) - 1] = 0;
              }

              const char *real = wg_files_map_path(
                  args[0],
                  engine->blink,
                  apath,
                  sizeof(apath)
              );

              if (real) {
                  ret_val = wg_files_create(
                      real,
                      args[1],
                      args[4]
                  );

                  if (
                      (uint32_t)ret_val ==
                      0xFFFFFFFFu
                  ) {
                      s_last_error = 2;
                  } else {
                      s_last_error = 0;
                  }

              } else {
                  ret_val = 0xFFFFFFFFu;
                  s_last_error = 2;
              }

              WG_LOGI(
                  TAG,
                  "POSTAL FIX11.4 CreateFileA('%s', access=0x%X, share=0x%X, creation=%u) -> 0x%X",
                  apath,
                  args[1],
                  args[2],
                  args[4],
                  (uint32_t)ret_val
              );

          } else if (strcmp(fn, "CreateFileW") == 0) {'''

          if (
              "POSTAL FIX11.4 CreateFileA"
              not in s
          ):
              if createfile_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.4 CreateFileW anchor missing"
                  )

              s = s.replace(
                  createfile_anchor,
                  createfile_block,
                  1
              )

          virtual_anchor = (
              '        } else if '
              '(strcmp(fn, "CloseHandle") == 0) {'
          )

          virtual_block = r'''        } else if (strcmp(fn, "VirtualAlloc") == 0) {
              uint32_t requested = args[0];
              uint32_t size = args[1];
              uint32_t alloc_type = args[2];
              uint32_t protect = args[3];

              if (size == 0) {
                  size = 1;
              }

              uint32_t rounded =
                  (size + 0xFFFu) & ~0xFFFu;

              uint32_t addr = 0;

              if (requested != 0) {
                  uint8_t *zeros =
                      calloc(
                          1,
                          rounded
                      );

                  if (zeros) {
                      if (
                          wg_blink_load_code(
                              engine->blink,
                              requested,
                              zeros,
                              rounded,
                              0
                          )
                      ) {
                          addr = requested;

                          track_alloc(
                              addr,
                              size
                          );
                      }

                      free(zeros);
                  }

              } else {
                  addr = wg_guest_alloc(
                      engine,
                      size
                  );
              }

              ret_val = addr;

              s_last_error =
                  addr ? 0 : 8;

              WG_LOGI(
                  TAG,
                  "POSTAL FIX11.4 VirtualAlloc(addr=0x%X,size=0x%X,type=0x%X,protect=0x%X) -> 0x%X",
                  requested,
                  size,
                  alloc_type,
                  protect,
                  addr
              );

          } else if (strcmp(fn, "VirtualFree") == 0) {

              WG_LOGI(
                  TAG,
                  "POSTAL FIX11.4 VirtualFree(addr=0x%X,size=0x%X,type=0x%X) -> TRUE",
                  args[0],
                  args[1],
                  args[2]
              );

              ret_val = 1;
              s_last_error = 0;

          } else if (strcmp(fn, "CloseHandle") == 0) {'''

          if (
              "POSTAL FIX11.4 VirtualAlloc"
              not in s
          ):
              if virtual_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.4 CloseHandle anchor missing"
                  )

              s = s.replace(
                  virtual_anchor,
                  virtual_block,
                  1
              )

          cwd_old = "\n".join([
              '            '
              'wg_files_set_cwd(path[0] ? path : NULL);',

              '            '
              'WG_LOGI(TAG, "SetCurrentDirectory(\'%s\')", path);',

              '            '
              'ret_val = 1;',
          ])

          cwd_new = r'''            bool postal_fake_system32 =
                strcmp(
                    path,
                    "C:\\Windows\\System32"
                ) == 0 ||
                strcmp(
                    path,
                    "C:\\Windows\\System32\\"
                ) == 0 ||
                strcmp(
                    path,
                    "c:\\windows\\system32"
                ) == 0 ||
                strcmp(
                    path,
                    "c:\\windows\\system32\\"
                ) == 0;

            if (postal_fake_system32) {

                WG_LOGI(
                    TAG,
                    "POSTAL FIX11.4 ignoring SetCurrentDirectory('%s'); keeping Postal2/System",
                    path
                );

            } else {

                wg_files_set_cwd(
                    path[0] ?
                    path :
                    NULL
                );

                WG_LOGI(
                    TAG,
                    "SetCurrentDirectory('%s')",
                    path
                );
            }

            ret_val = 1;'''

          if (
              "POSTAL FIX11.4 ignoring SetCurrentDirectory"
              not in s
          ):
              if cwd_old not in s:
                  raise SystemExit(
                      "ERROR: FIX11.4 SetCurrentDirectory block missing"
                  )

              s = s.replace(
                  cwd_old,
                  cwd_new,
                  1
              )

          cleanup_marker = (
              '        if '
              '(strcmp(cleanup_fn, "DisableThreadLibraryCalls") == 0) '
              'num_args = 1;'
          )

          cleanup_new = "\n".join([
              '        if '
              '(strcmp(cleanup_fn, "VirtualAlloc") == 0) '
              'num_args = 4;',

              '        else if '
              '(strcmp(cleanup_fn, "VirtualFree") == 0) '
              'num_args = 3;',

              '        else if '
              '(strcmp(cleanup_fn, "CreateFileA") == 0) '
              'num_args = 7;',

              '        else if '
              '(strcmp(cleanup_fn, "CreateFileW") == 0) '
              'num_args = 7;',

              '        else if '
              '(strcmp(cleanup_fn, "CloseHandle") == 0) '
              'num_args = 1;',

              '        else if '
              '(strcmp(cleanup_fn, "SetCurrentDirectoryA") == 0) '
              'num_args = 1;',

              '        else if '
              '(strcmp(cleanup_fn, "SetCurrentDirectoryW") == 0) '
              'num_args = 1;',

              '        else if '
              '(strcmp(cleanup_fn, "DisableThreadLibraryCalls") == 0) '
              'num_args = 1;',
          ])

          if (
              'strcmp(cleanup_fn, "VirtualAlloc")'
              not in s
          ):
              if cleanup_marker not in s:
                  raise SystemExit(
                      "ERROR: FIX11.4 cleanup anchor missing"
                  )

              s = s.replace(
                  cleanup_marker,
                  cleanup_new,
                  1
              )

          p.write_text(s)

          print(
              "POSTAL FIX 11.4 INSTALLED"
          )
          PY

          FILE="WineGlass/Sources/Core/wg_engine.c"

          grep -n \
            "POSTAL FIX11.4 CreateFileA" \
            "$FILE"

          grep -n \
            "POSTAL FIX11.4 VirtualAlloc" \
            "$FILE"

          grep -n \
            "POSTAL FIX11.4 VirtualFree" \
            "$FILE"

          grep -n \
            "POSTAL FIX11.4 ignoring SetCurrentDirectory" \
            "$FILE"


      - name: Patch FIX 11.5 real WINMM timer
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/Core/wg_engine.c"
          )

          s = p.read_text()

          handler_anchor = (
              '        } else if '
              '(strcmp(fn, "DisableThreadLibraryCalls") == 0) {'
          )

          timer_block = r'''        } else if (strcmp(fn, "timeGetTime") == 0) {
              struct timespec ts;

              if (
                  clock_gettime(
                      CLOCK_MONOTONIC,
                      &ts
                  ) == 0
              ) {
                  uint64_t ms =
                      ((uint64_t)ts.tv_sec * 1000ULL) +
                      ((uint64_t)ts.tv_nsec / 1000000ULL);

                  ret_val =
                      (uint32_t)ms;

              } else {

                  ret_val =
                      (uint32_t)(
                          ((uint64_t)clock() * 1000ULL) /
                          (uint64_t)CLOCKS_PER_SEC
                      );
              }

          } else if (strcmp(fn, "timeBeginPeriod") == 0) {

              ret_val = 0;
              s_last_error = 0;

              WG_LOGI(
                  TAG,
                  "POSTAL FIX11.5 timeBeginPeriod(%u) -> TIMERR_NOERROR",
                  args[0]
              );

          } else if (strcmp(fn, "timeEndPeriod") == 0) {

              ret_val = 0;
              s_last_error = 0;

              WG_LOGI(
                  TAG,
                  "POSTAL FIX11.5 timeEndPeriod(%u) -> TIMERR_NOERROR",
                  args[0]
              );

          } else if (strcmp(fn, "DisableThreadLibraryCalls") == 0) {'''

          if (
              "POSTAL FIX11.5 timeBeginPeriod"
              not in s
          ):
              if handler_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.5 handler anchor missing"
                  )

              s = s.replace(
                  handler_anchor,
                  timer_block,
                  1
              )

          cleanup_anchor = (
              '        if '
              '(strcmp(cleanup_fn, "VirtualAlloc") == 0) '
              'num_args = 4;'
          )

          cleanup_block = "\n".join([
              '        if '
              '(strcmp(cleanup_fn, "timeGetTime") == 0) '
              'num_args = 0;',

              '        else if '
              '(strcmp(cleanup_fn, "timeBeginPeriod") == 0) '
              'num_args = 1;',

              '        else if '
              '(strcmp(cleanup_fn, "timeEndPeriod") == 0) '
              'num_args = 1;',

              '        else if '
              '(strcmp(cleanup_fn, "VirtualAlloc") == 0) '
              'num_args = 4;',
          ])

          if (
              'strcmp(cleanup_fn, "timeGetTime")'
              not in s
          ):
              if cleanup_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.5 cleanup anchor missing"
                  )

              s = s.replace(
                  cleanup_anchor,
                  cleanup_block,
                  1
              )

          quiet_anchor = (
              '            '
              '"QueryPerformanceCounter", '
              '"GetSystemTimePreciseAsFileTime",'
          )

          quiet_replacement = (
              '            '
              '"timeGetTime", '
              '"QueryPerformanceCounter", '
              '"GetSystemTimePreciseAsFileTime",'
          )

          if (
              '"timeGetTime", "QueryPerformanceCounter"'
              not in s
          ):
              if quiet_anchor in s:
                  s = s.replace(
                      quiet_anchor,
                      quiet_replacement,
                      1
                  )

          p.write_text(s)

          print(
              "POSTAL FIX 11.5 WINMM INSTALLED"
          )
          PY

          FILE="WineGlass/Sources/Core/wg_engine.c"

          grep -n \
            'strcmp(fn, "timeGetTime")' \
