      - name: Stamp POSTAL FIX 11.8.1 launcher
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/App/WGSceneDelegate.m")
          s = p.read_text()
          s = s.replace("FIX 11.2 CLEAN", "FIX 11.8.1 CLEAN")
          s = s.replace("FIX11.2 CLEAN", "FIX11.8.1 CLEAN")
          p.write_text(s)
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd WineGlass
          rm -rf WineGlass.xcodeproj
          xcodegen generate

          test -f WineGlass.xcodeproj/project.pbxproj
          grep -m1 "objectVersion" WineGlass.xcodeproj/project.pbxproj || true

          if grep -q "objectVersion = 77" WineGlass.xcodeproj/project.pbxproj; then
            echo "ERROR: unsupported objectVersion 77"
            exit 1
          fi

      - name: Build POSTAL 2 FIX 11.8.1 CLEAN
        shell: bash
        run: |
          set -o pipefail

          cd WineGlass
          rm -rf build

          xcodebuild             -project WineGlass.xcodeproj             -scheme WineGlass             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath build             ARCHS=arm64             ONLY_ACTIVE_ARCH=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native             build             2>&1 | tee xcodebuild.log

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail

          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"

          test -d "$APP"
          test -f "$APP/WineGlass"

          lipo -info "$APP/WineGlass"

          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "$ID"
          test "$ID" = "com.postal2ios.native"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          OUT="$ROOT/out"

          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          mkdir -p "$APP/VC120"

          cp "$ROOT/vc120-runtime/msvcr120.dll" "$APP/VC120/msvcr120.dll"
          cp "$ROOT/vc120-runtime/msvcp120.dll" "$APP/VC120/msvcp120.dll"

          test -s "$APP/VC120/msvcr120.dll"
          test -s "$APP/VC120/msvcp120.dll"

          cp -R "$APP" "$OUT/Payload/POSTAL 2.app"

          cd "$OUT"
          zip -qry "POSTAL-2-iOS-v11.8.1-CLEAN.ipa" Payload
          ls -lh "POSTAL-2-iOS-v11.8.1-CLEAN.ipa"

      - name: Upload POSTAL 2 FIX 11.8.1 CLEAN IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v11.8.1-CLEAN
          path: out/POSTAL-2-iOS-v11.8.1-CLEAN.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p debug-fix11-8-1-clean
          cp WineGlass/xcodebuild.log debug-fix11-8-1-clean/ 2>/dev/null || true
          cp blink-src/config.h debug-fix11-8-1-clean/blink-config.h 2>/dev/null || true
          cp WineGlass/Vendor/blink/wg_blink_impl.c debug-fix11-8-1-clean/ 2>/dev/null || true
          cp WineGlass/Sources/Core/wg_engine.c debug-fix11-8-1-clean/ 2>/dev/null || true
          cp WineGlass/Sources/App/WGSceneDelegate.m debug-fix11-8-1-clean/ 2>/dev/null || true
          cp WineGlass/project.yml debug-fix11-8-1-clean/ 2>/dev/null || true
          cp vc120-runtime/msvcr120.dll debug-fix11-8-1-clean/ 2>/dev/null || true
          cp vc120-runtime/msvcp120.dll debug-fix11-8-1-clean/ 2>/dev/null || true

      - name: Upload FIX 11.8.1 CLEAN debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX11.8.1-CLEAN-DEBUG
          path: debug-fix11-8-1-clean
          if-no-files-found: ignore
          retention-days: 7
