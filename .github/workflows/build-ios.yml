name: POSTAL 2 Full Data iOS FIXED Importer v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Native iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          brew install xcodegen

          echo
          echo "===== XCODE ====="
          xcodebuild -version

          echo
          echo "===== XCODEGEN ====="
          xcodegen --version

          echo
          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================================
      # CREATE PROJECT
      # ==========================================================

      - name: Create POSTAL 2 iOS project
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          rm -rf Postal2iOS
          mkdir -p Postal2iOS/Sources

          cat > Postal2iOS/project.yml <<'YAML'
          name: Postal2iOS

          options:
            bundleIdPrefix: com.postal2ios

          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1"
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""

          targets:
            Postal2iOS:
              type: application
              platform: iOS

              sources:
                - Sources

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native
                  PRODUCT_NAME: Postal2iOS
                  INFOPLIST_KEY_CFBundleDisplayName: "POSTAL 2"
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO

              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: POSTAL 2
                  CFBundleName: POSTAL 2
                  UIApplicationSupportsIndirectInputEvents: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                    - UIInterfaceOrientationPortrait
                  UILaunchScreen: {}
          YAML

      # ==========================================================
      # SWIFT APP
      # ==========================================================

      - name: Create POSTAL 2 importer
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          cat > Postal2iOS/Sources/Postal2App.swift <<'SWIFT'
          import SwiftUI
          import UniformTypeIdentifiers
          import Foundation

          @main
          struct Postal2App: App {

              var body: some Scene {

                  WindowGroup {

                      ContentView()
                          .preferredColorScheme(
                              .dark
                          )
                  }
              }
          }

          // =====================================================
          // FILE COUNTERS
          // =====================================================

          struct PostalCounts {

              var maps = 0

              var staticMeshes = 0

              var textures = 0

              var animations = 0

              var scripts = 0

              var sounds = 0

              var music = 0

              var configs = 0

              var total = 0
          }

          // =====================================================
          // MAIN VIEW
          // =====================================================

          struct ContentView: View {

              @State private var showImporter =
                  false

              @State private var importing =
                  false

              @State private var status =
                  "Import the full POSTAL 2 folder"

              @State private var errorText:
                  String? = nil

              @State private var progressText =
                  ""

              @State private var counts =
                  PostalCounts()

              private let fm =
                  FileManager.default

              // =================================================
              // UI
              // =================================================

              var body: some View {

                  ScrollView {

                      VStack(
                          spacing: 16
                      ) {

                          Text(
                              "POSTAL 2 iOS"
                          )
                          .font(
                              .system(
                                  size: 30,
                                  weight: .bold
                              )
                          )

                          Text(
                              "Native ARM64 runtime"
                          )
                          .foregroundStyle(
                              .secondary
                          )

                          // =====================================
                          // IMPORT BUTTON
                          // =====================================

                          Button {

                              errorText =
                                  nil

                              showImporter =
                                  true

                          } label: {

                              HStack {

                                  Image(
                                      systemName:
                                          "folder.badge.plus"
                                  )

                                  Text(
                                      importing
                                      ? "Importing…"
                                      : "Import POSTAL 2 Folder"
                                  )
                              }
                              .frame(
                                  maxWidth:
                                      .infinity
                              )
                              .padding()
                          }
                          .buttonStyle(
                              .borderedProminent
                          )
                          .disabled(
                              importing
                          )

                          // =====================================
                          // IMPORT PROGRESS
                          // =====================================

                          if importing {

                              ProgressView()
                                  .padding(
                                      .top,
                                      4
                                  )

                              if !progressText.isEmpty {

                                  Text(
                                      progressText
                                  )
                                  .font(
                                      .caption
                                  )
                                  .foregroundStyle(
                                      .secondary
                                  )
                              }
                          }

                          Divider()

                          // =====================================
                          // PACKAGE COUNTS
                          // =====================================

                          VStack(
                              spacing: 8
                          ) {

                              StatRow(
                                  title:
                                      "Maps",
                                  ext:
                                      ".fuk",
                                  value:
                                      counts.maps
                              )

                              StatRow(
                                  title:
                                      "StaticMeshes",
                                  ext:
                                      ".usx",
                                  value:
                                      counts.staticMeshes
                              )

                              StatRow(
                                  title:
                                      "Textures",
                                  ext:
                                      ".utx",
                                  value:
                                      counts.textures
                              )

                              StatRow(
                                  title:
                                      "Animations",
                                  ext:
                                      ".ukx",
                                  value:
                                      counts.animations
                              )

                              StatRow(
                                  title:
                                      "Scripts",
                                  ext:
                                      ".u",
                                  value:
                                      counts.scripts
                              )

                              StatRow(
                                  title:
                                      "Sounds",
                                  ext:
                                      ".uax / wav",
                                  value:
                                      counts.sounds
                              )

                              StatRow(
                                  title:
                                      "Music",
                                  ext:
                                      ".ogg / mp3",
                                  value:
                                      counts.music
                              )

                              StatRow(
                                  title:
                                      "Configs",
                                  ext:
                                      ".ini / int",
                                  value:
                                      counts.configs
                              )
                          }

                          Divider()

                          // =====================================
                          // TOTAL FILES
                          // =====================================

                          HStack {

                              Text(
                                  "TOTAL FILES"
                              )
                              .fontWeight(
                                  .bold
                              )

                              Spacer()

                              Text(
                                  "\(counts.total)"
                              )
                              .fontWeight(
                                  .bold
                              )
                          }

                          // =====================================
                          // STATUS
                          // =====================================

                          Text(
                              status
                          )
                          .font(
                              .system(
                                  size: 14,
                                  weight:
                                      .medium
                              )
                          )
                          .multilineTextAlignment(
                              .center
                          )
                          .foregroundStyle(
                              errorText == nil
                              ? .green
                              : .red
                          )
                          .padding(
                              .top,
                              4
                          )

                          if let errorText {

                              Text(
                                  errorText
                              )
                              .font(
                                  .caption
                              )
                              .foregroundStyle(
                                  .red
                              )
                              .multilineTextAlignment(
                                  .center
                              )
                              .textSelection(
                                  .enabled
                              )
                          }

                          Text(
                              "Select ONE main POSTAL 2 folder containing Maps, StaticMeshes, Textures, Animations, Sounds, Music and System."
                          )
                          .font(
                              .caption
                          )
                          .foregroundStyle(
                              .secondary
                          )
                          .multilineTextAlignment(
                              .center
                          )
                          .padding(
                              .top,
                              8
                          )
                      }
                      .padding(
                          20
                      )
                  }

                  // =============================================
                  // FOLDER IMPORTER
                  // =============================================

                  .fileImporter(
                      isPresented:
                          $showImporter,
                      allowedContentTypes:
                          [.folder],
                      allowsMultipleSelection:
                          false
                  ) { result in

                      switch result {

                      case .success(
                          let urls
                      ):

                          guard let source =
                              urls.first
                          else {

                              fail(
                                  "No folder selected"
                              )

                              return
                          }

                          beginImport(
                              source
                          )

                      case .failure(
                          let error
                      ):

                          fail(
                              "Folder picker error: \(error.localizedDescription)"
                          )
                      }
                  }

                  // =============================================
                  // FIND EXISTING IMPORT
                  // =============================================

                  .onAppear {

                      scanExistingImport()
                  }
              }

              // =================================================
              // BEGIN IMPORT
              // =================================================

              private func beginImport(
                  _ source: URL
              ) {

                  importing =
                      true

                  status =
                      "Reading POSTAL 2 folder…"

                  progressText =
                      source.lastPathComponent

                  errorText =
                      nil

                  counts =
                      PostalCounts()

                  // =============================================
                  // SECURITY SCOPED ACCESS
                  // =============================================

                  let accessGranted =
                      source
                      .startAccessingSecurityScopedResource()

                  DispatchQueue.global(
                      qos: .userInitiated
                  ).async {

                      defer {

                          if accessGranted {

                              source
                                  .stopAccessingSecurityScopedResource()
                          }
                      }

                      do {

                          let result =
                              try importFolder(
                                  source
                              )

                          DispatchQueue.main.async {

                              counts =
                                  result

                              importing =
                                  false

                              progressText =
                                  ""

                              if (
                                  result.maps > 0 &&
                                  result.staticMeshes > 0 &&
                                  result.textures > 0
                              ) {

                                  status =
                                      "POSTAL 2 data imported successfully"

                                  errorText =
                                      nil

                              } else {

                                  status =
                                      "Folder imported, but required POSTAL 2 packages are missing"

                                  errorText =
                                      "Need at least Maps (.fuk), StaticMeshes (.usx) and Textures (.utx)."
                              }
                          }

                      } catch {

                          DispatchQueue.main.async {

                              importing =
                                  false

                              progressText =
                                  ""

                              status =
                                  "POSTAL 2 import failed"

                              errorText =
                                  error
                                  .localizedDescription
                          }
                      }
                  }
              }

              // =================================================
              // IMPORT FOLDER
              // =================================================

              private func importFolder(
                  _ source: URL
              ) throws -> PostalCounts {

                  guard let documents =
                      fm.urls(
                          for:
                              .documentDirectory,
                          in:
                              .userDomainMask
                      ).first
                  else {

                      throw ImportError(
                          message:
                              "Documents directory unavailable"
                      )
                  }

                  // =============================================
                  // DESTINATION
                  // =============================================

                  let destination =
                      documents
                      .appendingPathComponent(
                          "Postal2FullData",
                          isDirectory:
                              true
                      )

                  try fm
                      .createDirectory(
                          at:
                              destination,
                          withIntermediateDirectories:
                              true
                      )

                  let keys:
                      [URLResourceKey] = [

                          .isDirectoryKey,

                          .isRegularFileKey,

                          .fileSizeKey
                      ]

                  guard let enumerator =
                      fm.enumerator(
                          at:
                              source,
                          includingPropertiesForKeys:
                              keys,
                          options: [

                              .skipsHiddenFiles,

                              .skipsPackageDescendants
                          ]
                      )
                  else {

                      throw ImportError(
                          message:
                              "Could not read selected folder"
                      )
                  }

                  var result =
                      PostalCounts()

                  var copied =
                      0

                  var scanned =
                      0

                  // =============================================
                  // POSTAL 2 FILE TYPES
                  // =============================================

                  let allowedExtensions:
                      Set<String> = [

                          "fuk",

                          "usx",

                          "utx",

                          "ukx",

                          "u",

                          "uax",

                          "wav",

                          "ogg",

                          "mp3",

                          "ini",

                          "int",

                          "bmp",

                          "tga",

                          "png",

                          "jpg",

                          "jpeg",

                          "txt"
                      ]

                  // =============================================
                  // WALK DIRECTORY
                  // =============================================

                  while let item =
                      enumerator.nextObject()
                          as? URL {

                      scanned += 1

                      let values =
                          try? item
                              .resourceValues(
                                  forKeys:
                                      Set(keys)
                              )

                      if values?
                          .isDirectory ==
                          true {

                          continue
                      }

                      guard values?
                          .isRegularFile ==
                          true
                      else {

                          continue
                      }

                      let ext =
                          item
                          .pathExtension
                          .lowercased()

                      guard allowedExtensions
                          .contains(
                              ext
                          )
                      else {

                          continue
                      }

                      // =========================================
                      // KEEP ORIGINAL DIRECTORY STRUCTURE
                      // =========================================

                      let sourceRoot =
                          source
                          .standardizedFileURL
                          .path

                      let fullPath =
                          item
                          .standardizedFileURL
                          .path

                      var relative =
                          fullPath

                      if relative.hasPrefix(
                          sourceRoot
                      ) {

                          relative.removeFirst(
                              sourceRoot.count
                          )
                      }

                      while relative.hasPrefix(
                          "/"
                      ) {

                          relative.removeFirst()
                      }

                      if relative.isEmpty {

                          relative =
                              item.lastPathComponent
                      }

                      let target =
                          destination
                          .appendingPathComponent(
                              relative
                          )

                      let parent =
                          target
                          .deletingLastPathComponent()

                      try fm
                          .createDirectory(
                              at:
                                  parent,
                              withIntermediateDirectories:
                                  true
                          )

                      // =========================================
                      // REPLACE EXISTING FILE
                      // =========================================

                      if fm
                          .fileExists(
                              atPath:
                                  target.path
                          ) {

                          try fm
                              .removeItem(
                                  at:
                                      target
                              )
                      }

                      // =========================================
                      // COPY FILE
                      // =========================================

                      try fm
                          .copyItem(
                              at:
                                  item,
                              to:
                                  target
                          )

                      copied += 1

                      classify(
                          extensionName:
                              ext,
                          counts:
                              &result
                      )

                      // =========================================
                      // UPDATE PROGRESS
                      // =========================================

                      if copied % 25 == 0 {

                          let c =
                              copied

                          let s =
                              scanned

                          DispatchQueue.main.async {

                              progressText =
                                  "Imported \(c) files • scanned \(s)"
                          }
                      }
                  }

                  result.total =
                      copied

                  if copied == 0 {

                      throw ImportError(
                          message:
                              "No supported POSTAL 2 files were found in this folder"
                      )
                  }

                  return result
              }

              // =================================================
              // CLASSIFY POSTAL FILE
              // =================================================

              private func classify(
                  extensionName ext:
                      String,
                  counts:
                      inout PostalCounts
              ) {

                  switch ext {

                  case "fuk":

                      counts.maps += 1

                  case "usx":

                      counts.staticMeshes += 1

                  case "utx":

                      counts.textures += 1

                  case "ukx":

                      counts.animations += 1

                  case "u":

                      counts.scripts += 1

                  case "uax",
                       "wav":

                      counts.sounds += 1

                  case "ogg",
                       "mp3":

                      counts.music += 1

                  case "ini",
                       "int":

                      counts.configs += 1

                  default:

                      break
                  }
              }

              // =================================================
              // SCAN EXISTING IMPORT
              // =================================================

              private func scanExistingImport() {

                  guard let documents =
                      fm.urls(
                          for:
                              .documentDirectory,
                          in:
                              .userDomainMask
                      ).first
                  else {

                      return
                  }

                  let root =
                      documents
                      .appendingPathComponent(
                          "Postal2FullData",
                          isDirectory:
                              true
                      )

                  guard fm
                      .fileExists(
                          atPath:
                              root.path
                      )
                  else {

                      return
                  }

                  DispatchQueue.global(
                      qos:
                          .utility
                  ).async {

                      guard let enumerator =
                          fm.enumerator(
                              at:
                                  root,
                              includingPropertiesForKeys:
                                  [.isRegularFileKey],
                              options:
                                  [.skipsHiddenFiles]
                          )
                      else {

                          return
                      }

                      var result =
                          PostalCounts()

                      var total =
                          0

                      while let item =
                          enumerator.nextObject()
                              as? URL {

                          let ext =
                              item
                              .pathExtension
                              .lowercased()

                          switch ext {

                          case "fuk",
                               "usx",
                               "utx",
                               "ukx",
                               "u",
                               "uax",
                               "wav",
                               "ogg",
                               "mp3",
                               "ini",
                               "int":

                              total += 1

                              classify(
                                  extensionName:
                                      ext,
                                  counts:
                                      &result
                              )

                          default:

                              continue
                          }
                      }

                      result.total =
                          total

                      if total > 0 {

                          DispatchQueue.main.async {

                              counts =
                                  result

                              status =
                                  "Existing POSTAL 2 data found"
                          }
                      }
                  }
              }

              // =================================================
              // ERROR
              // =================================================

              private func fail(
                  _ text: String
              ) {

                  importing =
                      false

                  status =
                      "Import failed"

                  errorText =
                      text
              }
          }

          // =====================================================
          // STAT ROW
          // =====================================================

          struct StatRow: View {

              let title:
                  String

              let ext:
                  String

              let value:
                  Int

              var body: some View {

                  HStack {

                      VStack(
                          alignment:
                              .leading,
                          spacing:
                              2
                      ) {

                          Text(
                              title
                          )

                          Text(
                              ext
                          )
                          .font(
                              .caption2
                          )
                          .foregroundStyle(
                              .secondary
                          )
                      }

                      Spacer()

                      Text(
                          "\(value)"
                      )

                      // =========================================
                      // FIXED:
                      //
                      // OLD:
                      //
                      // .system(
                      //     design: .monospaced
                      // )
                      //
                      // caused:
                      //
                      // missing argument for parameter #1
                      //
                      // NEW:
                      // =========================================

                      .font(
                          .system(
                              .body,
                              design:
                                  .monospaced
                          )
                      )
                  }
              }
          }

          // =====================================================
          // IMPORT ERROR
          // =====================================================

          struct ImportError:
              LocalizedError {

              let message:
                  String

              var errorDescription:
                  String? {

                  message
              }
          }
          SWIFT

          # ======================================================
          # INFO.PLIST
          # ======================================================

          cat > Postal2iOS/Sources/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>CFBundleDisplayName</key>
              <string>POSTAL 2</string>

              <key>CFBundleName</key>
              <string>POSTAL 2</string>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>
              <array>

                  <string>
                  UIInterfaceOrientationLandscapeLeft
                  </string>

                  <string>
                  UIInterfaceOrientationLandscapeRight
                  </string>

                  <string>
                  UIInterfaceOrientationPortrait
                  </string>

              </array>

              <key>UILaunchScreen</key>
              <dict/>

          </dict>
          </plist>
          PLIST

      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/Postal2iOS"

          xcodegen generate

          echo
          echo "======================================"
          echo "PROJECT GENERATED"
          echo "======================================"

          find . \
            -maxdepth 2 \
            -type f \
            -print

      # ==========================================================
      # CHECK SWIFT SOURCE BEFORE BUILD
      # ==========================================================

      - name: Verify importer source
        shell: bash
        run: |
          set -e

          SWIFT="$GITHUB_WORKSPACE/Postal2iOS/Sources/Postal2App.swift"

          test -f "$SWIFT"

          echo
          echo "======================================"
          echo "IMPORTER SOURCE CHECK"
          echo "======================================"

          grep -n \
            "fileImporter" \
            "$SWIFT"

          grep -n \
            "startAccessingSecurityScopedResource" \
            "$SWIFT"

          grep -n \
            "Postal2FullData" \
            "$SWIFT"

          grep -n \
            "Imported" \
            "$SWIFT"

          grep -n \
            "design:" \
            "$SWIFT"

          echo
          echo "======================================"
          echo "SOURCE READY"
          echo "======================================"

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build POSTAL 2 iOS
        shell: bash
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/Postal2iOS"

          rm -rf \
            "$GITHUB_WORKSPACE/build"

          mkdir -p \
            "$GITHUB_WORKSPACE/build"

          echo
          echo "======================================"
          echo "BUILDING POSTAL 2 iOS ARM64"
          echo "======================================"

          xcodebuild \
            -project Postal2iOS.xcodeproj \
            -scheme Postal2iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/build/xcodebuild.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"

            grep \
              -n \
              -E \
              "error:|fatal error:" \
              "$GITHUB_WORKSPACE/build/xcodebuild.log" \
              | tail \
                  -200 \
              || true

            echo
            echo "======================================"

            exit "$STATUS"
          fi

          echo
          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"

      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -e

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -type d \
              -name "Postal2iOS.app" \
              | head -n 1
          )"

          if [ -z "$APP" ]; then

            echo
            echo "ERROR: Postal2iOS.app not found"

            exit 1
          fi

          echo "APP_PATH=$APP" \
            >> "$GITHUB_ENV"

          echo
          echo "======================================"
          echo "APP FOUND"
          echo "======================================"

          echo "$APP"

          du \
            -sh \
            "$APP"

      # ==========================================================
      # CHECK ARM64
      # ==========================================================

      - name: Verify ARM64 binary
        shell: bash
        run: |
          set -e

          BIN="$APP_PATH/Postal2iOS"

          test -f "$BIN"

          echo
          echo "======================================"
          echo "BINARY"
          echo "======================================"

          file "$BIN"

          echo
          echo "======================================"
          echo "ARCHITECTURE"
          echo "======================================"

          lipo \
            -info \
            "$BIN" \
            || true

      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"

          mkdir -p \
            "$OUTPUT/Payload"

          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/POSTAL2.app"

          cd "$OUTPUT"

          zip \
            -qry \
            "POSTAL-2-iOS-FullData-Importer-FIXED-v2.ipa" \
            Payload

          rm -rf \
            Payload

          echo
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls \
            -lh \
            POSTAL-2-iOS-FullData-Importer-FIXED-v2.ipa

      # ==========================================================
      # VERIFY IPA
      # ==========================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          IPA="$GITHUB_WORKSPACE/output/POSTAL-2-iOS-FullData-Importer-FIXED-v2.ipa"

          test -f "$IPA"

          TMP="$RUNNER_TEMP/postal2-ipa"

          rm -rf "$TMP"

          mkdir -p "$TMP"

          unzip \
            -q \
            "$IPA" \
            -d "$TMP"

          APP="$TMP/Payload/POSTAL2.app"

          test -d "$APP"

          echo
          echo "======================================"
          echo "BUNDLE ID"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo
          echo "======================================"
          echo "FILE SHARING"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :UIFileSharingEnabled" \
            "$APP/Info.plist" \
            || true

          echo
          echo "======================================"
          echo "OPEN DOCUMENTS IN PLACE"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :LSSupportsOpeningDocumentsInPlace" \
            "$APP/Info.plist" \
            || true

          echo
          echo "======================================"
          echo "IPA CONTENTS"
          echo "======================================"

          unzip \
            -l \
            "$IPA" \
            | head \
                -60

      # ==========================================================
      # README
      # ==========================================================

      - name: Create README
        shell: bash
        run: |
          set -e

          cat > \
            "$GITHUB_WORKSPACE/output/README.txt" \
            <<'EOF'
          POSTAL 2 iOS
          FULL DATA IMPORTER FIXED v2
          ===========================

          CURRENT STAGE
          -------------

          POSTAL 2 full-data importer.

          This build does NOT yet run the complete POSTAL 2 game.

          Its job is to import and preserve the original POSTAL 2
          game-data directory on iOS so the next native-runtime
          stages can use it.


          HOW TO IMPORT
          -------------

          1. Install the IPA.

          2. Open POSTAL 2.

          3. Press:

             Import POSTAL 2 Folder

          4. iOS Files opens.

          5. Select ONE MAIN POSTAL 2 folder.

          It should contain data such as:

             Maps

             StaticMeshes

             Textures

             Animations

             Sounds

             Music

             System


          6. Press Open.


          EXPECTED RESULT
          ---------------

          The app immediately displays:

             Reading POSTAL 2 folder…

          Then the file counter starts increasing.

          Example:

             Imported 25 files

             Imported 50 files

             Imported 75 files


          PACKAGE TYPES
          -------------

          Maps
          .fuk

          Static meshes
          .usx

          Textures
          .utx

          Animations
          .ukx

          Scripts
          .u

          Sounds
          .uax
          .wav

          Music
          .ogg
          .mp3

          Config
          .ini
          .int


          IMPORT LOCATION
          ---------------

          Imported files are stored inside:

             Documents/Postal2FullData


          IMPORTANT
          ---------

          Do NOT select only Maps.

          Do NOT select only Textures.

          Do NOT import each folder one by one.

          Select the MAIN POSTAL 2 folder once.


          FIX IN v2
          ---------

          Fixed Swift compiler error:

             missing argument for parameter #1 in call

          Old invalid font call:

             .system(
                 design: .monospaced
             )

          New valid font call:

             .system(
                 .body,
                 design: .monospaced
             )


          BUNDLE
          ------

          Bundle ID:

             com.postal2ios.native


          PLATFORM
          --------

          iPhone ARM64

          Minimum iOS:

             iOS 15


          NEXT STAGE
          ----------

          After full-data import works correctly:

          package indexing

          Unreal package reader

          map dependency resolution

          Bridge map loading

          rendering

          controls

          gameplay runtime


          IPA is unsigned.

          Re-sign with your normal iOS sideloading method.
          EOF

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload POSTAL 2 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Postal2Native-FullData-Importer-FIXED-v2
          path: |
            output/POSTAL-2-iOS-FullData-Importer-FIXED-v2.ipa
            output/README.txt
          if-no-files-found: error
          retention-days: 7

      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Postal2Native-FullData-Importer-FIXED-v2-failed
          path: |
            Postal2iOS/project.yml
            Postal2iOS/Sources/Postal2App.swift
            Postal2iOS/Sources/Info.plist
            build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
