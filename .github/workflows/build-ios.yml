name: POSTAL 2 iOS v6 ORIGINAL EXE TEST FIX 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Windows x86 runtime
    runs-on: macos-14
    timeout-minutes: 120

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          echo
          echo "===== XCODE ====="
          xcodebuild -version

          echo
          echo "===== XCODEGEN ====="
          xcodegen --version

          echo
          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "===== GNU MAKE ====="
          gmake --version | head -n 1

          echo
          echo "===== FLOCK ====="
          command -v flock


      # ==========================================================
      # CLONE
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf WineGlass
          rm -rf blink

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink

          echo
          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo
          echo "===== BLINK COMMIT ====="
          git -C blink rev-parse HEAD


      # ==========================================================
      # BUILD BLINK
      #
      # NO JIT FOR FIRST POSTAL 2 TEST
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          BLINK="$GITHUB_WORKSPACE/blink"
          WG="$GITHUB_WORKSPACE/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"

          cd "$BLINK"

          echo
          echo "======================================"
          echo "BLINK SOURCE"
          echo "======================================"

          test -f config.h.in
          test -f configure

          echo
          echo "config.h.in exists"

          echo
          echo "======================================"
          echo "CONFIGURE BLINK FOR IOS"
          echo "======================================"

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-g -O2 -fno-common -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

          echo
          echo "======================================"
          echo "PATCH IOS CONFIG"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          config = Path("config.h")

          text = config.read_text()


          # ======================================================
          # FORCE NO-JIT SETTINGS
          # ======================================================

          force_enable = [

              "DISABLE_JIT",

              "DISABLE_THREADS",

              "DISABLE_SOCKETS",

              "HAVE_INT128",

              "HAVE_SYSCTL",

              "HAVE_SA_LEN",

              "HAVE_WCWIDTH",

              "HAVE_MEMCCPY",

              "HAVE_SEEKDIR",

              "HAVE_REALPATH",

              "HAVE_GETENTROPY",

              "HAVE_DEV_URANDOM",

              "HAVE_SCHED_YIELD",

              "HAVE_MAP_ANONYMOUS",

              "HAVE_MAP_SHARED",

              "HAVE_STRUCT_TIMEZONE"
          ]


          for name in force_enable:

              text = re.sub(

                  rf'^\s*//\s*#define\s+{re.escape(name)}\s*$',

                  f'#define {name}',

                  text,

                  flags=re.MULTILINE
              )


              if (

                  name.startswith("DISABLE_")

                  and

                  f"#define {name}" not in text

              ):

                  text = text.replace(

                      f"// #define {name}",

                      f"#define {name}"
                  )


          config.write_text(
              text
          )


          # ======================================================
          # MAKE BUILD HELPER FIX
          #
          # The build target remains ARM64 iPhoneOS because that
          # comes from CC/CFLAGS.
          #
          # This only prevents make from trying to execute the
          # freshly built iPhone binary on the macOS runner.
          # ======================================================

          config_mk = Path(
              "config.mk"
          )

          mk = config_mk.read_text()


          mk = re.sub(

              r'^HOST_SYSTEM\s*=.*$',

              'HOST_SYSTEM = Linux',

              mk,

              flags=re.MULTILINE
          )


          mk = re.sub(

              r'^HOST_ARCH\s*=.*$',

              'HOST_ARCH = x86_64',

              mk,

              flags=re.MULTILINE
          )


          config_mk.write_text(
              mk
          )
          PY


          echo
          echo "======================================"
          echo "CONFIG FLAGS"
          echo "======================================"

          grep \
            -E \
            "DISABLE_JIT|DISABLE_THREADS|DISABLE_SOCKETS|HAVE_MAP_ANONYMOUS|HAVE_MAP_SHARED|HAVE_SYSCTL" \
            config.h \
            || true


          echo
          echo "======================================"
          echo "CONFIG.MK"
          echo "======================================"

          grep \
            -E \
            "^HOST_SYSTEM|^HOST_ARCH|^CC =|^AR =|^CFLAGS =" \
            config.mk


          echo
          echo "======================================"
          echo "BUILD BLINK.A"
          echo "======================================"

          gmake \
            -j"$(sysctl -n hw.ncpu)" \
            o//blink/blink.a


          test -f \
            o//blink/blink.a


          mkdir -p \
            "$WG/Vendor/blink/lib"


          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"


          echo
          echo "======================================"
          echo "BUILD BLINK BRIDGE"
          echo "======================================"

          "$CC" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -fno-common \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"


          echo
          echo "======================================"
          echo "VERIFY BLINK"
          echo "======================================"

          file \
            "$WG/Vendor/blink/lib/blink.a"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            | grep \
                -q \
                "arm64"


          echo
          echo "BLINK ARM64 NO-JIT READY"


      # ==========================================================
      # PATCH WINEGLASS
      #
      # SAME BUNDLE ID AS OLD v5:
      #
      # com.postal2ios.native
      #
      # ==========================================================

      - name: Patch WineGlass into POSTAL 2 v6
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"


          python3 <<'PY'
          from pathlib import Path
          import plistlib
          import re


          # ======================================================
          # PROJECT.YML
          # ======================================================

          project = Path(
              "project.yml"
          )


          text = project.read_text()


          text = text.replace(

              "bundleIdPrefix: com.wineglass",

              "bundleIdPrefix: com.postal2ios"
          )


          text = text.replace(

              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",

              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )


          text = re.sub(

              r'xcodeVersion:\s*"[^"]+"',

              'xcodeVersion: "15.4"',

              text,

              count=1
          )


          if "projectFormat:" not in text:

              text = text.replace(

                  '  xcodeVersion: "15.4"',

                  '  xcodeVersion: "15.4"\n'
                  '  projectFormat: xcode15_3',

                  1
              )


          text = text.replace(

              'TARGETED_DEVICE_FAMILY: "1,2"',

              'TARGETED_DEVICE_FAMILY: "1"'
          )


          text = re.sub(

              r'^\s*CODE_SIGN_ENTITLEMENTS:.*\n',

              '',

              text,

              flags=re.MULTILINE
          )


          text = text.replace(

              "CODE_SIGN_STYLE: Automatic",

              "CODE_SIGN_STYLE: Manual"
          )


          text = re.sub(

              r'^\s*DEVELOPMENT_TEAM:.*\n',

              '',

              text,

              flags=re.MULTILINE
          )


          project.write_text(
              text
          )


          # ======================================================
          # INFO.PLIST
          # ======================================================

          plist_path = Path(
              "Sources/App/Info.plist"
          )


          with plist_path.open(
              "rb"
          ) as f:

              info = plistlib.load(
                  f
              )


          info[
              "CFBundleName"
          ] = "POSTAL 2"


          info[
              "CFBundleDisplayName"
          ] = "POSTAL 2"


          info[
              "CFBundleShortVersionString"
          ] = "0.6"


          info[
              "CFBundleVersion"
          ] = "6"


          info[
              "UIFileSharingEnabled"
          ] = True


          info[
              "LSSupportsOpeningDocumentsInPlace"
          ] = True


          with plist_path.open(
              "wb"
          ) as f:

              plistlib.dump(

                  info,

                  f,

                  sort_keys=False
              )


          # ======================================================
          # LOG FILE
          #
          # All WineGlass messages will also be written to:
          #
          # Documents/POSTAL2-WineGlass.log
          # ======================================================

          log_path = Path(
              "Sources/Core/wg_log.c"
          )


          log = log_path.read_text()


          if "#include <stdlib.h>" not in log:

              log = log.replace(

                  "#include <pthread.h>",

                  "#include <pthread.h>\n"
                  "#include <stdlib.h>",

                  1
              )


          old_mutex = (

              "static pthread_mutex_t s_mutex   = "
              "PTHREAD_MUTEX_INITIALIZER;"
          )


          new_mutex = (

              "static pthread_mutex_t s_mutex   = "
              "PTHREAD_MUTEX_INITIALIZER;\n"
              "static FILE *s_postal_file = NULL;"
          )


          if old_mutex not in log:

              raise SystemExit(
                  "Could not find wg_log mutex"
              )


          log = log.replace(

              old_mutex,

              new_mutex,

              1
          )


          old_init = """void wg_log_init(void) {
              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;
          }"""


          new_init = """void wg_log_init(void) {
              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;

              const char *home = getenv("HOME");

              if (home && home[0]) {

                  char path[1024];

                  snprintf(
                      path,
                      sizeof(path),
                      "%s/Documents/POSTAL2-WineGlass.log",
                      home
                  );

                  if (s_postal_file) {

                      fclose(
                          s_postal_file
                      );

                      s_postal_file =
                          NULL;
                  }

                  s_postal_file =
                      fopen(
                          path,
                          "w"
                      );

                  if (s_postal_file) {

                      setvbuf(
                          s_postal_file,
                          NULL,
                          _IOLBF,
                          0
                      );

                      fprintf(
                          s_postal_file,
                          "POSTAL 2 iOS v6 WineGlass log\\n"
                      );

                      fflush(
                          s_postal_file
                      );
                  }
              }
          }"""


          if old_init not in log:

              raise SystemExit(
                  "Could not patch wg_log_init"
              )


          log = log.replace(

              old_init,

              new_init,

              1
          )


          old_write = """    fprintf(stderr, "[%s/%s] %s\\n", level_names[lvl], safe_tag, buf);
              pthread_mutex_lock(&s_mutex);"""


          new_write = """    fprintf(stderr, "[%s/%s] %s\\n", level_names[lvl], safe_tag, buf);

              pthread_mutex_lock(&s_mutex);

              if (s_postal_file) {

                  fprintf(
                      s_postal_file,
                      "[%s/%s] %s\\n",
                      level_names[lvl],
                      safe_tag,
                      buf
                  );

                  fflush(
                      s_postal_file
                  );
              }"""


          if old_write not in log:

              raise SystemExit(
                  "Could not patch wg_log writer"
              )


          log = log.replace(

              old_write,

              new_write,

              1
          )


          log_path.write_text(
              log
          )


          # ======================================================
          # POSTAL2.EXE BUTTON
          # ======================================================

          scene_path = Path(
              "Sources/App/WGSceneDelegate.m"
          )


          scene = scene_path.read_text()


          old_title = (

              '[_loadButton setTitle:@"  Load .exe  " '
              'forState:UIControlStateNormal];'
          )


          new_title = (

              '[_loadButton setTitle:@"  RUN POSTAL 2  " '
              'forState:UIControlStateNormal];'
          )


          if old_title not in scene:

              raise SystemExit(
                  "Load .exe title not found"
              )


          scene = scene.replace(

              old_title,

              new_title,

              1
          )


          old_action = (

              '[_loadButton addTarget:self '
              'action:@selector(openFilePicker) '
              'forControlEvents:UIControlEventTouchUpInside];'
          )


          new_action = (

              '[_loadButton addTarget:self '
              'action:@selector(runPostal2) '
              'forControlEvents:UIControlEventTouchUpInside];'
          )


          if old_action not in scene:

              raise SystemExit(
                  "Load button action not found"
              )


          scene = scene.replace(

              old_action,

              new_action,

              1
          )


          # ======================================================
          # INSERT POSTAL 2 METHODS
          # ======================================================

          marker = (

              "#pragma mark - UIDocumentPickerDelegate"
          )


          if marker not in scene:

              raise SystemExit(
                  "UIDocumentPicker marker not found"
              )


          methods = r'''
          // =====================================================
          // POSTAL 2
          // =====================================================


          - (NSString *)findPostal2Exe {

              NSArray *paths =

                  NSSearchPathForDirectoriesInDomains(

                      NSDocumentDirectory,

                      NSUserDomainMask,

                      YES
                  );


              NSString *docs =
                  paths.firstObject;


              if (!docs) {

                  WG_LOGE(

                      "POSTAL2",

                      "Documents directory unavailable"
                  );

                  return nil;
              }


              NSString *root =

                  [
                      docs

                      stringByAppendingPathComponent:
                          @"Postal2FullData"
                  ];


              NSFileManager *fm =

                  [
                      NSFileManager
                      defaultManager
                  ];


              BOOL isDirectory =
                  NO;


              if (

                  ![
                      fm

                      fileExistsAtPath:
                          root

                      isDirectory:
                          &isDirectory
                  ]

                  ||

                  !isDirectory

              ) {

                  WG_LOGE(

                      "POSTAL2",

                      "Existing v5 folder missing: %s",

                      root.UTF8String
                  );


                  return nil;
              }


              // ===============================================
              // NORMAL POSTAL 2 PATH
              // ===============================================


              NSString *normal =

                  [
                      root

                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"
                  ];


              if (

                  [
                      fm

                      fileExistsAtPath:
                          normal
                  ]

              ) {

                  WG_LOGI(

                      "POSTAL2",

                      "Found normal EXE: %s",

                      normal.UTF8String
                  );


                  return normal;
              }


              // ===============================================
              // RECURSIVE FALLBACK
              // ===============================================


              NSDirectoryEnumerator *enumerator =

                  [
                      fm

                      enumeratorAtPath:
                          root
                  ];


              NSString *relative =
                  nil;


              while (

                  (
                      relative =
                          [
                              enumerator
                              nextObject
                          ]
                  )

              ) {

                  NSString *name =
                      relative.lastPathComponent;


                  if (

                      [
                          name

                          caseInsensitiveCompare:
                              @"Postal2.exe"
                      ]

                      ==

                      NSOrderedSame

                  ) {

                      NSString *found =

                          [
                              root

                              stringByAppendingPathComponent:
                                  relative
                          ];


                      WG_LOGI(

                          "POSTAL2",

                          "Found recursive EXE: %s",

                          found.UTF8String
                      );


                      return found;
                  }
              }


              WG_LOGE(

                  "POSTAL2",

                  "Postal2.exe not found under Postal2FullData"
              );


              return nil;
          }



          // =====================================================
          // RUN ORIGINAL WINDOWS POSTAL 2
          // =====================================================


          - (void)runPostal2 {

              if (!_engine) {

                  WG_LOGW(

                      "POSTAL2",

                      "RUN pressed before engine initialization"
                  );


                  return;
              }


              NSString *exe =

                  [
                      self

                      findPostal2Exe
                  ];


              if (!exe) {

                  [
                      _loadButton

                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "

                      forState:
                          UIControlStateNormal
                  ];


                  return;
              }


              NSString *systemFolder =

                  [
                      exe

                      stringByDeletingLastPathComponent
                  ];


              // Unreal Engine 2 uses lots of relative paths.
              // Put process working directory in System.


              if (

                  chdir(

                      systemFolder
                          .fileSystemRepresentation
                  )

                  !=

                  0

              ) {

                  WG_LOGE(

                      "POSTAL2",

                      "chdir System failed: %s",

                      systemFolder.UTF8String
                  );

              } else {

                  WG_LOGI(

                      "POSTAL2",

                      "Working directory: %s",

                      systemFolder.UTF8String
                  );
              }


              [
                  _loadButton

                  setTitle:
                      @"  STARTING POSTAL 2...  "

                  forState:
                      UIControlStateNormal
              ];


              _loadButton.enabled =
                  NO;


              WG_LOGI(

                  "POSTAL2",

                  "Launching ORIGINAL Windows executable"
              );


              WG_LOGI(

                  "POSTAL2",

                  "EXE = %s",

                  exe.UTF8String
              );


              [
                  self

                  loadAndRunPE:
                      exe
              ];
          }


          '''


          scene = scene.replace(

              marker,

              methods
              +
              "\n"
              +
              marker,

              1
          )


          scene_path.write_text(
              scene
          )


          print(
              "POSTAL 2 v6 patch complete"
          )
          PY


          echo
          echo "======================================"
          echo "BUNDLE ID"
          echo "======================================"

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            project.yml


          echo
          echo "======================================"
          echo "POSTAL 2 PATCH"
          echo "======================================"

          grep \
            -n \
            "RUN POSTAL 2\|findPostal2Exe\|runPostal2\|Postal2FullData" \
            Sources/App/WGSceneDelegate.m


          echo
          echo "======================================"
          echo "LOG PATCH"
          echo "======================================"

          grep \
            -n \
            "POSTAL2-WineGlass.log" \
            Sources/Core/wg_log.c


      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          xcodegen generate

          test -d \
            WineGlass.xcodeproj


          PBX="$GITHUB_WORKSPACE/WineGlass/WineGlass.xcodeproj/project.pbxproj"


          test -f \
            "$PBX"


          echo
          echo "======================================"
          echo "OBJECT VERSION"
          echo "======================================"

          grep \
            -n \
            "objectVersion" \
            "$PBX" \
            | head


          if grep \
            -q \
            "objectVersion = 77;" \
            "$PBX"; then

              echo
              echo "ERROR:"
              echo "Xcode project format 77"

              exit 1
          fi


      # ==========================================================
      # BUILD APPLICATION
      # ==========================================================

      - name: Build POSTAL 2 v6 ARM64
        shell: bash
        run: |
          set +e
          set -o pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          rm -rf \
            "$GITHUB_WORKSPACE/build"

          mkdir -p \
            "$GITHUB_WORKSPACE/build"


          echo
          echo "======================================"
          echo "BUILD POSTAL 2 v6"
          echo "======================================"


          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
                "$GITHUB_WORKSPACE/build/xcodebuild.log"


          STATUS=${PIPESTATUS[0]}


          if [ "$STATUS" -ne 0 ]; then

            echo
            echo "======================================"
            echo "REAL BUILD ERRORS"
            echo "======================================"


            grep \
              -n \
              -E \
              "error:|fatal error:" \
              "$GITHUB_WORKSPACE/build/xcodebuild.log" \
              | tail \
                  -250 \
              || true


            echo
            echo "======================================"


            exit "$STATUS"
          fi


          echo
          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"


      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -euxo pipefail


          APP="$(
            find \
              "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -type d \
              -name "WineGlass.app" \
              | head -n 1
          )"


          if [ -z "$APP" ]; then

            echo
            echo "ERROR:"
            echo "WineGlass.app not found"

            exit 1
          fi


          echo \
            "APP_PATH=$APP" \
            >> "$GITHUB_ENV"


          echo
          echo "======================================"
          echo "APP"
          echo "======================================"

          echo "$APP"


          echo
          echo "======================================"
          echo "EXECUTABLE"
          echo "======================================"

          file \
            "$APP/WineGlass"


          echo
          echo "======================================"
          echo "ARCHITECTURE"
          echo "======================================"

          lipo \
            -info \
            "$APP/WineGlass" \
            || true


          file \
            "$APP/WineGlass" \
            | grep \
                -q \
                "arm64"


      # ==========================================================
      # VERIFY BUNDLE
      # ==========================================================

      - name: Verify v6 bundle identity
        shell: bash
        run: |
          set -euxo pipefail


          INFO="$APP_PATH/Info.plist"


          BUNDLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$INFO"
          )"


          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$INFO"
          )"


          BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$INFO"
          )"


          echo
          echo "======================================"
          echo "IDENTITY"
          echo "======================================"

          echo "Bundle:  $BUNDLE"
          echo "Version: $VERSION"
          echo "Build:   $BUILD"


          test \
            "$BUNDLE" = \
            "com.postal2ios.native"


          test \
            "$VERSION" = \
            "0.6"


          test \
            "$BUILD" = \
            "6"


          echo
          echo "======================================"
          echo "FILE SHARING"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :UIFileSharingEnabled" \
            "$INFO"


      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create POSTAL 2 v6 IPA
        shell: bash
        run: |
          set -euxo pipefail


          OUTPUT="$GITHUB_WORKSPACE/output"


          rm -rf \
            "$OUTPUT"


          mkdir -p \
            "$OUTPUT/Payload"


          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/Postal2iOS.app"


          cd \
            "$OUTPUT"


          echo
          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"


          /usr/bin/zip \
            -qry \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX2.ipa" \
            Payload


          rm -rf \
            Payload


          test -f \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX2.ipa"


          echo
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls \
            -lh \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX2.ipa"


