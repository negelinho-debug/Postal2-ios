name: POSTAL 2 WineGlass iOS FIX 10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 FIX 10
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.0.app/Contents/Developer"
          else
            echo "ERROR: Xcode 15.4 not found"
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen make flock
          export PATH="$(brew --prefix)/bin:$PATH"
          command -v flock
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf WineGlass blink-src
          git clone --depth 1 https://github.com/Contonion/WineGlass.git WineGlass
          git clone --depth 1 https://github.com/jart/blink.git blink-src
          mkdir -p WineGlass/Vendor/blink/lib
          git -C WineGlass rev-parse HEAD
          git -C blink-src rev-parse HEAD

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"
          cd blink-src
          chmod +x configure
          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit
          test -f config.h
          test -f config.mk

      - name: Patch Blink iOS config
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/config.h")
          s = p.read_text(errors="ignore")

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
              "HAVE_SCHED_YIELD",
              "HAVE_SCHED_H",
          ]
          enable = [
              "HAVE_DEV_URANDOM",
              "HAVE_SYS_MOUNT_H",
              "HAVE_MAP_ANONYMOUS",
          ]

          for name in disable + enable:
              s = re.sub(rf'(?m)^\s*#define\s+{re.escape(name)}\b.*$', '', s)
              s = re.sub(rf'(?m)^\s*#undef\s+{re.escape(name)}\b.*$', '', s)

          s += "\n/* POSTAL 2 iOS FIX 10 */\n"
          for name in disable:
              s += f"#undef {name}\n"
          for name in enable:
              s += f"#define {name} 1\n"

          p.write_text(s)
          print("Blink iOS config patched")
          PY

          grep -q '^#define HAVE_MAP_ANONYMOUS 1$' blink-src/config.h

      - name: Patch Blink sched_yield
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/blink/syscall.c")
          s = p.read_text()

          pattern = r'''static\s+int\s+SysSchedYield\s*\(\s*struct\s+Machine\s*\*m\s*\)\s*\{.*?\n\}'''
          replacement = '''static int SysSchedYield(struct Machine *m) {
            (void)m;
            return 0;
          }'''

          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("ERROR: SysSchedYield patch failed")

          s = s.replace("        sched_yield();", "        /* sched_yield disabled on iOS */")
          if "return sched_yield();" in s:
              raise SystemExit("ERROR: sched_yield remains")

          p.write_text(s)
          PY

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"
          cd "$BLINK"
          rm -f o//blink/blink.a
          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a
          test -f o//blink/blink.a
          cp o//blink/blink.a "$WG/Vendor/blink/lib/blink.a"
          test -f "$WG/Vendor/blink/lib/blink.a"

      - name: Patch Blink VM mmap FIX 10
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Vendor/blink/wg_blink_impl.c")
          s = p.read_text()

          if "#include <errno.h>" not in s:
              if "#include <stdio.h>" not in s:
                  raise SystemExit("ERROR: stdio include missing")
              s = s.replace(
                  "#include <stdio.h>",
                  "#include <stdio.h>\n#include <errno.h>\n#include <sys/mman.h>",
                  1,
              )

          start_marker = "static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {"
          end_marker = "struct WGBlinkVM *WGBlinkVM_Create(void) {"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("ERROR: create_vm_with_mode markers missing")

          new_function = r'''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {
              fprintf(stderr, "[FIX10/BLINK] CREATE VM mode=%d\n", mode.omode);
              fflush(stderr);

              ensure_initialized();

              struct WGBlinkVM *vm = calloc(1, sizeof(struct WGBlinkVM));
              if (!vm) return NULL;

              vm->s = NewSystem(mode);
              if (!vm->s) {
                  free(vm);
                  return NULL;
              }

              if (!vm->s->real) {
                  long pagesize = FLAG_pagesize;
                  long real_size = (kRealSize + pagesize - 1) & ~(pagesize - 1);
                  errno = 0;
                  vm->s->real = Mmap(
                      NULL,
                      real_size,
                      PROT_READ | PROT_WRITE,
                      MAP_PRIVATE | MAP_ANONYMOUS_,
                      -1,
                      0,
                      "real"
                  );
                  int e = errno;
                  fprintf(stderr, "[FIX10/BLINK] Mmap real=%p errno=%d (%s)\n",
                          (void *)vm->s->real, e, e ? strerror(e) : "OK");
                  fflush(stderr);

                  if (vm->s->real == MAP_FAILED || !vm->s->real) {
                      vm->s->real = NULL;
                      FreeSystem(vm->s);
                      free(vm);
                      return NULL;
                  }
              }

              vm->m = NewMachine(vm->s, NULL);
              if (!vm->m) {
                  FreeSystem(vm->s);
                  free(vm);
                  return NULL;
              }

              if (mode.omode == XED_MODE_LONG) {
                  vm->s->cr0 = CR0_PE | CR0_MP | CR0_ET | CR0_PG;
                  vm->s->cr3 = AllocatePageTable(vm->s);
                  if (vm->s->cr3 == (u64)-1) {
                      FreeMachine(vm->m);
                      FreeSystem(vm->s);
                      free(vm);
                      return NULL;
                  }
              } else if (mode.omode == XED_MODE_LEGACY) {
                  vm->s->cr0 = CR0_PE | CR0_MP | CR0_ET;
              }

              vm->m->flags |= (1 << 9);
              fprintf(stderr, "[FIX10/BLINK] VM CREATE SUCCESS real=%p cr3=%llu\n",
                      (void *)vm->s->real, (unsigned long long)vm->s->cr3);
              fflush(stderr);
              return vm;
          }

          '''

          s = s[:start] + new_function + "\n" + s[end:]
          p.write_text(s)
          PY

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          cd "$BLINK"
          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"
          test -f "$WG/Vendor/blink/lib/wg_blink_impl.o"

      - name: Patch FIX 10 real Unreal DLL loader
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()

          # ============================================================
          # 1) Replace the generic real-DLL loader with a FIX 10 version.
          #    It keeps real module records BEFORE resolving dependencies,
          #    resolves Core/Engine-to-Core imports to real exports, and
          #    keeps system APIs on WineGlass Win32 thunks.
          # ============================================================

          start_marker = "// Load a DLL file into the VM. Returns the guest load base, or 0 on failure."
          end_marker = "// Look up an export by name in a loaded module; returns its guest address or 0."

          start = s.find(start_marker)
          end = s.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit("ERROR: real DLL loader markers missing")

          real_loader = r'''// Load a DLL file into the VM. Returns the guest load base, or 0 on failure.
          // FIX 10: this loader can wire game DLL imports to exports of other
          // already-loaded game DLLs instead of turning them into Auto-stubs.

          static uint32_t wg_module_export(uint32_t base, const char *func);
          static uint32_t wg_module_find(const char *path);

          #define WG_FIX10_PAGE          0x00A00000u
          #define WG_FIX10_WCMDLINE      0x00A00000u
          #define WG_FIX10_ACMDLINE      0x00A00100u
          #define WG_FIX10_APGMPTR       0x00A00300u
          #define WG_FIX10_WPGMPTR       0x00A00500u
          #define WG_FIX10_ACMDLN_VAR    0x00A00800u
          #define WG_FIX10_WCMDLN_VAR    0x00A00804u
          #define WG_FIX10_FMODE_VAR     0x00A00808u
          #define WG_FIX10_COMMODE_VAR   0x00A0080Cu
          #define WG_FIX10_ARGC_VAR      0x00A00810u
          #define WG_FIX10_ARGV_VAR      0x00A00814u
          #define WG_FIX10_WARGV_VAR     0x00A00818u
          #define WG_FIX10_PGMPTR_VAR    0x00A0081Cu
          #define WG_FIX10_WPGMPTR_VAR   0x00A00820u
          #define WG_FIX10_ENVIRON_VAR   0x00A00824u
          #define WG_FIX10_WENVIRON_VAR  0x00A00828u
          #define WG_FIX10_ARGV_ARRAY    0x00A00840u
          #define WG_FIX10_WARGV_ARRAY   0x00A00848u
          #define WG_FIX10_ENV_ARRAY     0x00A00850u
          #define WG_FIX10_WENV_ARRAY    0x00A00858u

          static bool wg_fix10_is_msvcr120(const char *dll) {
              if (!dll) return false;
              char lower[128];
              size_t n = strlen(dll);
              if (n >= sizeof(lower)) n = sizeof(lower) - 1;
              for (size_t i = 0; i < n; i++) {
                  lower[i] = (char)tolower((unsigned char)dll[i]);
              }
              lower[n] = '\0';
              return strstr(lower, "msvcr120") != NULL;
          }

          static uint32_t wg_fix10_data_import(const char *dll, const char *name) {
              if (!wg_fix10_is_msvcr120(dll) || !name) return 0;
              if (!strcmp(name, "_acmdln"))   return WG_FIX10_ACMDLN_VAR;
              if (!strcmp(name, "_wcmdln"))   return WG_FIX10_WCMDLN_VAR;
              if (!strcmp(name, "_fmode"))    return WG_FIX10_FMODE_VAR;
              if (!strcmp(name, "_commode"))  return WG_FIX10_COMMODE_VAR;
              if (!strcmp(name, "__argc"))    return WG_FIX10_ARGC_VAR;
              if (!strcmp(name, "__argv"))    return WG_FIX10_ARGV_VAR;
              if (!strcmp(name, "__wargv"))   return WG_FIX10_WARGV_VAR;
              if (!strcmp(name, "_pgmptr"))   return WG_FIX10_PGMPTR_VAR;
              if (!strcmp(name, "_wpgmptr"))  return WG_FIX10_WPGMPTR_VAR;
              if (!strcmp(name, "_environ"))  return WG_FIX10_ENVIRON_VAR;
              if (!strcmp(name, "_wenviron")) return WG_FIX10_WENVIRON_VAR;
              return 0;
          }

          static bool wg_fix10_find_local_dll(const char *guest_name,
                                               char *out,
                                               size_t outsz) {
              if (!guest_name || !guest_name[0] || !out || outsz < 4) return false;

              char wanted[64];
              dll_basename(guest_name, wanted, sizeof(wanted));

              char cwd[1024];
              if (!getcwd(cwd, sizeof(cwd))) return false;

              DIR *d = opendir(cwd);
              if (!d) return false;

              bool found = false;
              struct dirent *e;
              while ((e = readdir(d)) != NULL) {
                  if (!strcmp(e->d_name, ".") || !strcmp(e->d_name, "..")) continue;

                  char got[64];
                  dll_basename(e->d_name, got, sizeof(got));
                  if (strcmp(got, wanted) != 0) continue;

                  snprintf(out, outsz, "%s/%s", cwd, e->d_name);
                  found = true;
                  break;
              }

              closedir(d);
              return found;
          }

          static bool wg_fix10_is_unreal_boot_dll(const char *dll) {
              if (!dll) return false;
              char lower[64];
              dll_basename(dll, lower, sizeof(lower));
              return !strcmp(lower, "core.dll") || !strcmp(lower, "engine.dll");
          }

          static uint32_t wg_load_dll(WGBlinkInstance *blink,
                                      WGDllMapper *mapper,
                                      const char *real_path,
                                      const char *guest_name) {
              char base_name[64];
              dll_basename(guest_name, base_name, sizeof(base_name));

              for (int i = 0; i < 16; i++) {
                  if (s_modules[i].in_use &&
                      strcmp(s_modules[i].name, base_name) == 0) {
                      return s_modules[i].base;
                  }
              }

              WGPEImage *img = wg_pe_load_file(real_path);
              if (!img) {
                  WG_LOGE(TAG, "FIX10 failed to parse real DLL: %s", real_path);
                  return 0;
              }

              if (img->is_64bit) {
                  WG_LOGE(TAG, "FIX10 refusing 64-bit DLL in 32-bit process: %s", guest_name);
                  wg_pe_image_free(img);
                  return 0;
              }

              int slot_index = -1;
              for (int i = 0; i < 16; i++) {
                  if (!s_modules[i].in_use) {
                      slot_index = i;
                      break;
                  }
              }

              if (slot_index < 0) {
                  WG_LOGE(TAG, "FIX10 module table full while loading %s", guest_name);
                  wg_pe_image_free(img);
                  return 0;
              }

              uint32_t preferred = (uint32_t)img->image_base;
              uint32_t img_size  = img->size_of_image ? img->size_of_image : 0x100000;
              uint32_t load_base;
              int32_t delta;

              if (img->reloc_rva && img->reloc_size) {
                  load_base = s_dll_next_base;
                  s_dll_next_base =
                      (s_dll_next_base + img_size + 0xFFFFu) & ~0xFFFFu;
                  delta = (int32_t)(load_base - preferred);
              } else {
                  load_base = preferred;
                  delta = 0;
              }

              WGLoadedModule *slot = &s_modules[slot_index];
              memset(slot, 0, sizeof(*slot));
              slot->in_use = true;
              strncpy(slot->name, base_name, sizeof(slot->name) - 1);
              slot->base = load_base;
              slot->size = img_size;
              slot->img = img;

              WG_LOGI(TAG,
                      "FIX10 mapping REAL DLL %s from %s preferred=0x%X load=0x%X size=0x%X",
                      base_name,
                      real_path,
                      preferred,
                      load_base,
                      img_size);

              if (img->size_of_headers &&
                  img->raw_size >= img->size_of_headers) {
                  if (!wg_blink_load_code(blink,
                                          load_base,
                                          img->raw_data,
                                          img->size_of_headers,
                                          0)) {
                      WG_LOGE(TAG, "FIX10 header map failed for %s", base_name);
                      slot->in_use = false;
                      slot->img = NULL;
                      wg_pe_image_free(img);
                      return 0;
                  }
              }

              for (int i = 0; i < img->num_sections; i++) {
                  WGPESection *sec = &img->sections[i];
                  uint32_t vs = sec->virtual_size ? sec->virtual_size : sec->raw_size;
                  if (!vs) continue;

                  uint64_t va = (uint64_t)load_base + sec->virtual_address;
                  uint8_t *zeros = calloc(1, vs);
                  if (!zeros) {
                      WG_LOGE(TAG, "FIX10 OOM mapping %s:%s", base_name, sec->name);
                      slot->in_use = false;
                      slot->img = NULL;
                      wg_pe_image_free(img);
                      return 0;
                  }

                  bool mapped = wg_blink_load_code(blink, va, zeros, vs, 0);
                  free(zeros);

                  if (!mapped) {
                      WG_LOGE(TAG,
                              "FIX10 section map failed %s:%s @0x%llX size=0x%X",
                              base_name,
                              sec->name,
                              (unsigned long long)va,
                              vs);
                      slot->in_use = false;
                      slot->img = NULL;
                      wg_pe_image_free(img);
                      return 0;
                  }

                  if (sec->data && sec->raw_size) {
                      uint32_t n = sec->raw_size < vs ? sec->raw_size : vs;
                      if (!wg_blink_write_mem(blink, va, sec->data, n)) {
                          WG_LOGE(TAG, "FIX10 section write failed %s:%s",
                                  base_name, sec->name);
                          slot->in_use = false;
                          slot->img = NULL;
                          wg_pe_image_free(img);
                          return 0;
                      }
                  }
              }

              if (delta && img->reloc_rva && img->reloc_size) {
                  uint32_t off = 0;

                  while (off + 8 <= img->reloc_size) {
                      const uint8_t *blk =
                          pe_rva_ptr(img, img->reloc_rva + off, 8);
                      if (!blk) break;

                      uint32_t page_rva = 0;
                      uint32_t blk_size = 0;
                      memcpy(&page_rva, blk, 4);
                      memcpy(&blk_size, blk + 4, 4);

                      if (blk_size < 8 || off + blk_size > img->reloc_size) break;

                      uint32_t nent = (blk_size - 8) / 2;
                      const uint8_t *ents =
                          pe_rva_ptr(img,
                                     img->reloc_rva + off + 8,
                                     nent * 2);
                      if (!ents) break;

                      for (uint32_t e = 0; e < nent; e++) {
                          uint16_t v = 0;
                          memcpy(&v, ents + e * 2, 2);

                          if ((v >> 12) != 3) continue;

                          uint32_t target =
                              load_base + page_rva + (v & 0x0FFFu);
                          uint32_t val = 0;

                          if (!wg_blink_read_mem(blink, target, &val, 4)) {
                              WG_LOGE(TAG,
                                      "FIX10 relocation read failed %s @0x%X",
                                      base_name,
                                      target);
                              return 0;
                          }

                          val += (uint32_t)delta;

                          if (!wg_blink_write_mem(blink, target, &val, 4)) {
                              WG_LOGE(TAG,
                                      "FIX10 relocation write failed %s @0x%X",
                                      base_name,
                                      target);
                              return 0;
                          }
                      }

                      off += blk_size;
                  }
              }

              for (int i = 0; i < img->num_imports; i++) {
                  WGPEImportDll *imp = &img->imports[i];

                  WG_LOGI(TAG,
                          "FIX10 %s imports %s: %d functions",
                          base_name,
                          imp->dll_name,
                          imp->num_functions);

                  for (int j = 0; j < imp->num_functions; j++) {
                      const char *fn = imp->functions[j].name;
                      uint32_t resolved = 0;

                      resolved = wg_fix10_data_import(imp->dll_name, fn);

                      if (!resolved) {
                          uint32_t dep_base = wg_module_find(imp->dll_name);
                          if (dep_base) {
                              resolved = wg_module_export(dep_base, fn);
                              if (resolved) {
                                  WG_LOGI(TAG,
                                          "FIX10 REAL LINK %s!%s -> %s @0x%X",
                                          base_name,
                                          fn,
                                          imp->dll_name,
                                          resolved);
                              }
                          }
                      }

                      if (!resolved) {
                          uint64_t stub =
                              wg_dll_mapper_resolve(mapper,
                                                    imp->dll_name,
                                                    fn);
                          resolved = (uint32_t)stub;
                      }

                      if (!resolved) {
                          WG_LOGW(TAG,
                                  "FIX10 unresolved DLL import %s -> %s!%s",
                                  base_name,
                                  imp->dll_name,
                                  fn ? fn : "(ordinal)");
                          continue;
                      }

                      uint32_t iat =
                          load_base + imp->functions[j].iat_rva;

                      if (!wg_blink_write_mem(blink,
                                              iat,
                                              &resolved,
                                              4)) {
                          WG_LOGE(TAG,
                                  "FIX10 IAT write failed %s!%s @0x%X",
                                  base_name,
                                  fn ? fn : "(ordinal)",
                                  iat);
                          return 0;
                      }
                  }
              }

              WG_LOGI(TAG,
                      "FIX10 REAL DLL READY %s base=0x%X entry=0x%X reloc_delta=0x%X",
                      base_name,
                      load_base,
                      img->entry_point,
                      (uint32_t)delta);

              return load_base;
          }

          '''

          s = s[:start] + real_loader + s[end:]

          old = '''                WG_LOGD(TAG, "GetModuleHandleA('%s')", modname);
                          if (strcasestr(modname, "kernel32") ||'''

          new = '''                WG_LOGD(TAG, "GetModuleHandleA('%s')", modname);
                          uint32_t loaded = wg_module_find(modname);
                          if (loaded) {
                              ret_val = loaded;
                          } else if (strcasestr(modname, "kernel32") ||'''

          if old not in s:
              raise SystemExit("ERROR: GetModuleHandleA marker missing")
          s = s.replace(old, new, 1)

          helper_marker = "static bool load_pe_blink(WGEngine *engine) {"
          if helper_marker not in s:
              raise SystemExit("ERROR: load_pe_blink marker missing")

          helpers = r'''
          // ============================================================
          // POSTAL 2 FIX 10 — REAL CORE/ENGINE DLLS
          // ============================================================

          static void wg_fix10_put32(uint8_t *page,
                                     uint32_t guest,
                                     uint32_t value) {
              uint32_t off = guest - WG_FIX10_PAGE;
              if (off + 4 <= 0x1000) {
                  memcpy(page + off, &value, 4);
              }
          }

          static bool wg_fix10_prepare_crt_data(WGEngine *engine) {
              if (!engine || !engine->blink) return false;

              uint8_t page[0x1000];
              memset(page, 0, sizeof(page));

              const char *winpath = wg_files_exe_win_path();
              if (!winpath || !winpath[0]) {
                  winpath = "C:\\Postal2\\System\\Postal2.exe";
              }

              uint16_t *wcmd =
                  (uint16_t *)(page +
                      (WG_FIX10_WCMDLINE - WG_FIX10_PAGE));
              int wi = 0;
              wcmd[0] = '"';
              for (; winpath[wi] && wi < 120; wi++) {
                  wcmd[wi + 1] = (uint8_t)winpath[wi];
              }
              wcmd[wi + 1] = '"';
              wcmd[wi + 2] = 0;

              char *acmd =
                  (char *)(page +
                      (WG_FIX10_ACMDLINE - WG_FIX10_PAGE));
              snprintf(acmd, 500, "\"%s\"", winpath);

              char *apgm =
                  (char *)(page +
                      (WG_FIX10_APGMPTR - WG_FIX10_PAGE));
              snprintf(apgm, 500, "%s", winpath);

              uint16_t *wpgm =
                  (uint16_t *)(page +
                      (WG_FIX10_WPGMPTR - WG_FIX10_PAGE));
              int pi = 0;
              for (; winpath[pi] && pi < 240; pi++) {
                  wpgm[pi] = (uint8_t)winpath[pi];
              }
              wpgm[pi] = 0;

              wg_fix10_put32(page, WG_FIX10_ACMDLN_VAR, WG_FIX10_ACMDLINE);
              wg_fix10_put32(page, WG_FIX10_WCMDLN_VAR, WG_FIX10_WCMDLINE);
              wg_fix10_put32(page, WG_FIX10_FMODE_VAR, 0);
              wg_fix10_put32(page, WG_FIX10_COMMODE_VAR, 0);
              wg_fix10_put32(page, WG_FIX10_ARGC_VAR, 1);

              wg_fix10_put32(page, WG_FIX10_ARGV_VAR, WG_FIX10_ARGV_ARRAY);
              wg_fix10_put32(page, WG_FIX10_ARGV_ARRAY, WG_FIX10_APGMPTR);
              wg_fix10_put32(page, WG_FIX10_ARGV_ARRAY + 4, 0);

              wg_fix10_put32(page, WG_FIX10_WARGV_VAR, WG_FIX10_WARGV_ARRAY);
              wg_fix10_put32(page, WG_FIX10_WARGV_ARRAY, WG_FIX10_WPGMPTR);
              wg_fix10_put32(page, WG_FIX10_WARGV_ARRAY + 4, 0);

              wg_fix10_put32(page, WG_FIX10_PGMPTR_VAR, WG_FIX10_APGMPTR);
              wg_fix10_put32(page, WG_FIX10_WPGMPTR_VAR, WG_FIX10_WPGMPTR);

              wg_fix10_put32(page, WG_FIX10_ENVIRON_VAR, WG_FIX10_ENV_ARRAY);
              wg_fix10_put32(page, WG_FIX10_ENV_ARRAY, 0);
              wg_fix10_put32(page, WG_FIX10_WENVIRON_VAR, WG_FIX10_WENV_ARRAY);
              wg_fix10_put32(page, WG_FIX10_WENV_ARRAY, 0);

              if (!wg_blink_load_code(engine->blink,
                                      WG_FIX10_PAGE,
                                      page,
                                      sizeof(page),
                                      0)) {
                  WG_LOGE(TAG, "FIX10 CRT page map FAILED");
                  return false;
              }

              s_cmdpage_mapped = true;
              WG_LOGI(TAG, "FIX10 CRT DATA PAGE READY @0x%X", WG_FIX10_PAGE);
              return true;
          }

          #define WG_FIX10_DLL_RETURN 0x00C30000u

          static bool wg_fix10_call_dll_entry(WGEngine *engine,
                                              WGLoadedModule *m) {
              if (!engine || !engine->blink || !m || !m->in_use ||
                  !m->img || !m->img->entry_point) {
                  return true;
              }

              uint32_t entry = m->base + m->img->entry_point;
              uint64_t saved_regs[16];
              for (int i = 0; i < 16; i++) {
                  saved_regs[i] = wg_blink_get_reg(engine->blink, i);
              }
              uint64_t saved_rip = wg_blink_get_rip(engine->blink);

              uint8_t hlt = 0xF4;
              if (!wg_blink_load_code(engine->blink,
                                      WG_FIX10_DLL_RETURN,
                                      &hlt,
                                      1,
                                      0)) {
                  WG_LOGE(TAG, "FIX10 failed to map DLL return sentinel");
                  return false;
              }

              uint32_t esp = (uint32_t)wg_blink_get_reg(engine->blink, 4);
              uint32_t call_esp = esp - 16;
              uint32_t frame[4] = {
                  WG_FIX10_DLL_RETURN,
                  m->base,
                  1u,
                  0u
              };

              if (!wg_blink_write_mem(engine->blink,
                                      call_esp,
                                      frame,
                                      sizeof(frame))) {
                  WG_LOGE(TAG, "FIX10 failed to build DllMain stack for %s", m->name);
                  return false;
              }

              wg_blink_set_reg(engine->blink, 4, call_esp);
              wg_blink_set_rip(engine->blink, entry);

              WG_LOGI(TAG,
                      "FIX10 DllMain START %s entry=0x%X base=0x%X",
                      m->name,
                      entry,
                      m->base);

              bool ok = false;

              for (int loops = 0; loops < 2000; loops++) {
                  WGBlinkResult r = wg_blink_run(engine->blink, 100000);

                  if (r == WG_BLINK_OK) continue;

                  if (r == WG_BLINK_HALT) {
                      uint32_t rip = (uint32_t)wg_blink_get_rip(engine->blink);

                      if (rip == WG_FIX10_DLL_RETURN) {
                          ok = true;
                          break;
                      }

                      if (handle_blink_thunk(engine)) continue;

                      int stop = wg_blink_get_stop_reason(engine->blink);
                      uint32_t fault =
                          (uint32_t)wg_blink_get_fault_addr(engine->blink);

                      WG_LOGE(TAG,
                              "FIX10 DllMain HALT %s rip=0x%X stop=%d fault=0x%X",
                              m->name,
                              rip,
                              stop,
                              fault);
                      break;
                  }

                  WG_LOGE(TAG,
                          "FIX10 DllMain backend result=%d for %s",
                          (int)r,
                          m->name);
                  break;
              }

              uint32_t dll_result =
                  (uint32_t)wg_blink_get_reg(engine->blink, 0);

              for (int i = 0; i < 16; i++) {
                  wg_blink_set_reg(engine->blink, i, saved_regs[i]);
              }
              wg_blink_set_rip(engine->blink, saved_rip);

              if (!ok) {
                  WG_LOGE(TAG, "FIX10 DllMain FAILED for %s", m->name);
                  return false;
              }

              WG_LOGI(TAG,
                      "FIX10 DllMain DONE %s result=0x%X",
                      m->name,
                      dll_result);
              return true;
          }

          static bool wg_fix10_init_loaded_dlls(WGEngine *engine) {
              const char *order[] = {
                  "core.dll",
                  "engine.dll",
                  NULL
              };

              for (int oi = 0; order[oi]; oi++) {
                  for (int i = 0; i < 16; i++) {
                      if (!s_modules[i].in_use) continue;
                      if (strcmp(s_modules[i].name, order[oi]) != 0) continue;

                      if (!wg_fix10_call_dll_entry(engine, &s_modules[i])) {
                          return false;
                      }
                  }
              }
              return true;
          }

          '''

          s = s.replace(helper_marker, helpers + "\n" + helper_marker, 1)

          function_start = s.find(helper_marker)
          start_marker = "// Resolve imports — write thunk addresses into the IAT"
          end_marker = "    uint64_t entry = pe->image_base + pe->entry_point;"

          start = s.find(start_marker, function_start)
          if start == -1:
              raise SystemExit("ERROR: EXE import resolver START missing")

          line_start = s.rfind("\n", function_start, start)
          line_start = start if line_start == -1 else line_start + 1

          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit("ERROR: EXE import resolver END missing")

          replacement = r'''    // POSTAL 2 FIX 10 IMPORT RESOLUTION
              // Real Core.dll / Engine.dll exports first; Win32 APIs remain thunks.

              if (!pe->is_64bit) {
                  if (!wg_fix10_prepare_crt_data(engine)) {
                      WG_LOGE(TAG, "FIX10 CRT DATA setup failed");
                      return false;
                  }

                  const char *boot_dlls[] = {
                      "Core.dll",
                      "Engine.dll",
                      NULL
                  };

                  for (int bi = 0; boot_dlls[bi]; bi++) {
                      char real_path[1200] = {0};

                      if (!wg_fix10_find_local_dll(boot_dlls[bi],
                                                   real_path,
                                                   sizeof(real_path))) {
                          WG_LOGW(TAG,
                                  "FIX10 %s not found in current System directory",
                                  boot_dlls[bi]);
                          continue;
                      }

                      uint32_t base =
                          wg_load_dll(engine->blink,
                                      engine->dll_mapper,
                                      real_path,
                                      boot_dlls[bi]);

                      if (!base) {
                          WG_LOGE(TAG,
                                  "FIX10 failed to load REAL %s from %s",
                                  boot_dlls[bi],
                                  real_path);
                          return false;
                      }

                      WG_LOGI(TAG,
                              "FIX10 PRELOAD %s -> 0x%X",
                              boot_dlls[bi],
                              base);
                  }
              }

              if (pe->num_imports > 0) {
                  WG_LOGI(TAG,
                          "FIX10 resolving %d EXE DLL imports...",
                          pe->num_imports);

                  for (int i = 0; i < pe->num_imports; i++) {
                      WGPEImportDll *imp = &pe->imports[i];

                      WG_LOGI(TAG,
                              "  %s: %d functions",
                              imp->dll_name,
                              imp->num_functions);

                      for (int j = 0; j < imp->num_functions; j++) {
                          const char *fn = imp->functions[j].name;
                          uint64_t resolved = 0;
                          bool real_game_export = false;

                          if (!pe->is_64bit) {
                              uint32_t data_addr =
                                  wg_fix10_data_import(imp->dll_name, fn);

                              if (data_addr) {
                                  resolved = data_addr;
                                  WG_LOGI(TAG,
                                          "FIX10 DATA IMPORT %s!%s -> 0x%X",
                                          imp->dll_name,
                                          fn,
                                          data_addr);
                              }
                          }

                          if (!resolved &&
                              !pe->is_64bit &&
                              wg_fix10_is_unreal_boot_dll(imp->dll_name)) {
                              uint32_t mod = wg_module_find(imp->dll_name);

                              if (mod) {
                                  uint32_t exp = wg_module_export(mod, fn);

                                  if (exp) {
                                      resolved = exp;
                                      real_game_export = true;
                                      WG_LOGI(TAG,
                                              "FIX10 REAL EXE IMPORT %s!%s -> 0x%X",
                                              imp->dll_name,
                                              fn,
                                              exp);
                                  }
                              }
                          }

                          if (!resolved) {
                              resolved =
                                  wg_dll_mapper_resolve(engine->dll_mapper,
                                                        imp->dll_name,
                                                        fn);
                          }

                          if (!resolved) {
                              WG_LOGW(TAG,
                                      "FIX10 unresolved EXE import %s!%s",
                                      imp->dll_name,
                                      fn ? fn : "(ordinal)");
                              continue;
                          }

                          uint64_t iat_entry =
                              pe->image_base + imp->functions[j].iat_rva;
                          bool write_ok = false;

                          if (pe->is_64bit) {
                              uint64_t v64 = resolved;
                              write_ok =
                                  wg_blink_write_mem(engine->blink,
                                                     iat_entry,
                                                     &v64,
                                                     8);
                          } else {
                              uint32_t v32 = (uint32_t)resolved;
                              write_ok =
                                  wg_blink_write_mem(engine->blink,
                                                     iat_entry,
                                                     &v32,
                                                     4);
                          }

                          if (!write_ok) {
                              WG_LOGE(TAG,
                                      "FIX10 IAT write failed %s!%s @0x%llX",
                                      imp->dll_name,
                                      fn ? fn : "(ordinal)",
                                      (unsigned long long)iat_entry);
                              return false;
                          }

                          if (real_game_export) {
                              WG_LOGI(TAG,
                                      "FIX10 IAT REAL OK %s!%s",
                                      imp->dll_name,
                                      fn);
                          }
                      }
                  }
              }

          '''

          s = s[:line_start] + replacement + s[end:]

          init_marker = '''    WG_LOGI(TAG, "PE mapped via blink. Entry: 0x%llx", (unsigned long long)entry);'''

          init_code = r'''    if (!pe->is_64bit) {
                  if (!wg_fix10_init_loaded_dlls(engine)) {
                      WG_LOGE(TAG, "FIX10 REAL DLL initialization failed");
                      return false;
                  }

                  wg_blink_set_rip(engine->blink, entry);
              }

              WG_LOGI(TAG,
                      "FIX10 REAL CORE/ENGINE READY — EXE entry 0x%llx",
                      (unsigned long long)entry);
          '''

          if init_marker not in s:
              raise SystemExit("ERROR: PE mapped log marker missing")

          s = s.replace(init_marker, init_code + "\n" + init_marker, 1)

          p.write_text(s)
          print("FIX 10 REAL CORE/ENGINE DLL PATCH INSTALLED")
          PY

          echo "===== FIX10 SOURCE CHECK ====="

          grep -n \
            "FIX10 REAL DLL READY\|FIX10 REAL EXE IMPORT\|FIX10 DllMain\|FIX10 REAL CORE/ENGINE READY" \
            WineGlass/Sources/Core/wg_engine.c | head -80

      - name: Patch WineGlass project
        shell: bash
        run: |
          set -euxo pipefail
          cd WineGlass
          python3 <<'PY'
          from pathlib import Path

          p = Path("project.yml")
          s = p.read_text()
          s = s.replace("bundleIdPrefix: com.wineglass", "bundleIdPrefix: com.postal2ios")
          s = s.replace('xcodeVersion: "15.0"', 'xcodeVersion: "15.4"\n  projectFormat: xcode15_3')
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app", "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native")
          s = s.replace('TARGETED_DEVICE_FAMILY: "1,2"', 'TARGETED_DEVICE_FAMILY: "1"')

          lines = []
          for line in s.splitlines():
              if "CODE_SIGN_ENTITLEMENTS:" in line:
                  continue
              if "DEVELOPMENT_TEAM:" in line:
                  continue
              if "CODE_SIGN_STYLE: Automatic" in line:
                  line = line.replace("CODE_SIGN_STYLE: Automatic", "CODE_SIGN_STYLE: Manual")
              lines.append(line)

          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Patch Info plist
        shell: bash
        run: |
          set -euxo pipefail
          PLIST="WineGlass/Sources/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string POSTAL 2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.10.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 100" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          plutil -lint "$PLIST"

      - name: Patch POSTAL 2 launcher and log
        shell: bash
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/App/WGSceneDelegate.m")
          s = p.read_text()

          if "#include <stdio.h>" not in s:
              s = s.replace("#include <unistd.h>", "#include <unistd.h>\n#include <stdio.h>", 1)

          old = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              wg_log_init();'''

          new = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              NSString *docs = NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory,
                  NSUserDomainMask,
                  YES
              ).firstObject;

              NSString *logPath = [docs stringByAppendingPathComponent:@"POSTAL2-WineGlass.log"];
              [[NSFileManager defaultManager] removeItemAtPath:logPath error:nil];
              freopen(logPath.fileSystemRepresentation, "a", stderr);
              setvbuf(stderr, NULL, _IONBF, 0);

              fprintf(stderr,
                      "========================================\\n"
                      "POSTAL 2 WineGlass FIX 10\\n"
                      "REAL CORE/ENGINE DLLS + CRT DATA + PE32 IAT\\n"
                      "========================================\\n");
              fflush(stderr);

              wg_log_init();
              WG_LOGI("POSTAL2", "FIX 10 logging started");'''

          if old not in s:
              raise SystemExit("ERROR: scene startup marker missing")
          s = s.replace(old, new, 1)

          old = '[_loadButton setTitle:@"  Load .exe  " forState:UIControlStateNormal];'
          new = '[_loadButton setTitle:@"  RUN POSTAL 2  " forState:UIControlStateNormal];'
          if old not in s:
              raise SystemExit("ERROR: button title missing")
          s = s.replace(old, new, 1)

          old = '[_loadButton addTarget:self action:@selector(openFilePicker) forControlEvents:UIControlEventTouchUpInside];'
          new = '[_loadButton addTarget:self action:@selector(runPostal2) forControlEvents:UIControlEventTouchUpInside];'
          if old not in s:
              raise SystemExit("ERROR: button action missing")
          s = s.replace(old, new, 1)

          marker = "#pragma mark - UIDocumentPickerDelegate"
          if marker not in s:
              raise SystemExit("ERROR: document picker marker missing")

          methods = r'''
          - (NSString *)findPostal2Exe {
              NSString *docs = NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory,
                  NSUserDomainMask,
                  YES
              ).firstObject;

              NSString *root = [docs stringByAppendingPathComponent:@"Postal2FullData"];
              NSFileManager *fm = [NSFileManager defaultManager];

              NSString *normal = [root stringByAppendingPathComponent:@"System/Postal2.exe"];
              if ([fm fileExistsAtPath:normal]) return normal;

              NSDirectoryEnumerator *enumerator = [fm enumeratorAtPath:root];
              for (NSString *relative in enumerator) {
                  if ([[relative lastPathComponent] caseInsensitiveCompare:@"Postal2.exe"] == NSOrderedSame) {
                      NSString *found = [root stringByAppendingPathComponent:relative];
                      WG_LOGI("POSTAL2", "Found recursively: %s", found.UTF8String);
                      return found;
                  }
              }

              WG_LOGE("POSTAL2", "Postal2.exe NOT FOUND");
              return nil;
          }

          - (void)runPostal2 {
              static BOOL postalStarted = NO;

              if (!_engine) {
                  WG_LOGE("POSTAL2", "Engine not ready");
                  return;
              }

              NSString *exe = [self findPostal2Exe];
              if (!exe) {
                  [_loadButton setTitle:@"  POSTAL2.EXE NOT FOUND  " forState:UIControlStateNormal];
                  return;
              }

              if (postalStarted) {
                  WG_LOGW("POSTAL2", "Duplicate launch ignored");
                  return;
              }

              postalStarted = YES;
              _loadButton.enabled = NO;

              NSString *systemDir = [exe stringByDeletingLastPathComponent];
              int cdResult = chdir(systemDir.fileSystemRepresentation);
              WG_LOGI("POSTAL2", "System directory: %s", systemDir.UTF8String);
              WG_LOGI("POSTAL2", "chdir result = %d", cdResult);

              [_loadButton setTitle:@"  STARTING POSTAL 2...  " forState:UIControlStateNormal];
              WG_LOGI("POSTAL2", "Launching original Postal2.exe");
              [self loadAndRunPE:exe];
          }

          '''

          s = s.replace(marker, methods + "\n" + marker, 1)

          old = "            [self tryLoadBundledPE];"
          new = '''            WG_LOGI("POSTAL2", "Engine ready — FIX10 auto-start");
                      [self runPostal2];'''
          if old not in s:
              raise SystemExit("ERROR: auto-start marker missing")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          cd WineGlass
          rm -rf WineGlass.xcodeproj
          xcodegen generate
          test -f WineGlass.xcodeproj/project.pbxproj
          grep -m1 "objectVersion" WineGlass.xcodeproj/project.pbxproj || true
          if grep -q "objectVersion = 77" WineGlass.xcodeproj/project.pbxproj; then
            echo "ERROR: unsupported objectVersion 77"
            exit 1
          fi

      - name: Build POSTAL 2 FIX 10
        shell: bash
        run: |
          set -o pipefail
          cd WineGlass
          rm -rf build
          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.postal2ios.native \
            build \
            2>&1 | tee xcodebuild.log

      - name: Verify POSTAL 2 app
        shell: bash
        run: |
          set -euxo pipefail
          APP="WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          test -d "$APP"
          test -f "$APP/WineGlass"
          lipo -info "$APP/WineGlass"
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "$ID"
          test "$ID" = "com.postal2ios.native"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          APP="$ROOT/WineGlass/build/Build/Products/Release-iphoneos/WineGlass.app"
          OUT="$ROOT/out"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/POSTAL 2.app"
          cd "$OUT"
          zip -qry "POSTAL-2-iOS-v10-REAL-DLLS.ipa" Payload
          ls -lh "POSTAL-2-iOS-v10-REAL-DLLS.ipa"

      - name: Upload POSTAL 2 FIX 10 IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-iOS-v10-REAL-DLLS
          path: out/POSTAL-2-iOS-v10-REAL-DLLS.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare debug files
        if: always()
        shell: bash
        run: |
          mkdir -p debug-fix10
          cp WineGlass/xcodebuild.log debug-fix10/ 2>/dev/null || true
          cp blink-src/config.h debug-fix10/blink-config.h 2>/dev/null || true
          cp WineGlass/Vendor/blink/wg_blink_impl.c debug-fix10/ 2>/dev/null || true
          cp WineGlass/Sources/Core/wg_engine.c debug-fix10/ 2>/dev/null || true
          cp WineGlass/Sources/App/WGSceneDelegate.m debug-fix10/ 2>/dev/null || true
          cp WineGlass/project.yml debug-fix10/ 2>/dev/null || true

      - name: Upload FIX 10 debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL-2-FIX10-DEBUG
          path: debug-fix10
          if-no-files-found: ignore
          retention-days: 7
