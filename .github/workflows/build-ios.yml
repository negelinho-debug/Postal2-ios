      - name: Patch FIX 11.8 strict real LoadLibrary
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("WineGlass/Sources/Core/wg_engine.c")
          s = p.read_text()

          old = r'''        } else if (strcmp(fn, "LoadLibraryExW") == 0 ||
                   strcmp(fn, "LoadLibraryW") == 0) {
            // LoadLibrary[Ex]W(lpLibFileName, [hFile, dwFlags])
            uint16_t libname[512] = {0};
            char ascii[512] = {0};
            if (args[0]) {
                wg_blink_read_mem(engine->blink, args[0], libname, 1022);
                for (int i = 0; i < 511 && libname[i]; i++)
                    ascii[i] = libname[i] < 128 ? (char)libname[i] : '?';
            }
            WG_LOGI(TAG, "%s('%s')", fn, ascii);
            if (!ascii[0] || !args[0]) {
                // Empty or NULL library name — return main module handle
                ret_val = engine->pe_image ? (uint32_t)engine->pe_image->image_base : 0x400000;
            } else {
                uint32_t base = 0;
                char mapbuf[512];
                strncpy(mapbuf, ascii, sizeof(mapbuf) - 1);
                mapbuf[sizeof(mapbuf) - 1] = '\0';
                const char *real = wg_files_map_path(args[0], engine->blink,
                                                     mapbuf, sizeof(mapbuf));
                if (real) base = wg_load_dll(engine->blink, engine->dll_mapper, real, ascii);
                ret_val = base ? base
                               : 0x10000000 + (uint32_t)(engine->dll_mapper->count * 0x1000);
            }'''

          new = r'''        } else if (strcmp(fn, "LoadLibraryExW") == 0 ||
                   strcmp(fn, "LoadLibraryW") == 0) {
            uint16_t libname[512] = {0};
            char ascii[512] = {0};

            if (args[0]) {
                wg_blink_read_mem(engine->blink, args[0], libname, 1022);

                for (int i = 0; i < 511 && libname[i]; i++) {
                    ascii[i] =
                        libname[i] < 128 ?
                        (char)libname[i] :
                        '?';
                }
            }

            WG_LOGI(
                TAG,
                "POSTAL FIX11.8 %s request='%s'",
                fn,
                ascii
            );

            if (!ascii[0] || !args[0]) {
                ret_val =
                    engine->pe_image ?
                    (uint32_t)engine->pe_image->image_base :
                    0x400000;

                s_last_error = 0;

            } else {
                uint32_t base = 0;

                char mapbuf[512];

                strncpy(
                    mapbuf,
                    ascii,
                    sizeof(mapbuf) - 1
                );

                mapbuf[
                    sizeof(mapbuf) - 1
                ] = '\0';

                const char *real =
                    wg_files_map_path(
                        args[0],
                        engine->blink,
                        mapbuf,
                        sizeof(mapbuf)
                    );

                if (real) {
                    base =
                        wg_load_dll(
                            engine->blink,
                            engine->dll_mapper,
                            real,
                            ascii
                        );
                }

                if (base) {
                    ret_val = base;
                    s_last_error = 0;

                    WG_LOGI(
                        TAG,
                        "POSTAL FIX11.8 %s real DLL '%s' -> 0x%X",
                        fn,
                        ascii,
                        base
                    );

                } else {
                    size_t n =
                        strlen(ascii);

                    bool ends_in_sep =
                        n > 0 &&
                        (
                            ascii[n - 1] == '\\' ||
                            ascii[n - 1] == '/'
                        );

                    bool has_path =
                        strchr(
                            ascii,
                            '\\'
                        ) != NULL ||
                        strchr(
                            ascii,
                            '/'
                        ) != NULL ||
                        (
                            ascii[0] &&
                            ascii[1] == ':'
                        );

                    bool windows_system_path =
                        strcasestr(
                            ascii,
                            "\\Windows\\System32\\"
                        ) != NULL ||
                        strcasestr(
                            ascii,
                            "/Windows/System32/"
                        ) != NULL;

                    if (
                        ends_in_sep ||
                        (
                            has_path &&
                            !windows_system_path
                        )
                    ) {
                        ret_val = 0;
                        s_last_error = 126;

                        WG_LOGW(
                            TAG,
                            "POSTAL FIX11.8 %s STRICT FAIL '%s' -> NULL (error 126)",
                            fn,
                            ascii
                        );

                    } else {
                        ret_val =
                            0xBFFF0000u;

                        s_last_error = 0;

                        WG_LOGI(
                            TAG,
                            "POSTAL FIX11.8 %s system/fake '%s' -> 0x%X",
                            fn,
                            ascii,
                            (uint32_t)ret_val
                        );
                    }
                }
            }'''

          if (
              "POSTAL FIX11.8 %s request"
              not in s
          ):
              if old not in s:
                  raise SystemExit(
                      "ERROR: FIX11.8 LoadLibraryW block missing"
                  )

              s = s.replace(
                  old,
                  new,
                  1
              )

          p.write_text(s)

          print(
              "POSTAL 2 FIX 11.8 STRICT LOADLIBRARY INSTALLED"
          )

          print(
              "real DLL success -> real HMODULE"
          )

          print(
              "invalid/local path -> NULL + ERROR_MOD_NOT_FOUND"
          )

          print(
              "bare/system DLL -> mapper fake HMODULE"
          )
          PY

          ENGINE="WineGlass/Sources/Core/wg_engine.c"

          grep -n \
            "POSTAL FIX11.8 %s request" \
            "$ENGINE"

          grep -n \
            "POSTAL FIX11.8 %s STRICT FAIL" \
            "$ENGINE"

          grep -n \
            "ERROR_MOD_NOT_FOUND" \
            "$ENGINE" ||
            true

          echo \
            "POSTAL FIX 11.8 LOADLIBRARY VERIFY OK"

