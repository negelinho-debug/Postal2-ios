      - name: Patch POSTAL 2 launcher and log
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/App/WGSceneDelegate.m"
          )

          s = p.read_text()


          if "#include <stdio.h>" not in s:

              s = s.replace(
                  "#include <unistd.h>",
                  "#include <unistd.h>\n"
                  "#include <stdio.h>",
                  1
              )


          old = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              wg_log_init();'''

          new = '''    UIWindowScene *windowScene = (UIWindowScene *)scene;

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;

              NSString *logPath =
                  [docs
                      stringByAppendingPathComponent:
                          @"POSTAL2-WineGlass.log"];

              [[NSFileManager defaultManager]
                  removeItemAtPath:
                      logPath
                  error:nil];

              freopen(
                  logPath.fileSystemRepresentation,
                  "a",
                  stderr
              );

              setvbuf(
                  stderr,
                  NULL,
                  _IONBF,
                  0
              );

              fprintf(
                  stderr,
                  "========================================\\n"
                  "POSTAL 2 WineGlass FIX 9.0\\n"
                  "CRT DATA IMPORTS + PE32 IAT FIX\\n"
                  "========================================\\n"
              );

              fflush(stderr);

              wg_log_init();

              WG_LOGI(
                  "POSTAL2",
                  "FIX 9.0 logging started"
              );'''

          if old not in s:
              raise SystemExit(
                  "ERROR: scene startup marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          old = (
              '[_loadButton setTitle:'
              '@"  Load .exe  " '
              'forState:UIControlStateNormal];'
          )

          new = (
              '[_loadButton setTitle:'
              '@"  RUN POSTAL 2  " '
              'forState:UIControlStateNormal];'
          )

          if old not in s:
              raise SystemExit(
                  "ERROR: button title missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          old = (
              '[_loadButton addTarget:self '
              'action:@selector(openFilePicker) '
              'forControlEvents:'
              'UIControlEventTouchUpInside];'
          )

          new = (
              '[_loadButton addTarget:self '
              'action:@selector(runPostal2) '
              'forControlEvents:'
              'UIControlEventTouchUpInside];'
          )

          if old not in s:
              raise SystemExit(
                  "ERROR: button action missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          marker = \
              "#pragma mark - UIDocumentPickerDelegate"

          if marker not in s:
              raise SystemExit(
                  "ERROR: document picker marker missing"
              )


          methods = r'''
          // ============================================================
          // POSTAL 2 FIX 9
          // ============================================================

          - (NSString *)findPostal2Exe {

              NSString *docs =
                  NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                  ).firstObject;


              NSString *root =
                  [docs
                      stringByAppendingPathComponent:
                          @"Postal2FullData"];


              NSFileManager *fm =
                  [NSFileManager
                      defaultManager];


              WG_LOGI(
                  "POSTAL2",
                  "Searching under: %s",
                  root.UTF8String
              );


              NSString *normal =
                  [root
                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"];


              if (
                  [fm
                      fileExistsAtPath:
                          normal]
              ) {

                  WG_LOGI(
                      "POSTAL2",
                      "Found normal: %s",
                      normal.UTF8String
                  );

                  return normal;
              }


              NSDirectoryEnumerator *enumerator =
                  [fm
                      enumeratorAtPath:
                          root];


              for (
                  NSString *relative
                  in enumerator
              ) {

                  if (
                      [[relative
                          lastPathComponent]
                          caseInsensitiveCompare:
                              @"Postal2.exe"]
                      == NSOrderedSame
                  ) {

                      NSString *found =
                          [root
                              stringByAppendingPathComponent:
                                  relative];


                      WG_LOGI(
                          "POSTAL2",
                          "Found recursively: %s",
                          found.UTF8String
                      );


                      return found;
                  }
              }


              WG_LOGE(
                  "POSTAL2",
                  "Postal2.exe NOT FOUND"
              );


              return nil;
          }


          - (void)runPostal2 {

              static BOOL postalStarted =
                  NO;


              if (!_engine) {

                  WG_LOGE(
                      "POSTAL2",
                      "Engine not ready"
                  );

                  return;
              }


              NSString *exe =
                  [self
                      findPostal2Exe];


              if (!exe) {

                  [_loadButton
                      setTitle:
                          @"  POSTAL2.EXE NOT FOUND  "
                      forState:
                          UIControlStateNormal];

                  return;
              }


              if (postalStarted) {

                  WG_LOGW(
                      "POSTAL2",
                      "Duplicate launch ignored"
                  );

                  return;
              }


              postalStarted =
                  YES;


              _loadButton.enabled =
                  NO;


              NSString *systemDir =
                  [exe
                      stringByDeletingLastPathComponent];


              int cdResult =
                  chdir(
                      systemDir
                          .fileSystemRepresentation
                  );


              WG_LOGI(
                  "POSTAL2",
                  "System directory: %s",
                  systemDir.UTF8String
              );


              WG_LOGI(
                  "POSTAL2",
                  "chdir result = %d",
                  cdResult
              );


              [_loadButton
                  setTitle:
                      @"  STARTING POSTAL 2...  "
                  forState:
                      UIControlStateNormal];


              WG_LOGI(
                  "POSTAL2",
                  "Launching original Postal2.exe"
              );


              [self
                  loadAndRunPE:
                      exe];
          }

          '''


          s = s.replace(
              marker,
              methods
              + "\n"
              + marker,
              1
          )


          old = \
              "            [self tryLoadBundledPE];"

          new = '''            WG_LOGI(
                          "POSTAL2",
                          "Engine ready — FIX9 auto-start"
                      );

                      [self runPostal2];'''

          if old not in s:
              raise SystemExit(
                  "ERROR: auto-start marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          p.write_text(s)

          print(
              "FIX9 launcher patched"
          )
          PY

          grep -n \
            "FIX 9.0\|findPostal2Exe\|STARTING POSTAL 2" \
            WineGlass/Sources/App/WGSceneDelegate.m

