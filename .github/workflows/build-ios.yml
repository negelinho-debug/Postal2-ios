name: POSTAL 2 iOS v6 ORIGINAL EXE TEST FIX 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 Windows x86 runtime
    runs-on: macos-14
    timeout-minutes: 120

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== GNU MAKE ====="
          gmake --version | head -n 1

          echo "===== FLOCK ====="
          command -v flock


      # ==========================================================
      # CLONE
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf WineGlass blink

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink

          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK COMMIT ====="
          git -C blink rev-parse HEAD


      # ==========================================================
      # BUILD BLINK ARM64
      # NO JIT
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          BLINK="$GITHUB_WORKSPACE/blink"
          WG="$GITHUB_WORKSPACE/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"

          cd "$BLINK"

          echo
          echo "======================================"
          echo "CONFIGURE BLINK"
          echo "======================================"

          test -f config.h.in
          test -f configure

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-g -O2 -fno-common -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk


          echo
          echo "======================================"
          echo "PATCH BLINK FOR IPHONE"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("config.h")
          s = p.read_text()

          # ======================================================
          # DO NOT USE getentropy/getrandom ON THIS IOS BUILD
          # ======================================================

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
          ]

          for name in disable:

              s = re.sub(
                  rf'^[ \t]*#define[ \t]+{re.escape(name)}.*$',
                  f'// #define {name}',
                  s,
                  flags=re.MULTILINE
              )

          # ======================================================
          # USE /dev/urandom FALLBACK
          # ======================================================

          s = re.sub(
              r'^[ \t]*//[ \t]*#define[ \t]+HAVE_DEV_URANDOM.*$',
              '#define HAVE_DEV_URANDOM',
              s,
              flags=re.MULTILINE
          )

          if "#define HAVE_DEV_URANDOM" not in s:
              s += "\n#define HAVE_DEV_URANDOM\n"

          # ======================================================
          # FORCE NO JIT / NO THREADS / NO SOCKETS
          # ======================================================

          force = [
              "DISABLE_JIT",
              "DISABLE_THREADS",
              "DISABLE_SOCKETS",
          ]

          for name in force:

              if f"#define {name}" not in s:

                  s = s.replace(
                      f"// #define {name}",
                      f"#define {name}"
                  )

          p.write_text(s)


          # ======================================================
          # HOST HELPER SETTINGS
          # ======================================================

          mk_path = Path("config.mk")
          mk = mk_path.read_text()

          mk = re.sub(
              r'^HOST_SYSTEM\s*=.*$',
              'HOST_SYSTEM = Linux',
              mk,
              flags=re.MULTILINE
          )

          mk = re.sub(
              r'^HOST_ARCH\s*=.*$',
              'HOST_ARCH = x86_64',
              mk,
              flags=re.MULTILINE
          )

          mk_path.write_text(mk)
          PY


          echo
          echo "======================================"
          echo "RANDOM BACKEND CHECK"
          echo "======================================"

          grep \
            -E \
            "HAVE_GETENTROPY|HAVE_SYS_GETENTROPY|HAVE_GETRANDOM|HAVE_SYS_GETRANDOM|HAVE_KERN_ARND|HAVE_DEV_URANDOM" \
            config.h \
            || true


          echo
          echo "======================================"
          echo "BUILD BLINK.A"
          echo "======================================"

          gmake \
            -j"$(sysctl -n hw.ncpu)" \
            o//blink/blink.a


          test -f \
            o//blink/blink.a


          mkdir -p \
            "$WG/Vendor/blink/lib"


          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"


          echo
          echo "======================================"
          echo "BUILD WINEGLASS BLINK BRIDGE"
          echo "======================================"

          "$CC" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -fno-common \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"


          echo
          echo "======================================"
          echo "VERIFY BLINK"
          echo "======================================"

          file \
            "$WG/Vendor/blink/lib/blink.a"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o" \
            | grep -q "arm64"

          echo
          echo "BLINK ARM64 NO-JIT READY"


      # ==========================================================
      # PATCH WINEGLASS
      # KEEP SAME BUNDLE ID AS v5
      # ==========================================================

      - name: Patch WineGlass into POSTAL 2 v6
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          python3 <<'PY'
          from pathlib import Path
          import plistlib
          import re


          # ======================================================
          # PROJECT
          # ======================================================

          project = Path("project.yml")
          text = project.read_text()

          text = text.replace(
              "bundleIdPrefix: com.wineglass",
              "bundleIdPrefix: com.postal2ios"
          )

          text = text.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.wineglass.app",
              "PRODUCT_BUNDLE_IDENTIFIER: com.postal2ios.native"
          )

          text = text.replace(
              'xcodeVersion: "15.0"',
              'xcodeVersion: "15.4"\n  projectFormat: xcode15_3'
          )

          text = text.replace(
              'TARGETED_DEVICE_FAMILY: "1,2"',
              'TARGETED_DEVICE_FAMILY: "1"'
          )

          text = re.sub(
              r'^\s*CODE_SIGN_ENTITLEMENTS:.*\n',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*DEVELOPMENT_TEAM:.*\n',
              '',
              text,
              flags=re.MULTILINE
          )

          text = text.replace(
              "CODE_SIGN_STYLE: Automatic",
              "CODE_SIGN_STYLE: Manual"
          )

          project.write_text(text)


          # ======================================================
          # INFO PLIST
          # ======================================================

          plist_path = Path(
              "Sources/App/Info.plist"
          )

          with plist_path.open("rb") as f:
              info = plistlib.load(f)

          info["CFBundleName"] = "POSTAL 2"
          info["CFBundleDisplayName"] = "POSTAL 2"
          info["CFBundleShortVersionString"] = "0.6"
          info["CFBundleVersion"] = "6"
          info["UIFileSharingEnabled"] = True
          info["LSSupportsOpeningDocumentsInPlace"] = True

          with plist_path.open("wb") as f:
              plistlib.dump(
                  info,
                  f,
                  sort_keys=False
              )


          # ======================================================
          # WRITE LOG TO DOCUMENTS
          # ======================================================

          log_path = Path(
              "Sources/Core/wg_log.c"
          )

          log = log_path.read_text()

          if "#include <stdlib.h>" not in log:

              log = log.replace(
                  "#include <pthread.h>",
                  "#include <pthread.h>\n"
                  "#include <stdlib.h>",
                  1
              )

          old = (
              "static pthread_mutex_t s_mutex   = "
              "PTHREAD_MUTEX_INITIALIZER;"
          )

          new = (
              "static pthread_mutex_t s_mutex   = "
              "PTHREAD_MUTEX_INITIALIZER;\n"
              "static FILE *s_postal_file = NULL;"
          )

          if old not in log:
              raise SystemExit(
                  "wg_log mutex not found"
              )

          log = log.replace(
              old,
              new,
              1
          )

          old_init = """void wg_log_init(void) {
              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;
          }"""

          new_init = """void wg_log_init(void) {
              s_callback = NULL;
              s_userdata = NULL;
              s_minLevel = WG_LOG_DEBUG;

              const char *home = getenv("HOME");

              if (home && home[0]) {

                  char path[1024];

                  snprintf(
                      path,
                      sizeof(path),
                      "%s/Documents/POSTAL2-WineGlass.log",
                      home
                  );

                  s_postal_file =
                      fopen(
                          path,
                          "w"
                      );

                  if (s_postal_file) {

                      setvbuf(
                          s_postal_file,
                          NULL,
                          _IOLBF,
                          0
                      );

                      fprintf(
                          s_postal_file,
                          "POSTAL 2 iOS v6 WineGlass log\\n"
                      );

                      fflush(
                          s_postal_file
                      );
                  }
              }
          }"""

          if old_init not in log:
              raise SystemExit(
                  "wg_log_init not found"
              )

          log = log.replace(
              old_init,
              new_init,
              1
          )

          old_write = """    fprintf(stderr, "[%s/%s] %s\\n", level_names[lvl], safe_tag, buf);
              pthread_mutex_lock(&s_mutex);"""

          new_write = """    fprintf(stderr, "[%s/%s] %s\\n", level_names[lvl], safe_tag, buf);

              pthread_mutex_lock(&s_mutex);

              if (s_postal_file) {

                  fprintf(
                      s_postal_file,
                      "[%s/%s] %s\\n",
                      level_names[lvl],
                      safe_tag,
                      buf
                  );

                  fflush(
                      s_postal_file
                  );
              }"""

          if old_write not in log:
              raise SystemExit(
                  "wg_log writer not found"
              )

          log = log.replace(
              old_write,
              new_write,
              1
          )

          log_path.write_text(log)


          # ======================================================
          # POSTAL2.EXE AUTORUN
          # ======================================================

          scene_path = Path(
              "Sources/App/WGSceneDelegate.m"
          )

          scene = scene_path.read_text()


          scene = scene.replace(
              '[_loadButton setTitle:@"  Load .exe  " forState:UIControlStateNormal];',
              '[_loadButton setTitle:@"  RUN POSTAL 2  " forState:UIControlStateNormal];',
              1
          )


          scene = scene.replace(
              '[_loadButton addTarget:self action:@selector(openFilePicker) forControlEvents:UIControlEventTouchUpInside];',
              '[_loadButton addTarget:self action:@selector(runPostal2) forControlEvents:UIControlEventTouchUpInside];',
              1
          )


          marker = (
              "#pragma mark - UIDocumentPickerDelegate"
          )


          if marker not in scene:
              raise SystemExit(
                  "UIDocumentPicker marker not found"
              )


          methods = r'''
          // =====================================================
          // POSTAL 2
          // =====================================================

          - (NSString *)findPostal2Exe {

              NSString *docs =

                  NSSearchPathForDirectoriesInDomains(

                      NSDocumentDirectory,

                      NSUserDomainMask,

                      YES

                  ).firstObject;


              if (!docs) {

                  WG_LOGE(
                      "POSTAL2",
                      "Documents unavailable"
                  );

                  return nil;
              }


              NSString *root =

                  [
                      docs

                      stringByAppendingPathComponent:
                          @"Postal2FullData"
                  ];


              NSFileManager *fm =

                  [
                      NSFileManager
                      defaultManager
                  ];


              BOOL directory =
                  NO;


              if (

                  ![
                      fm

                      fileExistsAtPath:
                          root

                      isDirectory:
                          &directory
                  ]

                  ||

                  !directory

              ) {

                  WG_LOGE(

                      "POSTAL2",

                      "Postal2FullData missing"
                  );

                  return nil;
              }


              NSString *normal =

                  [
                      root

                      stringByAppendingPathComponent:
                          @"System/Postal2.exe"
                  ];


              if (

                  [
                      fm

                      fileExistsAtPath:
                          normal
                  ]

              ) {

                  WG_LOGI(

                      "POSTAL2",

                      "Found EXE: %s",

                      normal.UTF8String
                  );

                  return normal;
              }


              NSDirectoryEnumerator *e =

                  [
                      fm

                      enumeratorAtPath:
                          root
                  ];


              NSString *relative;


              while (

                  (
                      relative =
                          [
                              e
                              nextObject
                          ]
                  )

              ) {

                  if (

                      [
                          relative.lastPathComponent

                          caseInsensitiveCompare:
                              @"Postal2.exe"
                      ]

                      ==

                      NSOrderedSame

                  ) {

                      NSString *found =

                          [
                              root

                              stringByAppendingPathComponent:
                                  relative
                          ];


                      WG_LOGI(

                          "POSTAL2",

                          "Found recursive EXE: %s",

                          found.UTF8String
                      );

                      return found;
                  }
              }


              WG_LOGE(

                  "POSTAL2",

                  "Postal2.exe not found"
              );


              return nil;
          }


          - (void)runPostal2 {

              if (!_engine) {

                  WG_LOGW(

                      "POSTAL2",

                      "Engine not ready"
                  );

                  return;
              }


              NSString *exe =

                  [
                      self

                      findPostal2Exe
                  ];


              if (!exe) {

                  [
                      _loadButton

                      setTitle:
                          @" POSTAL2.EXE NOT FOUND "

                      forState:
                          UIControlStateNormal
                  ];

                  return;
              }


              NSString *systemFolder =

                  [
                      exe

                      stringByDeletingLastPathComponent
                  ];


              if (

                  chdir(

                      systemFolder
                          .fileSystemRepresentation
                  )

                  !=

                  0

              ) {

                  WG_LOGE(

                      "POSTAL2",

                      "Could not enter System folder"
                  );

              } else {

                  WG_LOGI(

                      "POSTAL2",

                      "Working directory: %s",

                      systemFolder.UTF8String
                  );
              }


              [
                  _loadButton

                  setTitle:
                      @" STARTING POSTAL 2... "

                  forState:
                      UIControlStateNormal
              ];


              _loadButton.enabled =
                  NO;


              WG_LOGI(

                  "POSTAL2",

                  "Launching original Postal2.exe"
              );


              [
                  self

                  loadAndRunPE:
                      exe
              ];
          }


          '''


          scene = scene.replace(
              marker,
              methods + "\n" + marker,
              1
          )


          # Auto-run after WineGlass engine initialization.
          scene = scene.replace(
              "[self tryLoadBundledPE];",
              "[self runPostal2];",
              1
          )


          scene_path.write_text(
              scene
          )


          print(
              "POSTAL 2 v6 FIX 3 patch complete"
          )
          PY


          echo "===== BUNDLE ====="

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            project.yml


          echo "===== POSTAL PATCH ====="

          grep \
            -n \
            "runPostal2\|findPostal2Exe\|Postal2FullData" \
            Sources/App/WGSceneDelegate.m


          echo "===== LOG ====="

          grep \
            -n \
            "POSTAL2-WineGlass.log" \
            Sources/Core/wg_log.c


      # ==========================================================
      # XCODEGEN
      # ==========================================================

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          xcodegen generate

          test -d WineGlass.xcodeproj

          PBX="$GITHUB_WORKSPACE/WineGlass/WineGlass.xcodeproj/project.pbxproj"

          test -f "$PBX"

          echo "===== OBJECT VERSION ====="

          grep \
            -n \
            "objectVersion" \
            "$PBX" \
            | head

          if grep \
            -q \
            "objectVersion = 77;" \
            "$PBX"; then

              echo "ERROR: objectVersion 77"
              exit 1
          fi


      # ==========================================================
      # BUILD IOS APP
      # ==========================================================

      - name: Build POSTAL 2 v6 ARM64
        shell: bash
        run: |
          set +e
          set -o pipefail

          cd "$GITHUB_WORKSPACE/WineGlass"

          rm -rf \
            "$GITHUB_WORKSPACE/build"

          mkdir -p \
            "$GITHUB_WORKSPACE/build"


          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 \
            | tee \
                "$GITHUB_WORKSPACE/build/xcodebuild.log"


          STATUS=${PIPESTATUS[0]}


          if [ "$STATUS" -ne 0 ]; then

              echo
              echo "======================================"
              echo "REAL BUILD ERRORS"
              echo "======================================"

              grep \
                -n \
                -E \
                "error:|fatal error:" \
                "$GITHUB_WORKSPACE/build/xcodebuild.log" \
                | tail -250 \
                || true

              exit "$STATUS"
          fi


      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find \
              "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -type d \
              -name "WineGlass.app" \
              | head -n 1
          )"

          if [ -z "$APP" ]; then

              echo "ERROR: WineGlass.app missing"
              exit 1
          fi

          echo "APP_PATH=$APP" \
            >> "$GITHUB_ENV"

          file \
            "$APP/WineGlass"

          lipo \
            -info \
            "$APP/WineGlass" \
            || true

          file \
            "$APP/WineGlass" \
            | grep -q "arm64"


      # ==========================================================
      # VERIFY ID
      # ==========================================================

      - name: Verify v6 bundle identity
        shell: bash
        run: |
          set -euxo pipefail

          INFO="$APP_PATH/Info.plist"

          BUNDLE="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$INFO"
          )"

          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$INFO"
          )"

          BUILD="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$INFO"
          )"

          echo "Bundle: $BUNDLE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"

          test \
            "$BUNDLE" = \
            "com.postal2ios.native"

          test \
            "$VERSION" = \
            "0.6"

          test \
            "$BUILD" = \
            "6"


      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create POSTAL 2 v6 IPA
        shell: bash
        run: |
          set -euxo pipefail

          OUTPUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUTPUT"

          mkdir -p \
            "$OUTPUT/Payload"

          cp -R \
            "$APP_PATH" \
            "$OUTPUT/Payload/Postal2iOS.app"

          cd "$OUTPUT"

          /usr/bin/zip \
            -qry \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX3.ipa" \
            Payload

          rm -rf Payload

          test -f \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX3.ipa"

          ls -lh \
            "POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX3.ipa"


      # ==========================================================
      # README
      # ==========================================================

      - name: Create README
        shell: bash
        run: |
          set -euxo pipefail

          cat > \
            "$GITHUB_WORKSPACE/output/README.txt" \
            <<'EOF'
          POSTAL 2 iOS v6 FIX 3

          DO NOT DELETE v5.

          SAME BUNDLE ID:

          com.postal2ios.native


          v5 data location:

          Documents/Postal2FullData


          v6 searches for:

          Documents/Postal2FullData/System/Postal2.exe


          CPU:

          blink ARM64

          no JIT


          RANDOM FIX:

          getentropy/getrandom disabled

          /dev/urandom enabled


          AFTER INSTALL:

          install OVER v5

          open POSTAL 2


          LOG:

          Documents/POSTAL2-WineGlass.log


          Send the log to ChatGPT
          after the launch attempt.
          EOF


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload POSTAL 2 v6 IPA
        uses: actions/upload-artifact@v4
        with:

          name: POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX3

          path: |

            output/POSTAL-2-iOS-v6-ORIGINAL-EXE-TEST-FIX3.ipa

            output/README.txt

          if-no-files-found: error

          compression-level: 0

          retention-days: 7


      # ==========================================================
      # DEBUG
      # ==========================================================

      - name: Upload build debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:

          name: POSTAL-2-iOS-v6-FIX3-BUILD-FAILED

          path: |

            build/xcodebuild.log

            WineGlass/project.yml

            WineGlass/Sources/App/WGSceneDelegate.m

            WineGlass/Sources/App/Info.plist

            WineGlass/Sources/Core/wg_log.c

            WineGlass/WineGlass.xcodeproj/project.pbxproj

            blink/config.h

            blink/config.mk

            blink/config.log

          if-no-files-found: ignore

          retention-days: 7
