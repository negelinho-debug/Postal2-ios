name: POSTAL 2 WineGlass iOS FIX 9.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POSTAL 2 FIX 9.0
    runs-on: macos-14
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # XCODE 15.4
      # ==========================================================

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== AVAILABLE XCODE ====="
          ls -1 /Applications | grep Xcode || true

          if [ -d "/Applications/Xcode_15.4.app" ]; then

            sudo xcode-select \
              -s "/Applications/Xcode_15.4.app/Contents/Developer"

          elif [ -d "/Applications/Xcode_15.4.0.app" ]; then

            sudo xcode-select \
              -s "/Applications/Xcode_15.4.0.app/Contents/Developer"

          else

            echo "ERROR: Xcode 15.4 not found"
            exit 1

          fi

          echo "===== SELECTED XCODE ====="
          xcodebuild -version

          echo "===== XCODE PATH ====="
          xcode-select -p

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          brew install xcodegen make flock

          export PATH="$(brew --prefix)/bin:$PATH"

          echo "===== FLOCK ====="
          command -v flock
          flock --version || true

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

          echo "===== SDK PATH ====="
          xcrun --sdk iphoneos --show-sdk-path

          echo "===== IOS CLANG ====="
          xcrun --sdk iphoneos --find clang

      # ==========================================================
      # CLONE
      # ==========================================================

      - name: Clone WineGlass and blink
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            WineGlass \
            blink-src

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink-src

          mkdir -p \
            WineGlass/Vendor/blink/lib

          echo "===== WINEGLASS COMMIT ====="
          git -C WineGlass rev-parse HEAD

          echo "===== BLINK COMMIT ====="
          git -C blink-src rev-parse HEAD

      # ==========================================================
      # CONFIGURE BLINK
      # ==========================================================

      - name: Configure Blink for iPhone ARM64
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          chmod +x configure

          echo "===== FLOCK ====="
          command -v flock

          echo "===== IOS SDK ====="
          echo "$SDK"

          echo "===== IOS CLANG ====="
          echo "$CC"

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          test -f config.h
          test -f config.mk

          echo "===== CONFIGURE DONE ====="

      # ==========================================================
      # BLINK IOS CONFIG
      #
      # FIX 8:
      # force MAP_ANONYMOUS.
      # ==========================================================

      - name: Patch Blink iOS config
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("blink-src/config.h")

          s = p.read_text(
              errors="ignore"
          )

          disable = [
              "HAVE_GETENTROPY",
              "HAVE_SYS_GETENTROPY",
              "HAVE_GETRANDOM",
              "HAVE_SYS_GETRANDOM",
              "HAVE_KERN_ARND",
              "HAVE_SCHED_YIELD",
              "HAVE_SCHED_H",
          ]

          enable = [
              "HAVE_DEV_URANDOM",
              "HAVE_SYS_MOUNT_H",
              "HAVE_MAP_ANONYMOUS",
          ]

          targets = set(
              disable + enable
          )

          out = []

          for line in s.splitlines():

              stripped = line.strip()

              matched = False

              for name in targets:

                  patterns = [
                      rf'^#define\s+{re.escape(name)}\b',
                      rf'^#undef\s+{re.escape(name)}\b',
                      rf'^//\s*#define\s+{re.escape(name)}\b',
                      rf'^//\s*#undef\s+{re.escape(name)}\b',
                  ]

                  if any(
                      re.search(pattern, stripped)
                      for pattern in patterns
                  ):
                      matched = True
                      break

              if not matched:
                  out.append(line)

          insert = [
              "",
              "/* POSTAL 2 IOS FIX 9.0 */",
          ]

          for name in disable:
              insert.append(
                  f"#undef {name}"
              )

          for name in enable:
              insert.append(
                  f"#define {name} 1"
              )

          final = []
          inserted = False

          for line in out:

              if (
                  not inserted
                  and line.strip().startswith("#endif")
              ):

                  final.extend(insert)
                  final.append("")
                  inserted = True

              final.append(line)

          if not inserted:
              final.extend(insert)

          p.write_text(
              "\n".join(final)
              + "\n"
          )

          print(
              "Blink config patched"
          )
          PY

          echo "===== CONFIG CHECK ====="

          grep -n \
            "HAVE_MAP_ANONYMOUS\|HAVE_DEV_URANDOM\|HAVE_SYS_MOUNT_H\|HAVE_SCHED_YIELD\|HAVE_GETENTROPY\|HAVE_GETRANDOM" \
            blink-src/config.h \
            || true

          grep -q \
            '^#define HAVE_MAP_ANONYMOUS 1$' \
            blink-src/config.h

      # ==========================================================
      # VERIFY MAP_ANONYMOUS
      # ==========================================================

      - name: Verify iOS MAP_ANONYMOUS
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cat > /tmp/postal2-map-test.c <<'EOF'
          #include <sys/mman.h>

          #ifndef MAP_ANONYMOUS
          #error MAP_ANONYMOUS missing
          #endif

          int postal2_map_test(void) {
              return MAP_PRIVATE | MAP_ANONYMOUS;
          }
          EOF

          "$CC" \
            -c \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_DARWIN_C_SOURCE \
            /tmp/postal2-map-test.c \
            -o /tmp/postal2-map-test.o

          test -f \
            /tmp/postal2-map-test.o

          echo "MAP_ANONYMOUS OK"

      # ==========================================================
      # sched_yield IOS PATCH
      # ==========================================================

      - name: Patch Blink sched_yield
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "blink-src/blink/syscall.c"
          )

          s = p.read_text()

          pattern = r'''
          static\s+int\s+SysSchedYield
          \s*\(
              \s*struct\s+Machine\s*\*m
          \s*\)
          \s*\{
          .*?
          \n\}
          '''

          replacement = '''
          static int SysSchedYield(struct Machine *m) {
            (void)m;
            return 0;
          }
          '''

          s, count = re.subn(
              pattern,
              replacement,
              s,
              count=1,
              flags=re.S | re.X
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: SysSchedYield patch failed"
              )

          s = s.replace(
              "        sched_yield();",
              "        /* sched_yield disabled */"
          )

          if "return sched_yield();" in s:
              raise SystemExit(
                  "ERROR: sched_yield remains"
              )

          p.write_text(s)

          print(
              "sched_yield patched"
          )
          PY

      # ==========================================================
      # BUILD BLINK
      # ==========================================================

      - name: Build blink ARM64 no-JIT
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix)/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          AR="$(xcrun --sdk iphoneos --find ar)"

          cd "$BLINK"

          rm -f \
            o//blink/blink.a

          echo "========================================"
          echo "BUILD BLINK ARM64"
          echo "========================================"

          gmake \
            -j2 \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            o//blink/blink.a

          test -f \
            o//blink/blink.a

          mkdir -p \
            "$WG/Vendor/blink/lib"

          cp \
            o//blink/blink.a \
            "$WG/Vendor/blink/lib/blink.a"

          ls -lh \
            "$WG/Vendor/blink/lib/blink.a"

      # ==========================================================
      # BLINK MMAP FIX
      #
      # This is the FIX 8 part that now works on device.
      # ==========================================================

      - name: Patch Blink VM mmap
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Vendor/blink/wg_blink_impl.c"
          )

          s = p.read_text()

          if "#include <errno.h>" not in s:

              if "#include <stdio.h>" not in s:
                  raise SystemExit(
                      "ERROR: stdio include missing"
                  )

              s = s.replace(
                  "#include <stdio.h>",
                  "#include <stdio.h>\n"
                  "#include <errno.h>\n"
                  "#include <sys/mman.h>",
                  1
              )

          start_marker = (
              "static struct WGBlinkVM "
              "*create_vm_with_mode("
              "struct XedMachineMode mode) {"
          )

          end_marker = (
              "struct WGBlinkVM "
              "*WGBlinkVM_Create(void) {"
          )

          start = s.find(
              start_marker
          )

          if start == -1:
              raise SystemExit(
                  "ERROR: create_vm start missing"
              )

          end = s.find(
              end_marker,
              start
          )

          if end == -1:
              raise SystemExit(
                  "ERROR: Create marker missing"
              )

          new_function = r'''static struct WGBlinkVM *create_vm_with_mode(struct XedMachineMode mode) {

              fprintf(
                  stderr,
                  "[FIX9/BLINK] CREATE VM mode=%d\n",
                  mode.omode
              );
              fflush(stderr);

              fprintf(
                  stderr,
                  "[FIX9/BLINK] BEFORE InitMap\n"
              );
              fflush(stderr);

              ensure_initialized();

              fprintf(
                  stderr,
                  "[FIX9/BLINK] AFTER InitMap pagesize=%ld\n",
                  FLAG_pagesize
              );
              fflush(stderr);


              struct WGBlinkVM *vm =
                  calloc(
                      1,
                      sizeof(struct WGBlinkVM)
                  );

              fprintf(
                  stderr,
                  "[FIX9/BLINK] VM calloc=%p\n",
                  (void *)vm
              );
              fflush(stderr);

              if (!vm) {
                  return NULL;
              }


              vm->s =
                  NewSystem(mode);

              fprintf(
                  stderr,
                  "[FIX9/BLINK] NewSystem=%p real=%p\n",
                  (void *)vm->s,
                  vm->s
                      ? (void *)vm->s->real
                      : NULL
              );
              fflush(stderr);

              if (!vm->s) {

                  free(vm);

                  return NULL;
              }


              if (!vm->s->real) {

                  long pagesize =
                      FLAG_pagesize;

                  long real_size =
                      (
                          kRealSize
                          + pagesize
                          - 1
                      )
                      & ~(pagesize - 1);


                  fprintf(
                      stderr,
                      "[FIX9/BLINK] BEFORE Mmap size=%ld flags=0x%x\n",
                      real_size,
                      MAP_PRIVATE | MAP_ANONYMOUS_
                  );
                  fflush(stderr);


                  errno = 0;

                  vm->s->real =
                      Mmap(
                          NULL,
                          real_size,
                          PROT_READ | PROT_WRITE,
                          MAP_PRIVATE | MAP_ANONYMOUS_,
                          -1,
                          0,
                          "real"
                      );

                  int mmap_errno =
                      errno;


                  fprintf(
                      stderr,
                      "[FIX9/BLINK] AFTER Mmap real=%p errno=%d (%s)\n",
                      (void *)vm->s->real,
                      mmap_errno,
                      mmap_errno
                          ? strerror(mmap_errno)
                          : "OK"
                  );
                  fflush(stderr);


                  if (
                      vm->s->real == MAP_FAILED
                      || !vm->s->real
                  ) {

                      fprintf(
                          stderr,
                          "[FIX9/BLINK] MMAP FAILED\n"
                      );
                      fflush(stderr);

                      vm->s->real =
                          NULL;

                      FreeSystem(
                          vm->s
                      );

                      free(vm);

                      return NULL;
                  }
              }


              vm->m =
                  NewMachine(
                      vm->s,
                      NULL
                  );

              fprintf(
                  stderr,
                  "[FIX9/BLINK] NewMachine=%p\n",
                  (void *)vm->m
              );
              fflush(stderr);


              if (!vm->m) {

                  FreeSystem(
                      vm->s
                  );

                  free(vm);

                  return NULL;
              }


              if (
                  mode.omode
                  == XED_MODE_LONG
              ) {

                  vm->s->cr0 =
                      CR0_PE
                      | CR0_MP
                      | CR0_ET
                      | CR0_PG;


                  errno = 0;

                  vm->s->cr3 =
                      AllocatePageTable(
                          vm->s
                      );

                  int page_errno =
                      errno;


                  fprintf(
                      stderr,
                      "[FIX9/BLINK] PageTable cr3=%llu errno=%d (%s)\n",
                      (unsigned long long)
                          vm->s->cr3,
                      page_errno,
                      page_errno
                          ? strerror(page_errno)
                          : "OK"
                  );
                  fflush(stderr);


                  if (
                      vm->s->cr3
                      == (u64)-1
                  ) {

                      FreeMachine(
                          vm->m
                      );

                      FreeSystem(
                          vm->s
                      );

                      free(vm);

                      return NULL;
                  }

              } else if (
                  mode.omode
                  == XED_MODE_LEGACY
              ) {

                  vm->s->cr0 =
                      CR0_PE
                      | CR0_MP
                      | CR0_ET;
              }


              vm->m->flags |=
                  (1 << 9);


              fprintf(
                  stderr,
                  "[FIX9/BLINK] VM CREATE SUCCESS real=%p cr3=%llu\n",
                  (void *)vm->s->real,
                  (unsigned long long)
                      vm->s->cr3
              );
              fflush(stderr);


              return vm;
          }

          '''

          s = (
              s[:start]
              + new_function
              + "\n"
              + s[end:]
          )

          p.write_text(s)

          print(
              "Blink VM FIX9 patched"
          )
          PY

          echo "===== BLINK CHECK ====="

          grep -n \
            "FIX9/BLINK\|MAP_FAILED" \
            WineGlass/Vendor/blink/wg_blink_impl.c

      # ==========================================================
      # BUILD WINEGLASS BLINK BRIDGE
      # ==========================================================

      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BLINK="$ROOT/blink-src"
          WG="$ROOT/WineGlass"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"

          cd "$BLINK"

          "$CC" \
            -c \
            -std=c11 \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -I"$BLINK" \
            -include "$BLINK/config.h" \
            "$WG/Vendor/blink/wg_blink_impl.c" \
            -o "$WG/Vendor/blink/lib/wg_blink_impl.o"

          test -f \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

          file \
            "$WG/Vendor/blink/lib/wg_blink_impl.o"

      # ==========================================================
      # BUILTIN FALLBACK A0-A3
      # ==========================================================

      - name: Add x86 A0 A1 A2 A3 fallback
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/CPU/wg_x86_decode.c"
          )

          s = p.read_text()

          marker = \
              "    // TEST AL/rAX, imm (A8, A9)"

          if marker not in s:
              raise SystemExit(
                  "ERROR: A8/A9 marker missing"
              )

          patch = r'''
              // =====================================================
              // POSTAL 2 FIX 9 FALLBACK
              // A0-A3 MOV moffs
              // =====================================================

              case 0xA0: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 1
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 1
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA1: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = op_sz
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = op_sz
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA2: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = 1
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = 1
                  };

                  out->num_operands = 2;
                  break;
              }

              case 0xA3: {
                  uint32_t addr = fetch32(c);

                  out->opcode = WG_OP_MOV;

                  out->operands[0] = (WGOperand){
                      .type = WG_OPERAND_MEM,
                      .mem_base = -2,
                      .mem_index = -1,
                      .mem_scale = 1,
                      .mem_disp = (int64_t)addr,
                      .mem_seg = c->seg_override,
                      .size = op_sz
                  };

                  out->operands[1] = (WGOperand){
                      .type = WG_OPERAND_REG,
                      .reg_index = 0,
                      .size = op_sz
                  };

                  out->num_operands = 2;
                  break;
              }

          '''

          s = s.replace(
              marker,
              patch + marker,
              1
          )

          p.write_text(s)

          print(
              "A0-A3 fallback added"
          )
          PY

      # ==========================================================
      # FIX 9
      #
      # MSVCR120 DATA IMPORTS
      #
      # Old behavior:
      #
      # _acmdln -> function HLT thunk
      # thunk bytes -> F4 F4 F4 F4
      #
      # New behavior:
      #
      # _acmdln IAT ->
      # 0xA00800 ->
      # pointer 0xA00100 ->
      # actual "Postal2.exe" command line
      #
      # Also:
      # _wcmdln
      # _fmode
      # _commode
      # __argc
      # __argv
      # __wargv
      # _pgmptr
      # _wpgmptr
      # _environ
      # _wenviron
      #
      # Plus:
      # PE32 IAT entries are now written as FOUR bytes.
      # ==========================================================

      - name: Patch FIX 9 MSVCR120 data imports
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/Core/wg_engine.c"
          )

          s = p.read_text()

          # ======================================================
          # INSERT FIX9 HELPERS
          # ======================================================

          marker = \
              "static bool load_pe_blink(WGEngine *engine) {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: load_pe_blink marker missing"
              )

          helper = r'''
          // ============================================================
          // POSTAL 2 FIX 9
          // MSVCR120 DATA IMPORT SUPPORT
          // ============================================================

          #define WG_FIX9_CRT_PAGE       0x00A00000u

          #define WG_FIX9_WCMDLINE       0x00A00000u
          #define WG_FIX9_ACMDLINE       0x00A00100u

          #define WG_FIX9_ACMDLN_VAR     0x00A00800u
          #define WG_FIX9_WCMDLN_VAR     0x00A00804u
          #define WG_FIX9_FMODE_VAR      0x00A00808u
          #define WG_FIX9_COMMODE_VAR    0x00A0080Cu

          #define WG_FIX9_ARGC_VAR       0x00A00810u
          #define WG_FIX9_ARGV_VAR       0x00A00814u
          #define WG_FIX9_WARGV_VAR      0x00A00818u

          #define WG_FIX9_PGMPTR_VAR     0x00A0081Cu
          #define WG_FIX9_WPGMPTR_VAR    0x00A00820u

          #define WG_FIX9_ENVIRON_VAR    0x00A00824u
          #define WG_FIX9_WENVIRON_VAR   0x00A00828u

          #define WG_FIX9_ARGV_ARRAY     0x00A00840u
          #define WG_FIX9_WARGV_ARRAY    0x00A00848u

          #define WG_FIX9_ENV_ARRAY      0x00A00850u
          #define WG_FIX9_WENV_ARRAY     0x00A00858u


          static void wg_fix9_page_put32(
              uint8_t *page,
              uint32_t guest_addr,
              uint32_t value
          ) {

              uint32_t off =
                  guest_addr
                  - WG_FIX9_CRT_PAGE;

              if (
                  off + 4
                  <= 0x1000
              ) {

                  memcpy(
                      page + off,
                      &value,
                      4
                  );
              }
          }


          static bool wg_fix9_prepare_crt_page(
              WGEngine *engine
          ) {

              if (
                  !engine
                  || !engine->blink
              ) {
                  return false;
              }


              uint8_t page[0x1000];

              memset(
                  page,
                  0,
                  sizeof(page)
              );


              const char *winpath =
                  wg_files_exe_win_path();


              if (
                  !winpath
                  || !winpath[0]
              ) {
                  winpath =
                      "C:\\Postal2\\System\\Postal2.exe";
              }


              // --------------------------------------------------
              // Wide command line
              // --------------------------------------------------

              uint16_t *wcmd =
                  (uint16_t *)page;

              wcmd[0] =
                  '"';

              int wi =
                  0;

              for (
                  ;
                  winpath[wi]
                  && wi < 240;
                  wi++
              ) {

                  wcmd[wi + 1] =
                      (uint8_t)
                          winpath[wi];
              }

              wcmd[wi + 1] =
                  '"';

              wcmd[wi + 2] =
                  0;


              // --------------------------------------------------
              // ANSI command line
              // --------------------------------------------------

              char *acmd =
                  (char *)(
                      page
                      + (
                          WG_FIX9_ACMDLINE
                          - WG_FIX9_CRT_PAGE
                      )
                  );

              snprintf(
                  acmd,
                  512,
                  "\"%s\"",
                  winpath
              );


              // --------------------------------------------------
              // _acmdln = char *
              //
              // Imported symbol points to THIS variable.
              // Variable contains pointer to actual command line.
              // --------------------------------------------------

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ACMDLN_VAR,
                  WG_FIX9_ACMDLINE
              );


              // _wcmdln = wchar_t *

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WCMDLN_VAR,
                  WG_FIX9_WCMDLINE
              );


              // --------------------------------------------------
              // _fmode / _commode
              // --------------------------------------------------

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_FMODE_VAR,
                  0
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_COMMODE_VAR,
                  0
              );


              // --------------------------------------------------
              // argc = 1
              // --------------------------------------------------

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ARGC_VAR,
                  1
              );


              // argv variable -> argv array

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ARGV_VAR,
                  WG_FIX9_ARGV_ARRAY
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ARGV_ARRAY,
                  WG_FIX9_ACMDLINE
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ARGV_ARRAY + 4,
                  0
              );


              // wargv variable -> wargv array

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WARGV_VAR,
                  WG_FIX9_WARGV_ARRAY
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WARGV_ARRAY,
                  WG_FIX9_WCMDLINE
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WARGV_ARRAY + 4,
                  0
              );


              // --------------------------------------------------
              // _pgmptr / _wpgmptr
              // --------------------------------------------------

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_PGMPTR_VAR,
                  WG_FIX9_ACMDLINE
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WPGMPTR_VAR,
                  WG_FIX9_WCMDLINE
              );


              // --------------------------------------------------
              // Empty environment arrays
              // --------------------------------------------------

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ENVIRON_VAR,
                  WG_FIX9_ENV_ARRAY
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_ENV_ARRAY,
                  0
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WENVIRON_VAR,
                  WG_FIX9_WENV_ARRAY
              );

              wg_fix9_page_put32(
                  page,
                  WG_FIX9_WENV_ARRAY,
                  0
              );


              // --------------------------------------------------
              // MAP PAGE INTO BLINK
              // --------------------------------------------------

              if (
                  !wg_blink_load_code(
                      engine->blink,
                      WG_FIX9_CRT_PAGE,
                      page,
                      sizeof(page),
                      0
                  )
              ) {

                  WG_LOGE(
                      TAG,
                      "FIX9: CRT data page mapping failed"
                  );

                  return false;
              }


              s_cmdpage_mapped =
                  true;


              WG_LOGI(
                  TAG,
                  "FIX9 CRT DATA PAGE READY @0x%X",
                  WG_FIX9_CRT_PAGE
              );

              WG_LOGI(
                  TAG,
                  "FIX9 _acmdln var=0x%X -> string=0x%X",
                  WG_FIX9_ACMDLN_VAR,
                  WG_FIX9_ACMDLINE
              );


              return true;
          }


          static uint32_t wg_fix9_msvcr_data_import(
              const char *dll,
              const char *name
          ) {

              if (
                  !dll
                  || !name
              ) {
                  return 0;
              }


              if (
                  !strcasestr(
                      dll,
                      "msvcr120"
                  )
              ) {
                  return 0;
              }


              if (
                  strcmp(
                      name,
                      "_acmdln"
                  ) == 0
              ) {
                  return WG_FIX9_ACMDLN_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_wcmdln"
                  ) == 0
              ) {
                  return WG_FIX9_WCMDLN_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_fmode"
                  ) == 0
              ) {
                  return WG_FIX9_FMODE_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_commode"
                  ) == 0
              ) {
                  return WG_FIX9_COMMODE_VAR;
              }


              if (
                  strcmp(
                      name,
                      "__argc"
                  ) == 0
              ) {
                  return WG_FIX9_ARGC_VAR;
              }


              if (
                  strcmp(
                      name,
                      "__argv"
                  ) == 0
              ) {
                  return WG_FIX9_ARGV_VAR;
              }


              if (
                  strcmp(
                      name,
                      "__wargv"
                  ) == 0
              ) {
                  return WG_FIX9_WARGV_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_pgmptr"
                  ) == 0
              ) {
                  return WG_FIX9_PGMPTR_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_wpgmptr"
                  ) == 0
              ) {
                  return WG_FIX9_WPGMPTR_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_environ"
                  ) == 0
              ) {
                  return WG_FIX9_ENVIRON_VAR;
              }


              if (
                  strcmp(
                      name,
                      "_wenviron"
                  ) == 0
              ) {
                  return WG_FIX9_WENVIRON_VAR;
              }


              return 0;
          }


          '''

          s = s.replace(
              marker,
              helper
              + "\n"
              + marker,
              1
          )


          # ======================================================
          # RESET CMD PAGE PER NEW BLINK VM
          # ======================================================

          old = '''    s_nsis_data_patched = false;
              s_nsis_exe_data_offset = 0;'''

          new = '''    s_nsis_data_patched = false;
              s_nsis_exe_data_offset = 0;

              /*
               * Blink VM is recreated for each PE load.
               * Therefore this page MUST be recreated too.
               */
              s_cmdpage_mapped = false;'''

          if old not in s:
              raise SystemExit(
                  "ERROR: load reset marker missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          # ======================================================
          # REPLACE MAIN EXE IMPORT RESOLVER
          # ======================================================

          old = '''    // Resolve imports — write thunk addresses into the IAT
              if (pe->num_imports > 0) {
                  WG_LOGI(TAG, "Resolving %d DLL imports...", pe->num_imports);
                  for (int i = 0; i < pe->num_imports; i++) {
                      WGPEImportDll *imp = &pe->imports[i];
                      WG_LOGI(TAG, "  %s: %d functions", imp->dll_name, imp->num_functions);
                      for (int j = 0; j < imp->num_functions; j++) {
                          uint64_t stub_addr = wg_dll_mapper_resolve(
                              engine->dll_mapper, imp->dll_name, imp->functions[j].name);
                          if (stub_addr) {
                              uint64_t iat_entry = pe->image_base + imp->functions[j].iat_rva;
                              uint8_t addr_bytes[8];
                              memcpy(addr_bytes, &stub_addr, 8);
                              wg_blink_write_mem(engine->blink, iat_entry, addr_bytes, 8);
                          }
                      }
                  }
              }'''

          new = '''    // ======================================================
              // FIX 9 IMPORT RESOLUTION
              //
              // PE32:
              //   IAT entries are 4 bytes.
              //
              // PE32+:
              //   IAT entries are 8 bytes.
              //
              // MSVCR120 data imports must point to DATA, not HLT
              // function thunks.
              // ======================================================

              if (!pe->is_64bit) {

                  if (
                      !wg_fix9_prepare_crt_page(
                          engine
                      )
                  ) {

                      WG_LOGE(
                          TAG,
                          "FIX9 CRT page setup failed"
                      );

                      return false;
                  }
              }


              if (
                  pe->num_imports
                  > 0
              ) {

                  WG_LOGI(
                      TAG,
                      "Resolving %d DLL imports...",
                      pe->num_imports
                  );


                  for (
                      int i = 0;
                      i < pe->num_imports;
                      i++
                  ) {

                      WGPEImportDll *imp =
                          &pe->imports[i];


                      WG_LOGI(
                          TAG,
                          "  %s: %d functions",
                          imp->dll_name,
                          imp->num_functions
                      );


                      for (
                          int j = 0;
                          j < imp->num_functions;
                          j++
                      ) {

                          const char *fn =
                              imp->functions[j].name;


                          uint64_t iat_entry =
                              pe->image_base
                              + imp->functions[j].iat_rva;


                          // ------------------------------------------
                          // MSVCR120 EXPORTED DATA
                          // ------------------------------------------

                          if (
                              !pe->is_64bit
                          ) {

                              uint32_t data_addr =
                                  wg_fix9_msvcr_data_import(
                                      imp->dll_name,
                                      fn
                                  );


                              if (
                                  data_addr
                              ) {

                                  wg_blink_write_mem(
                                      engine->blink,
                                      iat_entry,
                                      &data_addr,
                                      4
                                  );


                                  WG_LOGI(
                                      TAG,
                                      "FIX9 DATA IMPORT: %s!%s IAT=0x%llX -> 0x%X",
                                      imp->dll_name,
                                      fn,
                                      (unsigned long long)
                                          iat_entry,
                                      data_addr
                                  );


                                  continue;
                              }
                          }


                          // ------------------------------------------
                          // NORMAL FUNCTION IMPORT
                          // ------------------------------------------

                          uint64_t stub_addr =
                              wg_dll_mapper_resolve(
                                  engine->dll_mapper,
                                  imp->dll_name,
                                  fn
                              );


                          if (
                              !stub_addr
                          ) {
                              continue;
                          }


                          if (
                              pe->is_64bit
                          ) {

                              wg_blink_write_mem(
                                  engine->blink,
                                  iat_entry,
                                  &stub_addr,
                                  8
                              );

                          } else {

                              uint32_t stub32 =
                                  (uint32_t)
                                      stub_addr;


                              wg_blink_write_mem(
                                  engine->blink,
                                  iat_entry,
                                  &stub32,
                                  4
                              );
                          }
                      }
                  }
              }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: main import resolver block missing"
              )

          s = s.replace(
              old,
              new,
              1
          )


          p.write_text(s)


          print(
              "========================================"
          )

          print(
              "FIX 9 CRT DATA IMPORTS PATCHED"
          )

          print(
              "PE32 IAT WIDTH = 4 BYTES"
          )

          print(
              "========================================"
          )
          PY

          echo "===== FIX9 CHECK ====="

          grep -n \
            "FIX9 DATA IMPORT\|FIX9 CRT DATA\|wg_fix9_msvcr_data_import\|PE32 IAT" \
            WineGlass/Sources/Core/wg_engine.c

          echo "===== VERIFY OLD 8-BYTE MAIN IAT CODE GONE ====="

          python3 <<'PY'
          from pathlib import Path

          s = Path(
              "WineGlass/Sources/Core/wg_engine.c"
          ).read_text()

          block_start = s.find(
              "static bool load_pe_blink"
          )

          block_end = s.find(
              "static bool load_pe_builtin",
              block_start
          )

          area = s[
              block_start:block_end
          ]

          if (
              "memcpy(addr_bytes, &stub_addr, 8)"
              in area
          ):
              raise SystemExit(
                  "ERROR: old 8-byte PE32 IAT write remains"
              )

          print(
              "FIX9 IAT check OK"
          )
          PY

