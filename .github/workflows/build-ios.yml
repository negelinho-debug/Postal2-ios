            "POSTAL FIX11.5 timeBeginPeriod" \
            "$FILE"

          grep -n \
            "POSTAL FIX11.5 timeEndPeriod" \
            "$FILE"


      - name: Patch FIX 11.6 POSTAL System root
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "WineGlass/Sources/Win32/wg_win32_files.c"
          )

          s = p.read_text()

          flag_anchor = (
              'static char s_cwd_win[1024] = {0}; '
              '// current dir (Windows path), SetCurrentDirectory'
          )

          flag_block = '''static char s_cwd_win[1024] = {0}; // current dir (Windows path), SetCurrentDirectory
          static bool s_postal_system_root = false; // POSTAL 2 external System directory'''

          if "s_postal_system_root" not in s:

              if flag_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.6 cwd flag anchor missing"
                  )

              s = s.replace(
                  flag_anchor,
                  flag_block,
                  1
              )

          exe_anchor = (
              "    if (last_slash) "
              "*(last_slash + 1) = '\\0';"
          )

          exe_block = r'''    if (last_slash) *(last_slash + 1) = '\0';

              const char *postal_exe_name =
                  strrchr(
                      s_exe_path,
                      '/'
                  );

              postal_exe_name =
                  postal_exe_name ?
                  postal_exe_name + 1 :
                  s_exe_path;

              s_postal_system_root =
                  (
                      strcasecmp(
                          postal_exe_name,
                          "Postal2.exe"
                      ) == 0
                  );

              if (s_postal_system_root) {

                  snprintf(
                      s_cwd_win,
                      sizeof(s_cwd_win),
                      "C:\\Postal2\\System"
                  );

                  WG_LOGI(
                      TAG,
                      "POSTAL FIX11.6 System root '%s' -> '%s'",
                      s_cwd_win,
                      s_exe_dir
                  );
              }'''

          if (
              "POSTAL FIX11.6 System root"
              not in s
          ):
              if exe_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.6 exe-dir anchor missing"
                  )

              s = s.replace(
                  exe_anchor,
                  exe_block,
                  1
              )

          winpath_anchor = '''const char *wg_files_exe_win_path(void) {
              static char win[1024];
              if (s_win_path_cached) return win;'''

          winpath_block = r'''const char *wg_files_exe_win_path(void) {
              static char win[1024];

              if (s_postal_system_root) {

                  snprintf(
                      win,
                      sizeof(win),
                      "C:\\Postal2\\System\\Postal2.exe"
                  );

                  s_win_path_cached = true;

                  return win;
              }

              if (s_win_path_cached) return win;'''

          if (
              'C:\\\\Postal2\\\\System\\\\Postal2.exe'
              not in s
          ):
              if winpath_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.6 exe-win-path anchor missing"
                  )

              s = s.replace(
                  winpath_anchor,
                  winpath_block,
                  1
              )

          map_anchor = '''    // The installer .exe itself is the file the user picked — it lives in the
              // app sandbox, not inside the bottle, so keep mapping it to the real path.'''

          map_block = r'''    // POSTAL 2 lives outside Bottle/drive_c.
              // The physical game System directory is s_exe_dir.
              if (s_postal_system_root) {

                  const char *postal_rel = NULL;

                  const char *prefix_bs =
                      "C:\\Postal2\\System\\";

                  const char *prefix_fs =
                      "C:/Postal2/System/";

                  bool postal_relative =
                      src[0] &&
                      !(src[0] && src[1] == ':') &&
                      src[0] != '\\' &&
                      src[0] != '/';

                  if (postal_relative) {

                      postal_rel = src;

                  } else if (
                      strncasecmp(
                          src,
                          prefix_bs,
                          strlen(prefix_bs)
                      ) == 0
                  ) {

                      postal_rel =
                          src +
                          strlen(prefix_bs);

                  } else if (
                      strncasecmp(
                          src,
                          prefix_fs,
                          strlen(prefix_fs)
                      ) == 0
                  ) {

                      postal_rel =
                          src +
                          strlen(prefix_fs);
                  }

                  if (postal_rel) {

                      while (
                          *postal_rel == '\\' ||
                          *postal_rel == '/'
                      ) {
                          postal_rel++;
                      }

                      static char postal_mapped[1024];

                      snprintf(
                          postal_mapped,
                          sizeof(postal_mapped),
                          "%s%s",
                          s_exe_dir,
                          postal_rel
                      );

                      fix_separators(
                          postal_mapped
                      );

                      WG_LOGI(
                          TAG,
                          "POSTAL FIX11.6 map '%s' -> '%s'",
                          src,
                          postal_mapped
                      );

                      return postal_mapped;
                  }
              }

              // The installer .exe itself is the file the user picked — it lives in the
              // app sandbox, not inside the bottle, so keep mapping it to the real path.'''

          if (
              "POSTAL FIX11.6 map"
              not in s
          ):
              if map_anchor not in s:
                  raise SystemExit(
                      "ERROR: FIX11.6 map-path anchor missing"
                  )

              s = s.replace(
                  map_anchor,
                  map_block,
                  1
              )

          p.write_text(s)

          print(
              "POSTAL 2 FIX 11.6 SYSTEM ROOT INSTALLED"
          )

          print(
              "Virtual root: C:\\Postal2\\System"
          )

          print(
              "Physical root: directory containing Postal2.exe"
          )

          print(
              "Relative INI/INT files bypass Bottle/drive_c"
          )
          PY

          FILE="WineGlass/Sources/Win32/wg_win32_files.c"

          grep -n \
            "s_postal_system_root" \
            "$FILE"

          grep -n \
            "POSTAL FIX11.6 System root" \
            "$FILE"

          grep -n \
            "C:\\\\\\\\Postal2\\\\\\\\System\\\\\\\\Postal2.exe" \
            "$FILE" ||
            true

          grep -n \
            "POSTAL FIX11.6 map" \
            "$FILE"

          echo "FIX 11.6 VERIFY OK"


